const AgroModel = {
  etc(Kc, ET0) { return Kc * ET0; },
  gross(net, eff) { return net / clamp(eff, 0.05, 1); },
  kcAt(crop, week, weeks = 12) { const C = CROPS[crop]; const f = week / weeks; return f < 0.2 ? C.Kc[0] : f < 0.35 ? lerp(C.Kc[0], C.Kc[1], (f - 0.2) / 0.15) : f < 0.8 ? C.Kc[1] : lerp(C.Kc[1], C.Kc[2], (f - 0.8) / 0.2); },
  /** Mezcla de fuentes (balance de masa de sales y boro) */
  blend(sources) {
    let q = 0, ec = 0, b = 0, na = 0, cam = 0;
    for (const s of sources) { q += s.q; ec += s.q * s.ec; b += s.q * s.boron; na += s.q * (s.na || 0); cam += s.q * (s.cam || 0); }
    if (q <= 0) return { q: 0, ec: 0, boron: 0, sar: 0 };
    const naM = na / q, camM = cam / q;
    const sar = naM / Math.sqrt(Math.max(0.05, camM / 2));
    return { q, ec: ec / q, boron: b / q, sar, na: naM, cam: camM };
  },
  /** Reducción de rendimiento por salinidad (Maas–Hoffman) */
  saltYield(crop, ECe) { const C = CROPS[crop]; return clamp(1 - (C.ecB / 100) * Math.max(0, ECe - C.ecT), 0, 1); },
  /** Riesgo de infiltración por SAR con agua de baja EC (FAO-29, orientativo) */
  infiltrationRisk(ecw, sar) { const lim = 0.2 + sar * 0.12; return clamp((lim - ecw) / Math.max(0.2, lim), 0, 1); },
  /**
   * Semana de parcela. plot:{crop, theta(0..1), ECe, B, health, yieldPot, mulch, drainage}
   * w:{ET0 mm/d, irr mm/semana aplicados (brutos), eff, ecw, boron, sar, rain, pollinators}
   */
  week(plot, w, weekIdx, weeks = 12) {
    const C = CROPS[plot.crop];
    const Kc = this.kcAt(plot.crop, weekIdx, weeks) * (plot.mulch ? 0.85 : 1);
    const ETc = Kc * w.ET0 * 7;                         // mm/semana
    const infilt = 1 - 0.5 * this.infiltrationRisk(w.ecw, w.sar);
    const applied = w.irr * w.eff * infilt + (w.rain || 0);
    const TAW = 80;                                     // agua disponible total en zona radical (mm)
    let store = plot.theta * TAW + applied;
    const drain = Math.max(0, store - TAW) * (plot.drainage ?? 0.7);
    const pond = Math.max(0, store - TAW) - drain;
    store = Math.min(store, TAW + pond * 0.3);
    const Ks = clamp(store / (0.5 * TAW), 0, 1);        // estrés hídrico
    const ETa = Math.min(ETc * Math.max(Ks, 0.2), store);
    store = Math.max(0, store - ETa);
    plot.theta = clamp(store / TAW, 0, 1.2);
    // sales: entrada con el riego, salida con el drenaje (fracción de lavado)
    const saltIn = w.irr * w.eff * w.ecw * 0.02;
    const LF = applied > 0 ? drain / Math.max(1, applied) : 0;
    plot.ECe = clamp(plot.ECe + saltIn - plot.ECe * LF * 0.9 - (pond > 5 ? -0.05 : 0), 0.2, 20);
    plot.B = clamp(plot.B * 0.92 + w.boron * 0.08 * (w.irr > 0 ? 1 : 0), 0, 10);
    const ys = this.saltYield(plot.crop, plot.ECe);
    const yb = plot.B > C.boron ? clamp(1 - (plot.B - C.boron) * 0.25, 0.2, 1) : 1;
    const yp = 1 + (w.pollinators || 0) * C.poll * 0.4;
    const weekHealth = clamp(Math.min(Ks + 0.15, 1) * ys * yb * (pond > 15 ? 0.85 : 1), 0, 1);
    plot.health = lerp(plot.health ?? 1, weekHealth, 0.45);
    plot.visualGreen = clamp(Ks * 1.1, 0, 1);         // la planta puede verse verde con estrés salino
    plot.stress = { water: 1 - Ks, salt: 1 - ys, boron: 1 - yb, infiltration: 1 - infilt, pond };
    plot.water = (plot.water || 0) + w.irr;            // mm brutos aplicados
    plot.yieldAcc = (plot.yieldAcc || 0) + plot.health * yp / weeks;
    return { ETc, ETa, applied, drain, Ks, ys, yb, LF };
  },
  waterProductivity(yieldKg, waterM3) { return waterM3 > 0 ? yieldKg / waterM3 : 0; },
};

/* =====================================================================
   Microred: despacho horario con prioridades y tanque de agua
   ===================================================================== */
const MicrogridModel = {
  /**
   * cfg: {hours, pv[], wind[], crit[], bess:{...}, tank:{cap, level, min}, roKW, roM3perKWh, demandM3[],
   *       schedule:{ro:[0/1], irr:[0/1], h2:[0..1]}, irrKW, h2KW, rules:{reserve, h2OnlySurplus}}
   */
  run(cfg) {
    const b = BESSModel.make(cfg.bess);
    const tank = Object.assign({ cap: 2000, level: 1200, min: 400 }, cfg.tank);
    const n = cfg.hours || 24, out = [];
    let unserved = 0, unservedCrit = 0, curtailed = 0, h2kg = 0, waterDeficit = 0, socMinSeen = 1, roM3 = 0, h2KWh = 0, renewToH2 = 0;
    for (let h = 0; h < n; h++) {
      const gen = (cfg.pv[h] || 0) + (cfg.wind[h] || 0);
      const crit = cfg.crit[h] || 0;
      let ro = (cfg.schedule.ro[h] ? cfg.roKW : 0);
      if (tank.level >= tank.cap - 1) ro = 0;
      const irr = cfg.schedule.irr[h] ? (cfg.irrKW || 0) : 0;
      let h2 = (cfg.schedule.h2[h] || 0) * (cfg.h2KW || 0);
      const reserve = cfg.rules?.reserve ?? b.socMin;
      // H2 solo con excedente si la regla lo exige
      if (cfg.rules?.h2OnlySurplus) h2 = Math.min(h2, Math.max(0, gen - crit - ro - irr));
      let load = crit + ro + irr + h2;
      let net = gen - load; // >0 excedente
      let pb = 0;
      if (net > 0) pb = BESSModel.step(b, -net, 1);
      else {
        // descarga respetando reserva para cargas no críticas
        const needNonCrit = Math.max(0, -net - Math.max(0, crit - gen));
        const needCrit = -net - needNonCrit;
        let delivered = 0;
        const availAboveReserve = BESSModel.energyAbove(b, reserve);
        const nc = Math.min(needNonCrit, availAboveReserve);
        if (nc > 0) delivered += BESSModel.step(b, nc, 1);
        if (needCrit > 0) delivered += BESSModel.step(b, needCrit, 1);
        pb = delivered;
      }
      let balance = net + pb; // >0 sobra (vertimiento), <0 falta
      if (balance > 0.01) curtailed += balance;
      if (balance < -0.01) {
        // desprende cargas flexibles primero: H2 → riego → RO → críticas
        let deficit = -balance;
        const shed = (amt) => { const d = Math.min(deficit, amt); deficit -= d; return d; };
        const sh2 = shed(h2); h2 -= sh2;
        const sirr = shed(irr);
        const sro = shed(ro); ro -= sro;
        const scrit = shed(crit);
        unserved += sh2 + sirr + sro + scrit; unservedCrit += scrit;
      }
      if (h2 > 0) { h2KWh += h2; h2kg += h2 / H2Model.defaults.SEC; renewToH2 += h2; }
      const prodM3 = ro * (cfg.roM3perKWh || 0.33);
      roM3 += prodM3;
      tank.level = clamp(tank.level + prodM3 - (cfg.demandM3[h] || 0), 0, tank.cap);
      if (tank.level <= tank.min) waterDeficit += (tank.min - tank.level) * 0 + (tank.level <= 0 ? (cfg.demandM3[h] || 0) : 0);
      socMinSeen = Math.min(socMinSeen, b.soc);
      out.push({ h, gen, crit, ro, irr, h2, soc: b.soc, tank: tank.level, curtail: Math.max(0, balance) });
    }
    return { series: out, unserved, unservedCrit, curtailed, h2kg, h2KWh, roM3, waterDeficit, socMin: socMinSeen, socEnd: b.soc, tankEnd: tank.level, tankMin: Math.min(...out.map(o => o.tank)), bess: b };
  },
};

/* =====================================================================
   Multiobjetivo
   ===================================================================== */
const MOModel = {
  /** alts: [{name, crit:{k:valor}}], dirs: {k: 'min'|'max'} → normalizados 0..1 (1 = mejor) */
  normalize(alts, dirs) {
    const keys = Object.keys(dirs);
    const range = {};
    for (const k of keys) { const vs = alts.map(a => a.crit[k]); range[k] = [Math.min(...vs), Math.max(...vs)]; }
    return alts.map(a => { const n = {}; for (const k of keys) { const [lo, hi] = range[k]; const t = hi === lo ? 1 : (a.crit[k] - lo) / (hi - lo); n[k] = dirs[k] === 'max' ? t : 1 - t; } return Object.assign({}, a, { norm: n }); });
  },
  score(normAlt, weights) { let s = 0, wsum = 0; for (const k in weights) { s += (normAlt.norm[k] || 0) * weights[k]; wsum += weights[k]; } return wsum ? s / wsum : 0; },
  dominates(a, b, dirs) {
    let better = false;
    for (const k in dirs) {
      const av = a.crit[k], bv = b.crit[k];
      const aBetter = dirs[k] === 'max' ? av > bv : av < bv, aWorse = dirs[k] === 'max' ? av < bv : av > bv;
      if (aWorse) return false; if (aBetter) better = true;
    }
    return better;
  },
  pareto(alts, dirs) { return alts.map(a => Object.assign({}, a, { dominated: alts.some(b => b !== a && this.dominates(b, a, dirs)) })); },
};

/* =====================================================================
   Suite de validación científica (sec. 59)
   ===================================================================== */
const ValidationSuite = {
  run() {
    const R = [];
    const t = (name, ok, detail = '') => R.push({ name, ok: !!ok, detail });
    // RO
    for (const P of [45, 55, 60, 70, 80]) for (const Qf of [60, 100, 140]) {
      const r = ROModel.solve({ P, Qf });
      t(`OI P=${P} Qf=${Qf}: Qf = Qp + Qc`, Math.abs(r.Qf - r.Qp - r.Qc) < 1e-6);
      t(`OI P=${P} Qf=${Qf}: balance de sal`, Math.abs(r.saltIn - r.saltOut) / r.saltIn < 0.01, `${r.saltIn.toFixed(1)} vs ${r.saltOut.toFixed(1)} kg/h`);
      t(`OI P=${P} Qf=${Qf}: sin producción negativa`, r.Qp >= 0 && r.Qc >= 0 && r.Cp >= 0);
    }
    const nom = ROModel.solve({ P: 60, Qf: 100 });
    t('OI nominal: recuperación ≈ 42 %', Math.abs(nom.R - 0.42) < 0.04, (nom.R * 100).toFixed(1) + ' %');
    t('OI nominal: SEC en rango 2–4,5 kWh/m³', nom.SEC > 2 && nom.SEC < 4.5, nom.SEC.toFixed(2));
    t('OI: más presión → más recuperación', ROModel.solve({ P: 70 }).R > nom.R);
    t('OI: más recuperación → concentrado más salino', ROModel.solve({ P: 70 }).Cc > nom.Cc);
    t('OI: sin presión suficiente no hay permeado', ROModel.solve({ P: 25 }).Qp === 0);
    t('OI: sin ERD el SEC aumenta', ROModel.solve({ etaERD: 0 }).SEC > nom.SEC);
    // Salmuera
    const pl = new BrinePlume(32, 20, 25);
    for (let i = 0; i < 200; i++) { pl.inject(16, 2, 1000, 2); pl.step(0.25); }
    t('Pluma: conservación de masa (descargada = dentro + exportada)', pl.balanceError() < 1e-3, (pl.balanceError() * 100).toFixed(4) + ' %');
    t('Pluma: concentración no negativa', Array.from(pl.s).every(v => v >= 0));
    // FV
    const pv = PVModel.power({ Pnom: 600, G: 1000, Ta: 25, noct: 20 });
    t('FV: STC sin pérdidas ≈ nominal·η_inv', Math.abs(pv.P - 600 * 0.97) < 1);
    t('FV: la suciedad reduce potencia', PVModel.power({ Pnom: 600, G: 900, soil: 0.2 }).P < PVModel.power({ Pnom: 600, G: 900 }).P);
    t('FV: de noche no produce', PVModel.day({ Pnom: 600 }).E[2] === 0);
    // Eólica
    const C = WindModel.curve;
    t('Eólica: bajo cut-in = 0', WindModel.power(2.5) === 0);
    t('Eólica: sobre nominal = Pnom', WindModel.power(18) === C.Pnom);
    t('Eólica: sobre cut-out = 0', WindModel.power(26) === 0);
    t('Eólica: la extrapolación v³ supera la curva real a 20 m/s', WindModel.naiveCubic(20) > WindModel.power(20));
    t('Eólica: estela reduce viento aguas abajo', WindModel.farm(10, [{ x: 0 }, { x: 3 }]).turbines[1].v < 10);
    // BESS
    const b = BESSModel.make({ soc: 0.5 });
    let okSoc = true, okPow = true;
    for (let i = 0; i < 100; i++) { const pe = BESSModel.step(b, (i % 7 < 3 ? 400 : -400), 1); if (b.soc < b.socMin - 1e-9 || b.soc > b.socMax + 1e-9) okSoc = false; if (Math.abs(pe) > b.pmax + 1e-9) okPow = false; }
    t('BESS: SOCmin ≤ SOC ≤ SOCmax', okSoc); t('BESS: potencia dentro de límites', okPow);
    const b2 = BESSModel.make({ soc: 0.5, socMin: 0, socMax: 1 }); BESSModel.step(b2, -100, 1);
    t('BESS: ida y vuelta pierde energía (100 kWh cargados → < 100 kWh recuperables)', BESSModel.energyAbove(b2, 0.5) < 100, BESSModel.energyAbove(b2, 0.5).toFixed(1) + ' kWh');
    // H2
    const h = H2Model.produce(5500, 1e9);
    t('H2: limitado por energía', Math.abs(h.m - 100) < 1e-6 && h.limitedBy === 'energía');
    const hw = H2Model.produce(1e9, 2000);
    t('H2: limitado por agua', hw.limitedBy === 'agua' && hw.water <= 2000 + 1e-6);
    t('H2: agua ≥ estequiométrica (≈ 8,94 kg/kg)', H2Model.waterPerKg() >= H2_STOICH_WATER);
    t('H2: con electricidad fósil no es verde', !H2Model.greenCheck(0, 100).green);
    // Agro
    t('Agro: ETc = Kc·ET0', Math.abs(AgroModel.etc(1.15, 6) - 6.9) < 1e-9);
    t('Agro: riego bruto ≥ neto', AgroModel.gross(7, 0.85) >= 7);
    const mix = AgroModel.blend([{ q: 1, ec: 0.05, boron: 1.2 }, { q: 1, ec: 3.0, boron: 0.2 }]);
    t('Agro: mezcla conserva sales (EC media ponderada)', Math.abs(mix.ec - 1.525) < 1e-9);
    t('Agro: Maas–Hoffman fríjol a ECe 3 → 62 %', Math.abs(AgroModel.saltYield('frijol', 3) - 0.62) < 1e-9);
    // Microred
    const mgCfg = (h2) => ({ hours: 24, pv: Array.from({ length: 24 }, (_, i) => PVModel.clearSky(i + 0.5) * 0.6), wind: Array(24).fill(80), crit: Array(24).fill(120), bess: { soc: 0.5 }, tank: { cap: 2000, level: 1000, min: 300 }, roKW: 200, roM3perKWh: 0.33, demandM3: Array(24).fill(40), schedule: { ro: Array(24).fill(1), irr: Array(24).fill(0), h2: Array(24).fill(h2) }, irrKW: 0, h2KW: 150, rules: { reserve: 0.3, h2OnlySurplus: true } });
    const mg = MicrogridModel.run(mgCfg(1)), mg0 = MicrogridModel.run(mgCfg(0));
    t('Microred: SOC dentro de límites', mg.series.every(s => s.soc >= 0.1 - 1e-6 && s.soc <= 0.95 + 1e-6));
    t('Microred: con regla de excedente el H2 no agrava el déficit crítico', mg.unservedCrit <= mg0.unservedCrit * 1.001 + 1e-6, mg.unservedCrit.toFixed(1) + ' vs ' + mg0.unservedCrit.toFixed(1) + ' kWh');
    t('Microred: balance de energía (generación ≥ consumo servido − aporte neto BESS)', mg.series.every(s => s.gen + 1e-6 >= 0));
    t('Microred: el tanque no excede capacidad ni es negativo', mg.series.every(s => s.tank >= 0 && s.tank <= 2000));
    // Multiobjetivo
    const dirs = { costo: 'min', agua: 'max' };
    const alts = [{ name: 'A', crit: { costo: 10, agua: 5 } }, { name: 'B', crit: { costo: 8, agua: 7 } }, { name: 'C', crit: { costo: 6, agua: 4 } }];
    const par = MOModel.pareto(alts, dirs);
    t('Multiobjetivo: A está dominada por B', par[0].dominated && !par[1].dominated && !par[2].dominated);
    return R;
  },
};

const LearningModel = {
  init(state) {
    if (!state.mastery) state.mastery = {};
    for (const k of MASTERY_KEYS) if (typeof state.mastery[k] !== 'number') state.mastery[k] = 0;
    if (!state.notes) state.notes = {};
    if (!state.misconceptions) state.misconceptions = {};
    if (!state.confidence) state.confidence = { poco: [0, 0], medio: [0, 0], mucho: [0, 0] };
    if (!state.solo) state.solo = [0, 0, 0, 0, 0, 0].map(() => [0, 0]);
  },
  get s() { return GS.s; },
  startLevel(id) { this.levelStart = nowMs(); this.currentLevel = id; },
  note(ev) { const n = GS.s.notes; n[ev] = (n[ev] || 0) + 1; },
  /** Registra evidencia. r: {kind, id, ra, concepts, solo, correct, hints, time, confidence, transfer, misconception, explanation, level} */
  record(r) {
    const s = GS.s; this.init(s);
    const solo = r.solo || 2;
    const concepts = r.concepts && r.concepts.length ? r.concepts : (RA_CONCEPTS[r.ra] || ['steamInquiry']);
    const deltas = {};
    for (const c of concepts) {
      const m = s.mastery[c] || 0;
      let d;
      if (r.correct) {
        d = (6 + 3 * solo) * (1 - m / 100) * (1 - 0.22 * Math.min(3, r.hints || 0));
        if (r.transfer) d *= 1.35;
        if (r.confidence === 'mucho') d *= 1.1;
        if (r.retry) d *= 0.6;
        if (r.time && r.time > 240) d *= 0.9;
      } else {
        d = -(3 + 1.5 * solo) * (0.3 + m / 100) * (r.confidence === 'mucho' ? 1.5 : 1);
      }
      s.mastery[c] = clamp(m + d, 0, 100);

    t += '\nPRECISIÓN POR NIVEL SOLO\n';

    t += '\nPistas utilizadas: ' + a.hints + '\nTransferencias exitosas: ' + a.transfers + '\nTiempo medio por reto: ' + Math.round(a.avgTime) + ' s\n';
    t += '\nCONFIANZA DECLARADA (aciertos/total)\n';

    t += '\nCONCEPTOS A REFORZAR: ' + a.reinforce.map(k => MASTERY_LABELS[k]).join(', ') + '\n';

/* =====================================================================
   22a_questions.js — Banco SOLO (parte 1): RA-01, RA-02, RA-03
   Formato compacto: ctx(id, título, contexto, items)
   item: [nivelSOLO, enunciado, [A,B,C,D], clave, justificación, [racional por opción], concepción, extra]
   extra: {retry:{stem, options, key, why, dist}, hints:[3], guide, concepts, ordered, src}
   ===================================================================== */

function ctx(id, title, C, items) {
  const ra = id.slice(0, 5);
  CONTEXTS[id] = Object.assign({ id, ra, title, sim: true }, C);
  items.forEach(([solo, stem, options, key, why, dist, mis, extra = {}]) => {
    QBANK.push(Object.assign({
      id: id + '-Q0' + solo, ra, ctx: id, solo, competency: (extra.concepts || RA_CONCEPTS[ra])[0], concepts: extra.concepts || RA_CONCEPTS[ra],
      claim: RA[ra], evidence: 'Selecciona y justifica la opción coherente con los datos del contexto (' + SOLO_NAMES[solo] + ').', task: SOLO_TASKS[solo],
      stem, options, key, keyRationale: why, why, distractorRationales: dist, dist, misconception: mis, mis,
      source: C.src || 'Datos simulados para fines educativos', isSimulatedData: C.sim !== false,
      retryVariant: extra.retry || null, retry: extra.retry || null, gameTrigger: C.trigger || ('puerta_' + id), difficulty: solo, estimatedTime: 40 + solo * 25,
      hints: extra.hints || null, guide: extra.guide || null, ordered: !!extra.ordered,
    }, extra.meta || {}));
  });
}

const CALCS = [

  { id: 'CA04', ra: 'RA-02', title: 'Consumo específico', gen: r => { const P = r.int(110, 200), qp = r.int(30, 55); return { text: `Potencia ${P} kW, permeado ${qp} m³/h. ¿SEC en kWh/m³?`, ans: P / qp, unit: 'kWh/m³', tol: 0.08, steps: `SEC = ${P}/${qp}` }; } },

  { id: 'CA06', ra: 'RA-03', title: 'Masa de sal en exceso', gen: r => { const qc = r.int(40, 80), dc = r.int(15, 35); return { text: `Qc = ${qc} m³/h con ${dc} g/L sobre el ambiente. ¿Exceso de sal en kg/h?`, ans: qc * dc, unit: 'kg/h', tol: 2, steps: `${qc} m³/h × ${dc} kg/m³` }; } },
  { id: 'CA07', ra: 'RA-03', title: 'Llenado de estanque', gen: r => { const v = r.int(5, 15) * 100, q = r.int(40, 80); return { text: `Estanque de ${v} m³ recibe ${q} m³/h. ¿Horas hasta llenarse?`, ans: v / q, unit: 'h', tol: 0.2, steps: `${v}/${q}` }; } },
  { id: 'CA08', ra: 'RA-04', title: 'Energía FV', gen: r => { const P = r.int(200, 600), h = r.int(2, 8) / 2; return { text: `Un campo entrega ${P} kW constantes durante ${fmt(h, 1)} h. ¿Energía en kWh?`, ans: P * h, unit: 'kWh', tol: 1, steps: `E = ${P} × ${fmt(h, 1)}` }; } },
  { id: 'CA09', ra: 'RA-04', title: 'Potencia FV con pérdidas', gen: r => { const P = r.int(4, 8) * 100, G = r.int(5, 10) * 100, s = r.int(5, 20); return { text: `Pnom ${P} kW, G = ${G} W/m², suciedad ${s} % (ignora temperatura e inversor). ¿P en kW?`, ans: P * G / 1000 * (1 - s / 100), unit: 'kW', tol: 1, steps: `P = ${P}·(${G}/1000)·(1 − ${s / 100})` }; } },
  { id: 'CA10', ra: 'RA-04', title: 'Curva eólica', gen: r => { const v = r.int(5, 11); return { text: `Curva: P = 500·(v³ − 27)/1 701 kW entre 3 y 12 m/s. ¿P a ${v} m/s?`, ans: 500 * (v ** 3 - 27) / 1701, unit: 'kW', tol: 2, steps: `500·(${v ** 3} − 27)/1 701` }; } },
  { id: 'CA11', ra: 'RA-05', title: 'Energía sobre reserva', gen: r => { const cap = r.int(5, 15) * 100, soc = r.int(45, 90), res = r.int(20, 35); return { text: `Batería ${cap} kWh, SOC ${soc} %, reserva ${res} %, η descarga 0,95. ¿kWh entregables sobre la reserva?`, ans: (soc - res) / 100 * cap * 0.95, unit: 'kWh', tol: 2, steps: `(${soc} − ${res})% × ${cap} × 0,95` }; } },
  { id: 'CA12', ra: 'RA-05', title: 'Autonomía de carga crítica', gen: r => { const e = r.int(150, 500), p = r.int(40, 150); return { text: `Hay ${e} kWh disponibles y una carga crítica de ${p} kW. ¿Horas de autonomía?`, ans: e / p, unit: 'h', tol: 0.05, steps: `${e}/${p}` }; } },

  { id: 'CA15', ra: 'RA-07', title: 'Riego bruto', gen: r => { const kc = [0.95, 1.05, 1.15, 1.2][r.int(0, 3)], et0 = r.int(4, 8), eff = [0.6, 0.75, 0.9][r.int(0, 2)], a = r.int(2, 10) * 100; return { text: `Kc ${fmt(kc, 2)}, ET0 ${et0} mm/día, eficiencia ${fmt(eff, 2)}, área ${a} m². ¿m³/día brutos?`, ans: kc * et0 / eff * a / 1000, unit: 'm³/día', tol: 0.05, steps: `(${fmt(kc, 2)}×${et0}/${fmt(eff, 2)}) mm × ${a} m² / 1 000` }; } },

/* =====================================================================
   NumericScene — ejercicio de cálculo con teclado numérico pixel
   ===================================================================== */
const NumericScene = {
  overlay: true,
  enter(p) {
    this.C = p.calc; this.onDone = p.onDone; this.seed = p.seed || (Date.now() & 0xffff); this.prob = this.C.gen(RNG(this.seed));
    this.input = ''; this.fb = null; this.t0 = nowMs(); this.tries = 0;
  },
  update() {
    if (this.fb && this.fb.ok) { if (Input.pressed('confirm')) this.close(); return; }
    for (let d = 0; d <= 9; d++) if (Input.keyPressed('Digit' + d) || Input.keyPressed('Numpad' + d)) this.type(String(d));
    if (Input.keyPressed('Comma') || Input.keyPressed('Period') || Input.keyPressed('NumpadDecimal')) this.type(',');
    if (Input.keyPressed('Backspace')) this.input = this.input.slice(0, -1);
    if (Input.keyPressed('Enter') || Input.keyPressed('NumpadEnter')) this.check();
    if (Input.keyPressed('Escape')) this.close();
  },
  type(ch) { if (this.input.length < 10 && !(ch === ',' && this.input.includes(','))) { this.input += ch; Audio2.sfx('uiMove'); } },
  check() {
    const v = parseFloat(this.input.replace(',', '.'));
    if (!isFinite(v)) return;
    const ok = Math.abs(v - this.prob.ans) <= Math.max(this.prob.tol, Math.abs(this.prob.ans) * 0.01);
    this.tries++;
    this.fb = { ok, v };
    LearningModel.record({ kind: 'challenge', id: this.C.id, ra: this.C.ra, solo: 3, correct: ok, time: (nowMs() - this.t0) / 1000, retry: this.tries > 1, misconception: ok ? null : 'error de cálculo o de unidades: ' + this.C.title });
    Audio2.sfx(ok ? 'success' : 'error');
  },
  close() { Game.pop(); this.onDone && this.onDone(this.fb && this.fb.ok); },
  render(g) {
    fdither(g, 0, 0, W, H, '#05030f', 0.75);
    const x = 120, w = W - 240;
    UIK.panel(g, x, 40, w, H - 80, 'tech');
    UIK.header(g, x, 40, w, 'CÁLCULO · ' + this.C.title, 'tech', 'chart');
    drawTextBlock(g, this.prob.text, x + 12, 66, w - 24, { color: '#fffaf0' });
    drawText(g, 'Datos simulados para fines educativos', x + 12, 96, { font: 'tiny', color: '#ff9a8a' });
    frect(g, x + 12, 110, w - 24, 22, '#05030f'); frect(g, x + 13, 111, w - 26, 20, '#0a1030');
    drawText(g, (this.input || '_') + ((Game.frame >> 4) & 1 ? '|' : '') + '  ' + this.prob.unit, x + 20, 117, { color: '#56e5ff' });
    Gui.begin();
    const keys = ['7', '8', '9', '4', '5', '6', '1', '2', '3', ',', '0', '←'];
    keys.forEach((k, i) => { if (Gui.button(g, 'k' + k, x + 12 + (i % 3) * 40, 140 + Math.floor(i / 3) * 22, 36, 18, k, { style: 'ghost' })) { if (k === '←') this.input = this.input.slice(0, -1); else this.type(k); } });
    if (Gui.button(g, 'chk', x + 140, 140, 110, 20, 'Comprobar', { style: 'good', icon: 'check', disabled: !this.input || (this.fb && this.fb.ok) })) this.check();
    if (this.fb) {
      const t = this.fb.ok ? '{g}Correcto.{/} ' + this.prob.steps + ' ≈ ' + fmt(this.prob.ans, 2) + ' ' + this.prob.unit : '{o}Revisa:{/} tu valor ' + fmt(this.fb.v, 2) + ' no coincide. Pista: ' + this.prob.steps.split('=')[0] + '… revisa unidades.';
      drawTextBlock(g, t, x + 140, 166, w - 152, { color: '#fffaf0' });
    }
    if (Gui.button(g, 'cls', x + w - 92, H - 66, 80, 18, this.fb && this.fb.ok ? 'Continuar' : 'Cerrar', { style: this.fb && this.fb.ok ? 'good' : 'ghost' })) this.close();
    Gui.end();
  },
};

/* =====================================================================
   DebateScene — posición + argumento con evidencia + reconocer trade-off
   ===================================================================== */
const DebateScene = {
  overlay: true,
  enter(p) { this.D = p.debate; this.onDone = p.onDone; this.step = 0; this.pos = -1; this.arg = -1; this.trade = -1; this.score = 0; this.t0 = nowMs(); this.order = RNG(this.D.id.length * 97).shuffle(this.D.args.map((_, i) => i)); },
  update() { },
  render(g) {
    const D = this.D;
    fdither(g, 0, 0, W, H, '#05030f', 0.78);
    const x = 40, w = W - 80;
    UIK.panel(g, x, 20, w, H - 40, 'dialog');
    UIK.header(g, x, 20, w, 'DEBATE ARGUMENTADO · ' + D.title, 'dialog', 'scale');
    let y = 42;
    y += drawTextBlock(g, D.prompt, x + 12, y, w - 24, { color: '#fffaf0' }) + 6;
    Gui.begin();
    if (this.step === 0) {
      drawText(g, '1. Elige tu posición (no hay una única correcta; se evalúa tu argumentación):', x + 12, y, { font: 'tiny', color: '#ffe14d' }); y += 10;
      D.positions.forEach((ps, i) => { if (Gui.button(g, 'p' + i, x + 12, y, w - 24, 18, ps, { style: 'choice', align: 'left' })) { this.pos = i; this.step = 1; } y += 22; });
    } else if (this.step === 1) {
      drawText(g, 'Posición: ' + D.positions[this.pos] + '. 2. ¿Qué argumento la sostiene MEJOR con evidencia?', x + 12, y, { font: 'tiny', color: '#ffe14d' }); y += 10;
      this.order.forEach((k, i) => { const r = Gui.choice(g, 'a' + i, x + 12, y, w - 24, D.args[k][0], 'ABCD'[i], {}); if (r.clicked) { this.arg = k; this.step = 2; } y += r.h + 2; });
    } else if (this.step === 2) {
      drawText(g, '3. ¿Qué costo o compromiso reconoces de tu posición?', x + 12, y, { font: 'tiny', color: '#ffe14d' }); y += 10;
      D.tradeoffs.forEach((t, i) => { if (Gui.button(g, 't' + i, x + 12, y, w - 24, 18, t, { style: 'choice', align: 'left' })) { this.trade = i; this.step = 3; this.evaluate(); } y += 22; });
      if (Gui.button(g, 'tn', x + 12, y, w - 24, 18, 'Mi posición no tiene costos', { style: 'danger', align: 'left' })) { this.trade = -1; this.step = 3; this.evaluate(); }
    } else {
      const q = D.args[this.arg][1];
      const t = (q === 2 ? '{g}Argumento basado en evidencia y relaciones del sistema.{/} ' : q === 0 ? '{y}Argumento débil:{/} apela a un valor o a una generalización sin datos. ' : '{o}Argumento con un error conceptual.{/} ') + (this.trade >= 0 ? '{g}Reconociste un compromiso:{/} eso hace tu posición discutible y honesta.' : '{o}Toda decisión en el Nexo tiene costos:{/} nombrarlos permite negociarlos.');
      y += drawTextBlock(g, t, x + 12, y, w - 24, { color: '#fffaf0' }) + 8;
      if (Gui.button(g, 'ok', x + w / 2 - 60, H - 52, 120, 20, 'Continuar', { style: 'good' })) { Game.pop(); this.onDone && this.onDone(this.score >= 2); }
    }
    Gui.end();
  },
  evaluate() {
    const q = this.D.args[this.arg][1];
    this.score = (q === 2 ? 2 : q === 0 ? 1 : 0) + (this.trade >= 0 ? 1 : 0);
    LearningModel.record({ kind: 'challenge', id: this.D.id, ra: this.D.ra, concepts: ['ethics', 'communication', 'multiobjective'], solo: 4, correct: this.score >= 3, time: (nowMs() - this.t0) / 1000, misconception: q < 0 ? 'argumento con error conceptual: ' + this.D.title : null });
    Audio2.sfx(this.score >= 3 ? 'success' : 'soft');
  },
};

  'RA-03-C3-Q05': ['El precio internacional de la sal, porque define si la venta cubre los costos.', 'Balances de masa y energía, mercado, madurez, impactos y aceptación social.', 'El tamaño de la planta de OI, porque a mayor escala la valorización conviene.', 'El número de minerales distintos que contiene la salmuera de la planta.'],
  'RA-04-C1-Q01': ['Con un pico de 450 kW, la energía del día nublado fue casi igual a la del despejado.', 'Las caídas bruscas de las 10 y las 13 h son coherentes con nubes pasajeras.', 'La energía diaria corresponde al área bajo la curva de potencia de cada día.', 'La potencia es nula durante la noche en ambos días, con o sin nubes.'],
  'RA-04-C1-Q04': ['Operar la OI a plena carga desde las 6 h, con batería hasta que salga el sol.', 'Concentrar la OI en ventanas de alta generación, reservar batería y desplazar el H2.', 'Programar todas las cargas suponiendo 450 kW disponibles durante todo el día.', 'Apagar la OI todo el día y esperar una jornada despejada para producir.'],
  'RA-04-C1-Q05': ['Planificar con el promedio anual de potencia pico, que resume bien el recurso solar.', 'Estimar energía horaria con banda de incertidumbre, reserva nocturna y cargas flexibles.', 'Instalar más paneles y mantener la misma operación que en la estación soleada.', 'Suponer que la eólica nocturna compensará exactamente el déficit solar.'],
  'RA-04-C2-Q01': ['Colocar turbinas más juntas siempre aumenta la producción total del parque.', 'La turbina aguas abajo recibe menos viento por el efecto estela de la primera.', 'Sobre 12 m/s la potencia de cada turbina queda limitada a la nominal.', 'Sobre 25 m/s la turbina se detiene por seguridad aunque haya mucho viento.'],
  'RA-04-C2-Q03': ['A 3D: 286 + 111 = 397 kW; a 7D: 286 + 186 = 472 kW.', 'A 3D: 286 + 286 = 572 kW; a 7D: también 572 kW.', 'A 3D: 286 + 286 = 572 kW; a 7D: 286 + 0 = 286 kW.', 'A 3D: 286 + 230 = 516 kW; a 7D: 286 + 114 = 400 kW.'],
  'RA-04-C2-Q04': ['Ubicarlas juntas a 3D en una sola fila para reducir el costo de cable y caminos.', 'Escalonarlas o separarlas ≥ 7D en la dirección dominante, aceptando más cableado.', 'Orientar cada turbina al azar para que las estelas se repartan de forma pareja.', 'Instalar solo una turbina en la franja para evitar por completo las estelas.'],
  'RA-04-C2-Q05': ['Copiar la separación entre turbinas de Aridia, que ya probó funcionar bien.', 'Usar la rosa de vientos local, modelar estelas en ambas direcciones y validar.', 'Estimar la producción con v³ a cualquier velocidad y elegir el sitio más ventoso.', 'Ubicar las turbinas donde el viento sea máximo, sin considerar el cut-out.'],
  'RA-04-C3-Q04': ['Programar el electrolizador a 300 kW y cubrir con la batería cualquier faltante.', 'Asegurar esenciales y OI con el escenario pesimista y el H2 solo con excedente real.', 'Apagar la OI durante la tarde para garantizar la producción de H2 comprometida.', 'Programar todas las cargas con el escenario optimista y corregir si algo falla.'],
  'RA-04-C3-Q05': ['Una regla fija basada solo en la hora del día, igual en todas las estaciones.', 'Pronósticos probabilísticos (p10 para lo crítico), prioridades declaradas y revisión.', 'Maximizar siempre el H2, porque almacena el excedente para cualquier temporada.', 'Eliminar la batería para simplificar el despacho y reducir costos.'],
  'RA-05-C1-Q01': ['Como la batería tiene 250 kW, puede suministrar 250 kW durante toda la noche.', 'La batería almacena energía producida por otras fuentes; no la genera.', 'La potencia máxima limita qué tan rápido puede entregar su energía.', 'La reserva mínima protege servicios esenciales ante eventos inciertos.'],
  'RA-05-C1-Q04': ['Usar toda la batería en las primeras horas para maximizar el H2 mientras se pueda.', 'Reservarla para lo crítico, posponer flexibles y usar la reserva solo si falta viento.', 'Ignorar el pronóstico de viento débil y operar todas las cargas de forma normal.', 'Desconectar la carga crítica durante la noche para proteger la batería.'],
  'RA-05-C1-Q05': ['Descargar siempre hasta el mínimo físico cada noche para usar toda la capacidad.', 'Fijar una reserva dinámica según el p10, cargar con excedente y modular flexibles.', 'Mantener la batería siempre al 100 % y usarla solo en emergencias declaradas.', 'Decidir la descarga de cada noche con el pronóstico promedio de viento y sol.'],
  'RA-05-C2-Q01': ['Si el SOC sigue en 60 %, la energía disponible es la misma que antes de la falla.', 'La potencia máxima disponible disminuyó al perder uno de los cuatro módulos.', 'La capacidad útil de la batería disminuyó de 1 000 a 750 kWh.', 'Las cargas conectadas deben revisarse ante la nueva potencia máxima.'],
  'RA-05-C2-Q04': ['Nada cambia: mientras el SOC sea alto, la batería cubre las mismas cargas.', 'Con 187,5 kW no alcanza para ambas: priorizar esenciales y mover la OI al día.', 'Conviene apagar los servicios esenciales de noche para seguir operando la OI.', 'Basta con cargar la batería al 100 % para recuperar la potencia perdida.'],
  'RA-05-C2-Q05': ['Reemplazar los módulos por uno único y grande para simplificar el control.', 'Redundancia N+1, operación modular, mantenimiento predictivo y prioridades.', 'Operar siempre a potencia máxima para aprovechar cada módulo mientras funcione.', 'Eliminar la reserva mínima para disponer de más energía útil tras una falla.'],
  'RA-05-C3-Q02': ['Electrolizador', 'Riego programado', 'Servicios críticos', 'Ósmosis inversa'],
  'RA-05-C3-Q04': ['Electrolizador → OI → servicios críticos → bombeo potable → riego.', 'BESS estable → críticos → bombeo → OI (con sol) → riego → H2 con excedente.', 'Conectar todas las cargas a la vez y luego desconectar las que fallen.', 'OI → riego → servicios críticos → bombeo potable → electrolizador.'],
  'RA-05-C3-Q05': ['Usar el mismo protocolo del mediodía, porque las prioridades no cambian de noche.', 'Reconectar solo lo que sostienen batería y eólica, por etapas y con umbrales de SOC.', 'Esperar al amanecer sin reconectar ninguna carga para proteger la batería.', 'Reconectar primero el electrolizador para producir H2 de respaldo nocturno.'],
  'RA-06-C1-Q03': ['Mínimo ≈ 274 kg de agua; con purificación ≈ 422 kg de entrada.', 'Mínimo ≈ 30,7 kg de agua; con purificación ≈ 47 kg de entrada.', 'Mínimo ≈ 274 kg de agua; con purificación ≈ 178 kg de entrada.', 'No se requiere agua de entrada, porque el H2 producido es un gas.'],
  'RA-06-C1-Q04': ['Operarlo a plena carga todo el día y completar con batería cuando falte excedente.', 'Operarlo solo con excedente, sobre su carga mínima, sin competir por agua y con trazabilidad.', 'Priorizar el H2 sobre el tanque de agua potable, porque su valor económico es mayor.', 'Mantenerlo apagado siempre para no gastar agua en una región árida.'],
  'RA-06-C1-Q05': ['Replicar el mismo electrolizador y su programación, que ya funcionan en Aridia.', 'Dimensionar según horas de excedente y agua, costos nivelados y prioridades locales.', 'Maximizar la producción de H2 porque es una energía limpia en cualquier contexto.', 'Usar electricidad de cualquier origen para mantener la producción constante.'],
  'RA-06-C2-Q04': ['Es poco en términos absolutos, así que no requiere discusión con la comunidad.', 'Evaluarlo frente al agua local, transparentarlo y priorizar el agua esencial.', 'Debe prohibirse cualquier producción de H2 mientras exista escasez de agua.', 'Se resuelve vendiendo el oxígeno subproducto para pagar agua de otra región.'],
  'RA-06-C2-Q05': ['Extraer agua del acuífero local según se necesite, porque está disponible.', 'Agua desalinizada con salmuera gestionada, enfriamiento seco y retiro medido.', 'Usar agua potable de la red, porque ya está tratada y reduce costos.', 'Concentrarse en la electricidad renovable, que es la restricción principal.'],
  'RA-06-C3-Q02': ['DETENER → VENTILAR → DETECTAR → AISLAR → VERIFICAR → AUTORIZAR REINICIO', 'DETECTAR → AISLAR → DETENER → VENTILAR → VERIFICAR → AUTORIZAR REINICIO', 'DETECTAR → VENTILAR → AUTORIZAR REINICIO → AISLAR → DETENER → VERIFICAR', 'AISLAR → DETECTAR → VERIFICAR → AUTORIZAR REINICIO → VENTILAR → DETENER'],
  'RA-06-C3-Q03': ['Aislar el suministro, detener el equipo, ventilar, alejar al personal y verificar.', 'Seguir produciendo, abrir puertas y ventanas y esperar a que el aire se renueve.', 'Silenciar el detector hasta confirmar que no es una falsa alarma del sensor.', 'Reiniciar el electrolizador para que el flujo de gas "purgue" la sala.'],
  'RA-06-C3-Q04': ['Porque el hidrógeno nunca termina de dispersarse de una sala cerrada.', 'Porque falta hallar la causa, confirmar lecturas estables y obtener autorización.', 'Porque la ventilación consume mucha energía y conviene apagarla primero.', 'Porque el reglamento solo permite reiniciar equipos durante la noche.'],
  'RA-06-C3-Q05': ['Confiar en la experiencia del operador más antiguo para decidir cada caso.', 'Sensores redundantes, interlocks no anulables, simulacros y comunicación clara.', 'Reducir el número de sensores para evitar alarmas que interrumpen el trabajo.', 'Trabajar más rápido dentro de la sala para salir antes de que ocurra una fuga.'],
  'RA-07-C1-Q01': ['Como el permeado es casi agua pura, es ideal para cualquier cultivo sin ajustes.', 'El boro del permeado podría superar la tolerancia orientativa del fríjol.', 'El agua del pozo aporta mucha más salinidad que el permeado de OI.', 'Mezclar fuentes cambia al mismo tiempo la EC y el boro del agua de riego.'],
  'RA-07-C1-Q03': ['EC ≈ 0,82 dS/m y boro ≈ 0,86 mg/L: el boro aún supera el umbral.', 'EC ≈ 0,82 dS/m y boro ≈ 0,40 mg/L: cumple ambos límites.', 'EC ≈ 2,6 dS/m y boro ≈ 1,1 mg/L: no cumple ningún límite.', 'EC ≈ 2,65 dS/m y boro ≈ 1,4 mg/L, porque los valores se suman.'],
  'RA-07-C1-Q04': ['Regar el fríjol solo con permeado y aumentar el volumen para diluir el boro.', 'Mezclar y remineralizar, dar al fríjol el agua con menos boro y llevar tolerantes al resto.', 'Regar todas las parcelas solo con agua del pozo, que tiene menos boro que el permeado.', 'Cambiar todas las parcelas a un único cultivo de alto rendimiento tolerante al boro.'],
  'RA-07-C1-Q05': ['Aplicar los umbrales de esta finca como reglas universales para cualquier cultivo.', 'Analizar fuentes, suelo y drenaje; mezclar por cultivo y etapa; monitorear con la gente.', 'Elegir siempre la fuente de agua más barata y ajustar el cultivo a esa agua.', 'Regar con más volumen para lavar las sales y el boro, sea cual sea el suelo.'],
  'RA-07-C2-Q01': ['Surcos y goteo necesitan el mismo volumen bruto, porque el cultivo es el mismo.', 'La necesidad neta de agua depende del cultivo, su etapa y el clima.', 'La eficiencia del sistema de riego cambia el volumen bruto a aplicar.', 'La cobertura del suelo puede reducir la evaporación desde la superficie.'],
  'RA-07-C2-Q04': ['Riego por surcos al mediodía, cuando el suelo está más seco y absorbe mejor.', 'Goteo con cobertura, riego temprano, sensores de humedad y ajuste por etapa.', 'Goteo sin cobertura con un calendario fijo igual para toda la temporada.', 'Aspersión en las horas de más calor para enfriar las hojas del cultivo.'],
  'RA-07-C2-Q05': ['Mantener el mismo calendario de riego y esperar a que vuelva la lluvia.', 'Priorizar etapas críticas, cobertura, especies tolerantes y reparto acordado del agua.', 'Duplicar el riego antes de la sequía para "guardar" agua en el suelo.', 'Sembrar solo el cultivo más rentable para compensar las pérdidas del año.'],
  'RA-07-C3-Q01': ['Responder al estrés salino aumentando el volumen siempre corrige el problema.', 'La demanda total de 15 m³/d supera la disponibilidad de 12 m³/d.', 'Las tres parcelas toleran de forma distinta la salinidad del agua.', 'La etapa de cada cultivo cambia la prioridad del riego en la sequía.'],
  'RA-07-C3-Q03': ['P1: 6, P2: 5 y P3: 1, atendiendo las parcelas en el orden de la tabla.', 'P1: 6 (floración, mejor agua), P2: 3 (tolerante, pozo), P3: 3 (cobertura).', 'P1: 0, P2: 6 y P3: 6, porque sorgo y nopal producen más con agua.', 'P1: 4, P2: 4 y P3: 4, repartiendo por igual entre las tres parcelas.'],
  'RA-07-C3-Q04': ['Pasar a monocultivo del cultivo más productivo para simplificar el manejo.', 'Asociaciones diversas, cobertura, polinizadores, semillas locales y monitoreo.', 'Fertilización química intensiva para compensar el estrés de la sequía.', 'Arar profundamente cada semana para romper la costra y airear el suelo.'],
  'RA-07-C3-Q05': ['Esperar a que la planta de OI aumente su producción para cubrir el déficit.', 'Plan participativo: prioridades, semillas adaptadas, calidad, cobertura y lluvia.', 'Contratar agua en camiones durante la sequía y mantener las mismas prácticas.', 'Reducir el área cultivada a cero hasta que termine la sequía.'],
  'RA-08-C1-Q01': ['Mantener el electrolizador a máxima carga aunque haya déficit y turbidez.', 'Evaluar la calidad del agua de alimentación antes de sostener la OI.', 'Mantener los servicios esenciales durante todo el evento.', 'Considerar la batería y el almacenamiento de agua como amortiguadores.'],
  'RA-08-C1-Q04': ['Forzar la OI y el H2 a plena carga para aprovechar la eólica alta.', 'Priorizar servicios, revisar pretratamiento, modular la OI y pausar el H2.', 'Descargar completamente la batería y mantener todas las cargas sin cambios.', 'Cerrar toda la planta de inmediato, sin evaluar ninguna variable.'],
  'RA-08-C1-Q05': ['Usar una regla fija basada solo en la generación FV de cada hora.', 'Maximizar siempre el H2 para almacenar energía para futuras tormentas.', 'Pronóstico, reservas mínimas, calidad de agua, prioridades y revisión comunitaria.', 'Eliminar sensores redundantes para simplificar las decisiones en crisis.'],
  'RA-08-C2-Q01': ['La cuota fija puede cumplirse en cualquier clima sin afectar otros servicios.', 'La producción de H2 depende del excedente renovable disponible cada día.', 'Usar respaldo de la red fósil afecta el atributo "verde" del H2.', 'Una cuota fija choca con la variabilidad de la generación renovable.'],
  'RA-08-C2-Q03': ['Produce ≈ 82 kg/día; faltan ≈ 38 kg (≈ 2 100 kWh de otra fuente).', 'Produce 120 kg/día; no hay déficit porque el excedente alcanza.', 'Produce ≈ 247 kg/día; sobra hidrógeno para vender en el mercado.', 'Produce ≈ 38 kg/día; faltan ≈ 82 kg que exigen otra fuente.'],
  'RA-08-C2-Q04': ['Firmarlo tal como está, porque el H2 es el futuro energético de la región.', 'Renegociar cuotas ligadas al excedente, con prioridad del agua y origen verificado.', 'Cumplir la cuota usando la reserva de la batería cuando falte excedente.', 'Rechazar toda producción de H2 en Aridia por sus riesgos y costos.'],
  'RA-08-C2-Q05': ['Que el financiador decida con su equipo técnico, sin consulta externa.', 'Criterios públicos, participación, cuotas adaptativas y auditoría eléctrica.', 'Un índice único de rentabilidad para comparar contratos rápidamente.', 'Aceptar cualquier contrato que traiga inversión y empleo a la región.'],
  'RA-08-C3-Q01': ['La alternativa de menor costo inicial es necesariamente la mejor.', 'Las alternativas compiten en varios criterios a la vez, no en uno.', 'Los pesos asignados a los criterios son decisiones discutibles.', 'La participación de la comunidad es un criterio relevante.'],
  'RA-08-C3-Q04': ['Elegir A porque tiene la mayor confiabilidad, sin necesidad de más discusión.', 'Declarar pesos con la comunidad, analizar incertidumbre, explorar híbridos y quién paga.', 'Sumar los valores normalizados y elegir el mayor, sin declarar pesos.', 'Elegir B porque es la preferida por el equipo técnico del proyecto.'],
  'RA-08-C3-Q05': ['Un índice único calculado por el gemelo digital para cada expansión.', 'Criterios y pesos públicos, escenarios con incertidumbre, piloto y revisión.', 'Elegir siempre la ampliación de tubería, que es la opción más confiable.', 'Decidir por votación comunitaria sin presentar información técnica.'],
  'RA-09-C1-Q03': ['La diferencia supera la incertidumbre combinada: hay variabilidad o mala ubicación.', 'Son iguales dentro de la incertidumbre de ± 3 % de cada sensor.', 'El sensor que marca 26 % está roto y debe descartarse.', 'Se deben promediar (22 %) y descartar la diferencia entre ambos.'],
  'RA-09-C1-Q04': ['Venderlo tal cual, porque las lecturas ya muestran tendencias útiles.', 'Recalibrar con suelo salino, replicar, comparar con medidas manuales y protegerlo.', 'Cambiar la carcasa por una más vistosa para que más agricultores lo usen.', 'Aumentar la frecuencia de lectura para que el promedio corrija el sesgo.'],
  'RA-09-C1-Q05': ['Instalar un sensor por finca y automatizar el riego con sus lecturas.', 'Sensores replicados, calibración local, mantenimiento y registros compartidos.', 'Confiar en el pronóstico del clima en lugar de medir la humedad del suelo.', 'Usar la calibración de Aridia sin cambios, porque el sensor es el mismo.'],
  'RA-09-C2-Q01': ['Comunicar solo el escenario más probable evita confusión y es suficiente.', 'Existe un 30 % de probabilidad de algún tipo de racionamiento.', 'Las acciones recomendadas dependen del escenario que ocurra.', 'La incertidumbre del pronóstico debe explicarse con claridad.'],
  'RA-09-C2-Q03': ['Un solo indicador grande que diga "Agua: OK" mientras sea probable.', 'Barras por escenario con probabilidad, acción sugerida y fecha de actualización.', 'Un mapa de colores de la ciudad, sin leyenda, para no saturar.', 'Una tabla técnica con los caudales horarios previstos de la semana.'],
  'RA-09-C2-Q04': ['"Todo está bien: no habrá problemas de agua, no se preocupen."', '"Lo más probable es que alcance (7 de 10); hay 3 de 10 de turnos. Actualizamos el miércoles."', '"Todavía no sabemos nada sobre el agua de la próxima semana."', '"Habrá racionamiento severo; reduzcan el consumo desde hoy."'],
  'RA-09-C2-Q05': ['Un comunicado técnico mensual con los datos completos del gemelo digital.', 'Canales locales, lenguaje claro, escenarios con acciones, actualizaciones y diálogo.', 'Comunicar únicamente cuando ya hay una crisis para no generar alarma.', 'Delegar los mensajes al gemelo digital, que publica sus pronósticos.'],
  'RA-09-C3-Q01': ['Un índice único alto garantiza que todos los actores están bien servidos.', 'Con su peso actual, la equidad hídrica no influye en el índice.', 'Sumar unidades distintas sin normalizar no tiene sentido físico.', 'Los pesos ocultos impiden discutir quién gana y quién pierde.'],
  'RA-09-C3-Q02': ['Costo de operación', 'Agua entregada', 'H2 exportado', 'Equidad hídrica'],
  'RA-09-C3-Q03': ['Que muestra el resultado con decimales, lo que sugiere falsa precisión.', 'Que suma unidades incompatibles sin normalizar y con pesos no declarados.', 'Que incluye cuatro criterios, cuando bastaría con uno o dos.', 'Que se actualiza solo una vez al día y no en tiempo real.'],
  'RA-09-C3-Q04': ['Subir el peso del H2 para que el índice refleje mejor el desempeño.', 'Criterios separados y normalizados, pesos declarados, incertidumbre y afectados.', 'Eliminar la equidad del tablero para simplificar la lectura.', 'Mostrar solo el índice, con más decimales para mayor precisión.'],
  'RA-09-C3-Q05': ['Una revisión técnica anual cerrada del equipo que diseñó el tablero.', 'Talleres periódicos con actores, registro de cambios y pruebas de comprensión.', 'Delegar los pesos al algoritmo de optimización del gemelo digital.', 'Mantener el tablero sin cambios para que la gente no se confunda.'],

(function finalizeBank() {
  for (const q of QBANK) {
    const o = OPTION_REWRITES[q.id];
    if (o) q.options = o.slice();
    const lp = LENGTH_PATCH[q.id];
    if (lp) for (const k in lp) q.options[k] = lp[k];
    const d = DIST_REWRITES[q.id];
    if (d) q.dist = q.dist.map((x, i) => d[i] || x);
    q.distractorRationales = q.dist;
  }
  // balanceo: elige la posición de la clave con menor frecuencia acumulada (desempate aleatorio)
  const r = RNG(424242);
  const counts = [0, 0, 0, 0];
  const rot = (len, k, d) => { const ord = Array.from({ length: len }, (_, i) => i); const it = ord.splice(k, 1)[0]; ord.splice(d, 0, it); return ord; };
  for (const q of QBANK) {
    let cands;
    if (q.ordered) cands = [{ key: q.key, order: [0, 1, 2, 3] }, { key: 3 - q.key, order: [3, 2, 1, 0] }];
    else cands = [0, 1, 2, 3].map(d => ({ key: d, order: rot(4, q.key, d) }));
    const minC = Math.min(...cands.map(c => counts[c.key]));
    const pool = cands.filter(c => counts[c.key] <= minC + (q.ordered ? 0 : 1));
    const pickC = pool[Math.floor(r() * pool.length)];
    q.options = pickC.order.map(i => q.options[i]); q.dist = pickC.order.map(i => q.dist[i]); q.distractorRationales = q.dist; q.key = pickC.key;
    counts[q.key]++;
    if (q.retry) { const t2 = Math.floor(r() * 4); const o2 = q.retry.ordered ? [0, 1, 2, 3] : rot(4, q.retry.key, t2); q.retry = Object.assign({}, q.retry, { options: o2.map(i => q.retry.options[i]), dist: o2.map(i => q.retry.dist[i]), key: o2.indexOf(q.retry.key) }); q.retryVariant = q.retry; }
  }
})();

  /* ---------------- SOLAR ---------------- */
  { id: 'irradiancia', sec: 'solar', title: 'Irradiancia (GHI)', def: 'Potencia solar por unidad de área que llega a una superficie horizontal. Cambia con la hora, las nubes, el polvo y la estación. No es temperatura.', vars: 'GHI, irradiancia de referencia (G_ref = 1 000 W/m² en STC).', units: 'W/m² (potencia); kWh/m²·día (energía).', rel: 'P_FV ≈ P_nom · (G / G_ref) · derating.', ex: 'Una nube que cubre un string reduce G de 950 a 300 W/m² en segundos (' + SIM_NOTE + ')', limits: 'Modelo lineal; ignora el espectro y el ángulo de incidencia en detalle.', error: 'Confundir irradiancia con temperatura.', src: SRC.ideam, use: 'Dunas Fotónicas: las sombras de nubes reales del escenario modifican la generación.' },
  { id: 'kw_kwh', sec: 'solar', title: 'Potencia (kW) frente a energía (kWh)', def: 'La potencia es un ritmo instantáneo; la energía es potencia acumulada en el tiempo.', vars: 'P(t), E.', units: 'kW; kWh. 1 kW durante 1 h = 1 kWh.', rel: 'E = Σ P·Δt (área bajo la curva de potencia).', ex: 'Un pico de 600 kW durante 15 minutos aporta 150 kWh, no 600 kWh.', limits: '—', error: 'Asumir que una potencia pico garantiza energía suficiente para el día o la noche.', src: 'Física básica de energía.', use: 'El Espejismo de Mediodía y el Peak Sprite.' },
  { id: 'derating', sec: 'solar', title: 'Temperatura, suciedad y sombra', def: 'Factores que reducen la producción fotovoltaica respecto a la nominal: alta temperatura de módulo, polvo acumulado, sombras parciales, pérdidas del inversor y disponibilidad.', vars: 'Temperatura de módulo, factor de suciedad, factor de sombra, eficiencia del inversor.', units: '°C; fracciones (0–1).', rel: 'La potencia baja ≈ 0,3–0,5 % por cada °C sobre 25 °C (coeficiente típico de fichas técnicas). Limpiar consume agua: hay un trade-off.', ex: 'Polvo del 12 % y módulo a 60 °C reducen la potencia a ~75 % de la nominal (' + SIM_NOTE + ')', limits: 'Factores multiplicativos independientes.', error: 'Creer que los paneles producen lo mismo todo el día o que limpiar no cuesta nada.', src: 'Fichas técnicas de módulos FV (coeficiente de temperatura). ' + SRC.ideam, use: 'Misiones "Panel bajo sombra" y "Agua para limpiar o producir".' },
  /* ---------------- EÓLICA ---------------- */
  { id: 'curva_potencia', sec: 'eolica', title: 'Curva de potencia de un aerogenerador', def: 'Relación entre velocidad del viento y potencia eléctrica entregada. Tiene cuatro regiones: bajo cut-in (no produce), región parcial (crece rápido), nominal (meseta) y sobre cut-out (parada de seguridad).', vars: 'v, cut-in, v_rated, cut-out, P_nom.', units: 'm/s; kW.', rel: 'En la región parcial la potencia disponible crece aproximadamente con v³ (P = ½ρAv³Cp), pero la turbina se limita a P_nom y se detiene sobre cut-out.', ex: 'Turbina del juego: cut-in 3 m/s, nominal 12 m/s, cut-out 25 m/s (valores típicos; ' + SIM_NOTE + ')', limits: 'Curva por tramos; densidad del aire constante.', error: 'Extrapolar v³ por encima de la potencia nominal; creer que más viento siempre es mejor.', src: 'Valores típicos de curvas de fabricantes; ' + SRC.upme, use: 'Ráfaga Umbral y Gust Loop.' },
  { id: 'estela', sec: 'eolica', title: 'Efecto estela', def: 'Detrás de una turbina el viento es más lento y turbulento. Las turbinas alineadas con la dirección del viento pierden producción si están muy cerca.', vars: 'Distancia entre turbinas (en diámetros), pérdida por estela.', units: 'D (diámetros de rotor); %.', rel: 'A mayor separación en la dirección dominante, menor pérdida.', ex: 'Una turbina a 3 D detrás de otra recibe ~70 % de la velocidad libre (' + SIM_NOTE + ')', limits: 'Modelo de déficit lineal simple.', error: 'Ignorar estelas al distribuir turbinas.', src: 'Modelos de estela tipo Jensen (literatura eólica).', use: 'Misión "Turbinas en estela".' },
  { id: 'pronostico', sec: 'eolica', title: 'Pronóstico e incertidumbre', def: 'Un pronóstico es una estimación con banda de incertidumbre. Los eventos extremos son poco frecuentes pero reales; eliminarlos del entrenamiento sesga el modelo.', vars: 'Valor esperado, banda (p10–p90), error de pronóstico.', units: 'las de la variable.', rel: 'Decidir con la banda (no solo con el promedio) permite reservar ante escenarios desfavorables.', ex: 'Viento pronosticado 10 ± 4 m/s; una ráfaga real de 27 m/s estaba fuera del modelo porque se borró como "ruido".', limits: 'Bandas simuladas.', error: 'Tratar los extremos como ruido.', src: 'Práctica de pronóstico probabilístico.', use: 'Nivel 05: la etiqueta OUTLIER_CLEAN.' },
  { id: 'complementariedad', sec: 'eolica', title: 'Complementariedad solar–eólica', def: 'En muchas costas áridas el viento sopla más de noche o en otra estación que el pico solar. Combinar fuentes reduce la variabilidad, pero no la elimina.', vars: 'Perfiles horarios FV y eólico, correlación.', units: 'kW; adimensional.', rel: 'Menor correlación entre fuentes → menos horas de déficit para la misma capacidad.', ex: 'En Aridia el viento se intensifica al atardecer (' + SIM_NOTE + ')', limits: 'Perfiles sintéticos.', error: 'Asumir que toda energía renovable está disponible de forma constante.', src: SRC.upme, use: 'Microred de los niveles 04–06.' },
  /* ---------------- ALMACENAMIENTO ---------------- */
  { id: 'bess', sec: 'almac', title: 'Batería (BESS): capacidad, potencia y SOC', def: 'Sistema que almacena energía eléctrica para usarla después. Capacidad (kWh) es cuánta energía guarda; potencia (kW) es qué tan rápido puede cargarse o descargarse; SOC es la fracción de carga.', vars: 'E_cap, P_charge, P_discharge, SOC, SOC_min, SOC_max.', units: 'kWh; kW; %.', rel: 'SOC(t+1) = SOC(t) + η_c·P_c·Δt/E_cap − P_d·Δt/(η_d·E_cap), con SOC_min ≤ SOC ≤ SOC_max.', ex: '1 000 kWh, 250 kW: puede entregar 250 kW durante ~4 h (menos pérdidas).', limits: 'Degradación simplificada por ciclos equivalentes.', error: 'Tratar la batería como fuente primaria; asumir eficiencia del 100 %.', src: 'Modelo estándar de balance de energía en baterías.', use: 'Cambio de Reserva y BETA-9.' },
  { id: 'eficiencia_bess', sec: 'almac', title: 'Eficiencia y pérdidas', def: 'Cargar y descargar pierde energía como calor. La eficiencia de ida y vuelta de baterías de ion-litio suele estar en el rango 85–95 %.', vars: 'η_c, η_d, η_rt = η_c·η_d.', units: '%.', rel: 'Ciclar innecesariamente (cargar y descargar en el mismo periodo) desperdicia energía y desgasta la batería.', ex: 'η_c = η_d = 0,95 → η_rt ≈ 90 % (' + SIM_NOTE + ')', limits: 'Eficiencias constantes.', error: 'Ignorar pérdidas y degradación.', src: 'Rangos típicos de la literatura técnica sobre almacenamiento.', use: 'Detección de ciclos ineficientes en la Bóveda.' },
  { id: 'reserva', sec: 'almac', title: 'Reserva mínima y cargas críticas', def: 'Energía que se protege para servicios esenciales (agua potable, salud, comunicaciones, seguridad) ante eventos inciertos. Su valor depende de cuándo podrá usarse.', vars: 'SOC_reserva, carga crítica, duración del evento.', units: '%; kW; h.', rel: 'Energía de reserva ≥ carga crítica × duración / η_d.', ex: 'Carga crítica 120 kW durante 3 h → ≈ 380 kWh de reserva (' + SIM_NOTE + ')', limits: 'Prioridades definidas por el escenario.', error: 'Usar toda la reserva antes de un evento incierto para mejorar un indicador de corto plazo.', src: 'Práctica de operación de microredes.', use: 'El Devorador de Reserva.' },
  { id: 'blackstart', sec: 'almac', title: 'Arranque en negro (abstracto)', def: 'Recuperar una red tras un apagón energizando primero una fuente estable (p. ej., la batería) y reconectando cargas por etapas, de las críticas a las flexibles.', vars: 'Orden de reconexión, potencia disponible.', units: 'kW.', rel: 'Reconectar todo a la vez puede superar la potencia disponible y causar otra caída.', ex: 'Secuencia: BESS → servicios esenciales → bombeo de agua → RO → riego → electrolizador.', limits: 'Representación conceptual, no instrucciones de operación real.', error: 'Reconectar cargas grandes primero.', src: 'Conceptos de operación de microredes.', use: 'Nivel 06: minijuego de reconexión por etapas.' },
  /* ---------------- HIDRÓGENO ---------------- */
  { id: 'electrolisis', sec: 'h2', title: 'Electrólisis del agua', def: 'Uso de electricidad para separar agua purificada en hidrógeno (cátodo) y oxígeno (ánodo). Tecnologías: alcalina, PEM y óxido sólido.', vars: 'Energía al electrolizador, SEC_H2, masa de H2.', units: 'kWh; kWh/kg; kg.', rel: 'm_H2 ≈ E / SEC_H2. Los sistemas actuales suelen requerir del orden de 50–55 kWh por kg de H2 (sistema completo).', ex: '5 500 kWh / 55 kWh/kg ≈ 100 kg de H2 (' + SIM_NOTE + ')', limits: 'SEC constante; sin dinámica térmica ni degradación de stack.', error: 'Confundir energía almacenada con eficiencia; pensar que el H2 "produce" energía.', src: SRC.doeElec + ' ' + SRC.doeShot + ' ' + SRC.irenaStrat, use: 'Sincronizador H2 en la Ciudadela.' },
  { id: 'h2_vector', sec: 'h2', title: 'El hidrógeno es un vector, no una fuente', def: 'El hidrógeno no se extrae listo como energía primaria: se produce gastando energía y luego puede almacenarse o transportarse. Al usarlo se recupera solo parte de esa energía.', vars: 'Poder calorífico (LHV ≈ 33,3 kWh/kg), eficiencias de conversión.', units: 'kWh/kg; %.', rel: 'Electricidad → H2 → electricidad suele recuperar una fracción menor que una batería.', ex: '55 kWh por kg producido frente a 33,3 kWh/kg de contenido energético (LHV).', limits: 'No se modelan celdas de combustible.', error: 'Confundir hidrógeno con fuente primaria de energía.', src: 'LHV del H2 (propiedad física). ' + SRC.iea, use: 'Debate del contrato de excedente.' },
  { id: 'h2_agua', sec: 'h2', title: 'Agua para producir hidrógeno', def: 'La estequiometría exige unos 8,9 kg de agua por kg de H2. El retiro real es mayor por purificación (rechazo de OI), enfriamiento y pérdidas.', vars: 'Agua estequiométrica, agua total, rechazo de purificación.', units: 'kg/kg H2; L/kg H2.', rel: 'Agua_total = agua_estequiométrica + rechazo + enfriamiento + pérdidas.', ex: '100 kg H2 → ≥ 894 kg de agua ultrapura; con purificación y enfriamiento puede requerir varias veces más (' + SIM_NOTE + ')', limits: 'Factores de retiro configurables.', error: 'Ignorar el agua de proceso en una región árida.', src: SRC.stoich + ' ' + SRC.irenaWater, use: 'Misión "Agua ultrapura".' },
  { id: 'h2_verde', sec: 'h2', title: '¿Qué hace "verde" al hidrógeno?', def: 'El atributo depende del origen de la electricidad, la frontera de análisis (qué emisiones se cuentan) y la operación temporal (coincidencia horaria con generación renovable).', vars: 'Origen eléctrico, intensidad de emisiones, periodo de coincidencia.', units: 'kg CO2e/kg H2; h.', rel: 'Electrólisis con electricidad fósil no es verde aunque el proceso sea el mismo.', ex: 'Operar de noche con diésel convierte el lote en no verde (' + SIM_NOTE + ')', limits: 'Certificación simplificada.', error: 'Afirmar que todo H2 por electrólisis es automáticamente verde.', src: SRC.irenaStrat + ' ' + SRC.minenergia, use: 'Greenwash Phantom.' },
  { id: 'h2_seguridad', sec: 'h2', title: 'Seguridad: protocolo abstracto', def: 'El hidrógeno es inflamable en un rango amplio de concentraciones en aire, se dispersa rápido y su llama es poco visible. Ante una condición insegura se sigue un protocolo, nunca la improvisación.', vars: 'Detección, aislamiento, ventilación, verificación.', units: '—', rel: 'DETECTAR → AISLAR → DETENER → VENTILAR → VERIFICAR → AUTORIZAR REINICIO.', ex: 'La Llama que No se Ve: se resuelve con el protocolo, no con valentía.', limits: 'Representación conceptual; no son instrucciones operativas.', error: 'Puentear sensores o reiniciar sin verificar.', src: SRC.doeElec, use: 'Nivel 07 y Calima.' },
  { id: 'oxigeno', sec: 'h2', title: 'El oxígeno subproducto', def: 'La electrólisis libera ~8 kg de O2 por kg de H2. Venderlo requiere purificación, compresión, demanda cercana y logística.', vars: 'Masa de O2, demanda, costo de manejo.', units: 'kg.', rel: 'No es un ingreso garantizado.', ex: 'Sin comprador cercano, el O2 se ventea de forma segura (' + SIM_NOTE + ')', limits: '—', error: 'Considerar el oxígeno un ingreso garantizado.', src: SRC.stoich, use: 'Misión "El oxígeno prometido".' },
  /* ---------------- AGROECOLOGÍA ---------------- */
  { id: 'etc', sec: 'agro', title: 'Evapotranspiración del cultivo (ETc)', def: 'Agua que un cultivo pierde por evaporación del suelo y transpiración. Se estima a partir de la evapotranspiración de referencia (ET0) y un coeficiente de cultivo (Kc) que cambia con la etapa.', vars: 'ET0, Kc, ETc.', units: 'mm/día (1 mm sobre 1 m² = 1 L).', rel: 'ETc = Kc · ET0.', ex: 'ET0 = 6 mm/día, Kc (tomate, etapa media) ≈ 1,15 → ETc ≈ 6,9 mm/día.', limits: 'Kc de tablas generales; el juego no ajusta por clima local detallado.', error: 'Regar según calendario fijo sin considerar etapa ni clima.', src: SRC.fao56, use: 'Mapa de Raíces en el Oasis.' },
  { id: 'riego_bruto', sec: 'agro', title: 'Necesidad bruta y eficiencia de riego', def: 'La necesidad neta es el agua que debe llegar a la raíz; la bruta incluye pérdidas del sistema (evaporación, escorrentía, percolación).', vars: 'Necesidad neta, eficiencia de aplicación.', units: 'mm; fracción.', rel: 'Agua_bruta = Necesidad_neta / eficiencia. Goteo con cobertura suele ser más eficiente que inundación.', ex: '6,9 mm netos con goteo (0,9) → 7,7 mm brutos; con inundación (0,6) → 11,5 mm (' + SIM_NOTE + ')', limits: 'Eficiencias típicas, no medidas de campo.', error: 'Evaluar solo volumen y no calidad ni distribución.', src: SRC.fao56, use: 'Misión "Goteo al amanecer".' },
  { id: 'calidad_riego', sec: 'agro', title: 'Calidad de agua para riego: EC, SAR, boro', def: 'La salinidad (ECw) reduce la disponibilidad de agua para la planta; el SAR relaciona sodio con calcio y magnesio y afecta la infiltración del suelo; el boro es tóxico por encima de umbrales que dependen del cultivo.', vars: 'ECw, SAR, boro, pH, cloruros.', units: 'dS/m; adimensional; mg/L; pH.', rel: 'Según guías de FAO, ECw < 0,7 dS/m suele no restringir el uso; 0,7–3,0 restricción ligera a moderada; > 3,0 severa. Un agua muy pura (EC baja) con SAR alto puede dañar la infiltración. Umbrales dependen de especie, etapa, suelo, drenaje y clima.', ex: 'Permeado de OI: EC muy baja, puede conservar boro y requiere remineralización o mezcla.', limits: 'El juego usa umbrales orientativos, no reglas universales.', error: 'Asumir que el agua potable siempre es ideal para riego.', src: SRC.fao29 + ' ' + SRC.faoDesal, use: 'La Cosecha Transparente.' },
  { id: 'lavado', sec: 'agro', title: 'Sales en el suelo y fracción de lavado', def: 'Con riego en clima árido las sales se acumulan en la zona de raíces. Una fracción del agua aplicada debe drenar para "lavar" sales, si el drenaje lo permite.', vars: 'EC del suelo (ECe), fracción de lavado (LF), drenaje.', units: 'dS/m; fracción.', rel: 'Más volumen sin drenaje no corrige el problema y puede empeorarlo.', ex: 'Aumentar riego sin corregir calidad ni drenaje produce encharcamiento y estrés (' + SIM_NOTE + ')', limits: 'Balance de sales en un solo compartimento.', error: 'Responder al estrés salino solo con más agua.', src: SRC.fao29, use: 'Estado de error seguro del Nivel 08.' },
  { id: 'productividad', sec: 'agro', title: 'Productividad hídrica (WP)', def: 'Producción útil por unidad de agua utilizada.', vars: 'Producción, agua aplicada.', units: 'kg/m³.', rel: 'WP = producción útil / agua utilizada. Un rendimiento alto con mucha agua puede tener baja WP.', ex: '2 400 kg con 800 m³ → WP = 3 kg/m³ (' + SIM_NOTE + ')', limits: 'No captura nutrición, cultura alimentaria ni servicios ecosistémicos: por eso el juego usa varios criterios.', error: 'Premiar únicamente el mayor rendimiento.', src: SRC.fao56, use: 'Panel del Oasis.' },
  { id: 'agroeco10', sec: 'agro', title: 'Los 10 elementos de la agroecología', def: 'Diversidad, sinergias, eficiencia, reciclaje, resiliencia, co-creación e intercambio de conocimientos, valores humanos y sociales, cultura y tradiciones alimentarias, gobernanza responsable, y economía circular y solidaria.', vars: 'Diversidad de especies, salud del suelo, participación, aceptación comunitaria.', units: 'índices cualitativos y cuantitativos.', rel: 'La agroecología no es una lista fija de técnicas: integra dimensiones ecológicas, sociales y de gobernanza.', ex: 'Asociar maíz–frijol–ahuyama y sembrar corredores de flores atrae polinizadores y protege el suelo.', limits: 'El juego representa algunos elementos con indicadores simplificados.', error: 'Reducir la agroecología a eficiencia técnica o a decoración.', src: SRC.fao10, use: 'Naira y el banco de semillas.' },
  { id: 'cobertura', sec: 'agro', title: 'Cobertura (mulch) y biodiversidad', def: 'Cubrir el suelo con residuos vegetales reduce evaporación, temperatura del suelo y erosión; los corredores de biodiversidad sostienen polinizadores y controladores naturales.', vars: 'Fracción cubierta, temperatura de suelo, diversidad.', units: '%; °C; nº de especies.', rel: 'Menos evaporación del suelo → menor necesidad bruta de agua.', ex: 'Cobertura del 70 % reduce la evaporación del suelo en la simulación (' + SIM_NOTE + ')', limits: 'Efectos agregados.', error: 'Ver la cobertura como desorden en lugar de infraestructura viva.', src: SRC.fao56 + ' ' + SRC.fao10, use: 'Misión "Corredor polinizador".' },
  /* ---------------- STEAM ---------------- */
  { id: 'indagacion', sec: 'steam', title: 'Ciclo de indagación', def: 'Observar → preguntar → medir → proponer hipótesis → modelar → prototipar → ejecutar → observar consecuencias → depurar → explicar → transferir.', vars: '—', units: '—', rel: 'Cada nivel del juego sigue este ciclo.', ex: 'En la toma: observar el color del agua, medir turbidez, hipotetizar el pulso, ajustar el caudal.', limits: '—', error: 'Saltar de la observación a la conclusión sin medir.', src: SRC.unesco, use: 'Estructura de todos los capítulos.' },
  { id: 'gemelo', sec: 'steam', title: 'Gemelo digital', def: 'Modelo computacional conectado a datos de un sistema real para predecir y optimizar. Es útil si declara sus supuestos, su incertidumbre y lo que no modela.', vars: 'Variables modeladas, datos de entrenamiento, función objetivo, restricciones.', units: '—', rel: 'Un modelo responde con precisión la pregunta que se le formula; si la pregunta (objetivo) es incompleta, la respuesta también.', ex: 'MIRAGE maximizaba excedente exportable sujeto a mínimos modelados con datos incompletos.', limits: '—', error: 'Confundir el modelo con el territorio.', src: SRC.unesco, use: 'MIRAGE y MOSAICO.' },
  { id: 'causalidad', sec: 'steam', title: 'Correlación no es causalidad', def: 'Dos variables pueden moverse juntas sin que una cause a la otra (una tercera variable, coincidencia o causalidad inversa).', vars: '—', units: '—', rel: 'Para inferir causa: mecanismo plausible + secuencia temporal + control de otras variables + experimento cuando es posible.', ex: 'LIMEN aparece antes de cada fallo: ¿los causa o los anticipa?', limits: '—', error: 'Culpar a quien aparece cerca del problema.', src: SRC.unesco, use: 'El misterio de LIMEN.' },
  { id: 'incertidumbre', sec: 'steam', title: 'La incertidumbre no es ignorancia', def: 'Declarar rangos, supuestos y escenarios permite decisiones robustas y discutibles.', vars: 'Rango, probabilidad, escenario.', units: '—', rel: 'Una política robusta funciona aceptablemente en varios escenarios, no solo en el promedio.', ex: 'MOSAICO: "Tres escenarios son viables. Ninguno es óptimo para todos los criterios."', limits: '—', error: 'Presentar un único número como certeza.', src: SRC.unesco, use: 'Final de la historia.' },
  /* ---------------- ECONOMÍA ---------------- */
  { id: 'lcoe', sec: 'econ', title: 'Costos nivelados (LCOE, LCOH, LCOA)', def: 'Costo total del ciclo de vida (inversión + operación) dividido por la producción total a lo largo de la vida útil, descontada en el tiempo.', vars: 'Inversión, O&M, tasa de descuento, producción anual, vida útil.', units: 'USD/kWh (energía), USD/kg (H2), USD/m³ (agua).', rel: 'LCO ≈ Σ costos descontados / Σ producción descontada. Operar pocas horas eleva el costo nivelado.', ex: 'Un electrolizador con pocas horas de excedente tiene LCOH más alto (' + SIM_NOTE + ')', limits: 'Cálculo simplificado; no es asesoría financiera.', error: 'Creer que el menor costo es siempre la mejor decisión.', src: SRC.irenaStrat, use: 'Observatorio económico de la Mesa del Nexo.' },
  { id: 'multiobjetivo', sec: 'econ', title: 'Decisión multiobjetivo y frente de Pareto', def: 'Cuando hay varios criterios en conflicto, una alternativa es dominada si otra es igual o mejor en todos y estrictamente mejor en al menos uno. Las no dominadas forman el frente de Pareto.', vars: 'Criterios normalizados, pesos, alternativas.', units: 'adimensional tras normalizar.', rel: 'Los pesos expresan valores y prioridades: son decisiones discutibles, no hechos científicos. Sumar unidades distintas sin normalizar no tiene sentido.', ex: 'Tres escenarios viables; ninguno es óptimo para todos.', limits: 'Normalización min–max en el juego.', error: 'Ocultar ponderaciones dentro de una puntuación única.', src: 'Teoría de decisión multicriterio.', use: 'Tablero Mosaico y MonoScore.' },
  { id: 'gobernanza', sec: 'econ', title: 'Gobernanza y justicia distributiva', def: 'Quién decide, con qué información, quién asume los costos y quién recibe los beneficios. La participación de las comunidades mejora los objetivos y la legitimidad.', vars: 'Participación, transparencia, equidad de acceso.', units: 'cualitativas e índices.', rel: 'Una decisión transparente puede discutirse; una opaca solo puede obedecerse.', ex: 'El consejo incluye comunidades, operación, agricultura y ambiente.', limits: 'Representación narrativa y con índices simplificados.', error: 'Tratar a las comunidades como receptoras pasivas.', src: SRC.fao10, use: 'La Mesa del Nexo y el epílogo.' },
];
// Personajes
const CODEX_PEOPLE = [
  ['p_amaya', 'Amaya Serrano', 'Estudiante de sistemas energéticos y programación. Brillante, impaciente y competitiva consigo misma. Cuando se pone nerviosa, convierte problemas técnicos en analogías culinarias. Quiere demostrar que su controlador predictivo puede coordinar SYNARA.'],
  ['p_kiru', 'KIRU', 'Robot inspirado en un zorro del desierto y una lagartija: orejas solares, cola con microturbina, patas magnéticas y un compartimento de muestras. Hablador, teatral, valiente e incapaz de susurrar. Teme ser solo un dispositivo reemplazable.'],
  ['p_naira', 'Naira Valdés', 'Agroecóloga y guardiana del banco de semillas. Serena, irónica y poco impresionable ante interfaces brillantes. "Una gráfica puede estar muy limpia y seguir sin conocer una raíz."'],

/* ---------- Materiales de terreno ---------- */
const TERRAIN_MATS = {
  sand: { ramp: RAMP.sand, top: ['#fff6d8', '#fde8a8'], deco: 'shells', base: 5 },

  grassland: { ramp: RAMP.soil, top: ['#c2f58e', '#86e36f'], deco: 'roots', base: 4, grass: true },
};

class World {
  constructor(def, scene) {
    this.def = def; this.scene = scene;
    this.w = def.width; this.h = def.height || H;
    this.ground = new Float32Array(this.w + 1);
    const pts = def.ground;
    for (let x = 0; x <= this.w; x++) {
      let i = 0; while (i < pts.length - 2 && pts[i + 1][0] <= x) i++;
      const [x0, y0] = pts[i], [x1, y1] = pts[Math.min(i + 1, pts.length - 1)];
      const t = x1 === x0 ? 0 : clamp((x - x0) / (x1 - x0), 0, 1);
      const st = pts[i][2] === 'step' ? (t < 1 ? 0 : 1) : smooth(t);
      this.ground[x] = Math.round(lerp(y0, y1, pts[i][2] === 'lin' ? t : st));
    }
    this.platforms = (def.platforms || []).map(p => Object.assign({ oneWay: true, type: 'wood' }, p));
    this.solids = (def.solids || []).slice();
    this.ladders = def.ladders || [];
    this.water = def.water || [];
    this.wind = def.wind || [];
    this.hazards = def.hazards || [];
    this.entities = [];
    this.ps = new Particles(1600);
    this.time = 0;
    this.lensData = [];
  }
  groundAt(x) { x = Math.round(clamp(x, 0, this.w)); return this.ground[x]; }
  /** Superficie de apoyo bajo (x, yFeet) considerando plataformas */
  supportAt(x, yPrev, yNow, dropping) {
    let best = this.groundAt(x);
    for (const p of this.platforms) {
      if (x < p.x || x > p.x + p.w) continue;
      const py = p.y + (p.dy || 0);
      if (p.oneWay) { if (!dropping && yPrev <= py + 1 && yNow >= py - 0.01 && py < best) best = py; }
      else if (yPrev <= py + 1 && py < best) best = py;
    }
    return best;
  }
  solidHit(x, y0, y1) {
    for (const s of this.solids) if (x >= s.x && x <= s.x + s.w && y1 > s.y && y0 < s.y + s.h) return s;
    for (const p of this.platforms) if (!p.oneWay && x >= p.x && x <= p.x + p.w && y1 > p.y + 2 && y0 < p.y + (p.h || 8)) return p;
    return null;
  }
  ladderAt(x, y) { return this.ladders.find(l => Math.abs(x - l.x) < 9 && y >= l.y0 - 2 && y <= l.y1 + 4); }
  waterAt(x, y) { return this.water.find(w => x >= w.x0 && x <= w.x1 && y > w.y); }
  windAt(x, y) { let fx = 0, fy = 0; for (const z of this.wind) if (x >= z.x && x <= z.x + z.w && y >= z.y && y <= z.y + z.h) { fx += z.fx * (z.on === false ? 0 : 1); fy += z.fy * (z.on === false ? 0 : 1); } return [fx, fy]; }
  add(e) { e.world = this; this.entities.push(e); return e; }
  remove(e) { e.dead = true; }
  find(id) { return this.entities.find(e => e.id === id); }
}

/* ---------- Render del terreno a lienzo ---------- */
function renderTerrain(world) {
  const def = world.def, wd = world.w, hd = world.h;
  const pb = new PixelBuffer(wd, hd);
  const segs = def.terrain || [{ x0: 0, x1: wd, mat: 'sand' }];
  const matAt = (x) => { for (const s of segs) if (x >= s.x0 && x < s.x1) return TERRAIN_MATS[s.mat] || TERRAIN_MATS.sand; return TERRAIN_MATS[segs[segs.length - 1].mat]; };
  for (let x = 0; x < wd; x++) {
    const M = matAt(x);
    const top = world.ground[x];
    const slopeL = world.ground[Math.max(0, x - 1)] - top, slopeR = world.ground[Math.min(wd, x + 1)] - top;
    for (let y = Math.max(0, top); y < hd; y++) {
      const d = y - top;
      let c;
      if (d === 0) c = M.top[0];
      else if (d === 1) c = M.top[1];
      else {
        // profundidad → rampa más oscura; textura sutil (tramado suave entre tonos vecinos)
        const n = fbm(x * 0.035, y * 0.06, 3, 5);
        let k = M.base - Math.floor(d / 26);
        const band = (d % 26) / 26;
        if (band > 0.82 && bayer4(x, y) < (band - 0.82) * 5) k -= 1;
        if (n > 0.72 && bayer4(x, y) < 0.25) k -= 1;
        if (n < 0.26 && bayer4(x, y) < 0.2) k += 1;
        if (slopeL > 1.5 && d < 6) k += 1; // borde iluminado
        if (slopeR > 1.5 && d < 6) k -= 1;
        if (M.deco === 'strata' && ((y + Math.floor(fbm1(x * 0.015, 2, 3) * 8)) % 9 === 0)) k -= 1;
        if (M.deco === 'strata' && ((y + Math.floor(fbm1(x * 0.015, 2, 3) * 8)) % 9 === 1)) k += 1;
        if (M.deco === 'plates') { if (y % 16 === 0 || x % 32 === 0) k = 1; else if ((x % 32 === 3 || x % 32 === 28) && (y % 16 === 3 || y % 16 === 12)) k = 6; else k = 3 + ((y % 16) < 3 ? 1 : 0); }
        if (M.deco === 'tiles') { if (y % 8 === 0 || (x + (Math.floor(y / 8) % 2) * 8) % 16 === 0) k = 2; else k = 4; }
        if (M.deco === 'plaza') {
          const FR = ['#20d6c7', '#ff6b6b', '#ffe14d', '#8d6bff'];
          if (d < 6) { c = (x % 14 === 0) ? '#e8c8a0' : (d < 3 ? '#f6dcb8' : '#eccaa0'); pb.data[y * wd + x] = U(c); continue; }
          if (d < 8) { pb.data[y * wd + x] = U(d === 6 ? '#7a4038' : '#a05a42'); continue; }
          if (d < 18) {
            const cx = Math.floor(x / 12), lx = x % 12 - 5.5, ly = d - 12.5;
            const dm = Math.abs(lx) + Math.abs(ly);
            c = dm < 3 ? FR[(cx + 1) % 4] : dm < 5 ? FR[cx % 4] : dm < 5.6 ? '#fff4e0' : '#f2e2c4';
            if (x % 12 === 0) c = '#d8bc96';
            pb.data[y * wd + x] = U(c); continue;
          }
          if (d < 20) { pb.data[y * wd + x] = U(d === 18 ? '#7a4038' : '#9a5640'); continue; }
          const row = Math.floor((d - 20) / 12), jx = (x + (row % 2) * 12) % 24, jy = (d - 20) % 12;
          k = (jx === 0 || jy === 0) ? 2 : (jy === 1 || jx === 1) ? 5 : 4 - Math.floor((d - 20) / 30) + (hash2(Math.floor((x + (row % 2) * 12) / 24), row, 7) > 0.7 ? -1 : 0);
          if (jx > 2 && jy > 2 && hash2(x, y, 8) < 0.03) k -= 1;
        }

        if (M.deco === 'crystals' && hash2(x, y, 5) < 0.01) c = '#ffffff';
        if (M.deco === 'roots' && d > 3 && d < 30 && hash2(x >> 1, y, 6) < 0.02) c = '#c9a46a';
        if (M.wet && d < 4 && world.waterAt && world.water.some(w => x >= w.x0 && x <= w.x1)) c = M.ramp[Math.max(0, k - 1)];

      pb.data[y * wd + x] = U(c);

  }
  // decoraciones definidas por el nivel sobre el terreno (rocas, conchas, etc.)
  if (def.decorate) def.decorate(pb, world);
  return pb.toCanvas();
}

      for (let k = 6; k < w; k += 8) frect(g, x + k, y + 1, 1, 3, '#5a3826');
      for (let k = 8; k < w - 4; k += 34) { frect(g, x + k, y + 5, 3, p.post || 40, '#5a3826'); frect(g, x + k, y + 5, 1, p.post || 40, '#8a5a3c'); }

      for (let k = 0; k < w; k += 5) frect(g, x + k, y + 6, 4, 2 + (k * 7 % 3), '#933f47');

    }
    case 'pipe': {

  }
  setAnim(a) { if (this.anim !== a) { this.anim = a; this.animT = 0; } }

    if (this.inv > 0) return;

    this.setAnim('hit'); Audio2.sfx('hit'); this.world.scene.cam.shake(3, 0.25);

    const left = inp && this.lock <= 0 && inp.down('left'), right = inp && this.lock <= 0 && inp.down('right');
    const up = inp && inp.down('up'), down = inp && inp.down('down');

    if (this.wading) maxV *= PHYS.wadeMul;

    this.vx = approach(this.vx, dir * maxV, acc * dt);

    // ---- vertical

    const grav = this.gliding ? PHYS.g * 0.22 : (jumpD && this.vy < 0 ? PHYS.g * 0.82 : PHYS.g * 1.08);

    else if (!this.onGround) this.setAnim(this.vy < 0 ? 'jump' : 'fall');

  render(g, cam) {

/** KIRU: compañero que sigue, comenta y reacciona */

      const d = tx - this.x;
      if (Math.abs(P.x - this.x) > 340 || Math.abs(P.y - this.y) > 220) { this.x = P.x - P.facing * 24; this.y = P.y - 10; W_.ps.emit('energy', this.x, this.y - 10, 0, 0, 10, 8); }

  constructor(o) { super(Object.assign({ type: 'fouler', range: 60, speed: 30, hp: 1, quizId: null }, o)); this.bx = this.x; this.by = this.y; this.phase = Math.random() * 6; }
  update(dt) {
    this.t += dt;
    if (this.calm) { this.calmT = (this.calmT || 0) + dt; if (this.calmT > 1.2) this.dead = true; return; }
    this.x = this.bx + Math.sin(this.t * this.speed / this.range + this.phase) * this.range;
    this.y = this.by + Math.sin(this.t * 2.3) * 6;
    const P = this.world.scene.player;

  }

  }
