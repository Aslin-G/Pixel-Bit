  const night = !!opts.night;
  // muro con luz desde la izquierda
  pb.rect(x, y - h, w, h, pal[2]);
  pb.rect(x + w - Math.max(3, w * 0.18 | 0), y - h, Math.max(3, w * 0.18 | 0), h, pal[1]);
  pb.rect(x, y - h, 2, h, pal[3]);
  for (let yy = y - h; yy < y; yy++) for (let xx = x; xx < x + w; xx++) if (hash2(xx, yy, seed) < 0.06) pb.set(xx, yy, pal[1]);
  // zócalo
  pb.rect(x, y - 3, w, 3, pal[0]);
  // techo: cúpula, terraza o torre de viento
  const roof = opts.roof || r.pick(['dome', 'flat', 'tower', 'flat', 'arch']);
  if (roof === 'dome') {
    const rx = w * 0.3, ry = rx * 0.8, cx = x + w * 0.5;
    for (let yy = -ry; yy <= 0; yy++) for (let xx = -rx; xx <= rx; xx++) if ((xx * xx) / (rx * rx) + (yy * yy) / (ry * ry) <= 1) pb.set(Math.round(cx + xx), Math.round(y - h + yy), xx < -rx * 0.2 ? '#fffaf0' : xx < rx * 0.4 ? '#e6e0f4' : '#b8b0d8');
    pb.set(Math.round(cx), Math.round(y - h - ry - 1), '#ffe14d');
  } else if (roof === 'tower') {
    const tw = Math.max(6, w * 0.22 | 0), tx = x + (r.chance(0.5) ? 2 : w - tw - 2), th = h * 0.55;
    pb.rect(tx, y - h - th, tw, th, pal[2]); pb.rect(tx + tw - 2, y - h - th, 2, th, pal[1]);
    for (let k = 0; k < 2; k++) pb.rect(tx + 2, y - h - th + 3 + k * 5, tw - 4, 3, '#2a1a2a');
    pb.rect(tx - 1, y - h - th - 2, tw + 2, 2, pal[3]);
  } else if (roof === 'arch') {
    pb.rect(x - 1, y - h - 2, w + 2, 2, pal[3]);
    for (let k = 0; k < 3; k++) pb.set(x + 3 + k * Math.floor(w / 3), y - h - 3, '#86e36f');
  } else {
    pb.rect(x - 1, y - h - 2, w + 2, 2, pal[3]); pb.hline(x - 1, x + w, y - h, pal[0]);
    if (opts.solarRoof || r.chance(0.5)) { for (let k = 2; k < w - 4; k += 6) { pb.rect(x + k, y - h - 6, 5, 3, '#1f469e'); pb.set(x + k + 1, y - h - 6, '#8cc4ff'); pb.vline(x + k + 2, y - h - 3, y - h - 2, '#98c6d2'); } }
    if (r.chance(0.5)) { pb.rect(x + w - 8, y - h - 5, 3, 3, '#c9622e'); pb.set(x + w - 7, y - h - 7, '#4ccb70'); pb.set(x + w - 8, y - h - 6, '#86e36f'); }
  }
  // ventanas con celosía y puerta en arco
  const winCol = night ? '#ffd86a' : '#1a2a4a', winHi = night ? '#fff6c0' : '#4a7aa8';
  const nw = Math.max(1, Math.floor((w - 8) / 12));
  for (let i = 0; i < nw; i++) {
    const wx = x + 5 + i * 12, wy = y - h + 6;
    if (wy + 10 > y - 12) break;
    pb.rect(wx, wy, 6, 8, winCol); pb.rect(wx, wy, 6, 2, winHi);
    pb.vline(wx + 3, wy, wy + 7, pal[0]); pb.hline(wx, wx + 5, wy + 4, pal[0]);
    pb.rect(wx - 1, wy + 8, 8, 1, pal[3]);
    if (r.chance(0.4)) { pb.rect(wx - 1, wy + 9, 8, 2, '#c9622e'); pb.set(wx, wy + 8, '#4ccb70'); pb.set(wx + 3, wy + 7, '#f78acb'); pb.set(wx + 5, wy + 8, '#86e36f'); }
  }
  const dx = x + Math.floor(w * 0.35), dw = 8;
  pb.rect(dx, y - 13, dw, 13, night ? '#5a3a1a' : '#3a2018'); pb.rect(dx + 1, y - 15, dw - 2, 2, night ? '#5a3a1a' : '#3a2018');
  pb.rect(dx + 1, y - 12, 2, 11, night ? '#7a5228' : '#5a3424'); pb.set(dx + dw - 2, y - 7, '#ffe14d');
  if (opts.awning || r.chance(0.35)) {
    const ac = r.pick(['#ff6b6b', '#20d6c7', '#ffe14d', '#8d6bff']);
    for (let k = 0; k < w; k++) { pb.set(x + k, y - 17, k % 4 < 2 ? ac : '#fffaf0'); pb.set(x + k, y - 16, k % 4 < 2 ? shade(ac, -0.2) : '#e8e0d0'); }
  }
};

/* ---------- Infraestructura ---------- */
/** Fila de paneles fotovoltaicos en perspectiva */
ART.pvRow = function (pb, x, y, w, seed, opts = {}) {
  const tilt = opts.tilt ?? 8, depth = opts.depth ?? 10;
  const pal = RAMP.pv;
  const soil = opts.soil || 0;
  // estructura
  for (let k = 4; k < w; k += 18) { pb.vline(x + k, y - 2, y + 6, '#6aa0b4'); pb.vline(x + k + 1, y, y + 6, '#345a78'); }
  // superficie inclinada (paralelogramo)
  for (let j = 0; j < depth; j++) {
    const yy = y - j;
    const off = Math.round(j * tilt / depth);
    for (let i = 0; i < w; i++) {
      const xx = x + i + off;
      const cell = (i % 6 === 0) || (j % 4 === 0);
      let c = cell ? pal[1] : pal[3 + ((j > depth * 0.55) ? 1 : 0)];
      // reflejo diagonal del cielo
      if (!cell && ((i + j * 2 + (seed % 7)) % 23) < 3) c = pal[6];
      if (!cell && soil > 0 && hash2(xx, yy, seed) < soil * 0.6) c = '#c9a46a';
      pb.set(xx, yy, c);
    }
  }
  pb.hline(x + tilt, x + w + tilt - 1, y - depth, '#d6efff');
  pb.hline(x, x + w - 1, y + 1, '#0a1440');
};
/** Tanque cilíndrico con bandas y escalerilla */
ART.tank = function (pb, x, y, w, h, pal = RAMP.steelW, opts = {}) {
  for (let i = 0; i < w; i++) {
    const t = i / (w - 1);
    const idx = t < 0.15 ? 4 : t < 0.45 ? 5 : t < 0.75 ? 3 : t < 0.92 ? 2 : 1;
    pb.vline(x + i, y - h, y - 1, pal[idx]);
  }
  // tapa elíptica
  for (let i = 0; i < w; i++) { const t = (i - w / 2) / (w / 2); const dy = Math.round(Math.sqrt(Math.max(0, 1 - t * t)) * Math.max(2, w * 0.12)); pb.vline(x + i, y - h - dy, y - h, i < w * 0.4 ? pal[6] : pal[4]); }
  for (let k = 1; k < 4; k++) pb.hline(x, x + w - 1, y - Math.round(h * k / 4), pal[1]);
  if (opts.band) { pb.rect(x, y - Math.round(h * 0.55), w, 4, opts.band); pb.hline(x, x + w - 1, y - Math.round(h * 0.55), shade(opts.band, 0.3)); }
  if (opts.ladder) for (let yy = y - h; yy < y; yy += 3) { pb.hline(x + w - 5, x + w - 2, yy, '#263442'); pb.vline(x + w - 5, y - h, y, '#263442'); pb.vline(x + w - 2, y - h, y, '#263442'); }
  if (opts.label) { pb.rect(x + 3, y - h + 6, Math.min(w - 6, 14), 5, '#102a43'); pb.hline(x + 4, x + 4 + Math.min(w - 8, 10), y - h + 8, opts.labelCol || '#56e5ff'); }
};
/** Tubería horizontal/vertical con brillo y bridas */
ART.pipe = function (pb, x0, y0, x1, y1, r, kind = 'water') {
  const K = PIPE_PAL[kind] || PIPE_PAL.water;
  const horiz = Math.abs(x1 - x0) >= Math.abs(y1 - y0);
  if (horiz) {
    const xa = Math.min(x0, x1), xb = Math.max(x0, x1);
    for (let k = -r; k <= r; k++) { const t = (k + r) / (2 * r); pb.hline(xa, xb, y0 + k, K[t < 0.25 ? 4 : t < 0.5 ? 3 : t < 0.8 ? 2 : 1]); }
    for (let xx = xa + 8; xx < xb; xx += 22) { pb.rect(xx, y0 - r - 1, 2, 2 * r + 3, K[1]); pb.vline(xx, y0 - r - 1, y0 + r + 1, K[4]); }
  } else {
    const ya = Math.min(y0, y1), yb = Math.max(y0, y1);
    for (let k = -r; k <= r; k++) { const t = (k + r) / (2 * r); pb.vline(x0 + k, ya, yb, K[t < 0.25 ? 4 : t < 0.5 ? 3 : t < 0.8 ? 2 : 1]); }
    for (let yy = ya + 8; yy < yb; yy += 22) { pb.rect(x0 - r - 1, yy, 2 * r + 3, 2, K[1]); pb.hline(x0 - r - 1, x0 + r + 1, yy, K[4]); }
  }
};
const PIPE_PAL = {
  water: ['#0a2a40', '#106884', '#1491aa', '#22bdd0', '#a6f4ff'],
  seawater: ['#0a1f4a', '#0f3a74', '#1063a6', '#1283bf', '#6cf0db'],
  brine: ['#3c1046', '#621a66', '#8e2a80', '#bc3e92', '#f888b8'],
  power: ['#3a2208', '#6a3e0e', '#c8861a', '#eab02a', '#fff09a'],
  h2: ['#0b2b40', '#16768c', '#22a2b2', '#40d0d4', '#d8fff8'],
  steel: ['#1d2a48', '#345a78', '#477a94', '#6aa0b4', '#cfe8ee'],
  irrigation: ['#0f3b20', '#1f6a3a', '#33a552', '#4ccb70', '#c2f58e'],
};

/* ---------- Elementos dinámicos (ctx) ---------- */
/** Aerogenerador: torre + góndola + 3 aspas rotando. size≈altura de torre */
ART.turbine = function (g, x, y, size, angle, opts = {}) {
  const s = size;
  const col = opts.col || '#f4fdff', sh = opts.shade || '#98c6d2', dark = opts.dark || '#477a94';
  const tw = Math.max(1, Math.round(s / 30));
  // torre cónica
  for (let i = 0; i < s; i++) {
    const t = i / s;
    const hw = Math.max(0.5, tw * (1.4 - t * 0.6));
    const yy = Math.round(y - i);
    frect(g, Math.round(x - hw), yy, Math.max(1, Math.round(hw)), 1, col);
    frect(g, Math.round(x), yy, Math.max(1, Math.round(hw)), 1, sh);
  }
  const hx = Math.round(x), hy = Math.round(y - s);
  // góndola
  const nw = Math.max(2, Math.round(s / 12)), nh = Math.max(1, Math.round(s / 28));
  frect(g, hx - nw * 0.3, hy - nh, nw, nh * 2, col); frect(g, hx - nw * 0.3, hy, nw, nh, sh);
  // aspas
  const L = s * 0.48;
  for (let k = 0; k < 3; k++) {
    const a = angle + k * TAU / 3;
    const ex = hx + Math.cos(a) * L, ey = hy + Math.sin(a) * L;
    fline(g, hx, hy, ex, ey, col);
    if (s > 50) { fline(g, hx + Math.cos(a + 0.06) * 3, hy + Math.sin(a + 0.06) * 3, hx + Math.cos(a + 0.03) * L * 0.6, hy + Math.sin(a + 0.03) * L * 0.6, sh); }
    if (opts.tips) fpx(g, ex, ey, '#ff4e5d');
  }
  frect(g, hx - 1, hy - 1, 2, 2, dark);
  if (opts.stopped) { frect(g, hx - 1, hy - 5, 2, 2, (Game.frame >> 4) & 1 ? '#ff4e5d' : '#6a1414'); }
};
/** Gaviota / ave pequeña animada */
ART.bird = function (g, x, y, t, col = '#fffaf0', dark = '#3a4a6e') {
  const f = Math.floor(t * 8) % 4;
  const wing = [-2, -1, 0, -1][f];
  fpx(g, x, y, col); fpx(g, x + 1, y, col);
  fpx(g, x - 1, y + wing, dark); fpx(g, x - 2, y + wing * 2 + (wing ? 1 : 0), dark);
  fpx(g, x + 2, y + wing, dark); fpx(g, x + 3, y + wing * 2 + (wing ? 1 : 0), dark);
};
/** Flamenco (sprite procedural, animación de cuello) */
ART.flamingo = function (g, x, y, t, flip = 1) {
  const c1 = '#ff8ab8', c2 = '#f05a9a', c3 = '#ffc4dc', leg = '#e0607e';
  const bob = Math.round(Math.sin(t * 2) * 1);
  g.save(); g.translate(Math.round(x), Math.round(y)); g.scale(flip, 1);
  frect(g, 0, -12, 1, 12, leg); frect(g, 2, -12, 1, 7, leg); frect(g, 3, -6, 1, 1, leg); frect(g, 2, -5, 1, 1, leg);
  frect(g, -3, -17, 8, 5, c1); frect(g, -2, -18, 6, 1, c3); frect(g, -3, -13, 8, 1, c2); frect(g, -5, -16, 2, 2, c2);
  const nx = 4, ny = -18 + bob;
  frect(g, nx, ny - 8, 1, 9, c1); frect(g, nx + 1, ny - 9, 2, 2, c1); frect(g, nx + 3, ny - 8, 2, 1, '#fffaf0'); frect(g, nx + 4, ny - 7, 1, 2, '#140d26');
  g.restore();
};

/* ===== 13_bg.js ===== */
/* =====================================================================
   13_bg.js — Fondos parallax (5–8 capas) por bioma.
   Cada bioma devuelve: { layers:[{c, f, fy, y, dyn?}], sky, clouds,
   front:[…], tint } — capas prerenderizadas + dibujo dinámico.
   ===================================================================== */

const BG_CACHE = new Map();

class Backdrop {
  constructor(levelW, levelH) {
    this.levelW = levelW; this.levelH = levelH;
    this.layers = []; // detrás del juego
    this.front = [];  // delante del juego
    this.skyC = null; this.skyKey = '';
    this.clouds = [];
    this.weather = { wind: 0.3, dust: 0, clouds: 0.5, rain: 0 };
    this.time = 0;
  }
  /** Crea capa con ancho suficiente para su factor de parallax */
  layer(f, h, y, drawFn, opts = {}) {
    const w = Math.ceil(W + Math.max(0, this.levelW - W) * f) + 2;
    const pb = new PixelBuffer(w, h);
    drawFn(pb, w, h);
    const L = { c: pb.toCanvas(), f, fy: opts.fy ?? f * 0.3, y, dyn: opts.dyn || null, pre: opts.pre || null, w, h };
    (opts.front ? this.front : this.layers).push(L);
    return L;
  }
  dynLayer(f, dyn, opts = {}) { const L = { c: null, f, fy: opts.fy ?? f * 0.3, y: 0, dyn }; (opts.front ? this.front : this.layers).push(L); return L; }
  addClouds(n, pals, seed, yMin, yMax, f0 = 0.04, f1 = 0.18) {
    const r = RNG(seed);
    for (let i = 0; i < n; i++) {
      const w = r.int(40, 120), h = Math.round(w * r.range(0.32, 0.45));
      const f = lerp(f0, f1, r());
      const spr = ART.cloudSprite(w, h, seed * 13 + i, pals).toCanvas();
      this.clouds.push({ spr, x: r.range(0, W + (this.levelW - W) * f + 200), y: r.range(yMin, yMax), f, speed: r.range(3, 9) * (0.5 + f * 4), w, h, shadow: true });
    }
    this.clouds.sort((a, b) => a.f - b.f);
  }
  drawClouds(g, cam, wind = 1) {
    for (const c of this.clouds) {
      const span = W + (this.levelW - W) * c.f + c.w + 200;
      c.x += c.speed * Game.dt * wind;
      if (c.x > span) c.x -= span + c.w;
      const sx = Math.round(c.x - cam.x * c.f - c.w), sy = Math.round(c.y - cam.y * c.f * 0.3);
      if (sx > W || sx + c.w < 0) continue;
      g.drawImage(c.spr, sx, sy);
    }
  }
  /** Proyección de sombras de nubes sobre el suelo del juego (coordenadas de mundo) */
  cloudShadowAt(worldX) {
    let s = 0;
    for (const c of this.clouds) {
      if (c.f < 0.12) continue;
      // proyección aproximada: la nube a factor f proyecta sombra desplazada
      const cx = c.x - c.w * 0.5 + (Game.cam ? Game.cam.x : 0) * (1 - c.f);
      const d = Math.abs(worldX - cx);
      if (d < c.w * 0.45) s = Math.max(s, 1 - d / (c.w * 0.45));
    }
    return clamp(s, 0, 1);
  }
  render(g, cam, which = 'back') {
    const list = which === 'back' ? this.layers : this.front;
    for (const L of list) {
      if (L.pre) L.pre(g, cam, L);
      if (L.c) {
        const ox = Math.round(cam.x * L.f), oy = Math.round(cam.y * L.fy);
        g.drawImage(L.c, -ox, L.y - oy);
      }
      if (L.dyn) L.dyn(g, cam, L);
    }
  }
}

const CLOUD_PALS = {
  day: ['#9ab8e0', '#c8dcf2', '#eef6fc', '#ffffff'],
  dusk: ['#8a4a8a', '#d06a8a', '#ffa88a', '#ffe0b0'],
  dawn: ['#7a5aa0', '#c07aa8', '#ffb8a8', '#fff0d0'],
  night: ['#141c44', '#22305e', '#34467a', '#4a5e98'],

/** Cielo en lienzo de pantalla (factor 0) */
function makeSkyCanvas(ramp, horizon, opts = {}) {
  const k = ramp.join() + horizon + JSON.stringify(opts);
  if (BG_CACHE.has(k)) return BG_CACHE.get(k);
  const pb = new PixelBuffer(W, Math.max(horizon + 40, opts.h || H));
  ART.sky(pb, ramp, horizon, opts);
  const c = pb.toCanvas();
  BG_CACHE.set(k, c);
  return c;
}

/* ---------- Agua animada (superficie de mar en capa) ---------- */
function drawSeaSparkles(g, x0, y0, w, h, t, density = 1, cols = ['#ffffff', '#c6fff2', '#6cf0db']) {
  const n = Math.floor(w * h / 900 * density);
  for (let i = 0; i < n; i++) {
    const hx = hash1(i, 3), hy = hash1(i, 7);
    const ph = hash1(i, 11) * TAU;
    const life = (Math.sin(t * (1.5 + hash1(i, 13) * 2) + ph) + 1) / 2;
    if (life < 0.55) continue;
    const yy = Math.round(y0 + Math.pow(hy, 1.4) * h);
    const len = Math.max(1, Math.round((1 + (yy - y0) / h * 4) * (life - 0.5) * 2));
    const xx = Math.round(x0 + ((hx * w + t * 4 * (0.3 + hy)) % w));
    g.fillStyle = cols[i % cols.length];
    g.fillRect(xx, yy, len, 1);
  }
}
/** Columna de destellos del sol sobre el agua */
function drawSunGlitter(g, cx, y0, y1, t, col = '#fff6d8') {
  for (let y = y0; y < y1; y += 1) {
    const spread = 2 + (y - y0) * 0.35;
    const n = 1 + Math.floor((y - y0) / 12);
    for (let k = 0; k < n; k++) {
      const v = Math.sin(t * 3 + y * 1.7 + k * 2.3);
      if (v < 0.4) continue;
      const xx = Math.round(cx + Math.sin(y * 3.1 + k * 7.7 + t) * spread);
      g.fillStyle = v > 0.85 ? '#ffffff' : col;
      g.fillRect(xx, y, Math.round(1 + v * 2), 1);
    }
  }
}
/** Líneas de oleaje desplazándose */
function drawWaveBands(g, x0, y0, w, h, t, col, spacing = 7) {
  g.fillStyle = col;
  for (let y = y0; y < y0 + h; y += spacing) {
    const k = (y - y0) / h;
    const seg = 6 + k * 18;
    for (let x = x0 - ((t * (6 + k * 14) + y * 13) % (seg * 3)); x < x0 + w; x += seg * 3) {
      g.fillRect(Math.round(x), y + Math.round(Math.sin(x * 0.05 + t) * 0.6), Math.round(seg), 1);
    }
  }
}

    const sand = ART.hazeRamp(RAMP.dune, '#c8eef4', 0.22);
    ART.dunes(pb, 70, 26, sand, 7, { minW: 90, maxW: 220, lit: 5, shadow: 2, ripples: true });
    const r = RNG(9);
    for (let x = 30; x < w - 40; x += r.int(50, 120)) {
      if (r.chance(0.55)) { const hw = r.int(18, 34), hh = r.int(14, 26); ART.house(pb, x, 68, hw, hh, x, { pal: HOUSE_COLS[r.int(0, 6)].map(c => mixHex(c, '#c8eef4', 0.3)) }); }
      else ART.palm(pb, x, 70, r.int(22, 34), r.range(-6, 6), x, ART.hazeRamp(RAMP.leaf, '#c8eef4', 0.3));
    }
    // segunda hilera de dunas más cercana: rompe la llanura y da profundidad
    const top2 = ART.dunes(pb, 106, 20, ART.hazeRamp(RAMP.dune, '#c8eef4', 0.12), 13, { minW: 70, maxW: 170, lit: 5, shadow: 2, ripples: true });
    for (let x = 14; x < w; x += r.int(26, 70)) { const k = r(); const y = Math.round(top2[Math.min(w - 1, x)]) + 1; if (k < 0.4) ART.shrub(pb, x, y, r.int(3, 5), x, ART.hazeRamp(RAMP.leaf, '#c8eef4', 0.2)); else if (k < 0.55) ART.grass(pb, x, y, 3, x); }
    // franja de playa húmeda
    for (let x = 0; x < w; x++) { pb.set(x, 118, '#fde8a8'); pb.set(x, 119, '#c6fff2'); }
  }, { dyn: (g, cam, Ly) => {
    const ox = cam.x * 0.25;
    for (let i = 0; i < 5; i++) {
      const tx = 180 + i * 260 - ox;
      if (tx < -40 || tx > W + 40) continue;
      ART.turbine(g, tx, Ly.y - cam.y * Ly.fy + 64 - (i % 2) * 6, 34, Game.time * 1.6 + i, { col: '#e6f4fa', shade: '#a8c8d8' });
    }
  } });
  // 4. dunas cercanas con vegetación xerófita y rocas dispersas (deja ver el mar)
  B.layer(0.55, 120, H - 120 - 52, (pb, w) => {
    const r = RNG(21);
    const top = ART.dunes(pb, 96, 30, RAMP.dune, 23, { minW: 120, maxW: 260, lit: 5, shadow: 3, ripples: true });
    // rocas ocasionales
    for (let x = 60; x < w; x += r.int(160, 320)) { const y = Math.round(top[Math.min(w - 1, x)]) + 4; pb.ellipse(x, y, r.int(10, 18), r.int(6, 9), '#b8564b'); pb.ellipse(x - 3, y - 3, r.int(6, 10), 4, '#d77558'); pb.hline(x - 6, x + 2, y - 6, '#f7c08e'); }
    for (let x = 20; x < w; x += r.int(22, 60)) {
      const y = Math.round(top[Math.min(w - 1, x)]) + 2;
      const k = r();
      if (k < 0.22) ART.cactus(pb, x, y, r.int(14, 24), x);
      else if (k < 0.55) ART.shrub(pb, x, y, r.int(4, 7), x);
      else if (k < 0.7) ART.agave(pb, x, y, r.int(6, 9));
      else if (k < 0.82) ART.nopal(pb, x, y, r.int(3, 4), x);
      else ART.grass(pb, x, y, 4, x);
    }
  }, { fy: 0.3 });
  return B;
};

/** Utilidad: lluvia de partículas ambientales por bioma */
function ambientParticles(ps, kind, cam, rate, wind) {
  const n = Math.floor(rate * Game.dt * 60 + Math.random());
  for (let i = 0; i < n; i++) {
    const x = cam.x + Math.random() * (W + 80) - 40, y = cam.y + Math.random() * H;
    if (kind === 'dust') ps.emit('dust', x, y, wind * 40, Math.random() * 6 - 3);
    if (kind === 'sand') ps.emit('sand', cam.x - 10, cam.y + H * 0.4 + Math.random() * H * 0.6, 60 + wind * 80, -10);
    if (kind === 'leaf') ps.emit('leaf', x, cam.y - 5, wind * 30, 10);
    if (kind === 'firefly') ps.emit('firefly', x, y, 0, 0);
    if (kind === 'salt') ps.emit('salt', x, y, wind * 10, -5);
    if (kind === 'windline') ps.emit('windline', cam.x - 10, cam.y + Math.random() * H * 0.8, 120 + wind * 120, 0);
  }
}

/* ===== 14_portraits.js ===== */
/* =====================================================================
   14_portraits.js — Retratos pixel 128x128 para diálogos.
   Mismo motor SDF del rig con sombra proyectada del pelo, ojos con iris,
   pupila y brillos, cejas, nariz, labios y expresiones.
   ===================================================================== */

const PEXPR = {
  neutral: { eye: 'open', brow: 'neutral', mouth: 'line' },
  smile: { eye: 'open', brow: 'neutral', mouth: 'smile' },
  happy: { eye: 'happy', brow: 'up', mouth: 'smile', blush: true },
  joy: { eye: 'happy', brow: 'up', mouth: 'grin', blush: true },
  surprised: { eye: 'wide', brow: 'raised', mouth: 'o' },
  worried: { eye: 'open', brow: 'worried', mouth: 'wavy' },
  sad: { eye: 'sad', brow: 'worried', mouth: 'frown' },
  crying: { eye: 'sad', brow: 'worried', mouth: 'frown', tear: true },
  angry: { eye: 'angry', brow: 'angry', mouth: 'frown' },
  determined: { eye: 'angry', brow: 'determined', mouth: 'flat' },
  thinking: { eye: 'half', brow: 'skeptical', mouth: 'flat', look: 0.6 },
  skeptical: { eye: 'half', brow: 'skeptical', mouth: 'smirk' },
  guilty: { eye: 'down', brow: 'worried', mouth: 'flat' },
  calm: { eye: 'half', brow: 'neutral', mouth: 'smile' },
  scared: { eye: 'wide', brow: 'worried', mouth: 'wavy' },
  tired: { eye: 'half', brow: 'worried', mouth: 'flat' },
  proud: { eye: 'happy', brow: 'neutral', mouth: 'smirk', blush: true },
  embarrassed: { eye: 'down', brow: 'worried', mouth: 'wavy', blush: true },
};

const PF = {
  /** Ojo de retrato. (cx,cy) centro; w,h tamaño; iris: rampa; look desplazamiento horizontal */
  eye(pb, cx, cy, w, h, kind, o) {
    const ink = o.ink || '#1a0c18', lid = o.lid || '#2a1420', sk = o.skin;
    const sclera = '#fffaf0', scl2 = '#d8d0ec';
    cx = Math.round(cx); cy = Math.round(cy);
    const hw = w / 2, hh = h / 2;
    const look = o.look || 0;
    const drawOpen = (topCut = 0, wide = 1) => {
      // esclerótica
      for (let y = -hh * wide; y <= hh * wide; y++) for (let x = -hw; x <= hw; x++) {
        const d = (x * x) / (hw * hw) + (y * y) / (hh * hh * wide * wide);
        if (d > 1) continue;
        if (y < -hh * wide + topCut) { pb.set(cx + x, cy + y, sk[3]); continue; }
        pb.set(cx + x, cy + y, y > hh * 0.4 ? scl2 : sclera);
      }
      // iris
      const ir = Math.max(2, w * (wide > 1 ? 0.26 : 0.33)), iy = hh * 0.42 * wide;
      const icx = cx + look * hw * 0.35 + (o.far ? 1 : 0);
      for (let y = -iy - 1; y <= iy + 1; y++) for (let x = -ir; x <= ir; x++) {
        if ((x * x) / (ir * ir) + (y * y) / ((iy + 1) * (iy + 1)) > 1) continue;
        const yy = cy + 1 + y;
        if (yy < cy - hh * wide + topCut) continue;
        const ed = (x * x) / (ir * ir) + (y * y) / ((iy + 1) * (iy + 1));
        const t = (y + iy) / (2 * iy + 2);
        let c = o.iris[t < 0.3 ? 1 : t < 0.65 ? 2 : 3];
        if (ed > 0.75) c = o.iris[0];
        pb.set(Math.round(icx + x), yy, c);
      }
      // pupila
      pb.rect(Math.round(icx - 1), cy, 3, Math.max(2, Math.round(iy * 0.9)), ink);
      // brillos
      pb.rect(Math.round(icx - ir * 0.7), Math.max(cy - Math.round(iy * 0.6), cy - hh * wide + topCut + 1), 2, 2, '#ffffff');
      pb.set(Math.round(icx + ir * 0.5), cy + Math.round(iy * 0.7), '#ffffff');
      // párpado superior grueso + pestaña exterior
      for (let x = -hw - 1; x <= hw + 1; x++) {
        const yv = -Math.sqrt(Math.max(0, 1 - (x * x) / ((hw + 1) * (hw + 1)))) * hh * wide + topCut;
        pb.set(cx + x, Math.round(cy + yv) - 1, lid); pb.set(cx + x, Math.round(cy + yv), lid);
      }
      if (!o.far) { pb.set(cx + hw + 2, cy - hh * wide + topCut + 1, lid); pb.set(cx + hw + 3, cy - hh * wide + topCut, lid); }
      else { pb.set(cx + hw + 1, cy - hh * wide + topCut + 1, lid); }
      // párpado inferior
      for (let x = -hw + 2; x <= hw - 1; x++) { const yv = Math.sqrt(Math.max(0, 1 - (x * x) / (hw * hw))) * hh * wide; pb.set(cx + x, Math.round(cy + yv) + 1, sk[2]); }
    };
    switch (kind) {
      case 'happy': {
        for (let x = -hw; x <= hw; x++) { const yv = -Math.sqrt(Math.max(0, 1 - (x * x) / (hw * hw))) * hh * 0.6; pb.set(cx + x, Math.round(cy + yv + 2), lid); pb.set(cx + x, Math.round(cy + yv + 3), lid); }
        pb.set(cx + hw + 1, cy + 1, lid); pb.set(cx - hw - 1, cy + 2, lid);
        break;
      }
      case 'closed': for (let x = -hw; x <= hw; x++) { const yv = Math.sqrt(Math.max(0, 1 - (x * x) / (hw * hw))) * 2; pb.set(cx + x, Math.round(cy + yv + 1), lid); pb.set(cx + x, Math.round(cy + yv + 2), lid); } pb.set(cx + hw + 1, cy + 1, lid); break;
      case 'half': drawOpen(Math.round(hh * 0.85)); break;
      case 'down': drawOpen(Math.round(hh * 0.95)); break;
      case 'wide': drawOpen(0, 1.12); break;
      case 'angry': {
        drawOpen(Math.round(hh * 0.55));
        // párpado inclinado hacia el lagrimal
        for (let x = -hw; x <= hw; x++) { const inner = o.far ? -1 : 1; const yy = Math.round(cy - hh * 0.4 + (x * inner) / hw * 2.5); pb.set(cx + x, yy, lid); pb.set(cx + x, yy - 1, lid); for (let k = 2; k < 6; k++) pb.set(cx + x, yy - k, sk[3]); }
        break;
      }
      case 'sad': {
        drawOpen(Math.round(hh * 0.45));
        for (let x = -hw; x <= hw; x++) { const outer = o.far ? 1 : -1; const yy = Math.round(cy - hh * 0.45 + (x * outer) / hw * 2.5); pb.set(cx + x, yy, lid); for (let k = 1; k < 5; k++) pb.set(cx + x, yy - k, sk[3]); }
        pb.set(cx - 2, cy + hh - 1, '#a6f4ff');
        break;
      }
      default: drawOpen(0);
    }
  },
  brow(pb, cx, cy, w, kind, col, far) {
    cx = Math.round(cx); cy = Math.round(cy);
    const s = far ? -1 : 1; // interior hacia +x en ojo cercano
    let y0 = 0, y1 = 0, arch = 1.5;
    switch (kind) {
      case 'angry': case 'determined': y0 = -3; y1 = 2.5 * (kind === 'angry' ? 1.2 : 0.8); arch = 0.4; break;
      case 'worried': y0 = 1.5; y1 = -3; arch = 0.6; break;
      case 'raised': y0 = -3; y1 = -3; arch = 2.2; break;
      case 'up': y0 = -1; y1 = -1; arch = 2; break;
      case 'skeptical': y0 = far ? -3 : 0; y1 = far ? -3 : 0; arch = far ? 2.5 : 0.6; break;
    }
    for (let i = 0; i <= w; i++) {
      const t = i / w; // 0 exterior → 1 interior
      const x = cx + (far ? (w / 2 - i) : (i - w / 2));
      const y = cy + lerp(y0, y1, t) - Math.sin(t * Math.PI) * arch;
      const th = t < 0.2 ? 1 : 2;
      for (let k = 0; k < th + 1; k++) pb.set(Math.round(x), Math.round(y) + k, k === 0 ? shade(col, 0.15) : col);
    }
  },
  mouth(pb, cx, cy, w, kind, o) {
    cx = Math.round(cx); cy = Math.round(cy);
    const ink = o.ink || '#3a1218', lip = o.lip || '#a8505a', tongue = '#e2606a', teeth = '#fffaf0';
    const hw = Math.round(w / 2);
    switch (kind) {
      case 'smile':
        for (let x = -hw; x <= hw; x++) { const y = Math.round(-Math.cos((x / hw) * Math.PI / 2) * 2.4); pb.set(cx + x, cy - y, ink); }
        pb.set(cx + hw + 1, cy - 2, ink); pb.set(cx - hw - 1, cy - 1, ink); pb.hline(cx - hw + 2, cx + hw - 2, cy + 3, lip);
        break;
      case 'grin': {
        for (let x = -hw - 1; x <= hw + 1; x++) { const d = Math.round(Math.cos((x / (hw + 1)) * Math.PI / 2) * 5); for (let y = 0; y <= d; y++) pb.set(cx + x, cy - 1 + y, y === 0 ? teeth : y > d - 2 ? tongue : ink); }
        pb.hline(cx - hw - 1, cx + hw + 1, cy - 2, ink); pb.set(cx + hw + 2, cy - 3, ink); pb.set(cx - hw - 2, cy - 3, ink);
        break;
      }
      case 'o': pb.ellipse(cx, cy + 1, 2.6, 3.4, ink); pb.ellipse(cx, cy + 2.5, 1.5, 1.3, tongue); break;
      case 'open': pb.ellipse(cx, cy + 1, hw * 0.7, 3.2, ink); pb.ellipse(cx, cy + 2.6, hw * 0.45, 1.3, tongue); pb.hline(cx - Math.round(hw * 0.5), cx + Math.round(hw * 0.5), cy - 1, teeth); break;
      case 'talkSmall': pb.ellipse(cx, cy + 0.5, hw * 0.55, 2.2, ink); pb.hline(cx - 1, cx + 1, cy + 2, tongue); break;
      case 'frown': for (let x = -hw; x <= hw; x++) { const y = Math.round(-Math.cos((x / hw) * Math.PI / 2) * 2); pb.set(cx + x, cy + 2 + y, ink); } break;
      case 'wavy': for (let x = -hw; x <= hw; x++) pb.set(cx + x, cy + Math.round(Math.sin(x * 0.9) * 1.2), ink); break;
      case 'smirk': for (let x = -hw; x <= hw; x++) pb.set(cx + x, cy - (x > hw * 0.3 ? Math.round((x - hw * 0.3) * 0.5) : 0), ink); pb.hline(cx - hw + 2, cx + hw - 3, cy + 3, lip); break;
      case 'flat': pb.hline(cx - hw + 1, cx + hw - 1, cy, ink); pb.hline(cx - hw + 3, cx + hw - 3, cy + 3, lip); break;
      default: pb.hline(cx - hw + 1, cx + hw - 1, cy, ink); pb.set(cx + hw, cy - 1, ink); pb.hline(cx - hw + 3, cx + hw - 3, cy + 3, lip);
    }
  },
};

/* ---------- Constructor de retrato humanoide ---------- */
function buildPortraitHumanoid(D, exprName, talk, blink) {
  const R = new Rig(128, 128);
  const E = PEXPR[exprName] || PEXPR.neutral;
  const HX = 60 + (D.dx || 0), HY = 60 + (D.dy || 0);
  const rx = D.headRX || 27.5, ry = D.headRY || 31;
  const skin = D.skin, hair = D.hair;
  const o = { HX, HY, rx, ry, R, D, E };
  // torso / ropa
  D.outfit(R, o);
  // cuello
  R.capsule(HX - 3, HY + 20, HX - 5, HY + 38, 8, 9, { ramp: skin, base: 3, z: 20, group: 'neck', bevel: 6, cast: null });
  R.stamp(pb => { for (let x = HX - 14; x < HX + 8; x++) for (let y = HY + 27; y < HY + 31; y++) { const c = pb.get(x, y); if (c === U(skin[3]) && bayer4(x, y) < 0.5) pb.set(x, y, skin[2]); } }, 60);
  // cabeza
  R.ellipse(HX, HY, rx, ry, { ramp: skin, base: 4, z: 30, group: 'face', bevel: rx * 0.72 }, 0.05);
  R.ellipse(HX + 7, HY + 15, rx * 0.72, ry * 0.52, { ramp: skin, base: 4, z: 31, group: 'face', bevel: 10 }, -0.2);
  // oreja
  R.ellipse(HX - rx * 0.62, HY + 6, 4.5, 7.5, { ramp: skin, base: 3, z: 32, group: 'ear', bevel: 3.5 });
  R.stamp(pb => { const ex = Math.round(HX - rx * 0.62), ey = Math.round(HY + 6); pb.line(ex - 1, ey - 4, ex + 1, ey + 3, skin[2]); pb.line(ex + 1, ey - 3, ex + 2, ey + 1, skin[2]); }, 50);
  // pelo trasero
  if (D.hairBack) D.hairBack(R, o);
  // pelo frontal (proyecta sombra sobre la cara)
  if (D.hairFront) D.hairFront(R, o);
  if (D.accessory) D.accessory(R, o);
  // rasgos
  R.stamp(pb => {
    const eyeY = HY + (D.eyeY ?? 4);
    const e1 = HX - 4 + (D.eyeDX || 0), e2 = HX + 16 + (D.eyeDX || 0);
    const eo = { iris: D.iris, skin, look: E.look || 0.2, lid: D.lid };
    const ek = blink ? 'closed' : E.eye;
    PF.eye(pb, e1, eyeY, D.eyeW || 11, D.eyeH || 12, ek, eo);
    PF.eye(pb, e2, eyeY, (D.eyeW || 11) - 3, (D.eyeH || 12) - 1, ek, Object.assign({}, eo, { far: true }));
    const bc = D.browCol || hair[1];
    PF.brow(pb, e1, eyeY - 11, 11, E.brow, bc, false);
    PF.brow(pb, e2 + 1, eyeY - 11, 8, E.brow, bc, true);
    // nariz
    const nx = HX + 23, ny = HY + 15;
    pb.line(nx - 3, eyeY + 4, nx - 1, ny - 2, skin[3]); pb.set(nx, ny - 1, skin[2]); pb.set(nx - 1, ny, skin[1]); pb.set(nx - 3, ny + 1, skin[2]); pb.set(nx + 1, ny - 3, skin[5]);
    // boca
    let mk = E.mouth;
    if (talk) mk = (E.mouth === 'smile' || E.mouth === 'grin') ? 'open' : (E.mouth === 'o' ? 'o' : 'talkSmall');
    PF.mouth(pb, HX + 12 + (D.mouthDX || 0), HY + 24 + (D.mouthDY || 0), D.mouthW || 11, mk, { lip: D.lip || skin[2] });
    if (E.blush || D.alwaysBlush) { const bcol = D.blush || '#e8806a'; pb.dither(e1 - 6, eyeY + 8, 9, 3, null, bcol, 0.5); pb.dither(e2 + 1, eyeY + 8, 6, 3, null, bcol, 0.5); }
    if (E.tear) { pb.set(e1 - 2, eyeY + 7, '#a6f4ff'); pb.set(e1 - 2, eyeY + 8, '#56e5ff'); pb.set(e1 - 3, eyeY + 9, '#a6f4ff'); }
    if (D.freckles) for (const [fx, fy] of [[-8, 9], [-5, 11], [-2, 9], [19, 10], [22, 12], [-6, 13]]) pb.set(HX + fx, eyeY + fy, skin[2]);
    if (D.faceDetail) D.faceDetail(pb, Object.assign({}, o, { e1, e2, eyeY, mk }));
  }, 200);
  const pb = R.render();
  return pb;
}

/* ---------- Definiciones de retrato ---------- */
const PORTRAIT_DEFS = {};
PORTRAIT_DEFS.amaya = {
  skin: RAMP.skinA, hair: RAMP.hairA, iris: ['#2a1420', '#5a3020', '#8a5030', '#c08048'], blush: '#e86a5a', lip: '#9a4a40',
  outfit(R, o) {
    const { HX, HY } = o;
    R.poly([[4, 128], [10, 108], [34, 96], [86, 94], [112, 104], [124, 128]], { ramp: MAT.amayaJacket, base: 3, z: 10, group: 'jacket', bevel: 12 });
    R.poly([[46, 128], [52, 98], [70, 98], [78, 128]], { ramp: MAT.amayaShirt, base: 4, z: 11, group: 'shirt', bevel: 5 });
    R.poly([[40, 100], [56, 96], [58, 120], [44, 128]], { ramp: MAT.amayaJacket, base: 4, z: 12, group: 'lapelL', bevel: 3 });
    R.poly([[70, 96], [86, 98], [82, 128], [72, 120]], { ramp: MAT.amayaJacket, base: 4, z: 12, group: 'lapelR', bevel: 3 });
    R.stamp(pb => {
      for (let y = 104; y < 128; y += 4) pb.set(62, y, '#d0fff2');
      // insignia SYNARA
      pb.ellipse(30, 114, 4, 4, '#0e5a5e'); pb.poly([[30, 108], [34, 115], [26, 115]], '#20d6c7'); pb.ellipse(30, 115, 3, 3, '#20d6c7'); pb.set(29, 113, '#d0fff2');
      pb.line(14, 112, 24, 104, MAT.amayaJacket[2]); pb.line(98, 104, 108, 114, MAT.amayaJacket[2]);
    }, 60);
  },
  hairBack(R, o) {
    const { HX, HY } = o;
    const curls = [[-14, -36, 12], [0, -40, 12], [14, -36, 10], [-26, -26, 10], [24, -26, 8], [-8, -28, 11], [8, -30, 10], [-30, -12, 9], [-20, -48, 9], [-4, -52, 9], [12, -48, 8], [-32, -36, 7], [26, -40, 7]];
    curls.forEach(([dx, dy, r], i) => R.circle(HX + dx - 4, HY + dy - 4, r, { ramp: RAMP.hairA, base: 3, z: 5 + (dy + 60) * 0.001, group: 'curl' + i, bevel: r * 0.95, shiny: true, lineIdx: 1 }));
    R.ellipse(HX - 6, HY - 26, 9, 4, { ramp: MAT.amayaJacket, base: 4, z: 34, group: 'scrunch', bevel: 3 }, -0.3);
  },
  hairFront(R, o) {
    const { HX, HY, rx } = o;
    const cap = SDF.sub(SDF.ellipse(HX - 3, HY - 10, rx + 2, 24), SDF.ellipse(HX + 13, HY + 12, 26, 26));
    R.custom(cap, [HX - rx - 6, HY - 40, HX + rx + 6, HY + 20], { ramp: RAMP.hairA, base: 3, z: 40, group: 'hair', bevel: 8, shiny: true, cast: { on: ['face', 'ear'], dx: 2, dy: 3 } });
    [[18, -20, 6], [8, -24, 6.5], [-2, -26, 6], [26, -12, 5], [-18, 2, 6.5], [-16, 14, 5.5], [-22, -12, 6]].forEach(([dx, dy, r], i) => R.circle(HX + dx, HY + dy, r, { ramp: RAMP.hairA, base: 3, z: 41 + i * 0.01, group: 'fc' + i, bevel: r, shiny: true, lineIdx: 1, cast: { on: ['face', 'ear'], dx: 1, dy: 3 } }));
    R.capsule(HX + 27, HY - 10, HX + 30, HY + 6, 3, 2.5, { ramp: RAMP.hairA, base: 4, z: 42, group: 'lock', bevel: 2.5, shiny: true });
  },
  accessory(R, o) {

const Portraits = {
  cache: new Map(),
  get(id, expr = 'neutral', talk = 0, blink = false) {
    const k = id + '|' + expr + '|' + talk + '|' + (blink ? 1 : 0);
    let c = this.cache.get(k);
    if (c) return c;
    let pb;
    if (id === 'kiru') pb = portraitKiru(expr, talk, blink);
    else if (id === 'limen') pb = portraitLimen(expr, talk, blink);
    else if (id === 'mirage') pb = portraitTwin(expr, talk, blink, false);
    else if (id === 'mosaico') pb = portraitTwin(expr, talk, blink, true);
    else if (id === 'beta9') pb = portraitBeta(expr, talk);
    else pb = buildPortraitHumanoid(PORTRAIT_DEFS[id] || PORTRAIT_DEFS.amaya, expr, talk, blink);
    c = pb.toCanvas();
    this.cache.set(k, c);
    if (this.cache.size > 400) this.cache.delete(this.cache.keys().next().value);
    return c;
  },
  /** precalienta retratos frecuentes (llamar en carga de nivel) */
  warm(ids, exprs = ['neutral', 'smile']) { for (const id of ids) for (const e of exprs) { this.get(id, e, 0); this.get(id, e, 1); } },
};

/* ---------- Festival ---------- */
/** Guirnalda de banderines sobre una cuerda que cuelga entre dos puntos */
ART.bunting = function (pb, x0, y0, x1, y1, sag, cols, seed = 1) {
  const n = Math.max(2, Math.round(Math.abs(x1 - x0)));
  const pts = [];
  for (let i = 0; i <= n; i++) { const t = i / n; pts.push([x0 + (x1 - x0) * t, y0 + (y1 - y0) * t + Math.sin(t * Math.PI) * sag]); }
  for (let i = 0; i < pts.length - 1; i++) pb.set(Math.round(pts[i][0]), Math.round(pts[i][1]), '#5a3826');
  let k = 0;
  for (let i = 4; i < pts.length - 4; i += 9) {
    const [px, py] = pts[i], c = cols[(k + seed) % cols.length]; k++;
    for (let r = 0; r < 7; r++) { const hw = Math.round((7 - r) * 0.5); pb.hline(Math.round(px) - hw, Math.round(px) + hw, Math.round(py) + 1 + r, r < 2 ? shade(c, 0.2) : c); }
    pb.set(Math.round(px) + 1, Math.round(py) + 3, shade(c, -0.25)); pb.set(Math.round(px), Math.round(py) + 6, shade(c, -0.3));
  }
  return pts;
};
/** Puesto del festival con toldo festoneado */
ART.stall = function (pb, x, y, w, opts = {}) {
  const c1 = opts.c1 || '#ff6b6b', c2 = opts.c2 || '#fffaf0', h = opts.h || 40;
  // postes
  pb.rect(x + 2, y - h, 3, h, '#7a5236'); pb.rect(x + w - 5, y - h, 3, h, '#5a3826');
  // mostrador
  pb.rect(x, y - 16, w, 16, '#b07a50'); pb.rect(x, y - 16, w, 2, '#d8a070'); pb.rect(x, y - 3, w, 3, '#6e452e');
  for (let k = 6; k < w - 4; k += 10) pb.vline(x + k, y - 13, y - 4, '#8a5a3c');
  // toldo a rayas con festón
  for (let i = -3; i < w + 3; i++) {
    const stripe = Math.floor((i + 3) / 6) % 2 ? c1 : c2;
    for (let j = 0; j < 9; j++) pb.set(x + i, y - h - 9 + j, j < 2 ? shade(stripe, 0.15) : stripe);
    const sc = ((i + 3) % 6);
    const dip = sc < 1 || sc > 4 ? 1 : 3;
    for (let j = 0; j < dip; j++) pb.set(x + i, y - h + j, shade(stripe, -0.15));
  }
  pb.hline(x - 3, x + w + 2, y - h - 10, shade(c1, -0.35));
  // mercancía
  const r = RNG(opts.seed || x);
  const goods = opts.goods || 'fruit';
  for (let k = 4; k < w - 6; k += 7) {
    const gx = x + k, gy = y - 18;
    if (goods === 'fruit') { const c = r.pick(['#ff9f43', '#ffe14d', '#86e36f', '#ff4e5d', '#f78acb']); pb.disc(gx + 2, gy - 1, 2, c); pb.set(gx + 1, gy - 2, '#fffaf0'); }
    else if (goods === 'juice') { pb.rect(gx, gy - 7, 4, 7, '#cfe8ee'); pb.rect(gx + 1, gy - 5, 2, 5, r.pick(['#ff9f43', '#ff6b6b', '#86e36f', '#ffe14d'])); pb.set(gx + 2, gy - 9, '#ff4e5d'); }
    else if (goods === 'arepas') { pb.ellipse(gx + 2, gy - 1, 3, 1, '#f2d48a'); pb.hline(gx, gx + 4, gy - 2, '#ffe9b0'); pb.set(gx + 2, gy - 1, '#c9862e'); }
    else if (goods === 'crafts') { const c = r.pick(['#8d6bff', '#20d6c7', '#ff6b6b', '#ffe14d']); pb.rect(gx, gy - 6, 5, 6, c); pb.hline(gx, gx + 4, gy - 4, '#fffaf0'); pb.set(gx + 2, gy - 2, shade(c, -0.3)); }
    else if (goods === 'seeds') { pb.rect(gx, gy - 4, 5, 4, '#c9a46a'); pb.hline(gx, gx + 4, gy - 4, r.pick(['#ffe14d', '#ff4e5d', '#2a1a2a', '#fffaf0', '#c97c38'])); }
  }
  if (opts.sign) drawSign(pb, x + w / 2, y - h - 10, opts.sign, opts.signCol || '#8a5a3c');
};

/** Mural geométrico (patrones tejidos) */
ART.mural = function (pb, x, y, w, h, seed = 3) {
  const cols = ['#20d6c7', '#ff6b6b', '#ffe14d', '#8d6bff', '#ff9f43', '#4ccb70', '#fffaf0'];
  const r = RNG(seed);
  pb.rect(x, y - h, w, h, '#f2e2c4');
  for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) {
    const cx = (xx % 16) - 8, cy = (yy % 16) - 8;
    const d = Math.abs(cx) + Math.abs(cy);
    const band = Math.floor(yy / 16) + Math.floor(xx / 16);
    if (d === 7 || d === 3) pb.set(x + xx, y - h + yy, cols[(band + seed) % 6]);
    else if (d < 2) pb.set(x + xx, y - h + yy, cols[(band + seed + 2) % 6]);
    else if ((xx + yy) % 8 === 0 && d > 7) pb.set(x + xx, y - h + yy, '#e2cca4');
  }
  pb.rect(x, y - h, w, 1, '#fffaf0'); pb.rect(x, y - 1, w, 1, '#b89a78');
  void r;
};

/* ---------- Infraestructura de agua ---------- */
/** Bastidor de tubos de presión de OI (vista lateral) */
ART.roRack = function (pb, x, y, rows, n, opts = {}) {
  const tubeW = opts.tubeW || 56, tubeH = 7, gap = 3;
  const h = rows * (tubeH + gap) + 8;
  // bastidor
  pb.rect(x, y - h, 3, h, '#477a94'); pb.rect(x + tubeW + 9, y - h, 3, h, '#345a78');
  pb.rect(x, y - h, tubeW + 12, 2, '#6aa0b4'); pb.rect(x, y - 3, tubeW + 12, 3, '#263442');
  for (let r = 0; r < rows; r++) {
    const ty = y - 6 - (r + 1) * (tubeH + gap);
    for (let j = 0; j < tubeH; j++) {
      const t = j / (tubeH - 1);
      const c = t < 0.2 ? '#ffffff' : t < 0.5 ? '#eef6fa' : t < 0.8 ? '#c8d8e8' : '#8396ba';
      pb.hline(x + 6, x + 5 + tubeW, ty + j, c);
    }
    // tapas azules y bandas
    pb.rect(x + 3, ty - 1, 4, tubeH + 2, '#1f469e'); pb.vline(x + 3, ty, ty + tubeH - 1, '#4a7ad8');
    pb.rect(x + tubeW + 5, ty - 1, 4, tubeH + 2, '#1f469e'); pb.vline(x + tubeW + 8, ty, ty + tubeH - 1, '#102a63');
    for (let k = 14; k < tubeW; k += 14) pb.vline(x + 5 + k, ty, ty + tubeH - 1, '#a9bbd6');
    if (n) pb.set(x + 10, ty + 2, '#56e5ff');
  }
  // colectores: permeado (azul claro) y concentrado (violeta)
  pb.rect(x - 4, y - h + 4, 3, h - 8, '#1491aa'); pb.vline(x - 4, y - h + 4, y - 5, '#a6f4ff');
  pb.rect(x + tubeW + 13, y - h + 4, 3, h - 8, '#8e2a80'); pb.vline(x + tubeW + 13, y - h + 4, y - 5, '#f888b8');
  return { w: tubeW + 16, h };
};

/** Contenedor de baterías (BESS) con rejillas y franja de estado */

/** Electrolizador: pila de celdas con placas terminales, tirantes y separadores de gas */
ART.electrolyzer = function (pb, x, y, w, h) {
  const sw = Math.round(w * 0.55);
  // bancada
  pb.rect(x, y - 4, w, 4, '#263442'); pb.hline(x, x + w - 1, y - 4, '#477a94');
  // pila de celdas
  const sy = y - 4, sh = Math.round(h * 0.5);
  pb.rect(x + 2, sy - sh, 5, sh, '#345a78'); pb.rect(x + sw - 3, sy - sh, 5, sh, '#345a78');
  for (let k = 7; k < sw - 3; k++) {
    const c = k % 3 === 0 ? '#1d2a48' : k % 3 === 1 ? '#56e5ff' : '#c8d8e8';
    pb.vline(x + k, sy - sh + 3, sy - 3, c);
  }
  pb.hline(x + 2, x + sw + 1, sy - sh + 2, '#98c6d2'); pb.hline(x + 2, x + sw + 1, sy - 2, '#98c6d2');
  pb.hline(x + 2, x + sw + 1, sy - sh, '#cfe8ee');
  // separadores: H2 (cian) y O2 (blanco-azulado)
  const gx = x + sw + 6;
  const tank = (tx, hh, band) => { ART.tank(pb, tx, sy, 12, hh, RAMP.steelW, { band }); };
  tank(gx, Math.round(h * 0.85), '#22a2b2');
  tank(gx + 16, Math.round(h * 0.7), '#a9bbd6');
  pb.rect(gx + 2, sy - Math.round(h * 0.85) + 8, 8, 5, '#102a43'); pb.hline(gx + 3, gx + 8, sy - Math.round(h * 0.85) + 10, '#d8fff8');
  // tuberías superiores
  pb.rect(x + 8, sy - sh - 6, gx - x - 2, 2, '#40d0d4'); pb.rect(gx + 5, sy - Math.round(h * 0.85) - 4, 2, 4, '#40d0d4');
  pb.rect(x + 12, sy - sh - 10, gx - x + 12, 2, '#cfe8ee');
  // gabinete de potencia (rectificador)
  pb.rect(x + 4, sy - sh - 24, 18, 14, '#eab02a'); pb.rect(x + 4, sy - sh - 24, 18, 2, '#ffe14d'); pb.rect(x + 7, sy - sh - 20, 12, 4, '#140d26'); pb.hline(x + 8, x + 16, sy - sh - 18, '#fff09a');
};
/** Tanque horizontal de hidrógeno (cápsula) */
ART.h2tank = function (pb, x, y, len, r) {
  for (let j = -r; j <= r; j++) {
    const t = (j + r) / (2 * r);
    const c = t < 0.15 ? '#ffffff' : t < 0.45 ? '#eef6fa' : t < 0.75 ? '#c8d8e8' : t < 0.92 ? '#a9bbd6' : '#8396ba';
    const cap = Math.round(Math.sqrt(Math.max(0, 1 - (j / r) ** 2)) * r * 0.7);
    pb.hline(x - cap, x + len + cap, y - r + j + r, c);
  }
  pb.rect(x + len * 0.3, y, 8, 2 * r + 1, '#22a2b2'); pb.vline(x + len * 0.3, y, y + 2 * r, '#40d0d4');
  pb.rect(x + len * 0.55, y + r - 3, 14, 6, '#102a43');
  const tx = Math.round(x + len * 0.55 + 2), ty = y + r - 2;
  // "H2" diminuto
  for (const [dx, dy] of [[0, 0], [0, 1], [0, 2], [0, 3], [2, 0], [2, 1], [2, 2], [2, 3], [1, 2], [4, 0], [5, 0], [6, 1], [5, 2], [4, 3], [5, 3], [6, 3]]) pb.set(tx + dx, ty + dy, '#d8fff8');
  // patas
  pb.rect(x + 4, y + 2 * r, 3, 6, '#345a78'); pb.rect(x + len - 6, y + 2 * r, 3, 6, '#345a78');
  // válvula de alivio (abstracta)
  pb.rect(x + len - 2, y - 4, 2, 5, '#ff6b6b');
};
/** Poste de línea eléctrica con aisladores */
ART.pole = function (pb, x, y, h = 60) {
  pb.rect(x - 1, y - h, 3, h, '#7a5236'); pb.vline(x - 1, y - h, y, '#9a6e4a');
  pb.rect(x - 9, y - h + 4, 19, 2, '#5a3826');
  for (const k of [-8, 0, 8]) { pb.rect(x + k, y - h + 1, 2, 3, '#cfe8ee'); }
};
ART.cable = function (pb, x0, y0, x1, y1, sag, col = '#263442') {
  const n = Math.max(2, Math.abs(x1 - x0));
  for (let i = 0; i <= n; i++) { const t = i / n; pb.set(Math.round(x0 + (x1 - x0) * t), Math.round(y0 + (y1 - y0) * t + Math.sin(t * Math.PI) * sag), col); }
};

/* ---------- SYNARA ---------- */
/** Núcleo de SYNARA: torre blanca con cristal turquesa, anillos y antena */
ART.synaraCore = function (pb, x, y, h, opts = {}) {
  const w = opts.w || 64;
  const sealed = !!opts.sealed;
  // base escalonada
  pb.rect(x - 8, y - 10, w + 16, 10, '#d9c3a0'); pb.rect(x - 8, y - 10, w + 16, 2, '#f2e2c4');
  pb.rect(x - 4, y - 18, w + 8, 8, '#e8dcc0'); pb.rect(x - 4, y - 18, w + 8, 1, '#fffaf0');
  // fuste con bandas de vidrio
  for (let yy = y - h; yy < y - 18; yy++) {
    const t = (yy - (y - h)) / (h - 18);
    const inset = Math.round(Math.max(0, (1 - t)) * 10);
    for (let xx = x + inset; xx < x + w - inset; xx++) {
      const u = (xx - x - inset) / Math.max(1, w - 2 * inset);
      let c = u < 0.1 ? '#ffffff' : u < 0.55 ? '#f4f0e6' : u < 0.85 ? '#d8d0c0' : '#b8ac98';
      const band = (Math.floor((yy - (y - h)) / 14)) % 2 === 1 && u > 0.18 && u < 0.82;
      if (band) c = u < 0.4 ? '#7ff0dc' : u < 0.7 ? '#20d6c7' : '#138078';
      if (band && ((xx + yy) % 9 === 0)) c = '#c4fbff';
      pb.set(xx, yy, c);
    }
  }
  // puerta del núcleo
  const dx = x + w / 2 - 9;
  pb.rect(dx, y - 40, 18, 22, sealed ? '#3a1a2a' : '#0e5a5e'); pb.rect(dx, y - 40, 18, 2, '#fffaf0');
  if (sealed) for (let k = 0; k < 18; k += 3) pb.line(dx + k, y - 38, dx + k + 3, y - 19, '#ff4e5d');
  else { pb.rect(dx + 3, y - 36, 12, 14, '#20d6c7'); pb.vline(dx + 9, y - 36, y - 22, '#0e5a5e'); }
  // corona cristalina
  const cx = x + w / 2, cy = y - h - 4;
  pb.poly([[cx - 12, cy + 4], [cx, cy - 22], [cx + 12, cy + 4]], '#20d6c7');
  pb.poly([[cx - 12, cy + 4], [cx, cy - 22], [cx - 2, cy + 4]], '#7ff0dc');
  pb.line(cx, cy - 22, cx, cy + 3, '#c4fbff');
  pb.rect(cx - 16, cy + 4, 32, 3, '#e8dcc0'); pb.hline(cx - 16, cx + 15, cy + 4, '#fffaf0');
  pb.vline(cx, cy - 36, cy - 22, '#98c6d2'); pb.set(cx, cy - 37, '#ff4e5d');
};

ART.bigScreen = function (pb, x, y, w, h) {

/* ---------- Agroecología ---------- */
/** Planta de cultivo en distintos estadios (0..1) y estrés (0..1) */
ART.crop = function (pb, x, y, kind, stage = 1, seed = 1, stress = 0) {
  const r = RNG(seed);
  const leaf = stress > 0.6 ? ['#5a4a1a', '#8a7a2a', '#b0a040', '#d4c46a'] : stress > 0.3 ? ['#2a5a2a', '#5a8a2a', '#8ab040', '#c2d86a'] : ['#0f3b20', '#1f854c', '#33a552', '#86e36f'];
  const s = clamp(stage, 0.15, 1);
  if (kind === 'maiz' || kind === 'sorgo') {
    const hgt = Math.round((kind === 'maiz' ? 34 : 28) * s);
    pb.vline(x, y - hgt, y, leaf[1]); pb.vline(x + 1, y - hgt + 2, y, leaf[0]);
    for (let k = 4; k < hgt - 4; k += 5) {
      const side = (k / 5) % 2 ? 1 : -1, len = 6 + r.int(0, 3);
      for (let i = 0; i < len; i++) pb.set(x + side * (i + 1), y - k - Math.round(Math.sin(i / len * 2.2) * 3), i < len * 0.6 ? leaf[2] : leaf[3]);
    }
    if (s > 0.7) {
      if (kind === 'maiz') { pb.rect(x + 2, y - hgt * 0.55, 3, 7, '#f2d48a'); pb.set(x + 3, y - hgt * 0.55 - 1, '#c9862e'); pb.vline(x + 1, y - hgt * 0.55, y - hgt * 0.55 + 6, leaf[2]); for (let i = 0; i < 4; i++) pb.set(x - 1 + i, y - hgt - 1 - (i % 2), '#e8c070'); }
      else { for (let i = 0; i < 6; i++) pb.disc(x + (i % 2) - 1, y - hgt - 2 - i, 1, i % 2 ? '#a8402a' : '#c8582e'); }
    }
  } else if (kind === 'frijol') {
    const hgt = Math.round(24 * s);
    pb.vline(x, y - hgt - 2, y, '#8a6a3a');
    for (let k = 0; k < hgt; k += 2) { const ox = Math.round(Math.sin(k * 0.5) * 2); pb.set(x + ox, y - k, leaf[2]); if (k % 4 === 0) { pb.disc(x + ox + 2, y - k, 1, leaf[3]); pb.set(x + ox - 2, y - k - 1, leaf[1]); } }
    if (s > 0.7) for (let k = 0; k < 3; k++) { pb.vline(x + 2, y - 6 - k * 6, y - 3 - k * 6, '#7a8a2a'); pb.set(x - 2, y - 10 - k * 6, '#f78acb'); }
  } else if (kind === 'ahuyama') {
    const n = Math.round(4 * s) + 1;
    for (let i = 0; i < n; i++) { const lx = x + (i - n / 2) * 6, ly = y - 3 - (i % 2) * 2; pb.ellipse(lx, ly, 4, 3, leaf[2]); pb.ellipse(lx - 1, ly - 1, 2, 1, leaf[3]); pb.set(lx, ly + 2, leaf[0]); }
    pb.hline(x - n * 3, x + n * 3, y - 1, leaf[1]);
    if (s > 0.6) { pb.ellipse(x + 2, y - 3, 4, 3, '#ff9f43'); pb.hline(x - 1, x + 5, y - 5, '#ffc06a'); pb.vline(x + 2, y - 6, y - 1, '#c9622e'); }
  } else if (kind === 'tomate' || kind === 'aji') {
    const hgt = Math.round((kind === 'tomate' ? 20 : 12) * s);
    if (kind === 'tomate') pb.vline(x + 3, y - hgt - 4, y, '#b07a50');
    for (let k = 0; k < hgt; k += 2) { pb.set(x + (k % 4 ? 1 : -1), y - k, leaf[1]); pb.disc(x + r.int(-3, 3), y - k, 1, leaf[2 + (k % 2)]); }
    if (s > 0.6) for (let k = 0; k < 4; k++) { const fx = x + r.int(-3, 3), fy = y - r.int(3, Math.max(4, hgt)); if (kind === 'tomate') { pb.disc(fx, fy, 1, '#ff4e5d'); pb.set(fx - 1, fy - 1, '#ffb0a0'); } else { pb.vline(fx, fy, fy + 2, r.chance(0.5) ? '#ff4e5d' : '#ffe14d'); } }
  } else if (kind === 'nopal') ART.nopal(pb, x, y, Math.max(2, Math.round(3 * s)), seed);
  else ART.shrub(pb, x, y, Math.max(3, Math.round(6 * s)), seed);
};
/** Cinta de goteo con emisores sobre el suelo */
ART.dripLine = function (pb, x0, x1, y, spacing = 10) {
  pb.hline(x0, x1, y, '#1a1a24'); pb.hline(x0, x1, y - 1, '#2a2a3a');
  for (let x = x0 + 3; x < x1; x += spacing) { pb.set(x, y - 1, '#4a4a5a'); pb.set(x, y + 1, '#3a6a8a'); }
};
/** Casa-malla (sombra) con estructura liviana */
ART.shadeHouse = function (pb, x, y, w, h) {
  for (let k = 0; k <= w; k += 20) pb.vline(x + k, y - h, y, '#cfe8ee');
  pb.hline(x, x + w, y - h, '#e8f0f4');
  for (let yy = y - h + 1; yy < y; yy++) for (let xx = x; xx < x + w; xx++) if (((xx + yy) & 3) === 0 && pb.alpha(xx, yy) === 0) pb.set(xx, yy, '#8ab0a0');
  for (let k = 0; k < w; k++) pb.set(x + k, y - h - Math.round(Math.sin(k / w * Math.PI) * 6), '#e8f0f4');
};
/** Pozo/estanque de evaporación con costras de sal */
ART.evapPond = function (pb, x, y, w, h = 8) {
  pb.rect(x - 2, y - 2, w + 4, h + 4, '#c9a46a'); pb.rect(x, y, w, h, '#b8b0e0');
  for (let i = 0; i < w; i += 3) for (let j = 0; j < h; j += 2) if (hash2(x + i, y + j, 5) < 0.35) pb.set(x + i, y + j, '#ffffff');
  pb.hline(x, x + w - 1, y, '#e0dafc');
};
/** Montículo de sal cristalina */
ART.saltPile = function (pb, x, y, w, h) {
  for (let i = 0; i < w; i++) {
    const t = i / (w - 1), hh = Math.round(Math.sin(t * Math.PI) * h);
    for (let j = 0; j < hh; j++) { const c = t < 0.45 ? (j > hh - 3 ? '#ffffff' : '#f4f0ff') : (j > hh - 2 ? '#e0dafc' : '#c4bce8'); pb.set(x + i, y - j, c); }
  }
  for (let k = 0; k < w; k += 5) pb.set(x + k, y - Math.round(Math.sin(k / w * Math.PI) * h) + 1, '#ffffff');
};

/* ---------- Piezas animadas (ctx) ---------- */
/** Guirnalda de luces: pts del cable, encendidas o no */
function drawStringLights(g, pts, t, on = true, cols = ['#ffe14d', '#ff9f43', '#7ff0dc', '#ff8ab8']) {
  for (let i = 6, k = 0; i < pts.length - 4; i += 12, k++) {
    const [x, y] = pts[i];
    const c = cols[k % cols.length];
    if (!on) { fpx(g, x, y + 1, '#3a3050'); continue; }
    const tw = 0.7 + 0.3 * Math.sin(t * 3 + k * 1.7);
    fdither(g, x - 3, y - 2, 7, 7, c, 0.22 * tw);
    frect(g, x - 1, y + 1, 2, 2, c); fpx(g, x - 1, y + 1, '#fffaf0');
  }
}
/** Molino de papel de los niños */
function drawPaperWindmill(g, x, y, a, col = '#ff6b6b') {
  frect(g, x, y, 1, 14, '#b07a50');
  const cols = [col, '#ffe14d', '#20d6c7', '#8d6bff'];
  for (let k = 0; k < 4; k++) {
    const aa = a + k * Math.PI / 2;
    for (let r = 1; r < 5; r++) { fpx(g, x + Math.cos(aa) * r, y + Math.sin(aa) * r, cols[k]); fpx(g, x + Math.cos(aa + 0.5) * r * 0.7, y + Math.sin(aa + 0.5) * r * 0.7, cols[k]); }
  }
  fpx(g, x, y, '#fffaf0');
}
/** Burbujas de gas que suben del electrolizador; rate 0..1 */
function drawGasBubbles(g, x, y, w, h, t, rate, col = '#d8fff8') {
  const n = Math.round(rate * 10);
  for (let i = 0; i < n; i++) {
    const ph = ((t * (0.8 + (i % 3) * 0.3) + i * 0.37) % 1);
    const bx = x + ((i * 37) % w), by = y - ph * h;
    fpx(g, bx + Math.round(Math.sin(ph * 9 + i) * 1), by, col);
  }
}
/** Barra de estado de carga sobre un contenedor */
function drawSOCStrip(g, x, y, w, soc, t, charging = 0) {
  frect(g, x - 1, y - 1, w + 2, 6, '#05031a'); frect(g, x, y, w, 4, '#102a43');
  const col = soc < 0.2 ? '#ff4e5d' : soc < 0.4 ? '#ffb93b' : '#86e36f';
  const n = Math.round(soc * 10);
  for (let i = 0; i < 10; i++) frect(g, x + 1 + i * (w - 2) / 10, y + 1, Math.max(1, (w - 2) / 10 - 1), 2, i < n ? col : '#1c2350');
  if (charging) { const k = Math.floor(t * 6) % 10; frect(g, x + 1 + k * (w - 2) / 10, y + 1, Math.max(1, (w - 2) / 10 - 1), 2, charging > 0 ? '#fff09a' : '#ff9a8a'); }
}
/** Goteo: gotas cayendo de emisores */
function drawDrips(g, x0, x1, y, t, on, spacing = 10) {
  if (!on) return;
  for (let x = x0 + 3, i = 0; x < x1; x += spacing, i++) {
    const ph = (t * 1.2 + i * 0.31) % 1;
    if (ph < 0.6) fpx(g, x, y + 1 + Math.floor(ph * 4), '#6cf0db');
    else { fpx(g, x - 1, y + 4, '#2a5a7a'); fpx(g, x + 1, y + 4, '#2a5a7a'); }
  }
}

BIOMES.plaza = function (L) {

/* =====================================================================
   20_models.js — Modelos científicos simplificados, deterministas y
   explicables. Sin dependencias del DOM (se prueban en Node).
   Todas las cifras de escenario son supuestos de simulación salvo
   las constantes físicas y rangos indicados en el Atlas.
   ===================================================================== */

const UNITS = {
  'm³/h': 'caudal', 'g/L': 'concentración', 'bar': 'presión', 'kW': 'potencia', 'kWh': 'energía', 'kWh/m³': 'energía específica',
  'kg': 'masa', 'kg/h': 'flujo másico', 'kWh/kg': 'energía específica', 'W/m²': 'irradiancia', 'm/s': 'velocidad', '%': 'fracción', 'mm/día': 'lámina diaria', 'dS/m': 'conductividad', 'mg/L': 'concentración', 'NTU': 'turbidez',
};
/** Variable con metadatos (sec. 21 de la especificación) */
function V(name, symbol, value, unit, min, max, simulated = true, explanation = '', source = null) { return { name, symbol, value, unit, min, max, simulated, explanation, source }; }

const K_OSM = 0.77;        // bar por g/L (aprox. van 't Hoff para NaCl/agua de mar)
const H2_STOICH_WATER = 18.015 / 2.016; // ≈ 8,936 kg agua / kg H2
const H2_O2_RATIO = 15.999 / 2.016;     // ≈ 7,94 kg O2 / kg H2
const H2_LHV = 33.33;      // kWh/kg

/* =====================================================================
   Toma y pretratamiento
   ===================================================================== */
const IntakeModel = {
  /**
   * p: {Qtoma m³/h, depth m, screens bool, coag 0..1, turbIn NTU, filterDP bar, cap m³/h, dt h}
   * Retorna turbidez de salida, ΔP del filtro, riesgo ecológico, fouling potencial.
   */
  step(p) {
    const depthFactor = clamp(1 - (p.depth - 2) / 14, 0.35, 1);          // tomas más profundas captan menos sedimento resuspendido
    const turbRaw = p.turbIn * depthFactor;
    const capture = p.screens ? 0.15 : 0.0;
    const removal = clamp(0.55 + 0.38 * p.coag + capture, 0, 0.97);        // eficiencia abstracta de coagulación+filtración
    const load = turbRaw * p.Qtoma / 1000;                                 // carga de sólidos relativa
    const overload = Math.max(0, p.Qtoma / p.cap - 1);
    const turbOut = turbRaw * (1 - removal) * (1 + overload * 3);
    const dDP = (0.012 * load * (1 + overload * 4) - (p.backwash ? 0.6 : 0)) * p.dt;
    const filterDP = clamp((p.filterDP ?? 0.3) + dDP, 0.2, 2.5);
    const approachV = p.Qtoma / 3600 / (p.screens ? 2.4 : 1.6);            // m/s sobre área efectiva (m²)
    const ecoRisk = clamp((approachV - 0.15) / 0.25, 0, 1) * (p.screens ? 0.55 : 1) * (p.depth < 4 ? 1.2 : 1);
    const sdi = clamp(1 + turbOut * 0.9 + (filterDP - 0.3) * 1.5, 0, 9);
    const treatable = turbOut < 2.0 && filterDP < 1.2 && overload < 0.05;
    return { turbRaw, turbOut, filterDP, approachV, ecoRisk, sdi, removal, overload, treatable, Qtoma: p.Qtoma };
  },
};

/* =====================================================================
   Ósmosis inversa
   ===================================================================== */
const ROModel = {
  defaults: { Qf: 100, Cf: 35, T: 25, P: 60, foul: 0, A: 1.88, etaPump: 0.8, etaERD: 0.95, dPloss: 1.0, aux: 0.25, Pmax: 82, CpMax: 0.4, Rmax: 0.55 },
  /** Resuelve el estado estacionario. p: {Qf, Cf, T, P, foul, A, etaPump, etaERD, dPloss, aux} */
  solve(params) {
    const p = Object.assign({}, this.defaults, params);
    const TCF = Math.exp(0.03 * (p.T - 25));
    const loss = p.dPloss + p.foul * 2.2;
    const Aeff = p.A * TCF * (1 - 0.6 * clamp(p.foul, 0, 1));
    const state = (R) => {
      const Qp = R * p.Qf, Qc = p.Qf - Qp;
      // iteración interna para Cp (paso de sal) y Cc (balance)
      let Cp = 0.005 * p.Cf, Cc = p.Cf;
      let NDP = 0;
      for (let k = 0; k < 6; k++) {
        Cc = Qc > 1e-6 ? (p.Cf * p.Qf - Cp * Qp) / Qc : p.Cf * 50;
        const piAvg = K_OSM * (p.Cf + Cc) / 2;
        NDP = p.P - piAvg + K_OSM * Cp - loss;
        const Jrel = Math.max(0.05, NDP / 22);
        const Cavg = (p.Cf + Cc) / 2;
        Cp = Math.min(Cavg, 0.0045 * Cavg / Jrel * TCF * (1 + 1.5 * clamp(p.foul, 0, 1)));
      }
      return { Qp, Qc, Cp, Cc, NDP };
    };
    // bisección: A·NDP(R) = R·Qf
    let lo = 0, hi = 0.95;
    const f = (R) => Aeff * Math.max(0, state(R).NDP) - R * p.Qf;
    let R;
    if (f(1e-4) <= 0) R = 0;
    else {
      for (let i = 0; i < 50; i++) { const m = (lo + hi) / 2; if (f(m) > 0) lo = m; else hi = m; }
      R = (lo + hi) / 2;
    }
    const s = state(R);
    const Qp = Math.max(0, s.Qp), Qc = p.Qf - Qp;
    const Cc = s.Cc, Cp = R > 0 ? s.Cp : 0;
    const piF = K_OSM * p.Cf, piC = K_OSM * Cc, piAvg = (piF + piC) / 2;
    // energía
    const hydFeed = p.P * p.Qf / 36;                         // kW hidráulicos (bar·m³/h / 36)
    const recov = p.etaERD * Math.max(0, p.P - loss) * Qc / 36;
    const Ppump = Math.max(0, hydFeed - recov) / p.etaPump;
    const Paux = p.aux * p.Qf;                              // pretratamiento y bombeo de toma (kWh/m³ de alimentación)
    const Pel = Ppump + Paux;
    const SEC = Qp > 0.01 ? Pel / Qp : Infinity;
    const scaleIdx = (Cc - 62) / 12 + (p.T - 25) * 0.03;    // >0 → riesgo de incrustación
    const fluxIdx = s.NDP / 22;                              // >1.25 → flujo alto, ensuciamiento acelerado
    const alarms = [];
    if (p.P > p.Pmax) alarms.push({ id: 'pmax', sev: 3, text: 'Presión sobre el límite mecánico de los recipientes' });
    else if (p.P > p.Pmax - 6) alarms.push({ id: 'phigh', sev: 1, text: 'Presión cercana al límite' });
    if (Cp > p.CpMax) alarms.push({ id: 'quality', sev: 3, text: 'Permeado fuera de especificación (conductividad alta)' });
    if (R > p.Rmax) alarms.push({ id: 'recovery', sev: 2, text: 'Recuperación alta: concentrado muy salino' });
    if (scaleIdx > 0) alarms.push({ id: 'scaling', sev: scaleIdx > 0.6 ? 3 : 2, text: 'Riesgo de incrustación en membranas' });
    if (fluxIdx > 1.3) alarms.push({ id: 'flux', sev: 2, text: 'Flujo alto: ensuciamiento acelerado' });
    if (Qp <= 0.01) alarms.push({ id: 'noflow', sev: 2, text: 'Sin presión neta de impulso: no hay permeado' });
    if (Qc < 0.3 * p.Qf) alarms.push({ id: 'qcmin', sev: 2, text: 'Caudal de concentrado bajo el mínimo de arrastre' });
    const ok = !alarms.some(a => a.sev >= 3) && Qp > 0;
    return { Qf: p.Qf, Qp, Qc, R, Cf: p.Cf, Cp, Cc, piF, piC, piAvg, NDP: s.NDP, P: p.P, T: p.T, Pel, Ppump, Paux, recov: recov / p.etaPump, SEC, scaleIdx, fluxIdx, foul: p.foul, alarms, ok,
      saltIn: p.Cf * p.Qf, saltOut: Cp * Qp + Cc * Qc };
  },
  /** Evolución del ensuciamiento por hora */
  foulRate(r, sdi) { return 0.002 * Math.max(0, sdi - 2) + 0.004 * Math.max(0, r.fluxIdx - 1.1) + (r.scaleIdx > 0 ? 0.006 * r.scaleIdx : 0); },
  clean(foul) { return foul * 0.15; },
};

/* =====================================================================
   Pluma de salmuera (advección–difusión 2D, conserva masa)
   ===================================================================== */
class BrinePlume {
  constructor(nx = 64, ny = 36, cell = 25) {
    this.nx = nx; this.ny = ny; this.cell = cell; // m por celda
    this.s = new Float32Array(nx * ny); this.tmp = new Float32Array(nx * ny);
    this.exported = 0; this.discharged = 0; this.t = 0;
    this.kappa = 0.18; this.U = 0.9; this.tidePeriod = 12.4; this.cross = 0.12;
    this.land = new Uint8Array(nx * ny); // 1 = tierra (no agua)
    this.receptors = []; // {x,y,r,name,sens}
    this.exposure = 0;
  }
  idx(x, y) { return y * this.nx + x; }
  tideU(t = this.t) { return this.U * Math.sin(TAU * t / this.tidePeriod); }
  mass() { let m = 0; for (let i = 0; i < this.s.length; i++) m += this.s[i]; return m; }
  /** Inyecta masa de sal en exceso (kg) en una celda o difusor */
  inject(x, y, massKg, diffuser = 1) {
    const r = Math.max(0, diffuser - 1);
    const cells = [];
    for (let dy = -r; dy <= r; dy++) for (let dx = -r * 2; dx <= r * 2; dx++) { const xx = x + dx, yy = y + dy; if (xx >= 0 && yy >= 0 && xx < this.nx && yy < this.ny && !this.land[this.idx(xx, yy)]) cells.push(this.idx(xx, yy)); }
    if (!cells.length) return;
    const per = massKg / cells.length;
    for (const i of cells) this.s[i] += per;
    this.discharged += massKg;
  }
  /** Paso de tiempo dt (h). Advección upwind + difusión explícita; frontera mar adentro abierta. */
  step(dt) {
    const { nx, ny, s, tmp, land } = this;
    const u = this.tideU(), v = this.cross;
    const cu = clamp(Math.abs(u) * dt, 0, 0.45), cv = clamp(Math.abs(v) * dt, 0, 0.45), kd = clamp(this.kappa * dt, 0, 0.2);
    tmp.fill(0);
    let out = 0;
    for (let y = 0; y < ny; y++) for (let x = 0; x < nx; x++) {
      const i = y * nx + x; const m = s[i]; if (m <= 0) continue;
      if (land[i]) { tmp[i] += m; continue; }
      let stay = m;
      const send = (xx, yy, amt) => {
        if (xx < 0 || xx >= nx || yy >= ny) { out += amt; return true; } // sale por fronteras abiertas (laterales y mar adentro)
        if (yy < 0) return false;
        const j = yy * nx + xx; if (land[j]) return false;
        tmp[j] += amt; return true;
      };
      // advección
      const ax = u > 0 ? 1 : -1, ay = v > 0 ? 1 : -1;
      const mx = m * cu, my = m * cv;
      if (send(x + ax, y, mx)) stay -= mx;
      if (send(x, y + ay, my)) stay -= my;
      // difusión a 4 vecinos
      const md = m * kd;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) if (send(x + dx, y + dy, md)) stay -= md;
      tmp[i] += stay;
    }
    s.set(tmp);
    this.exported += out;
    this.t += dt;
    // exposición de receptores: celdas con exceso > umbral
    let exp = 0;
    for (const r of this.receptors) { const c = this.concAt(r.x, r.y); r.c = c; if (c > r.th) exp += (c - r.th) * r.sens * dt; }
    this.exposure += exp;
    return exp;
  }
  /** Concentración en exceso (g/L) en celda: masa / volumen de celda (profundidad 2 m) */
  concAt(x, y) { x = clamp(x | 0, 0, this.nx - 1); y = clamp(y | 0, 0, this.ny - 1); return this.s[this.idx(x, y)] / (this.cell * this.cell * 2) ; }
  areaAbove(th) { let n = 0; const vol = this.cell * this.cell * 2; for (let i = 0; i < this.s.length; i++) if (this.s[i] / vol > th) n++; return n * this.cell * this.cell; }
  balanceError() { return Math.abs(this.discharged - (this.mass() + this.exported)) / Math.max(1, this.discharged); }
}

/* =====================================================================
   Fotovoltaica
   ===================================================================== */
const PVModel = {
  /** Potencia (kW). p: {Pnom kW, G W/m², Ta °C, soil 0..1, shade 0..1, inv 0..1, gamma %/°C, avail} */
  power(p) {
    const gamma = p.gamma ?? -0.004; // fracción por °C
    const Tm = (p.Ta ?? 30) + (p.G / 800) * ((p.noct ?? 45) - 20);
    const fT = 1 + gamma * (Tm - 25);
    const P = p.Pnom * (p.G / 1000) * fT * (1 - (p.soil || 0)) * (1 - (p.shade || 0)) * (p.inv ?? 0.97) * (p.avail ?? 1);
    return { P: Math.max(0, P), Tm, fT };
  },
  /** Irradiancia de cielo claro aproximada (W/m²) para la hora h (0–24) */
  clearSky(h, opts = {}) {
    const rise = opts.rise ?? 6, set = opts.set ?? 18, Gmax = opts.Gmax ?? 1000;
    if (h <= rise || h >= set) return 0;
    const x = (h - rise) / (set - rise);
    return Gmax * Math.pow(Math.sin(Math.PI * x), 1.25);
  },
  /** Perfil horario de energía (kWh) y potencia pico; nubes: arreglo de factores 0..1 por hora */
  day(p, clouds = []) {
    const P = [], E = []; let tot = 0, peak = 0;
    for (let h = 0; h < 24; h++) {
      let e = 0, pk = 0;
      for (let k = 0; k < 4; k++) { const hh = h + (k + 0.5) / 4; const G = this.clearSky(hh, p) * (1 - (clouds[h] || 0)); const pw = this.power(Object.assign({}, p, { G })).P; e += pw * 0.25; pk = Math.max(pk, pw); }
      P.push(pk); E.push(e); tot += e; peak = Math.max(peak, pk);
    }
    return { P, E, total: tot, peak };
  },
};

/* =====================================================================
   Eólica
   ===================================================================== */
const WindModel = {
  curve: { cutIn: 3, rated: 12, cutOut: 25, restart: 20, Pnom: 500 },
  /** Potencia por tramos (kW). running=false si estaba en parada por cut-out (histéresis) */
  power(v, c = this.curve, running = true, rho = 1.225) {
    if (!running && v > c.restart) return 0;
    if (v < c.cutIn || v >= c.cutOut) return 0;
    if (v >= c.rated) return c.Pnom;
    const f = (v ** 3 - c.cutIn ** 3) / (c.rated ** 3 - c.cutIn ** 3);
    return c.Pnom * clamp(f * (rho / 1.225), 0, 1);
  },
  /** Extrapolación cúbica ingenua (para mostrar el error conceptual) */
  naiveCubic(v, vRef = 10, c = this.curve) { return this.power(vRef, c) * (v / vRef) ** 3; },
  /** Déficit de estela tipo Jensen a x diámetros aguas abajo */
  wakeDeficit(xD, Ct = 0.8, k = 0.075) { if (xD <= 0) return 0; return (1 - Math.sqrt(1 - Ct)) / Math.pow(1 + 2 * k * xD, 2); },
  /** Parque: turbinas [{x en D}] alineadas con el viento (de izquierda a derecha) */
  farm(v, turbines, c = this.curve) {
    const sorted = turbines.slice().sort((a, b) => a.x - b.x);
    let total = 0;
    const res = sorted.map((t, i) => {
      let def = 0;
      for (let j = 0; j < i; j++) { const dx = t.x - sorted[j].x; const dy = Math.abs((t.y || 0) - (sorted[j].y || 0)); if (dx > 0 && dy < 1.2) def = Math.sqrt(def * def + this.wakeDeficit(dx) ** 2); }
      const vt = v * (1 - def);
      const P = t.stopped ? 0 : this.power(vt, c);
      total += P;
      return Object.assign({}, t, { v: vt, deficit: def, P });
    });
    return { total, turbines: res };
  },
};

/* =====================================================================
   Batería (BESS)
   ===================================================================== */
const BESSModel = {
  make(o = {}) { return Object.assign({ cap: 1000, pmax: 250, soc: 0.6, socMin: 0.1, socMax: 0.95, etaC: 0.95, etaD: 0.95, throughput: 0, health: 1, cycleLife: 4000 }, o); },
  /**
   * Solicitud p (kW): >0 descarga, <0 carga, durante dt (h).
   * Respeta potencia y límites de SOC. Devuelve potencia efectiva entregada (+) o absorbida (−).
   */
  step(b, p, dt) {
    const cap = b.cap * b.health;
    let pe = clamp(p, -b.pmax, b.pmax);
    if (pe > 0) {
      const eAvail = Math.max(0, (b.soc - b.socMin) * cap) * b.etaD;
      pe = Math.min(pe, eAvail / dt);
      b.soc -= pe * dt / (b.etaD * cap);
    } else if (pe < 0) {
      const room = Math.max(0, (b.socMax - b.soc) * cap) / b.etaC;
      pe = -Math.min(-pe, room / dt);
      b.soc += -pe * b.etaC * dt / cap;
    }
    b.soc = clamp(b.soc, 0, 1);
    b.throughput += Math.abs(pe) * dt;
    b.health = Math.max(0.6, 1 - 0.2 * b.throughput / (b.cycleLife * 2 * b.cap));
    return pe;
  },
  energyAbove(b, socLevel) { return Math.max(0, (b.soc - socLevel) * b.cap * b.health) * b.etaD; },
};

/* =====================================================================
   Hidrógeno
   ===================================================================== */
const H2Model = {
  defaults: { SEC: 55, purifyReject: 0.35, cooling: 0, minLoad: 0.1, pmax: 300 },
  /** Agua total necesaria por kg de H2 (kg) */
  waterPerKg(o = {}) { const p = Object.assign({}, this.defaults, o); return H2_STOICH_WATER / (1 - p.purifyReject) + p.cooling; },
  /** Produce con energía E (kWh) y agua disponible (kg). Limita por ambas. */
  produce(E, waterAvail, o = {}) {
    const p = Object.assign({}, this.defaults, o);
    const byEnergy = Math.max(0, E) / p.SEC;
    const wpk = this.waterPerKg(p);
    const byWater = Math.max(0, waterAvail) / wpk;
    const m = Math.min(byEnergy, byWater);
    return { m, limitedBy: byEnergy <= byWater ? 'energía' : 'agua', water: m * wpk, waterStoich: m * H2_STOICH_WATER, energy: m * p.SEC, o2: m * H2_O2_RATIO, lhv: m * H2_LHV };
  },
  /** Verificación de atributo "verde": fracción renovable horaria y frontera */
  greenCheck(renewKWh, totalKWh, boundary = 'horaria') {
    const share = totalKWh > 0 ? renewKWh / totalKWh : 0;
    return { share, green: share >= 0.999 && boundary === 'horaria', boundary };
  },
  SAFETY: ['DETECTAR', 'AISLAR', 'DETENER', 'VENTILAR', 'VERIFICAR', 'AUTORIZAR REINICIO'],
};
