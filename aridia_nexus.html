/* ===== 12_props.js ===== */
/* =====================================================================
   12_props.js — Primitivas de escenografía pixel art.
   Prerender sobre PixelBuffer (estático) y dibujo dinámico sobre ctx.
   ===================================================================== */

const ART = {};

/* ---------- utilidades de color atmosférico ---------- */
ART.haze = (hex, haze, k) => mixHex(hex, haze, clamp(k, 0, 1));
ART.hazeRamp = (ramp, haze, k) => ramp.map(c => mixHex(c, haze, k));

/* ---------- Cielo ---------- */
/** Cielo en bandas tramadas. ramp de arriba (oscuro) a horizonte (claro). */
ART.sky = function (pb, ramp, horizonY, opts = {}) {
  const h = pb.h, w = pb.w;
  for (let y = 0; y < h; y++) {
    const t = clamp(y / horizonY, 0, 1);
    const tt = Math.pow(t, opts.curve || 1.25);
    for (let x = 0; x < w; x++) pb.data[y * w + x] = U(rampDither(ramp, tt, x, y));
  }
  if (opts.sun) ART.sunDisc(pb, opts.sun.x, opts.sun.y, opts.sun.r, opts.sun.cols, opts.sun.halo);
  if (opts.stars) {
    const r = RNG(opts.seed || 5);
    for (let i = 0; i < opts.stars; i++) {
      const x = r.int(0, w - 1), y = r.int(0, Math.floor(horizonY * 0.85));
      const b = r();
      pb.set(x, y, b > 0.9 ? '#ffffff' : b > 0.6 ? '#c8d0ff' : '#8a8ccb');
      if (b > 0.97) { pb.set(x - 1, y, '#5a6fb0'); pb.set(x + 1, y, '#5a6fb0'); pb.set(x, y - 1, '#5a6fb0'); pb.set(x, y + 1, '#5a6fb0'); }
    }
  }
};
/** Sol con halo de anillos tramados */
ART.sunDisc = function (pb, cx, cy, r, cols = ['#fff6d8', '#ffe878', '#ffd04a'], halo = '#fff0b8') {
  for (let y = Math.floor(cy - r * 3.2); y <= cy + r * 3.2; y++) for (let x = Math.floor(cx - r * 3.2); x <= cx + r * 3.2; x++) {
    const d = Math.hypot(x + 0.5 - cx, y + 0.5 - cy);
    if (d < r) { pb.set(x, y, d < r * 0.55 ? cols[0] : d < r * 0.85 ? cols[1] : cols[2]); }
    else if (d < r * 3.2) {
      const k = 1 - (d - r) / (r * 2.2);
      if (bayer4(x, y) < k * 0.55) pb.set(x, y, halo);
    }
  }
};
/** Nube pixel: racimo de círculos con base plana, sombreada en 4 tonos */
ART.cloudSprite = function (w, h, seed, pal) {
  const pb = new PixelBuffer(w, h);
  const r = RNG(seed);
  const blobs = [];
  const n = 4 + Math.floor(w / 18);
  for (let i = 0; i < n; i++) {
    const bx = lerp(w * 0.18, w * 0.82, i / (n - 1)) + r.range(-4, 4);
    const rad = (h * 0.32) * (1 - Math.abs(i / (n - 1) - 0.5) * 0.9) + r.range(0, h * 0.18);
    blobs.push([bx, h - rad * 0.9 - 2, rad]);
  }
  for (let i = 0; i < 3; i++) blobs.push([r.range(w * 0.3, w * 0.7), h * 0.45 + r.range(-3, 3), h * r.range(0.28, 0.4)]);
  const base = h - 3;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let inside = false, best = 0;
    for (const [bx, by, br] of blobs) {
      const d = Math.hypot(x + 0.5 - bx, y + 0.5 - by);
      if (d < br) { inside = true; const nyv = (y + 0.5 - by) / br, nxv = (x + 0.5 - bx) / br; best = Math.max(best, -nyv * 0.8 - nxv * 0.35); }
    }
    if (!inside || y > base) continue;
    const bottom = (y - (base - h * 0.28)) / (h * 0.28);
    let idx = best > 0.55 ? 3 : best > 0.05 ? 2 : best > -0.45 ? 1 : 0;
    if (bottom > 0.4) idx = Math.min(idx, 1);
    if (bottom > 0.8) idx = 0;
    // transición tramada entre tonos
    if (idx < 3 && bayer4(x, y) < 0.25 && best > (idx === 2 ? 0.45 : idx === 1 ? -0.05 : -0.55)) idx++;
    pb.set(x, y, pal[idx]);
  }
  return pb;
};

/* ---------- Perfiles de terreno ---------- */
/** Dibuja cordillera/mesetas: heightFn(x)→y superior. pal: rampa (oscura→clara). */
ART.ridge = function (pb, heightFn, pal, opts = {}) {
  const w = pb.w, h = pb.h;
  const tops = new Float32Array(w);
  for (let x = 0; x < w; x++) tops[x] = heightFn(x);
  for (let x = 0; x < w; x++) {
    const top = Math.round(tops[x]);
    const slope = (tops[Math.min(w - 1, x + 1)] - tops[Math.max(0, x - 1)]) * 0.5;
    for (let y = Math.max(0, top); y < h; y++) {
      const depth = y - top;
      let idx;
      if (opts.mesa) {
        // caras: lado izquierdo iluminado (pendiente negativa = subida hacia la derecha... luz desde izquierda)
        const face = slope < -0.6 ? 2 : slope > 0.6 ? -1 : 0;
        idx = opts.baseIdx + face;
        if (depth < 2) idx = opts.baseIdx + 2;
        // estratos
        if (opts.strata && ((y + Math.floor(fbm1(x * 0.02, 2, 9) * 6)) % opts.strata === 0)) idx -= 1;
        if (opts.strata && ((y + Math.floor(fbm1(x * 0.02, 2, 9) * 6)) % opts.strata === 1) && face >= 0) idx += 1;
      } else {
        idx = opts.baseIdx + (slope < -0.35 ? 1 : slope > 0.35 ? -1 : 0);
        if (depth < 1) idx += 1;
      }
      // degradado vertical hacia la base (bruma)
      if (opts.fadeTo) {
        const k = clamp((y - top) / (opts.fadeLen || 60), 0, 1);
        if (bayer4(x, y) < k * 0.9) idx = Math.min(idx, opts.fadeIdx ?? 0);
      }
      pb.set(x, y, pal[clamp(idx, 0, pal.length - 1)]);
    }
  }
  return tops;
};
/** Dunas: superposición de lomas con lado de sotavento sombreado y rizaduras */
ART.dunes = function (pb, yBase, amp, pal, seed, opts = {}) {
  const w = pb.w;
  const r = RNG(seed);
  const crests = [];
  let x = -r.range(20, 80);
  while (x < w + 100) { const width = r.range(opts.minW || 80, opts.maxW || 180); crests.push({ x, w: width, hgt: amp * r.range(0.6, 1) }); x += width * r.range(0.55, 0.85); }
  const top = new Float32Array(w).fill(1e9), shadeArr = new Int8Array(w);
  for (const c of crests) {
    const peak = c.x + c.w * 0.62;
    for (let xx = Math.max(0, Math.floor(c.x)); xx < Math.min(w, c.x + c.w); xx++) {
      let y;
      if (xx < peak) { const t = (xx - c.x) / (peak - c.x); y = yBase - c.hgt * Math.sin(t * Math.PI / 2) ** 1.6; }
      else { const t = (xx - peak) / (c.x + c.w - peak); y = yBase - c.hgt * (1 - t) ** 1.3; }
      if (y < top[xx]) { top[xx] = y; shadeArr[xx] = xx < peak ? 1 : -1; }
    }
  }
  for (let xx = 0; xx < w; xx++) {
    if (top[xx] > 1e8) top[xx] = yBase;
    const t0 = Math.round(top[xx]);
    for (let y = t0; y < pb.h; y++) {
      const d = y - t0;
      let idx = shadeArr[xx] > 0 ? opts.lit ?? 4 : opts.shadow ?? 2;
      if (d < 1) idx += 1;
      if (shadeArr[xx] > 0 && d > 3 && d < 9 && bayer4(xx, y) < 0.3) idx -= 1;
      // rizaduras del viento
      if (opts.ripples && ((y * 3 + Math.floor(Math.sin(xx * 0.08 + y * 0.3) * 3)) % 7 === 0) && shadeArr[xx] > 0) idx -= 1;
      if (opts.fade && y > yBase - 4) idx = Math.max(idx - 1, 0);
      pb.set(xx, y, pal[clamp(idx, 0, pal.length - 1)]);
    }
  }
  return top;
};
/** Mar con degradado hacia el horizonte */
ART.sea = function (pb, y0, y1, pal, opts = {}) {
  for (let y = y0; y < y1; y++) {
    const t = (y - y0) / Math.max(1, y1 - y0);
    for (let x = 0; x < pb.w; x++) {
      const tt = opts.invert ? 1 - t : t;
      pb.set(x, y, rampDither(pal, tt * 0.9 + 0.05, x, y));
    }
  }
};

/* ---------- Vegetación ---------- */
ART.palm = function (pb, x, y, hgt, lean, seed, pal = RAMP.leaf) {
  const r = RNG(seed);
  // tronco segmentado
  let px = x, py = y;
  const segs = Math.floor(hgt / 3);
  for (let i = 0; i < segs; i++) {
    const t = i / segs;
    const nx = x + Math.sin(t * 1.4) * lean, ny = y - i * 3;
    pb.rect(Math.round(nx) - 2, Math.round(ny) - 3, 4, 3, '#8a5a3c');
    pb.set(Math.round(nx) - 2, Math.round(ny) - 3, '#5a3826'); pb.set(Math.round(nx) + 1, Math.round(ny) - 1, '#5a3826');
    pb.hline(Math.round(nx) - 2, Math.round(nx) + 1, Math.round(ny) - 1, '#6e452e');
    pb.set(Math.round(nx) - 1, Math.round(ny) - 3, '#b07a50');
    px = nx; py = ny - 3;
  }
  // hojas (frondas)
  const fronds = 7;
  for (let f = 0; f < fronds; f++) {
    const a = -Math.PI + (f / (fronds - 1)) * Math.PI + r.range(-0.15, 0.15);
    const len = hgt * r.range(0.45, 0.62);
    let fx = px, fy = py;
    for (let s = 0; s < len; s++) {
      const t = s / len;
      fx = px + Math.cos(a) * s; fy = py + Math.sin(a) * s * 0.55 + t * t * len * 0.45;
      const wdt = Math.round((1 - t) * 3) + 1;
      for (let k = -wdt; k <= wdt; k++) {
        const c = k < 0 ? pal[5] : k === 0 ? pal[6] : pal[3];
        pb.set(Math.round(fx), Math.round(fy) + k, c);
      }
      if (s % 2 === 0) pb.set(Math.round(fx), Math.round(fy) + wdt + 1, pal[2]);
    }
  }
  pb.disc(px, py + 1, 2, '#5a3826'); pb.set(Math.round(px) - 1, Math.round(py), '#c8861a'); pb.set(Math.round(px) + 1, Math.round(py) + 1, '#9a5e12');
};
/** Cactus columnar (cardón) */
ART.cactus = function (pb, x, y, hgt, seed, pal = RAMP.leaf) {
  const r = RNG(seed);
  const col = (cx, cy0, cy1, w) => {
    for (let yy = Math.round(cy1); yy <= cy0; yy++) {
      for (let k = -w; k <= w; k++) {
        const t = k / w;
        let idx = t < -0.4 ? 5 : t < 0.2 ? 4 : t < 0.7 ? 3 : 2;
        if (Math.abs(k) === w) idx = 1;
        if ((k + 64) % 2 === 0 && Math.abs(k) < w && idx > 2) idx -= 0;
        pb.set(Math.round(cx + k), yy, pal[idx]);
      }
      if ((yy % 4) === 0) for (let k = -w + 1; k < w; k += 2) pb.set(Math.round(cx + k), yy, '#fff6d8');
    }
    for (let k = -w + 1; k < w; k++) pb.set(Math.round(cx + k), Math.round(cy1) - 1, pal[k < 0 ? 5 : 4]);
  };
  const w = Math.max(2, Math.round(hgt / 14));
  col(x, y, y - hgt, w);
  const arms = r.int(1, 3);
  for (let i = 0; i < arms; i++) {
    const side = i % 2 ? 1 : -1;
    const ay = y - hgt * r.range(0.3, 0.6);
    const ax = x + side * (w + 3);
    const ah = hgt * r.range(0.25, 0.45);
    for (let k = 0; k <= 3; k++) pb.rect(Math.round(x + side * (w + k)), Math.round(ay - 1), 1, w * 2 - 1, pal[3]);
    col(ax, ay + w, ay - ah, Math.max(1, w - 1));
  }
  if (r.chance(0.6)) { pb.set(Math.round(x), Math.round(y - hgt - 2), '#f78acb'); pb.set(Math.round(x) + 1, Math.round(y - hgt - 2), '#ffd8ec'); }
};
/** Nopal / tuna */
ART.nopal = function (pb, x, y, size, seed, pal = RAMP.leaf) {
  const r = RNG(seed);
  const pads = [[0, 0, size, size * 1.3]];
  for (let i = 0; i < 3 + r.int(0, 2); i++) { const p = r.pick(pads); pads.push([p[0] + r.range(-size, size), p[1] - p[3] * r.range(0.7, 1.1), size * r.range(0.6, 0.9), size * r.range(0.8, 1.2)]); }
  for (const [px, py, rw, rh] of pads) {
    const cx = x + px, cy = y + py - rh;
    for (let yy = -rh; yy <= rh; yy++) for (let xx = -rw; xx <= rw; xx++) {
      const d = (xx * xx) / (rw * rw) + (yy * yy) / (rh * rh);
      if (d > 1) continue;
      let idx = xx < -rw * 0.3 && yy < 0 ? 5 : d > 0.75 ? 2 : 4;
      if (d > 0.92) idx = 1;
      pb.set(Math.round(cx + xx), Math.round(cy + yy), pal[idx]);
    }
    pb.set(Math.round(cx), Math.round(cy - rh * 0.3), '#fff6d8'); pb.set(Math.round(cx - rw * 0.4), Math.round(cy + rh * 0.2), '#fff6d8');
    if (r.chance(0.5)) { pb.disc(cx + rw * 0.2, cy - rh, 1.4, '#e05aa0'); pb.set(Math.round(cx + rw * 0.2) - 1, Math.round(cy - rh) - 1, '#ffc4dc'); }
  }
};
/** Agave */
ART.agave = function (pb, x, y, size, pal = ['#0f3b3a', '#1c5a50', '#2c7a66', '#4a9e7e', '#7cc4a0', '#b8e6c4']) {
  const leaves = 9;
  for (let i = 0; i < leaves; i++) {
    const a = -Math.PI * (0.08 + 0.84 * i / (leaves - 1));
    const len = size * (0.7 + 0.3 * Math.sin(i * 1.7));
    for (let s = 0; s < len; s++) {
      const t = s / len;
      const lx = x + Math.cos(a) * s, ly = y + Math.sin(a) * s;
      const wdt = Math.round((1 - t) * 2.2);
      for (let k = -wdt; k <= wdt; k++) pb.set(Math.round(lx + k * Math.sin(a) * 0.6), Math.round(ly), pal[k < 0 ? 4 : k === 0 ? 5 : 2]);
    }
    pb.set(Math.round(x + Math.cos(a) * len), Math.round(y + Math.sin(a) * len), '#c97c38');
  }
};
/** Arbusto xerófito */
ART.shrub = function (pb, x, y, r0, seed, pal = RAMP.moss) {
  const r = RNG(seed);
  const n = 5 + r.int(0, 4);
  for (let i = 0; i < n; i++) {
    const bx = x + r.range(-r0, r0), by = y - r.range(1, r0 * 0.9), br = r0 * r.range(0.4, 0.7);
    for (let yy = -br; yy <= br; yy++) for (let xx = -br; xx <= br; xx++) {
      const d = Math.hypot(xx, yy) / br;
      if (d > 1 || by + yy > y) continue;
      const lit = (-xx - yy) / br;
      let idx = lit > 0.5 ? 4 : lit > -0.2 ? 3 : 2;
      if (hash2(Math.round(bx + xx), Math.round(by + yy), seed) < 0.18) idx -= 1;
      if (d > 0.9) idx = 1;
      pb.set(Math.round(bx + xx), Math.round(by + yy), pal[clamp(idx, 0, pal.length - 1)]);
    }
  }
  if (r.chance(0.5)) for (let i = 0; i < 3; i++) pb.set(Math.round(x + r.range(-r0, r0)), Math.round(y - r.range(2, r0)), r.pick(['#ffe14d', '#f78acb', '#fffaf0']));
};
/** Mata de hierba / pasto */
ART.grass = function (pb, x, y, n, seed, pal = RAMP.leaf) {
  const r = RNG(seed);
  for (let i = 0; i < n; i++) {
    const gx = x + r.range(-n, n), h = r.int(2, 6), lean = r.range(-1.2, 1.2);
    for (let k = 0; k < h; k++) pb.set(Math.round(gx + lean * k / h), y - k, pal[k === h - 1 ? 6 : k > h / 2 ? 5 : 3]);
  }
};
/** Árbol frondoso (moringa / trupillo) */
ART.tree = function (pb, x, y, hgt, seed, pal = RAMP.leaf, trunk = ['#3a2218', '#5a3826', '#7a5236', '#9a6e4a']) {
  const r = RNG(seed);
  for (let i = 0; i < hgt * 0.45; i++) { const xx = x + Math.sin(i * 0.12) * 1.5; pb.rect(Math.round(xx) - 2, y - i, 4, 1, trunk[1]); pb.set(Math.round(xx) - 1, y - i, trunk[2]); pb.set(Math.round(xx) + 1, y - i, trunk[0]); }
  const cy = y - hgt * 0.6;
  const blobs = 7 + r.int(0, 4);
  for (let i = 0; i < blobs; i++) {
    const bx = x + r.range(-hgt * 0.38, hgt * 0.38), by = cy + r.range(-hgt * 0.22, hgt * 0.15), br = hgt * r.range(0.15, 0.25);
    for (let yy = -br; yy <= br; yy++) for (let xx = -br; xx <= br; xx++) {
      const d = Math.hypot(xx, yy) / br; if (d > 1) continue;
      const lit = (-xx * 0.6 - yy) / br;
      let idx = lit > 0.55 ? 6 : lit > 0.15 ? 5 : lit > -0.3 ? 4 : 3;
      if (hash2(Math.round(bx + xx) >> 1, Math.round(by + yy) >> 1, seed) < 0.2) idx--;
      if (d > 0.93) idx = 2;
      pb.set(Math.round(bx + xx), Math.round(by + yy), pal[clamp(idx, 0, pal.length - 1)]);
    }
  }
};

/* ---------- Arquitectura bioclimática de Aridia ---------- */
const HOUSE_COLS = [
  ['#7a2a3a', '#b04450', '#e06a70', '#f6a0a0', '#ffd0c8'],
  ['#0e5a5e', '#178a86', '#28b8aa', '#6ae0cc', '#c0f8ea'],
  ['#8a5e14', '#c08a20', '#eab02a', '#ffd86a', '#fff0b0'],
  ['#3a2a7a', '#5a44a8', '#8070d0', '#b0a4ec', '#e0dafc'],
  ['#8a3e1e', '#c06030', '#e8884a', '#f8b880', '#ffe2c4'],
  ['#2a5a2a', '#3e8040', '#5aa85a', '#90d080', '#c8f0b0'],
  ['#e8dcc0', '#f2e8d0', '#faf4e4', '#fffcf4', '#ffffff'],
];
ART.house = function (pb, x, y, w, h, seed, opts = {}) {
  const r = RNG(seed);
  const pal = opts.pal || r.pick(HOUSE_COLS);
  const night = !!opts.night;
  // muro con luz desde la izquierda
  pb.rect(x, y - h, w, h, pal[2]);
  pb.rect(x + w - Math.max(3, w * 0.18 | 0), y - h, Math.max(3, w * 0.18 | 0), h, pal[1]);
  pb.rect(x, y - h, 2, h, pal[3]);
  for (let yy = y - h; yy < y; yy++) for (let xx = x; xx < x + w; xx++) if (hash2(xx, yy, seed) < 0.06) pb.set(xx, yy, pal[1]);
  // zócalo
  pb.rect(x, y - 3, w, 3, pal[0]);
  // techo: cúpula, terraza o torre de viento
  const roof = opts.roof || r.pick(['dome', 'flat', 'tower', 'flat', 'arch']);
  if (roof === 'dome') {
    const rx = w * 0.3, ry = rx * 0.8, cx = x + w * 0.5;
    for (let yy = -ry; yy <= 0; yy++) for (let xx = -rx; xx <= rx; xx++) if ((xx * xx) / (rx * rx) + (yy * yy) / (ry * ry) <= 1) pb.set(Math.round(cx + xx), Math.round(y - h + yy), xx < -rx * 0.2 ? '#fffaf0' : xx < rx * 0.4 ? '#e6e0f4' : '#b8b0d8');
    pb.set(Math.round(cx), Math.round(y - h - ry - 1), '#ffe14d');
  } else if (roof === 'tower') {
    const tw = Math.max(6, w * 0.22 | 0), tx = x + (r.chance(0.5) ? 2 : w - tw - 2), th = h * 0.55;
    pb.rect(tx, y - h - th, tw, th, pal[2]); pb.rect(tx + tw - 2, y - h - th, 2, th, pal[1]);
    for (let k = 0; k < 2; k++) pb.rect(tx + 2, y - h - th + 3 + k * 5, tw - 4, 3, '#2a1a2a');
    pb.rect(tx - 1, y - h - th - 2, tw + 2, 2, pal[3]);
  } else if (roof === 'arch') {
    pb.rect(x - 1, y - h - 2, w + 2, 2, pal[3]);
    for (let k = 0; k < 3; k++) pb.set(x + 3 + k * Math.floor(w / 3), y - h - 3, '#86e36f');
  } else {
    pb.rect(x - 1, y - h - 2, w + 2, 2, pal[3]); pb.hline(x - 1, x + w, y - h, pal[0]);
    if (opts.solarRoof || r.chance(0.5)) { for (let k = 2; k < w - 4; k += 6) { pb.rect(x + k, y - h - 6, 5, 3, '#1f469e'); pb.set(x + k + 1, y - h - 6, '#8cc4ff'); pb.vline(x + k + 2, y - h - 3, y - h - 2, '#98c6d2'); } }
    if (r.chance(0.5)) { pb.rect(x + w - 8, y - h - 5, 3, 3, '#c9622e'); pb.set(x + w - 7, y - h - 7, '#4ccb70'); pb.set(x + w - 8, y - h - 6, '#86e36f'); }
  }
  // ventanas con celosía y puerta en arco
  const winCol = night ? '#ffd86a' : '#1a2a4a', winHi = night ? '#fff6c0' : '#4a7aa8';
  const nw = Math.max(1, Math.floor((w - 8) / 12));
  for (let i = 0; i < nw; i++) {
    const wx = x + 5 + i * 12, wy = y - h + 6;
    if (wy + 10 > y - 12) break;
    pb.rect(wx, wy, 6, 8, winCol); pb.rect(wx, wy, 6, 2, winHi);
    pb.vline(wx + 3, wy, wy + 7, pal[0]); pb.hline(wx, wx + 5, wy + 4, pal[0]);
    pb.rect(wx - 1, wy + 8, 8, 1, pal[3]);
    if (r.chance(0.4)) { pb.rect(wx - 1, wy + 9, 8, 2, '#c9622e'); pb.set(wx, wy + 8, '#4ccb70'); pb.set(wx + 3, wy + 7, '#f78acb'); pb.set(wx + 5, wy + 8, '#86e36f'); }
  }
  const dx = x + Math.floor(w * 0.35), dw = 8;
  pb.rect(dx, y - 13, dw, 13, night ? '#5a3a1a' : '#3a2018'); pb.rect(dx + 1, y - 15, dw - 2, 2, night ? '#5a3a1a' : '#3a2018');
  pb.rect(dx + 1, y - 12, 2, 11, night ? '#7a5228' : '#5a3424'); pb.set(dx + dw - 2, y - 7, '#ffe14d');
  if (opts.awning || r.chance(0.35)) {
    const ac = r.pick(['#ff6b6b', '#20d6c7', '#ffe14d', '#8d6bff']);
    for (let k = 0; k < w; k++) { pb.set(x + k, y - 17, k % 4 < 2 ? ac : '#fffaf0'); pb.set(x + k, y - 16, k % 4 < 2 ? shade(ac, -0.2) : '#e8e0d0'); }
  }
};

/* ---------- Infraestructura ---------- */
/** Fila de paneles fotovoltaicos en perspectiva */
ART.pvRow = function (pb, x, y, w, seed, opts = {}) {
  const tilt = opts.tilt ?? 8, depth = opts.depth ?? 10;
  const pal = RAMP.pv;
  const soil = opts.soil || 0;
  // estructura
  for (let k = 4; k < w; k += 18) { pb.vline(x + k, y - 2, y + 6, '#6aa0b4'); pb.vline(x + k + 1, y, y + 6, '#345a78'); }
  // superficie inclinada (paralelogramo)
  for (let j = 0; j < depth; j++) {
    const yy = y - j;
    const off = Math.round(j * tilt / depth);
    for (let i = 0; i < w; i++) {
      const xx = x + i + off;
      const cell = (i % 6 === 0) || (j % 4 === 0);
      let c = cell ? pal[1] : pal[3 + ((j > depth * 0.55) ? 1 : 0)];
      // reflejo diagonal del cielo
      if (!cell && ((i + j * 2 + (seed % 7)) % 23) < 3) c = pal[6];
      if (!cell && soil > 0 && hash2(xx, yy, seed) < soil * 0.6) c = '#c9a46a';
      pb.set(xx, yy, c);
    }
  }
  pb.hline(x + tilt, x + w + tilt - 1, y - depth, '#d6efff');
  pb.hline(x, x + w - 1, y + 1, '#0a1440');
};
/** Tanque cilíndrico con bandas y escalerilla */
ART.tank = function (pb, x, y, w, h, pal = RAMP.steelW, opts = {}) {
  for (let i = 0; i < w; i++) {
    const t = i / (w - 1);
    const idx = t < 0.15 ? 4 : t < 0.45 ? 5 : t < 0.75 ? 3 : t < 0.92 ? 2 : 1;
    pb.vline(x + i, y - h, y - 1, pal[idx]);
  }
  // tapa elíptica
  for (let i = 0; i < w; i++) { const t = (i - w / 2) / (w / 2); const dy = Math.round(Math.sqrt(Math.max(0, 1 - t * t)) * Math.max(2, w * 0.12)); pb.vline(x + i, y - h - dy, y - h, i < w * 0.4 ? pal[6] : pal[4]); }
  for (let k = 1; k < 4; k++) pb.hline(x, x + w - 1, y - Math.round(h * k / 4), pal[1]);
  if (opts.band) { pb.rect(x, y - Math.round(h * 0.55), w, 4, opts.band); pb.hline(x, x + w - 1, y - Math.round(h * 0.55), shade(opts.band, 0.3)); }
  if (opts.ladder) for (let yy = y - h; yy < y; yy += 3) { pb.hline(x + w - 5, x + w - 2, yy, '#263442'); pb.vline(x + w - 5, y - h, y, '#263442'); pb.vline(x + w - 2, y - h, y, '#263442'); }
  if (opts.label) { pb.rect(x + 3, y - h + 6, Math.min(w - 6, 14), 5, '#102a43'); pb.hline(x + 4, x + 4 + Math.min(w - 8, 10), y - h + 8, opts.labelCol || '#56e5ff'); }
};
/** Tubería horizontal/vertical con brillo y bridas */
ART.pipe = function (pb, x0, y0, x1, y1, r, kind = 'water') {
  const K = PIPE_PAL[kind] || PIPE_PAL.water;
  const horiz = Math.abs(x1 - x0) >= Math.abs(y1 - y0);
  if (horiz) {
    const xa = Math.min(x0, x1), xb = Math.max(x0, x1);
    for (let k = -r; k <= r; k++) { const t = (k + r) / (2 * r); pb.hline(xa, xb, y0 + k, K[t < 0.25 ? 4 : t < 0.5 ? 3 : t < 0.8 ? 2 : 1]); }
    for (let xx = xa + 8; xx < xb; xx += 22) { pb.rect(xx, y0 - r - 1, 2, 2 * r + 3, K[1]); pb.vline(xx, y0 - r - 1, y0 + r + 1, K[4]); }
  } else {
    const ya = Math.min(y0, y1), yb = Math.max(y0, y1);
    for (let k = -r; k <= r; k++) { const t = (k + r) / (2 * r); pb.vline(x0 + k, ya, yb, K[t < 0.25 ? 4 : t < 0.5 ? 3 : t < 0.8 ? 2 : 1]); }
    for (let yy = ya + 8; yy < yb; yy += 22) { pb.rect(x0 - r - 1, yy, 2 * r + 3, 2, K[1]); pb.hline(x0 - r - 1, x0 + r + 1, yy, K[4]); }
  }
};
const PIPE_PAL = {
  water: ['#0a2a40', '#106884', '#1491aa', '#22bdd0', '#a6f4ff'],
  seawater: ['#0a1f4a', '#0f3a74', '#1063a6', '#1283bf', '#6cf0db'],
  brine: ['#3c1046', '#621a66', '#8e2a80', '#bc3e92', '#f888b8'],
  power: ['#3a2208', '#6a3e0e', '#c8861a', '#eab02a', '#fff09a'],
  h2: ['#0b2b40', '#16768c', '#22a2b2', '#40d0d4', '#d8fff8'],
  steel: ['#1d2a48', '#345a78', '#477a94', '#6aa0b4', '#cfe8ee'],
  irrigation: ['#0f3b20', '#1f6a3a', '#33a552', '#4ccb70', '#c2f58e'],
};

/* ---------- Elementos dinámicos (ctx) ---------- */
/** Aerogenerador: torre + góndola + 3 aspas rotando. size≈altura de torre */
ART.turbine = function (g, x, y, size, angle, opts = {}) {
  const s = size;
  const col = opts.col || '#f4fdff', sh = opts.shade || '#98c6d2', dark = opts.dark || '#477a94';
  const tw = Math.max(1, Math.round(s / 30));
  // torre cónica
  for (let i = 0; i < s; i++) {
    const t = i / s;
    const hw = Math.max(0.5, tw * (1.4 - t * 0.6));
    const yy = Math.round(y - i);
    frect(g, Math.round(x - hw), yy, Math.max(1, Math.round(hw)), 1, col);
    frect(g, Math.round(x), yy, Math.max(1, Math.round(hw)), 1, sh);
  }
  const hx = Math.round(x), hy = Math.round(y - s);
  // góndola
  const nw = Math.max(2, Math.round(s / 12)), nh = Math.max(1, Math.round(s / 28));
  frect(g, hx - nw * 0.3, hy - nh, nw, nh * 2, col); frect(g, hx - nw * 0.3, hy, nw, nh, sh);
  // aspas
  const L = s * 0.48;
  for (let k = 0; k < 3; k++) {
    const a = angle + k * TAU / 3;
    const ex = hx + Math.cos(a) * L, ey = hy + Math.sin(a) * L;
    fline(g, hx, hy, ex, ey, col);
    if (s > 50) { fline(g, hx + Math.cos(a + 0.06) * 3, hy + Math.sin(a + 0.06) * 3, hx + Math.cos(a + 0.03) * L * 0.6, hy + Math.sin(a + 0.03) * L * 0.6, sh); }
    if (opts.tips) fpx(g, ex, ey, '#ff4e5d');
  }
  frect(g, hx - 1, hy - 1, 2, 2, dark);
  if (opts.stopped) { frect(g, hx - 1, hy - 5, 2, 2, (Game.frame >> 4) & 1 ? '#ff4e5d' : '#6a1414'); }
};
/** Gaviota / ave pequeña animada */
ART.bird = function (g, x, y, t, col = '#fffaf0', dark = '#3a4a6e') {
  const f = Math.floor(t * 8) % 4;
  const wing = [-2, -1, 0, -1][f];
  fpx(g, x, y, col); fpx(g, x + 1, y, col);
  fpx(g, x - 1, y + wing, dark); fpx(g, x - 2, y + wing * 2 + (wing ? 1 : 0), dark);
  fpx(g, x + 2, y + wing, dark); fpx(g, x + 3, y + wing * 2 + (wing ? 1 : 0), dark);
};
/** Flamenco (sprite procedural, animación de cuello) */
ART.flamingo = function (g, x, y, t, flip = 1) {
  const c1 = '#ff8ab8', c2 = '#f05a9a', c3 = '#ffc4dc', leg = '#e0607e';
  const bob = Math.round(Math.sin(t * 2) * 1);
  g.save(); g.translate(Math.round(x), Math.round(y)); g.scale(flip, 1);
  frect(g, 0, -12, 1, 12, leg); frect(g, 2, -12, 1, 7, leg); frect(g, 3, -6, 1, 1, leg); frect(g, 2, -5, 1, 1, leg);
  frect(g, -3, -17, 8, 5, c1); frect(g, -2, -18, 6, 1, c3); frect(g, -3, -13, 8, 1, c2); frect(g, -5, -16, 2, 2, c2);
  const nx = 4, ny = -18 + bob;
  frect(g, nx, ny - 8, 1, 9, c1); frect(g, nx + 1, ny - 9, 2, 2, c1); frect(g, nx + 3, ny - 8, 2, 1, '#fffaf0'); frect(g, nx + 4, ny - 7, 1, 2, '#140d26');
  g.restore();
};

/* ===== 13_bg.js ===== */
/* =====================================================================
   13_bg.js — Fondos parallax (5–8 capas) por bioma.
   Cada bioma devuelve: { layers:[{c, f, fy, y, dyn?}], sky, clouds,
   front:[…], tint } — capas prerenderizadas + dibujo dinámico.
   ===================================================================== */

const BG_CACHE = new Map();

class Backdrop {
  constructor(levelW, levelH) {
    this.levelW = levelW; this.levelH = levelH;
    this.layers = []; // detrás del juego
    this.front = [];  // delante del juego
    this.skyC = null; this.skyKey = '';
    this.clouds = [];
    this.weather = { wind: 0.3, dust: 0, clouds: 0.5, rain: 0 };
    this.time = 0;
  }
  /** Crea capa con ancho suficiente para su factor de parallax */
  layer(f, h, y, drawFn, opts = {}) {
    const w = Math.ceil(W + Math.max(0, this.levelW - W) * f) + 2;
    const pb = new PixelBuffer(w, h);
    drawFn(pb, w, h);
    const L = { c: pb.toCanvas(), f, fy: opts.fy ?? f * 0.3, y, dyn: opts.dyn || null, pre: opts.pre || null, w, h };
    (opts.front ? this.front : this.layers).push(L);
    return L;
  }
  dynLayer(f, dyn, opts = {}) { const L = { c: null, f, fy: opts.fy ?? f * 0.3, y: 0, dyn }; (opts.front ? this.front : this.layers).push(L); return L; }
  addClouds(n, pals, seed, yMin, yMax, f0 = 0.04, f1 = 0.18) {
    const r = RNG(seed);
    for (let i = 0; i < n; i++) {
      const w = r.int(40, 120), h = Math.round(w * r.range(0.32, 0.45));
      const f = lerp(f0, f1, r());
      const spr = ART.cloudSprite(w, h, seed * 13 + i, pals).toCanvas();
      this.clouds.push({ spr, x: r.range(0, W + (this.levelW - W) * f + 200), y: r.range(yMin, yMax), f, speed: r.range(3, 9) * (0.5 + f * 4), w, h, shadow: true });
    }
    this.clouds.sort((a, b) => a.f - b.f);
  }
  drawClouds(g, cam, wind = 1) {
    for (const c of this.clouds) {
      const span = W + (this.levelW - W) * c.f + c.w + 200;
      c.x += c.speed * Game.dt * wind;
      if (c.x > span) c.x -= span + c.w;
      const sx = Math.round(c.x - cam.x * c.f - c.w), sy = Math.round(c.y - cam.y * c.f * 0.3);
      if (sx > W || sx + c.w < 0) continue;
      g.drawImage(c.spr, sx, sy);
    }
  }
  /** Proyección de sombras de nubes sobre el suelo del juego (coordenadas de mundo) */
  cloudShadowAt(worldX) {
    let s = 0;
    for (const c of this.clouds) {
      if (c.f < 0.12) continue;
      // proyección aproximada: la nube a factor f proyecta sombra desplazada
      const cx = c.x - c.w * 0.5 + (Game.cam ? Game.cam.x : 0) * (1 - c.f);
      const d = Math.abs(worldX - cx);
      if (d < c.w * 0.45) s = Math.max(s, 1 - d / (c.w * 0.45));
    }
    return clamp(s, 0, 1);
  }
  render(g, cam, which = 'back') {
    const list = which === 'back' ? this.layers : this.front;
    for (const L of list) {
      if (L.pre) L.pre(g, cam, L);
      if (L.c) {
        const ox = Math.round(cam.x * L.f), oy = Math.round(cam.y * L.fy);
        g.drawImage(L.c, -ox, L.y - oy);
      }
      if (L.dyn) L.dyn(g, cam, L);
    }
  }
}

/* ---------- helpers de nubes por paleta ---------- */
const CLOUD_PALS = {
  day: ['#9ab8e0', '#c8dcf2', '#eef6fc', '#ffffff'],
  dusk: ['#8a4a8a', '#d06a8a', '#ffa88a', '#ffe0b0'],
  dawn: ['#7a5aa0', '#c07aa8', '#ffb8a8', '#fff0d0'],
  night: ['#141c44', '#22305e', '#34467a', '#4a5e98'],
  storm: ['#6a3a22', '#94582e', '#c08048', '#e0aa6a'],
  tech: ['#2a3a6a', '#3e5a8e', '#6a88b8', '#a0bce0'],
};

/** Cielo en lienzo de pantalla (factor 0) */
function makeSkyCanvas(ramp, horizon, opts = {}) {
  const k = ramp.join() + horizon + JSON.stringify(opts);
  if (BG_CACHE.has(k)) return BG_CACHE.get(k);
  const pb = new PixelBuffer(W, Math.max(horizon + 40, opts.h || H));
  ART.sky(pb, ramp, horizon, opts);
  const c = pb.toCanvas();
  BG_CACHE.set(k, c);
  return c;
}

/* ---------- Agua animada (superficie de mar en capa) ---------- */
function drawSeaSparkles(g, x0, y0, w, h, t, density = 1, cols = ['#ffffff', '#c6fff2', '#6cf0db']) {
  const n = Math.floor(w * h / 900 * density);
  for (let i = 0; i < n; i++) {
    const hx = hash1(i, 3), hy = hash1(i, 7);
    const ph = hash1(i, 11) * TAU;
    const life = (Math.sin(t * (1.5 + hash1(i, 13) * 2) + ph) + 1) / 2;
    if (life < 0.55) continue;
    const yy = Math.round(y0 + Math.pow(hy, 1.4) * h);
    const len = Math.max(1, Math.round((1 + (yy - y0) / h * 4) * (life - 0.5) * 2));
    const xx = Math.round(x0 + ((hx * w + t * 4 * (0.3 + hy)) % w));
    g.fillStyle = cols[i % cols.length];
    g.fillRect(xx, yy, len, 1);
  }
}
/** Columna de destellos del sol sobre el agua */
function drawSunGlitter(g, cx, y0, y1, t, col = '#fff6d8') {
  for (let y = y0; y < y1; y += 1) {
    const spread = 2 + (y - y0) * 0.35;
    const n = 1 + Math.floor((y - y0) / 12);
    for (let k = 0; k < n; k++) {
      const v = Math.sin(t * 3 + y * 1.7 + k * 2.3);
      if (v < 0.4) continue;
      const xx = Math.round(cx + Math.sin(y * 3.1 + k * 7.7 + t) * spread);
      g.fillStyle = v > 0.85 ? '#ffffff' : col;
      g.fillRect(xx, y, Math.round(1 + v * 2), 1);
    }
  }
}
/** Líneas de oleaje desplazándose */
function drawWaveBands(g, x0, y0, w, h, t, col, spacing = 7) {
  g.fillStyle = col;
  for (let y = y0; y < y0 + h; y += spacing) {
    const k = (y - y0) / h;
    const seg = 6 + k * 18;
    for (let x = x0 - ((t * (6 + k * 14) + y * 13) % (seg * 3)); x < x0 + w; x += seg * 3) {
      g.fillRect(Math.round(x), y + Math.round(Math.sin(x * 0.05 + t) * 0.6), Math.round(seg), 1);
    }
  }
}

const BIOMES = {};

/** COSTA DE CAPTACIÓN (Nivel 01) */
BIOMES.coast = function (L) {

  B.sky = makeSkyCanvas(RAMP.skyDay, horizon, { sun: { x: 470, y: 62, r: 13, halo: '#fff3d4' }, curve: 1.15 });
  B.addClouds(9, CLOUD_PALS.day, 41, 18, 120);
  // 1. promontorio lejano con faro
  B.layer(0.08, 90, horizon - 60, (pb, w) => {
    const hazePal = ART.hazeRamp(RAMP.mesa, '#a6e0f4', 0.62);
    ART.ridge(pb, (x) => 60 - Math.max(0, 1 - Math.abs(x - 120) / 170) * 46 - fbm1(x * 0.03, 3, 2) * 10 + (x > 260 ? 30 : 0), hazePal, { mesa: true, baseIdx: 4, strata: 7 });
    pb.rect(158, 6, 4, 14, '#fffaf0'); pb.rect(158, 10, 4, 3, '#ff6b6b'); pb.rect(157, 4, 6, 2, '#5a6fb0'); pb.set(160, 3, '#ffe14d');

  }, { dyn: (g, cam) => {

    drawSunGlitter(g, 470 - cam.x * 0.02, horizon + 1, horizon + 70, t);
    drawSeaSparkles(g, 0, horizon + 2, W, 70, t, 1.2);
    // velero lejano
    const bx = Math.round(((t * 4) % (W + 60)) - 30 - cam.x * 0.1);
    frect(g, bx, horizon + 6, 9, 2, '#fffaf0'); frect(g, bx + 1, horizon + 8, 7, 1, '#3a4a6e');
    frect(g, bx + 4, horizon - 6, 1, 12, '#3a4a6e'); g.fillStyle = '#fffaf0'; for (let i = 0; i < 10; i++) g.fillRect(bx + 5, horizon - 5 + i, Math.round(i * 0.5), 1);
    frect(g, bx + 2, horizon - 2, 2, 7, '#ff9f43');
  } });
  // 3. costa media con pueblo de Aridia y aerogeneradores lejanos
  B.layer(0.25, 120, horizon - 52, (pb, w) => {

    const r = RNG(9);

      if (r.chance(0.55)) { const hw = r.int(18, 34), hh = r.int(14, 26); ART.house(pb, x, 68, hw, hh, x, { pal: HOUSE_COLS[r.int(0, 6)].map(c => mixHex(c, '#c8eef4', 0.3)) }); }
      else ART.palm(pb, x, 70, r.int(22, 34), r.range(-6, 6), x, ART.hazeRamp(RAMP.leaf, '#c8eef4', 0.3));
    }
    // franja de playa húmeda
    for (let x = 0; x < w; x++) { pb.set(x, 118, '#fde8a8'); pb.set(x, 119, '#c6fff2'); }
  }, { dyn: (g, cam, Ly) => {
    const ox = cam.x * 0.25;
    for (let i = 0; i < 5; i++) {
      const tx = 180 + i * 260 - ox;
      if (tx < -40 || tx > W + 40) continue;
      ART.turbine(g, tx, Ly.y - cam.y * Ly.fy + 64 - (i % 2) * 6, 34, Game.time * 1.6 + i, { col: '#e6f4fa', shade: '#a8c8d8' });
    }
  } });
  // 4. acantilado cercano con vegetación xerófita
  B.layer(0.55, 150, H - 150 - 40, (pb, w) => {
    const r = RNG(21);
    ART.ridge(pb, (x) => 70 + Math.sin(x * 0.006) * 18 + fbm1(x * 0.02, 4, 4) * 26 - (Math.sin(x * 0.0021 + 1) > 0.5 ? 34 : 0), RAMP.mesa, { mesa: true, baseIdx: 5, strata: 6 });

      const k = r();
      if (k < 0.3) ART.cactus(pb, x, Math.round(y) + 2, r.int(14, 26), x);
      else if (k < 0.6) ART.shrub(pb, x, Math.round(y) + 2, r.int(4, 7), x);
      else if (k < 0.75) ART.agave(pb, x, Math.round(y) + 2, r.int(6, 10));
      else ART.nopal(pb, x, Math.round(y) + 2, r.int(3, 5), x);
    }
  }, { fy: 0.3 });
  return B;
};

/** Utilidad: lluvia de partículas ambientales por bioma */
function ambientParticles(ps, kind, cam, rate, wind) {
  const n = Math.floor(rate * Game.dt * 60 + Math.random());
  for (let i = 0; i < n; i++) {
    const x = cam.x + Math.random() * (W + 80) - 40, y = cam.y + Math.random() * H;
    if (kind === 'dust') ps.emit('dust', x, y, wind * 40, Math.random() * 6 - 3);
    if (kind === 'sand') ps.emit('sand', cam.x - 10, cam.y + H * 0.4 + Math.random() * H * 0.6, 60 + wind * 80, -10);
    if (kind === 'leaf') ps.emit('leaf', x, cam.y - 5, wind * 30, 10);
    if (kind === 'firefly') ps.emit('firefly', x, y, 0, 0);
    if (kind === 'salt') ps.emit('salt', x, y, wind * 10, -5);
    if (kind === 'windline') ps.emit('windline', cam.x - 10, cam.y + Math.random() * H * 0.8, 120 + wind * 120, 0);
  }
}

/* ===== 14_portraits.js ===== */
/* =====================================================================
   14_portraits.js — Retratos pixel 128x128 para diálogos.
   Mismo motor SDF del rig con sombra proyectada del pelo, ojos con iris,
   pupila y brillos, cejas, nariz, labios y expresiones.
   ===================================================================== */

const PEXPR = {
  neutral: { eye: 'open', brow: 'neutral', mouth: 'line' },
  smile: { eye: 'open', brow: 'neutral', mouth: 'smile' },
  happy: { eye: 'happy', brow: 'up', mouth: 'smile', blush: true },
  joy: { eye: 'happy', brow: 'up', mouth: 'grin', blush: true },
  surprised: { eye: 'wide', brow: 'raised', mouth: 'o' },
  worried: { eye: 'open', brow: 'worried', mouth: 'wavy' },
  sad: { eye: 'sad', brow: 'worried', mouth: 'frown' },
  crying: { eye: 'sad', brow: 'worried', mouth: 'frown', tear: true },
  angry: { eye: 'angry', brow: 'angry', mouth: 'frown' },
  determined: { eye: 'angry', brow: 'determined', mouth: 'flat' },
  thinking: { eye: 'half', brow: 'skeptical', mouth: 'flat', look: 0.6 },
  skeptical: { eye: 'half', brow: 'skeptical', mouth: 'smirk' },
  guilty: { eye: 'down', brow: 'worried', mouth: 'flat' },
  calm: { eye: 'half', brow: 'neutral', mouth: 'smile' },
  scared: { eye: 'wide', brow: 'worried', mouth: 'wavy' },
  tired: { eye: 'half', brow: 'worried', mouth: 'flat' },
  proud: { eye: 'happy', brow: 'neutral', mouth: 'smirk', blush: true },
  embarrassed: { eye: 'down', brow: 'worried', mouth: 'wavy', blush: true },
};

const PF = {
  /** Ojo de retrato. (cx,cy) centro; w,h tamaño; iris: rampa; look desplazamiento horizontal */
  eye(pb, cx, cy, w, h, kind, o) {
    const ink = o.ink || '#1a0c18', lid = o.lid || '#2a1420', sk = o.skin;
    const sclera = '#fffaf0', scl2 = '#d8d0ec';
    cx = Math.round(cx); cy = Math.round(cy);
    const hw = w / 2, hh = h / 2;
    const look = o.look || 0;
    const drawOpen = (topCut = 0, wide = 1) => {
      // esclerótica
      for (let y = -hh * wide; y <= hh * wide; y++) for (let x = -hw; x <= hw; x++) {
        const d = (x * x) / (hw * hw) + (y * y) / (hh * hh * wide * wide);
        if (d > 1) continue;
        if (y < -hh * wide + topCut) { pb.set(cx + x, cy + y, sk[3]); continue; }
        pb.set(cx + x, cy + y, y > hh * 0.4 ? scl2 : sclera);
      }
      // iris
      const ir = Math.max(2, w * (wide > 1 ? 0.26 : 0.33)), iy = hh * 0.42 * wide;
      const icx = cx + look * hw * 0.35 + (o.far ? 1 : 0);
      for (let y = -iy - 1; y <= iy + 1; y++) for (let x = -ir; x <= ir; x++) {
        if ((x * x) / (ir * ir) + (y * y) / ((iy + 1) * (iy + 1)) > 1) continue;
        const yy = cy + 1 + y;
        if (yy < cy - hh * wide + topCut) continue;
        const ed = (x * x) / (ir * ir) + (y * y) / ((iy + 1) * (iy + 1));
        const t = (y + iy) / (2 * iy + 2);
        let c = o.iris[t < 0.3 ? 1 : t < 0.65 ? 2 : 3];
        if (ed > 0.75) c = o.iris[0];
        pb.set(Math.round(icx + x), yy, c);
      }
      // pupila
      pb.rect(Math.round(icx - 1), cy, 3, Math.max(2, Math.round(iy * 0.9)), ink);
      // brillos
      pb.rect(Math.round(icx - ir * 0.7), Math.max(cy - Math.round(iy * 0.6), cy - hh * wide + topCut + 1), 2, 2, '#ffffff');
      pb.set(Math.round(icx + ir * 0.5), cy + Math.round(iy * 0.7), '#ffffff');
      // párpado superior grueso + pestaña exterior
      for (let x = -hw - 1; x <= hw + 1; x++) {
        const yv = -Math.sqrt(Math.max(0, 1 - (x * x) / ((hw + 1) * (hw + 1)))) * hh * wide + topCut;
        pb.set(cx + x, Math.round(cy + yv) - 1, lid); pb.set(cx + x, Math.round(cy + yv), lid);
      }
      if (!o.far) { pb.set(cx + hw + 2, cy - hh * wide + topCut + 1, lid); pb.set(cx + hw + 3, cy - hh * wide + topCut, lid); }
      else { pb.set(cx + hw + 1, cy - hh * wide + topCut + 1, lid); }
      // párpado inferior
      for (let x = -hw + 2; x <= hw - 1; x++) { const yv = Math.sqrt(Math.max(0, 1 - (x * x) / (hw * hw))) * hh * wide; pb.set(cx + x, Math.round(cy + yv) + 1, sk[2]); }
    };
    switch (kind) {
      case 'happy': {
        for (let x = -hw; x <= hw; x++) { const yv = -Math.sqrt(Math.max(0, 1 - (x * x) / (hw * hw))) * hh * 0.6; pb.set(cx + x, Math.round(cy + yv + 2), lid); pb.set(cx + x, Math.round(cy + yv + 3), lid); }
        pb.set(cx + hw + 1, cy + 1, lid); pb.set(cx - hw - 1, cy + 2, lid);
        break;
      }
      case 'closed': for (let x = -hw; x <= hw; x++) { const yv = Math.sqrt(Math.max(0, 1 - (x * x) / (hw * hw))) * 2; pb.set(cx + x, Math.round(cy + yv + 1), lid); pb.set(cx + x, Math.round(cy + yv + 2), lid); } pb.set(cx + hw + 1, cy + 1, lid); break;
      case 'half': drawOpen(Math.round(hh * 0.85)); break;
      case 'down': drawOpen(Math.round(hh * 0.95)); break;
      case 'wide': drawOpen(0, 1.12); break;
      case 'angry': {
        drawOpen(Math.round(hh * 0.55));
        // párpado inclinado hacia el lagrimal
        for (let x = -hw; x <= hw; x++) { const inner = o.far ? -1 : 1; const yy = Math.round(cy - hh * 0.4 + (x * inner) / hw * 2.5); pb.set(cx + x, yy, lid); pb.set(cx + x, yy - 1, lid); for (let k = 2; k < 6; k++) pb.set(cx + x, yy - k, sk[3]); }
        break;
      }
      case 'sad': {
        drawOpen(Math.round(hh * 0.45));
        for (let x = -hw; x <= hw; x++) { const outer = o.far ? 1 : -1; const yy = Math.round(cy - hh * 0.45 + (x * outer) / hw * 2.5); pb.set(cx + x, yy, lid); for (let k = 1; k < 5; k++) pb.set(cx + x, yy - k, sk[3]); }
        pb.set(cx - 2, cy + hh - 1, '#a6f4ff');
        break;
      }
      default: drawOpen(0);
    }
  },
  brow(pb, cx, cy, w, kind, col, far) {
    cx = Math.round(cx); cy = Math.round(cy);
    const s = far ? -1 : 1; // interior hacia +x en ojo cercano
    let y0 = 0, y1 = 0, arch = 1.5;
    switch (kind) {
      case 'angry': case 'determined': y0 = -3; y1 = 2.5 * (kind === 'angry' ? 1.2 : 0.8); arch = 0.4; break;
      case 'worried': y0 = 1.5; y1 = -3; arch = 0.6; break;
      case 'raised': y0 = -3; y1 = -3; arch = 2.2; break;
      case 'up': y0 = -1; y1 = -1; arch = 2; break;
      case 'skeptical': y0 = far ? -3 : 0; y1 = far ? -3 : 0; arch = far ? 2.5 : 0.6; break;
    }
    for (let i = 0; i <= w; i++) {
      const t = i / w; // 0 exterior → 1 interior
      const x = cx + (far ? (w / 2 - i) : (i - w / 2));
      const y = cy + lerp(y0, y1, t) - Math.sin(t * Math.PI) * arch;
      const th = t < 0.2 ? 1 : 2;
      for (let k = 0; k < th + 1; k++) pb.set(Math.round(x), Math.round(y) + k, k === 0 ? shade(col, 0.15) : col);
    }
  },
  mouth(pb, cx, cy, w, kind, o) {
    cx = Math.round(cx); cy = Math.round(cy);
    const ink = o.ink || '#3a1218', lip = o.lip || '#a8505a', tongue = '#e2606a', teeth = '#fffaf0';
    const hw = Math.round(w / 2);
    switch (kind) {
      case 'smile':
        for (let x = -hw; x <= hw; x++) { const y = Math.round(-Math.cos((x / hw) * Math.PI / 2) * 2.4); pb.set(cx + x, cy - y, ink); }
        pb.set(cx + hw + 1, cy - 2, ink); pb.set(cx - hw - 1, cy - 1, ink); pb.hline(cx - hw + 2, cx + hw - 2, cy + 3, lip);
        break;
      case 'grin': {
        for (let x = -hw - 1; x <= hw + 1; x++) { const d = Math.round(Math.cos((x / (hw + 1)) * Math.PI / 2) * 5); for (let y = 0; y <= d; y++) pb.set(cx + x, cy - 1 + y, y === 0 ? teeth : y > d - 2 ? tongue : ink); }
        pb.hline(cx - hw - 1, cx + hw + 1, cy - 2, ink); pb.set(cx + hw + 2, cy - 3, ink); pb.set(cx - hw - 2, cy - 3, ink);
        break;
      }
      case 'o': pb.ellipse(cx, cy + 1, 2.6, 3.4, ink); pb.ellipse(cx, cy + 2.5, 1.5, 1.3, tongue); break;
      case 'open': pb.ellipse(cx, cy + 1, hw * 0.7, 3.2, ink); pb.ellipse(cx, cy + 2.6, hw * 0.45, 1.3, tongue); pb.hline(cx - Math.round(hw * 0.5), cx + Math.round(hw * 0.5), cy - 1, teeth); break;
      case 'talkSmall': pb.ellipse(cx, cy + 0.5, hw * 0.55, 2.2, ink); pb.hline(cx - 1, cx + 1, cy + 2, tongue); break;
      case 'frown': for (let x = -hw; x <= hw; x++) { const y = Math.round(-Math.cos((x / hw) * Math.PI / 2) * 2); pb.set(cx + x, cy + 2 + y, ink); } break;
      case 'wavy': for (let x = -hw; x <= hw; x++) pb.set(cx + x, cy + Math.round(Math.sin(x * 0.9) * 1.2), ink); break;
      case 'smirk': for (let x = -hw; x <= hw; x++) pb.set(cx + x, cy - (x > hw * 0.3 ? Math.round((x - hw * 0.3) * 0.5) : 0), ink); pb.hline(cx - hw + 2, cx + hw - 3, cy + 3, lip); break;
      case 'flat': pb.hline(cx - hw + 1, cx + hw - 1, cy, ink); pb.hline(cx - hw + 3, cx + hw - 3, cy + 3, lip); break;
      default: pb.hline(cx - hw + 1, cx + hw - 1, cy, ink); pb.set(cx + hw, cy - 1, ink); pb.hline(cx - hw + 3, cx + hw - 3, cy + 3, lip);
    }
  },
};

/* ---------- Constructor de retrato humanoide ---------- */
function buildPortraitHumanoid(D, exprName, talk, blink) {
  const R = new Rig(128, 128);
  const E = PEXPR[exprName] || PEXPR.neutral;
  const HX = 60 + (D.dx || 0), HY = 60 + (D.dy || 0);
  const rx = D.headRX || 27.5, ry = D.headRY || 31;
  const skin = D.skin, hair = D.hair;
  const o = { HX, HY, rx, ry, R, D, E };
  // torso / ropa
  D.outfit(R, o);
  // cuello
  R.capsule(HX - 3, HY + 20, HX - 5, HY + 38, 8, 9, { ramp: skin, base: 3, z: 20, group: 'neck', bevel: 6, cast: null });
  R.stamp(pb => { for (let x = HX - 14; x < HX + 8; x++) for (let y = HY + 27; y < HY + 31; y++) { const c = pb.get(x, y); if (c === U(skin[3]) && bayer4(x, y) < 0.5) pb.set(x, y, skin[2]); } }, 60);
  // cabeza
  R.ellipse(HX, HY, rx, ry, { ramp: skin, base: 4, z: 30, group: 'face', bevel: rx * 0.72 }, 0.05);
  R.ellipse(HX + 7, HY + 15, rx * 0.72, ry * 0.52, { ramp: skin, base: 4, z: 31, group: 'face', bevel: 10 }, -0.2);
  // oreja
  R.ellipse(HX - rx * 0.62, HY + 6, 4.5, 7.5, { ramp: skin, base: 3, z: 32, group: 'ear', bevel: 3.5 });
  R.stamp(pb => { const ex = Math.round(HX - rx * 0.62), ey = Math.round(HY + 6); pb.line(ex - 1, ey - 4, ex + 1, ey + 3, skin[2]); pb.line(ex + 1, ey - 3, ex + 2, ey + 1, skin[2]); }, 50);
  // pelo trasero
  if (D.hairBack) D.hairBack(R, o);
  // pelo frontal (proyecta sombra sobre la cara)
  if (D.hairFront) D.hairFront(R, o);
  if (D.accessory) D.accessory(R, o);
  // rasgos
  R.stamp(pb => {
    const eyeY = HY + (D.eyeY ?? 4);
    const e1 = HX - 4 + (D.eyeDX || 0), e2 = HX + 16 + (D.eyeDX || 0);
    const eo = { iris: D.iris, skin, look: E.look || 0.2, lid: D.lid };
    const ek = blink ? 'closed' : E.eye;
    PF.eye(pb, e1, eyeY, D.eyeW || 11, D.eyeH || 12, ek, eo);
    PF.eye(pb, e2, eyeY, (D.eyeW || 11) - 3, (D.eyeH || 12) - 1, ek, Object.assign({}, eo, { far: true }));
    const bc = D.browCol || hair[1];
    PF.brow(pb, e1, eyeY - 11, 11, E.brow, bc, false);
    PF.brow(pb, e2 + 1, eyeY - 11, 8, E.brow, bc, true);
    // nariz
    const nx = HX + 23, ny = HY + 15;
    pb.line(nx - 3, eyeY + 4, nx - 1, ny - 2, skin[3]); pb.set(nx, ny - 1, skin[2]); pb.set(nx - 1, ny, skin[1]); pb.set(nx - 3, ny + 1, skin[2]); pb.set(nx + 1, ny - 3, skin[5]);
    // boca
    let mk = E.mouth;
    if (talk) mk = (E.mouth === 'smile' || E.mouth === 'grin') ? 'open' : (E.mouth === 'o' ? 'o' : 'talkSmall');
    PF.mouth(pb, HX + 12 + (D.mouthDX || 0), HY + 24 + (D.mouthDY || 0), D.mouthW || 11, mk, { lip: D.lip || skin[2] });
    if (E.blush || D.alwaysBlush) { const bcol = D.blush || '#e8806a'; pb.dither(e1 - 6, eyeY + 8, 9, 3, null, bcol, 0.5); pb.dither(e2 + 1, eyeY + 8, 6, 3, null, bcol, 0.5); }
    if (E.tear) { pb.set(e1 - 2, eyeY + 7, '#a6f4ff'); pb.set(e1 - 2, eyeY + 8, '#56e5ff'); pb.set(e1 - 3, eyeY + 9, '#a6f4ff'); }
    if (D.freckles) for (const [fx, fy] of [[-8, 9], [-5, 11], [-2, 9], [19, 10], [22, 12], [-6, 13]]) pb.set(HX + fx, eyeY + fy, skin[2]);
    if (D.faceDetail) D.faceDetail(pb, Object.assign({}, o, { e1, e2, eyeY, mk }));
  }, 200);
  const pb = R.render();
  return pb;
}

/* ---------- Retratos no humanoides ---------- */
function portraitKiru(expr, talk, blink) {
  const R = new Rig(128, 128);
  const mood = KIRU_EYES[expr] || (PEXPR[expr] ? ({ happy: 'happy', joy: 'happy', surprised: 'big', sad: 'down', worried: 'down', determined: 'brave', thinking: 'mixed', scared: 'big', tired: 'tired', guilty: 'down', smile: 'happy', calm: 'open' }[expr] || 'open') : 'open');
  const HX = 62, HY = 70;
  R.poly([[HX - 20, HY - 12], [HX - 44, HY - 66], [HX - 4, HY - 26]], { ramp: MAT.kiruPanel, base: 3, z: 5, group: 'earB', bevel: 4, dark: 1 });
  R.ellipse(HX, HY + 44, 34, 18, { ramp: MAT.kiruBody, base: 3, z: 6, group: 'body', bevel: 12 });
  R.ellipse(HX, HY, 42, 36, { ramp: MAT.kiruBody, base: 4, z: 10, group: 'head', bevel: 24 });
  R.poly([[HX + 2, HY - 24], [HX + 18, HY - 78], [HX + 40, HY - 14]], { ramp: MAT.kiruPanel, base: 4, z: 12, group: 'earF', bevel: 4 });
  R.ellipse(HX + 8, HY + 4, 30, 23, { ramp: MAT.ink, base: 2, z: 14, group: 'screen', bevel: 6, flat: true });
  R.ellipse(HX + 40, HY + 16, 10, 8, { ramp: MAT.kiruOrange, base: 4, z: 15, group: 'nose', bevel: 6 });
  R.ellipse(HX + 4, HY + 48, 18, 7, { ramp: MAT.kiruOrange, base: 4, z: 8, group: 'belly', bevel: 4 });
  R.stamp(pb => {
    // celdas solares
    for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) { const x = HX + 12 + i * 5 + j * 1.5, y = HY - 52 + j * 9 + i * 1; pb.rect(Math.round(x), Math.round(y), 4, 7, '#2a5cc4'); pb.set(Math.round(x), Math.round(y), '#9cc8ff'); }
    pb.ellipse(HX + 18, HY - 76, 3, 3, '#ff8e34');
    const c1 = '#56e5ff', c2 = '#e6fdff', c3 = '#106884';
    const lx = HX - 6, rx = HX + 18, yy = HY - 2;
    const eye = (x) => {
      if (blink) { pb.rect(x - 5, yy + 4, 10, 2, c1); return; }
      switch (mood) {
        case 'happy': for (let k = -5; k <= 5; k++) { const y = Math.round(yy + 4 - Math.sqrt(25 - k * k) * 0.8); pb.rect(x + k, y, 1, 2, c1); } break;
        case 'big': pb.ellipse(x, yy + 2, 7, 9, c1); pb.ellipse(x, yy + 2, 4, 6, c3); pb.rect(x - 4, yy - 4, 3, 3, c2); break;
        case 'down': pb.rect(x - 5, yy + 2, 10, 6, c1); pb.rect(x - 5, yy + 2, 10, 2, c3); pb.line(x - 6, yy - 2, x + 5, yy, c1); break;
        case 'brave': pb.rect(x - 5, yy, 10, 9, c1); pb.line(x - 6, yy - 1, x + 5, yy + 2, '#0a0816'); pb.line(x - 6, yy, x + 5, yy + 3, '#0a0816'); pb.rect(x - 3, yy + 3, 2, 2, c2); break;
        case 'tired': pb.rect(x - 5, yy + 5, 10, 2, c1); pb.rect(x - 4, yy + 7, 8, 1, c3); break;
        case 'mixed': if (x === lx) { pb.ellipse(x, yy + 2, 5, 7, c1); pb.rect(x - 2, yy - 2, 2, 2, c2); } else { pb.rect(x - 4, yy + 3, 8, 2, c1); pb.rect(x + 6, yy - 6, 2, 4, '#ffe14d'); pb.set(x + 7, yy - 1, '#ffe14d'); } break;
        case 'star': for (let k = -5; k <= 5; k++) { pb.set(x + k, yy + 2, '#ffe14d'); pb.set(x, yy + 2 + k, '#ffe14d'); } pb.rect(x - 1, yy + 1, 3, 3, c2); break;
        default: pb.ellipse(x, yy + 2, 5, 7.5, c1); pb.rect(x - 3, yy - 3, 3, 3, c2); pb.rect(x + 1, yy + 6, 2, 2, c3);
      }
    };

/* ---------- Materiales de terreno ---------- */
const TERRAIN_MATS = {
  sand: { ramp: RAMP.sand, top: ['#fff6d8', '#fde8a8'], deco: 'shells', base: 5 },
  beach: { ramp: RAMP.sand, top: ['#fff6d8', '#fde8a8'], deco: 'shells', base: 6, wet: true },

  tile: { ramp: ['#3a2a4a', '#5a3e5e', '#8a5a6e', '#b87a7a', '#d8a08a', '#f0c8a8', '#fff0d8'], top: ['#fff0d8', '#f0c8a8'], deco: 'tiles', base: 4 },
  stone: { ramp: RAMP.rock, top: ['#e8d8d0', '#c79a9e'], deco: 'cobble', base: 5 },

class World {
  constructor(def, scene) {
    this.def = def; this.scene = scene;
    this.w = def.width; this.h = def.height || H;
    this.ground = new Float32Array(this.w + 1);
    const pts = def.ground;
    for (let x = 0; x <= this.w; x++) {
      let i = 0; while (i < pts.length - 2 && pts[i + 1][0] <= x) i++;
      const [x0, y0] = pts[i], [x1, y1] = pts[Math.min(i + 1, pts.length - 1)];
      const t = x1 === x0 ? 0 : clamp((x - x0) / (x1 - x0), 0, 1);
      const st = pts[i][2] === 'step' ? (t < 1 ? 0 : 1) : smooth(t);
      this.ground[x] = Math.round(lerp(y0, y1, pts[i][2] === 'lin' ? t : st));
    }
    this.platforms = (def.platforms || []).map(p => Object.assign({ oneWay: true, type: 'wood' }, p));
    this.solids = (def.solids || []).slice();
    this.ladders = def.ladders || [];
    this.water = def.water || [];
    this.wind = def.wind || [];
    this.hazards = def.hazards || [];
    this.entities = [];
    this.ps = new Particles(1600);
    this.time = 0;
    this.lensData = [];
  }
  groundAt(x) { x = Math.round(clamp(x, 0, this.w)); return this.ground[x]; }
  /** Superficie de apoyo bajo (x, yFeet) considerando plataformas */
  supportAt(x, yPrev, yNow, dropping) {
    let best = this.groundAt(x);
    for (const p of this.platforms) {
      if (x < p.x || x > p.x + p.w) continue;
      const py = p.y + (p.dy || 0);
      if (p.oneWay) { if (!dropping && yPrev <= py + 1 && yNow >= py - 0.01 && py < best) best = py; }
      else if (yPrev <= py + 1 && py < best) best = py;
    }
    return best;
  }
  solidHit(x, y0, y1) {
    for (const s of this.solids) if (x >= s.x && x <= s.x + s.w && y1 > s.y && y0 < s.y + s.h) return s;
    for (const p of this.platforms) if (!p.oneWay && x >= p.x && x <= p.x + p.w && y1 > p.y + 2 && y0 < p.y + (p.h || 8)) return p;
    return null;
  }
  ladderAt(x, y) { return this.ladders.find(l => Math.abs(x - l.x) < 9 && y >= l.y0 - 2 && y <= l.y1 + 4); }
  waterAt(x, y) { return this.water.find(w => x >= w.x0 && x <= w.x1 && y > w.y); }
  windAt(x, y) { let fx = 0, fy = 0; for (const z of this.wind) if (x >= z.x && x <= z.x + z.w && y >= z.y && y <= z.y + z.h) { fx += z.fx * (z.on === false ? 0 : 1); fy += z.fy * (z.on === false ? 0 : 1); } return [fx, fy]; }
  add(e) { e.world = this; this.entities.push(e); return e; }
  remove(e) { e.dead = true; }
  find(id) { return this.entities.find(e => e.id === id); }
}

/* ---------- Render del terreno a lienzo ---------- */
function renderTerrain(world) {
  const def = world.def, wd = world.w, hd = world.h;
  const pb = new PixelBuffer(wd, hd);
  const segs = def.terrain || [{ x0: 0, x1: wd, mat: 'sand' }];
  const matAt = (x) => { for (const s of segs) if (x >= s.x0 && x < s.x1) return TERRAIN_MATS[s.mat] || TERRAIN_MATS.sand; return TERRAIN_MATS[segs[segs.length - 1].mat]; };
  for (let x = 0; x < wd; x++) {
    const M = matAt(x);
    const top = world.ground[x];
    const slopeL = world.ground[Math.max(0, x - 1)] - top, slopeR = world.ground[Math.min(wd, x + 1)] - top;
    for (let y = Math.max(0, top); y < hd; y++) {
      const d = y - top;
      let c;
      if (d === 0) c = M.top[0];
      else if (d === 1) c = M.top[1];
      else {
        // profundidad → rampa más oscura, con ruido tramado
        const n = fbm(x * 0.05, y * 0.08, 3, 5);
        let k = M.base - Math.floor(d / 22) - (n > 0.62 ? 1 : 0);
        if (slopeL > 1.5 && d < 6) k += 1; // borde iluminado
        if (slopeR > 1.5 && d < 6) k -= 1;
        if (M.deco === 'strata' && ((y + Math.floor(fbm1(x * 0.015, 2, 3) * 8)) % 9 === 0)) k -= 1;
        if (M.deco === 'strata' && ((y + Math.floor(fbm1(x * 0.015, 2, 3) * 8)) % 9 === 1)) k += 1;
        if (M.deco === 'plates') { if (y % 16 === 0 || x % 32 === 0) k = 1; else if ((x % 32 === 3 || x % 32 === 28) && (y % 16 === 3 || y % 16 === 12)) k = 6; else k = 3 + ((y % 16) < 3 ? 1 : 0); }
        if (M.deco === 'tiles') { if (y % 8 === 0 || (x + (Math.floor(y / 8) % 2) * 8) % 16 === 0) k = 2; else k = 4; }
        if (M.deco === 'cobble') { const cx = Math.floor(x / 9), cy = Math.floor(y / 7); const jx = (x + (cy % 2) * 4) % 9, jy = y % 7; k = (jx === 0 || jy === 0) ? 2 : 4 + (hash2(cx, cy, 2) > 0.6 ? 1 : 0); }
        if (M.deco === 'ripples' && d < 30 && ((y * 2 + Math.floor(Math.sin(x * 0.05) * 4)) % 9 === 0)) k -= 1;
        if (bayer4(x, y) < 0.18 && n > 0.55) k -= 1;
        k = clamp(k, 0, M.ramp.length - 1);
        c = M.ramp[k];
        if (M.deco === 'shells' && hash2(x, y, 3) < 0.004 && d > 4) c = hash2(x, y, 4) < 0.5 ? '#fff6d8' : '#f78acb';
        if (M.deco === 'crystals' && hash2(x, y, 5) < 0.01) c = '#ffffff';
        if (M.deco === 'roots' && d > 3 && d < 30 && hash2(x >> 1, y, 6) < 0.02) c = '#c9a46a';
        if (M.wet && d < 4 && world.waterAt && world.water.some(w => x >= w.x0 && x <= w.x1)) c = M.ramp[Math.max(0, k - 1)];
      }
      pb.data[y * wd + x] = U(c);
    }
    // decoraciones de superficie
    if (M.grass && hash2(x, 1, 9) < 0.35) { const gh = 1 + Math.floor(hash2(x, 2, 9) * 4); for (let k = 1; k <= gh; k++) pb.set(x, top - k, k === gh ? '#c2f58e' : '#4ccb70'); }
  }
  // decoraciones definidas por el nivel sobre el terreno (rocas, conchas, etc.)
  if (def.decorate) def.decorate(pb, world);
  return pb.toCanvas();
}

/* ---------- Plataformas ---------- */
function drawPlatform(g, p, ox, oy) {
  const x = Math.round(p.x - ox), y = Math.round(p.y + (p.dy || 0) - oy), w = p.w;
  if (x > W || x + w < 0) return;
  switch (p.type) {
    case 'wood': {
      frect(g, x, y, w, 5, '#8a5a3c'); frect(g, x, y, w, 1, '#c8925e'); frect(g, x, y + 4, w, 1, '#4a2a1e');
      for (let k = 6; k < w; k += 8) frect(g, x + k, y + 1, 1, 3, '#5a3826');
      for (let k = 8; k < w - 4; k += 34) { frect(g, x + k, y + 5, 3, p.post || 40, '#5a3826'); frect(g, x + k, y + 5, 1, p.post || 40, '#8a5a3c'); }
      break;
    }
    case 'metal': {
      frect(g, x, y, w, 4, '#345a78'); frect(g, x, y, w, 1, '#98c6d2'); frect(g, x, y + 3, w, 1, '#1d2a48');
      for (let k = 2; k < w; k += 4) frect(g, x + k, y + 1, 1, 2, '#1d2a48');
      frect(g, x, y - 10, w, 1, '#ffb93b'); for (let k = 0; k < w; k += 16) frect(g, x + k, y - 10, 1, 10, '#6aa0b4');
      break;
    }
    case 'rock': {
      g.fillStyle = '#b8564b'; g.fillRect(x, y, w, 6); frect(g, x, y, w, 1, '#f7c08e'); frect(g, x + 1, y + 1, w - 2, 1, '#eb9a6c');
      for (let k = 0; k < w; k += 5) frect(g, x + k, y + 6, 4, 2 + (k * 7 % 3), '#933f47');
      break;
    }
    case 'pipe': {
      const K = PIPE_PAL[p.kind || 'steel'];
      frect(g, x, y, w, 6, K[2]); frect(g, x, y, w, 1, K[4]); frect(g, x, y + 1, w, 1, K[3]); frect(g, x, y + 5, w, 1, K[0]);
      for (let k = 10; k < w; k += 30) frect(g, x + k, y - 1, 2, 8, K[1]);
      break;
    }
    case 'crate': {
      frect(g, x, y, w, p.h || 16, '#a8743e'); frect(g, x, y, w, 1, '#e0aa6a'); frect(g, x + 2, y + 2, w - 4, (p.h || 16) - 4, '#8a5a2c');
      fline(g, x + 2, y + 2, x + w - 3, y + (p.h || 16) - 3, '#c8925e'); frect(g, x, y + (p.h || 16) - 1, w, 1, '#4a2a1e');
      break;
    }
    case 'salt': {
      frect(g, x, y, w, 5, '#f78acb'); frect(g, x, y, w, 1, '#ffffff'); frect(g, x, y + 1, w, 1, '#ffd8ec'); frect(g, x, y + 4, w, 1, '#b44d88');
      for (let k = 3; k < w; k += 7) { fpx(g, x + k, y - 1, '#ffffff'); fpx(g, x + k + 1, y - 2, '#fff2f8'); }
      break;
    }
    default: frect(g, x, y, w, 4, '#6aa0b4');
  }
}

/** Jugadora */
class Player extends Entity {
  constructor(o) {
    super(o);
    this.charId = 'amaya';
    this.onGround = false; this.coyote = 0; this.buffer = 0; this.anim = 'idle'; this.animT = 0; this.runT = 0;
    this.climbing = null; this.wading = false; this.gliding = false; this.inv = 0; this.lock = 0; this.forcedAnim = null;
    this.lastSafe = { x: this.x, y: this.y }; this.stepT = 0; this.expr = null;
    this.w = 12; this.h = 56;
  }
  setAnim(a) { if (this.anim !== a) { this.anim = a; this.animT = 0; } }
  hurt(dir, power = 160) {
    if (this.inv > 0) return;
    this.inv = 1.1; this.vx = dir * power; this.vy = -180; this.onGround = false; this.lock = 0.35;
    this.setAnim('hit'); Audio2.sfx('hit'); this.world.scene.cam.shake(3, 0.25);
    this.world.ps.emit('spark', this.x, this.y - 30, 0, -40, 8, 6);
  }
  update(dt) {
    const W_ = this.world, inp = W_.scene.inputEnabled() ? Input : null;
    this.t += dt; this.animT += dt;
    if (this.inv > 0) this.inv -= dt;
    if (this.lock > 0) this.lock -= dt;
    const left = inp && this.lock <= 0 && inp.down('left'), right = inp && this.lock <= 0 && inp.down('right');
    const up = inp && inp.down('up'), down = inp && inp.down('down');
    const jumpP = inp && inp.pressed('jump'), jumpD = inp && inp.down('jump');
    if (jumpP) this.buffer = PHYS.buffer; else this.buffer -= dt;

class Adversary extends Entity {
  constructor(o) { super(Object.assign({ type: 'fouler', range: 60, speed: 30, hp: 1, quizId: null }, o)); this.bx = this.x; this.by = this.y; this.phase = Math.random() * 6; }
  update(dt) {
    this.t += dt;
    if (this.calm) { this.calmT = (this.calmT || 0) + dt; if (this.calmT > 1.2) this.dead = true; return; }
    this.x = this.bx + Math.sin(this.t * this.speed / this.range + this.phase) * this.range;
    this.y = this.by + Math.sin(this.t * 2.3) * 6;
    const P = this.world.scene.player;
    if (P && Math.abs(P.x - this.x) < 12 && Math.abs(P.y - 28 - this.y) < 26) P.hurt(sign(P.x - this.x) || 1, 150);
    if (Math.random() < 0.2) this.world.ps.emit(this.type === 'scale' || this.type === 'saltMirage' ? 'salt' : this.type === 'peak' ? 'spark' : this.type === 'gust' ? 'windline' : 'glitch', this.x + (Math.random() - 0.5) * 14, this.y + (Math.random() - 0.5) * 14, 0, 0, 1);

    const k = this.calm ? 1 - (this.calmT || 0) / 1.2 : 1;
    // cuerpo de partículas en espiral con "ojo"
    for (let i = 0; i < 26; i++) {
      const a = t * 2 + i * 0.7, r = (4 + (i % 7) * 1.6) * k;
      fpx(g, x + Math.cos(a) * r, y + Math.sin(a * 1.3) * r * 0.8, c[i % 4]);
    }
    fdisc(g, x, y, 5 * k, c[1]); fdisc(g, x - 1, y - 1, 3 * k, c[2]);
    if (!this.calm) { frect(g, x - 2, y - 1, 2, 2, '#140d26'); frect(g, x + 1, y - 1, 2, 2, '#140d26'); fpx(g, x - 2, y - 1, '#fff'); }
    if (this.type === 'monoscore') drawText(g, '100', x, y - 14, { font: 'tiny', align: 'center', color: '#ffd84a', shadow: '#140d26' });
    if (this.type === 'peak') drawText(g, 'kW!', x, y - 14, { font: 'tiny', align: 'center', color: '#ffe14d', shadow: '#140d26' });
  }
}

/**
 * DialogueScene: overlay. lines: [{who, text, expr, side, choices:[...]}]
 * onDone(result) → índice de elección (si hubo) o null.
 */
const DialogueScene = {
  overlay: true,
  enter(p) {
    this.lines = p.lines; this.i = 0; this.onDone = p.onDone; this.t = 0; this.choice = 0; this.result = null;
    this.bgDim = p.dim ?? 0.0; this.silence = 0;
    this.startLine();
  },
  startLine() {
    const L = this.lines[this.i];
    this.t = 0; this.shown = 0; this.done = false; this.choice = 0; this.lastBlip = 0;
    this.silence = L.pause || 0;
    this.full = String(L.text || '');
    this.plain = stripMarkup(this.full);
    announce((SPEAKERS[L.who] ? SPEAKERS[L.who].name + ': ' : '') + this.plain);
    if (L.sfx) Audio2.sfx(L.sfx);
    if (L.onShow) L.onShow();
  },
  update(dt) {
    const L = this.lines[this.i];
    if (this.silence > 0) { this.silence -= dt; return; }
    this.t += dt;
    const speed = 42 * Game.settings.dialogSpeed * (Input.down('fast') ? 3 : 1);
    if (!this.done) {
      const prev = Math.floor(this.shown);
      this.shown = Math.min(this.plain.length, this.shown + speed * dt);
      const cur = Math.floor(this.shown);
      if (cur > prev) {
        const ch = this.plain[cur - 1];
        const sp = SPEAKERS[L.who];
        if (sp && sp.voice && ch && ch !== ' ' && (cur % 2 === 0)) Audio2.sfx('voice', { voice: sp.voice, vol: 0.7 });
        if (ch === '.' || ch === '?' || ch === '!') this.silence = 0.12 / Game.settings.dialogSpeed;
      }
      if (this.shown >= this.plain.length) this.done = true;
    }
    const adv = Input.pressed('confirm') || Input.pressed('jump') || Input.pressed('interact') || (Input.pointer.pressed && !L.choices);
    if (Input.pressed('skip') && !L.choices && !L.noSkip) { this.done = true; this.shown = this.plain.length; this.next(); return; }
    if (L.choices) {
      if (!this.done) { if (adv) { this.done = true; this.shown = this.plain.length; } return; }
      return; // la elección la gestiona Gui en render
    }
    if (adv) {
      if (!this.done) { this.done = true; this.shown = this.plain.length; }
      else this.next();
    } else if (this.done && Game.settings.autoAdvance) { this.autoT = (this.autoT || 0) + dt; if (this.autoT > 1.6 + this.plain.length * 0.03) { this.autoT = 0; this.next(); } }
  },
  next(choiceIdx) {
    const L = this.lines[this.i];
    if (choiceIdx !== undefined) { this.result = choiceIdx; if (L.onChoose) L.onChoose(choiceIdx); }
    Audio2.sfx('soft', { vol: 0.4 });
    this.i++;
    if (this.i >= this.lines.length) { Game.pop(); this.onDone && this.onDone(this.result); }
    else this.startLine();
  },
  render(g) {
    const L = this.lines[this.i];
    if (!L) return;
    if (this.bgDim) fdither(g, 0, 0, W, H, '#05030f', this.bgDim);
    const sp = SPEAKERS[L.who] || SPEAKERS.narr;
    const big = Game.settings.textScale > 1;
    const boxH = big ? 104 : 86, boxY = H - boxH - 6;
    const side = L.side || (['amaya', 'kiru'].includes(L.who) ? 'left' : 'right');
    const hasP = sp.portrait && L.portrait !== false;
    // retrato grande sobre la caja
    if (hasP) {
      const talking = !this.done && (Math.floor(this.t * 9) % 2 === 0);
      const pc = Portraits.get(sp.portrait, L.expr || 'neutral', talking ? 1 : 0, (Math.floor(Game.time * 0.4) % 7 === 0) && (Game.time % 2.5) < 0.12);
      const px = side === 'left' ? 10 : W - 10 - 128;
      const py = boxY - 128 + 34;
      g.drawImage(pc, px, py);
    }
    UIK.panel(g, 6, boxY, W - 12, boxH, L.who === 'mirage' ? 'mirage' : L.who === 'limen' ? 'limen' : L.who === 'mosaico' ? 'mosaic' : 'dialog');
    const tx = hasP && side === 'left' ? 146 : 16;
    const tw = hasP ? W - 12 - 150 : W - 36;
    // placa de nombre
    if (sp.name) {
      const nw = FONTS.main.measure(sp.name) + 16;
      const nx = hasP && side === 'left' ? 140 : (hasP ? W - 146 - nw : 14);
      frect(g, nx, boxY - 9, nw, 13, '#0a0718'); frect(g, nx + 1, boxY - 8, nw - 2, 11, sp.color);
      fdither(g, nx + 1, boxY - 8, nw - 2, 5, '#ffffff', 0.25);
      drawText(g, sp.name, nx + nw / 2, boxY - 6, { align: 'center', color: '#0a0718' });
    }
    const opts = { color: '#fffaf0', shadow: '#0a0718', scale: big ? 1 : 1 };
    drawTextBlock(g, this.full, tx, boxY + 12, tw, Object.assign({ max: Math.floor(this.shown), lineH: big ? 13 : 11 }, opts));
    if (L.choices && this.done) {
      Gui.begin();
      const n = L.choices.length;
      const cw = Math.min(280, (W - 40) / Math.min(n, 2) - 8);
      let cy = boxY - 8 - n * 22;
      L.choices.forEach((c, k) => {
        const by = cy + k * 22;
        UIK.panel(g, W / 2 - cw / 2 - 4, by - 2, cw + 8, 22, 'glass');
        if (Gui.button(g, 'ch' + k, W / 2 - cw / 2, by, cw, 18, c, { style: 'choice' })) this.next(k);
      });
      Gui.end();
    } else if (this.done) {
      const bx = W - 22, by = boxY + boxH - 12 + Math.round(Math.sin(Game.time * 6));
      frect(g, bx, by, 7, 2, '#ffe14d'); frect(g, bx + 1, by + 2, 5, 1, '#ffe14d'); frect(g, bx + 2, by + 3, 3, 1, '#ffe14d'); fpx(g, bx + 3, by + 4, '#ffe14d');
    }
    drawText(g, 'X: saltar', W - 16, boxY + 4, { font: 'tiny', color: '#5a5e80', align: 'right' });
  },
};

/** Muestra diálogo y devuelve promesa con el resultado */
function talk(lines, opts = {}) {
  return new Promise((res) => { Game.push(DialogueScene, Object.assign({ lines: lines.map(normLine), onDone: res }, opts)); });
}
function normLine(l) {
  if (Array.isArray(l)) { const [who, expr, text, extra] = l; return Object.assign({ who, expr, text }, extra || {}); }
  return l;
}

TESTS.portraits = {
  enter() {},
  update() {},
  render(g) {
    frect(g, 0, 0, W, H, '#2a2a5a');
    const q = new URLSearchParams(location.search);
    const ids = (q.get('ids') || 'amaya,naira,dante,eliana,kiru').split(',');
    const ex = (q.get('ex') || 'neutral').split(',');
    let i = 0;
    for (const id of ids) for (const e of ex) {
      const c = Portraits.get(id, e, q.get('talk') ? 1 : 0);
      const x = (i % 5) * 128, y = Math.floor(i / 5) * 128;
      g.drawImage(c, x, y); drawText(g, id + ' ' + e, x + 4, y + 118, { font: 'tiny', color: '#fff', shadow: '#000' });
      i++;
    }
  },
};
