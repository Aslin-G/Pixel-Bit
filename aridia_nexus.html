/* ---------- RNG determinista (mulberry32) ---------- */

  r.chance = (p) => r() < p;

    }

  /** Relleno de polígono por líneas de barrido */
  poly(pts, c) {
    const cu = typeof c === 'string' ? U(c) : c;
    let minY = Infinity, maxY = -Infinity;
    for (const p of pts) { minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]); }
    minY = Math.max(0, Math.floor(minY)); maxY = Math.min(this.h - 1, Math.ceil(maxY));
    const xs = [];
    for (let y = minY; y <= maxY; y++) {
      xs.length = 0; const sy = y + 0.5;
      for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        const [xi, yi] = pts[i], [xj, yj] = pts[j];
        if ((yi > sy) !== (yj > sy)) xs.push(xi + (sy - yi) / (yj - yi) * (xj - xi));
      }
      xs.sort((a, b) => a - b);
      for (let k = 0; k + 1 < xs.length; k += 2) {
        const xa = Math.max(0, Math.round(xs[k])), xb = Math.min(this.w - 1, Math.round(xs[k + 1]) - 1);
        for (let x = xa; x <= xb; x++) this.data[y * this.w + x] = cu;
      }
    }
  }
  /** Rectángulo tramado: fracción t del color b sobre a (Bayer 4x4) */
  dither(x, y, w, h, a, b, t) {
    const au = a == null ? null : (typeof a === 'string' ? U(a) : a), bu = typeof b === 'string' ? U(b) : b;
    for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) {
      if (bayer4(xx, yy) < t) this.set(xx, yy, bu); else if (au != null) this.set(xx, yy, au);
    }
  }
  /** Gradiente vertical por rampa con transiciones tramadas */
  vgrad(x, y, w, h, ramp, t0 = 0, t1 = 1, strength = 1) {
    for (let yy = 0; yy < h; yy++) {
      const t = lerp(t0, t1, h <= 1 ? 0 : yy / (h - 1));
      for (let xx = 0; xx < w; xx++) this.set(x + xx, y + yy, U(rampDither(ramp, t, x + xx, y + yy, strength)));
    }
  }
  /** Copia otro buffer (respeta transparencia) */
  blit(src, dx, dy, flip = false) {
    for (let y = 0; y < src.h; y++) for (let x = 0; x < src.w; x++) {
      const c = src.data[y * src.w + (flip ? src.w - 1 - x : x)];
      if (c >>> 24) this.set(dx + x, dy + y, c);
    }
  }
  /** Contorno exterior: píxel transparente vecino de opaco → color (o función del vecino) */
  outline(color, diag = false) {
    const w = this.w, h = this.h, d = this.data, out = new Uint32Array(d);
    const fixed = typeof color === 'string' ? U(color) : color;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x;
      if (d[i] >>> 24) continue;
      let nb = 0;
      if (x > 0 && d[i - 1] >>> 24) nb = d[i - 1];
      else if (x < w - 1 && d[i + 1] >>> 24) nb = d[i + 1];
      else if (y > 0 && d[i - w] >>> 24) nb = d[i - w];
      else if (y < h - 1 && d[i + w] >>> 24) nb = d[i + w];
      else if (diag) {
        if (x > 0 && y > 0 && d[i - w - 1] >>> 24) nb = d[i - w - 1];
        else if (x < w - 1 && y > 0 && d[i - w + 1] >>> 24) nb = d[i - w + 1];
        else if (x > 0 && y < h - 1 && d[i + w - 1] >>> 24) nb = d[i + w - 1];
        else if (x < w - 1 && y < h - 1 && d[i + w + 1] >>> 24) nb = d[i + w + 1];
      }
      if (nb) out[i] = typeof color === 'function' ? color(nb) : fixed;
    }
    d.set(out);
  }
  /** Reemplaza un color por otro */
  swap(fromU, toU) { const d = this.data; for (let i = 0; i < d.length; i++) if (d[i] === fromU) d[i] = toU; }
  toCanvas(c) {
    c = c || makeCanvas(this.w, this.h);
    c.g.putImageData(this.img, 0, 0);
    return c;
  }
}

/** Oscurecimiento hacia el contorno: dado un color u32 retorna versión muy oscura con tono violeta */
const _darkCache = new Map();
function darkOf(u, amt = -0.75) {
  const k = u + '|' + amt;
  let v = _darkCache.get(k);
  if (v === undefined) { v = U(shade(u32ToHex(u), amt)); _darkCache.set(k, v); }
  return v;
}

/** Crea un sprite desde mapa de caracteres con paleta {char:hex} */
function spriteFromMap(rows, pal, scale = 1) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const pb = new PixelBuffer(w * scale, h * scale);
  for (let y = 0; y < h; y++) for (let x = 0; x < rows[y].length; x++) {
    const ch = rows[y][x];
    const col = pal[ch];
    if (col) pb.rect(x * scale, y * scale, scale, scale, col);
  }
  return pb;
}

/** Dibuja rectángulo en contexto con coordenadas enteras */
function frect(g, x, y, w, h, col) { g.fillStyle = col; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function fpx(g, x, y, col) { g.fillStyle = col; g.fillRect(Math.round(x), Math.round(y), 1, 1); }
/** Línea de píxeles en contexto (Bresenham) */
function fline(g, x0, y0, x1, y1, col) {
  g.fillStyle = col;
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy, guard = 0;
  for (; ;) {
    g.fillRect(x0, y0, 1, 1);
    if ((x0 === x1 && y0 === y1) || ++guard > 4000) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
/** Círculo relleno pixelado en contexto */
function fdisc(g, cx, cy, r, col) {
  g.fillStyle = col;
  const ri = Math.ceil(r);
  for (let y = -ri; y <= ri; y++) {
    const hw = Math.floor(Math.sqrt(Math.max(0, r * r - (y + 0.5) * (y + 0.5)) ) + 0.5);
    if (hw > 0) g.fillRect(Math.round(cx) - hw, Math.round(cy) + y, hw * 2, 1);
  }
}
/** Rectángulo tramado en contexto (patrón cacheado) */
const _patCache = new Map();
function ditherPattern(g, col, level) {
  const lv = clamp(Math.round(level * 16), 0, 16);
  const k = col + '|' + lv;
  let p = _patCache.get(k);
  if (!p) {
    const c = makeCanvas(4, 4);
    for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) if (BAYER4[y * 4 + x] < lv / 16) { c.g.fillStyle = col; c.g.fillRect(x, y, 1, 1); }
    p = g.createPattern(c, 'repeat');
    _patCache.set(k, p);
  }
  return p;
}
function fdither(g, x, y, w, h, col, level) {
  if (level <= 0) return;
  if (level >= 1) { frect(g, x, y, w, h, col); return; }
  g.fillStyle = ditherPattern(g, col, level);
  g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
/** Elipse tramada (sombras discretizadas) */
function fshadow(g, cx, cy, rx, ry, col = 'rgba(20,13,38,1)', level = 0.5) {
  g.fillStyle = ditherPattern(g, col, level);
  for (let y = -ry; y <= ry; y++) {
    const hw = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry + 0.01))));
    if (hw > 0) g.fillRect(Math.round(cx - hw), Math.round(cy + y), hw * 2, 1);
  }
}

class BitmapFont {

    this.map = opts.map || {};

    const entries = [];
    for (const ch in src) entries.push([ch, src[ch], false]);
    if (opts.accented) for (const ch in opts.accented) {
      const [rows, up] = this._compose(src, opts.accented[ch]);
      entries.push([ch, rows, up]);
    }

    for (const [ch, rows, up] of entries) { const w = Math.max(...rows.map(r => r.length)); this.glyphs.set(ch, { x: ax, w, rows, up }); ax += w + 1; }

    this.atlas.g.fillStyle = '#ffffff';
    for (const [, gl] of this.glyphs) {
      const off = gl.up ? 0 : this.top;
      gl.rows.forEach((row, ry) => { for (let i = 0; i < row.length; i++) if (row[i] === '#') this.atlas.g.fillRect(gl.x + i, ry + off, 1, 1); });
    }

  }
  /** Compone glifo acentuado; retorna [filas, esMayúsculaConFilasExtra] */
  _compose(src, [base, accKey]) {
    const b = src[base];
    const acc = ACC_MARK[accKey];
    const aw = acc[0].length;
    let w = b[0].length;
    const isUpper = base !== 'ı' && base === base.toUpperCase();
    let rows = b.map(r => r);
    if (w < aw) { // ensancha glifos estrechos (í)
      const pad = aw - w; rows = rows.map(r => r + '.'.repeat(pad)); w = aw;
    }
    const off = Math.max(0, Math.floor((w - aw) / 2) + (accKey === '´' && w > aw ? 1 : 0));
    const accRows = acc.map(r => { const row = '.'.repeat(w).split(''); for (let k = 0; k < r.length; k++) if (r[k] === '#' && off + k < w) row[off + k] = '#'; return row.join(''); });
    if (isUpper) return [accRows.concat(rows), true];
    const out = rows.slice();
    for (let i = 0; i < 2; i++) {
      const row = (out[i] || '.'.repeat(w)).split('');
      for (let k = 0; k < w; k++) if (accRows[i][k] === '#') row[k] = '#';
      out[i] = row.join('');

  }

    if (this.upper) ch = this.map[ch] || ch.toUpperCase();
    else ch = this.map[ch] || ch;
    return this.glyphs.get(ch) || this.glyphs.get('?');
  }
  tint(col) {
    let c = this.tints.get(col);

}

/** Elimina marcado {x} de color */
function stripMarkup(t) { return String(t).replace(/\{[a-z\/]\}/g, ''); }

// La fuente principal usa 11 filas: 2 para acentos de mayúscula + 9 de glifo.
const FONTS = {};

/** Separa texto con marcado en segmentos {text,color} */
function parseRich(text, baseColor) {
  const out = [];
  let col = baseColor;
  const re = /\{([a-z\/])\}/g;
  let last = 0, m;
  const s = String(text);
  while ((m = re.exec(s))) {
    if (m.index > last) out.push({ t: s.slice(last, m.index), c: col });
    col = m[1] === '/' ? baseColor : (TEXT_COLORS[m[1]] || baseColor);
    last = re.lastIndex;
  }
  if (last < s.length) out.push({ t: s.slice(last), c: col });
  return out;
}

/** Envuelve texto con marcado a un ancho máximo → arreglo de líneas (conservan marcado) */
function wrapText(text, maxW, font = 'main') {
  const f = FONTS[font];
  const paragraphs = String(text).split('\n');
  const lines = [];
  for (const para of paragraphs) {
    const words = para.split(' ');
    let line = '', lineW = 0;
    let carry = ''; // código de color activo para continuar en la siguiente línea
    for (let wi = 0; wi < words.length; wi++) {
      const word = words[wi];
      const ww = f.measure(word);
      const sp = line ? f.charW(' ') : 0;
      if (line && lineW + sp + ww > maxW) {
        lines.push(line);
        line = carry + word; lineW = ww;
      } else { line += (line ? ' ' : '') + word; lineW += sp + ww + (line === word ? 0 : 0); }
      const codes = word.match(/\{[a-z\/]\}/g);
      if (codes) { const lastc = codes[codes.length - 1]; carry = lastc === '{/}' ? '' : lastc; }
    }
    lines.push(line);
  }
  return lines;
}

/**
 * Dibuja texto pixel. opts: color, shadow, outline, align('left'|'center'|'right'), font, scale, max (nº de caracteres visibles)

function drawText(g, text, x, y, opts = {}) {
  const font = FONTS[opts.font || 'main'];
  const color = opts.color || '#fffaf0';
  const scale = opts.scale || 1;
  const segs = parseRich(text, color);
  const totalW = font.measure(text) * scale;
  let cx = Math.round(x);
  if (opts.align === 'center') cx = Math.round(x - totalW / 2);

    cx = startX; shown = 0;

/** Bloque de texto con ajuste de línea; retorna altura usada */
function drawTextBlock(g, text, x, y, maxW, opts = {}) {
  const fontName = opts.font || 'main';
  const f = FONTS[fontName];

  lines.forEach((ln, i) => {

/** Texto de título: escalado, relleno en degradado por filas, contorno y sombra profunda */
function drawTitleText(g, text, x, y, scale, ramp, opts = {}) {
  const font = FONTS.main;

}

  /* ---------- ambiente continuo ---------- */

    this.ambNodes.storm = mk('bandpass', 260, 0.7);
    const hum = c.createOscillator(); hum.type = 'sawtooth'; hum.frequency.value = 55;
    const hf = c.createBiquadFilter(); hf.type = 'lowpass'; hf.frequency.value = 180;

  setAmbience(o) { Object.assign(this.ambTarget, { sea: 0, wind: 0, hum: 0, birds: 0, storm: 0, bubbles: 0 }, o); },
  updateAmbience(dt) {
    if (!this.ok) return;
    this._ambT += dt;
    const t = this.ctx.currentTime, a = this.ambTarget, T = this._ambT;
    const wave = 0.55 + 0.45 * Math.sin(T * 0.9) * Math.sin(T * 0.37 + 1);

    this.ambNodes.storm.gn.gain.setTargetAtTime(a.storm * 0.35 * (0.6 + 0.4 * gust), t, 0.5);
    this.ambNodes.hum.gn.gain.setTargetAtTime(a.hum * 0.05, t, 0.4);

  },
  /* ---------- música ---------- */
  playMusic(name) {
    if (this.trackName === name) return;
    if (!this.ok) { this._pendingTrack = name; this.trackName = null; return; }
    this.trackName = name;
    const tr = MUSIC[name];
    if (!tr) { this.track = null; return; }

    this.track = Object.assign({}, tr, { melTokens: mel, chordObjs: tr.chords.map(parseChord), root: NOTE_I[tr.key] });

  stopMusic() { this.track = null; this.trackName = null; },
  _schedule() {

  _inst(name, t, midi, dur, vel) {
    const f = mtof(midi), dest = this.music;

      case 'marimba': this.tone(t, f, dur, { type: 'sine', gain: 0.16 * vel, release: Math.min(0.6, dur + 0.25), dest }); this.tone(t, f * 4, 0.03, { type: 'triangle', gain: 0.03 * vel, dest }); break;

      case 'lead': this.tone(t, f, dur, { type: 'square', wave: this.pulse, gain: 0.05 * vel, release: dur + 0.08, vib: 3, dest }); break;
      case 'bass': this.tone(t, f, dur, { type: 'triangle', gain: 0.2 * vel, release: dur + 0.05, dest }); break;
      case 'pad': {

  },
  _drum(kind, t, vel = 1) {
    const dest = this.music;
    switch (kind) {
      case 'kick': this.tone(t, 140, 0.18, { type: 'sine', gain: 0.3 * vel, freqEnd: 45, dest }); break;
      case 'snare': this.noise(t, 0.14, { type: 'bandpass', freq: 1800, q: 0.7, gain: 0.1 * vel, dest }); break;
      case 'hat': this.noise(t, 0.04, { type: 'highpass', freq: 7000, gain: 0.05 * vel, dest }); break;
      case 'shaker': this.noise(t, 0.06, { type: 'bandpass', freq: 6000, q: 1.5, gain: 0.05 * vel, attack: 0.015, dest }); break;

  _playStep(step, t, sd) {
    const tr = this.track;
    const bar = Math.floor(step / 16), s = step % 16;
    const nBars = tr.chordObjs.length;
    const ch = tr.chordObjs[bar % nBars];
    const baseRoot = 36 + ch.root; // C2…
    const intensity = this.intensity;
    // melodía (corcheas)
    if (s % 2 === 0) {
      const mi = (step / 2) % tr.melTokens.length;
      const tok = tr.melTokens[mi];
      if (tok && tok !== '.' && tok !== '-') {
        let len = 1; while (tr.melTokens[(mi + len) % tr.melTokens.length] === '-' && len < 8) len++;
        const midi = noteToMidi(tok);
        if (midi) this._inst(tr.lead, t, midi, sd * 2 * len * 0.9, 0.9);
      }
    }
    // pad al inicio de compás
    if (tr.pad && s === 0) ch.ints.slice(0, 4).forEach((iv) => this._inst('pad', t, 60 + ((ch.root + iv) % 12) - (ch.root + iv >= 12 ? 0 : 0), sd * 16, 0.8));
    // bajo
    const bs = tr.bassStyle;
    if (bs === 'roots' && (s === 0 || s === 8)) this._inst('bass', t, baseRoot + (s === 8 ? 7 : 0), sd * 6, 1);
    if (bs === 'pulse' && s % 4 === 0) this._inst('bass', t, baseRoot + (s === 12 ? 12 : 0), sd * 3, 0.8);
    if (bs === 'cumbia' && (s === 0 || s === 6 || s === 8 || s === 14)) this._inst('bass', t, baseRoot + (s === 8 || s === 14 ? 7 : 0), sd * 2, 1);
    if (bs === 'drone' && s === 0) this._inst('bass', t, baseRoot, sd * 15, 0.7);
    if (bs === 'drive' && s % 2 === 0) this._inst('bass', t, baseRoot + (s % 8 === 6 ? 12 : 0), sd * 1.5, 0.9);
    // arpegio suave
    if (tr.lead !== 'lead' && s % 4 === 2 && tr.drums !== 'none') {
      const iv = ch.ints[(s / 4 | 0) % ch.ints.length];
      this._inst('pluck', t, 60 + ch.root + iv, sd * 2, 0.35);
    }
    // percusión
    const d = tr.drums;
    if (d === 'cumbia') {
      if (s % 2 === 0) this._drum('shaker', t, s % 4 === 2 ? 1 : 0.6);
      if (s === 0 || s === 8) this._drum('kick', t, 0.7);
      if (s === 4 || s === 12) this._drum('conga', t);
      if (s === 6 || s === 14) this._drum('congaHi', t, 0.8);
      if (s === 3 || s === 10) this._drum('clave', t, 0.7);
    } else if (d === 'tech') {
      if (s % 8 === 0) this._drum('kick', t, 0.6);
      if (s % 4 === 2) this._drum('hat', t, 0.7);
      if (s === 12 && bar % 2 === 1) this._drum('snare', t, 0.5);
    } else if (d === 'drive') {
      if (s % 4 === 0) this._drum('kick', t, 0.8 * intensity);
      if (s % 2 === 1) this._drum('hat', t, 0.6);
      if (s === 4 || s === 12) this._drum('snare', t, 0.7);
    } else if (d === 'soft') {
      if (s === 0) this._drum('kick', t, 0.35);
      if (s % 4 === 2) this._drum('shaker', t, 0.4);
    }
  },
};

const DEFAULT_BINDINGS = {
  left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'], up: ['KeyW', 'ArrowUp'], down: ['KeyS', 'ArrowDown'],
  jump: ['Space', 'KeyK'], interact: ['KeyE', 'KeyJ'], tool: ['KeyQ', 'KeyL'], reset: ['KeyR'], lens: ['KeyN'],
  codex: ['KeyC'], map: ['KeyM'], hint: ['KeyH'], data: ['Tab'], pause: ['Escape', 'KeyP'],
  confirm: ['Enter', 'Space', 'KeyE', 'NumpadEnter'], cancel: ['Escape', 'Backspace'],
  next: ['Tab'], uiLeft: ['ArrowLeft', 'KeyA'], uiRight: ['ArrowRight', 'KeyD'], uiUp: ['ArrowUp', 'KeyW'], uiDown: ['ArrowDown', 'KeyS'],
  skip: ['KeyX'], teacher: ['F9'], fast: ['ShiftLeft', 'ShiftRight'],

const ACTION_LABELS = {
  left: 'Izquierda', right: 'Derecha', up: 'Subir / contextual', down: 'Bajar', jump: 'Saltar', interact: 'Interactuar', tool: 'Herramienta activa',
  reset: 'Reiniciar simulación', lens: 'Lente Nexo', codex: 'Atlas del Nexo', map: 'Mapa', hint: 'Pista', data: 'Datos', pause: 'Pausa',
};
const KEY_NAMES = { Space: 'ESPACIO', Enter: 'ENTER', Escape: 'ESC', Tab: 'TAB', Backspace: 'BORRAR', ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓', ShiftLeft: 'SHIFT', ShiftRight: 'SHIFT' };

const Input = {
  bindings: deepClone(DEFAULT_BINDINGS),
  keys: new Set(), justDown: new Set(), justUp: new Set(),
  virt: new Set(), virtPrev: new Set(), // botones táctiles virtuales
  pad: new Set(), padPrev: new Set(),

  listeners: [],
  init(canvas) {
    this.canvas = canvas;

      if (['Tab', 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Backspace', 'F9'].includes(e.code)) e.preventDefault();

  down(action) {

    for (const gp of gps) {
      if (!gp) continue;
      const b = (i) => gp.buttons[i] && gp.buttons[i].pressed;
      const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
      if (ax < -0.4 || b(14)) { this.pad.add('left'); this.pad.add('uiLeft'); }
      if (ax > 0.4 || b(15)) { this.pad.add('right'); this.pad.add('uiRight'); }
      if (ay < -0.5 || b(12)) { this.pad.add('up'); this.pad.add('uiUp'); }
      if (ay > 0.5 || b(13)) { this.pad.add('down'); this.pad.add('uiDown'); }
      if (b(0)) { this.pad.add('jump'); this.pad.add('confirm'); }
      if (b(1)) { this.pad.add('cancel'); this.pad.add('tool'); }
      if (b(2)) this.pad.add('interact');
      if (b(3)) this.pad.add('lens');
      if (b(9)) this.pad.add('pause');
      if (b(8)) this.pad.add('codex');
      if (b(4)) this.pad.add('hint');
      if (b(5)) this.pad.add('next');
      if (this.pad.size) this.lastDevice = 'gamepad';
    }
  },
  /** Llamar al final de cada paso de actualización */
  endStep() {
    this.justDown.clear(); this.justUp.clear(); this.typedKeys.length = 0;
    this.virtPrev = new Set(this.virt);
    const p = this.pointer; p.pressed = false; p.released = false; p.moved = false; p.wheel = 0;
    this.anyKeyPressed = false;
  },
  anyConfirm() { return this.pressed('confirm') || this.pointer.pressed; },
  consumePointer() { this.pointer.pressed = false; this.pointer.released = false; },
};

/* ---------- Controles táctiles virtuales ---------- */
const Touch = {
  owners: new Map(), // pointerId → acción
  layout() {
    // botones en coordenadas lógicas
    const s = Game.settings.touchScale || 1;
    const r = 15 * s;
    return [
      { a: 'left', x: 34, y: H - 40, r, icon: '←' },
      { a: 'right', x: 34 + 2.3 * r, y: H - 40, r, icon: '→' },
      { a: 'up', x: 34 + 1.15 * r, y: H - 40 - 2.1 * r, r: r * 0.8, icon: '↑' },
      { a: 'jump', x: W - 36, y: H - 42, r: r * 1.1, icon: 'A' },
      { a: 'interact', x: W - 36 - 2.4 * r, y: H - 36, r, icon: 'E' },
      { a: 'tool', x: W - 36 - 1.1 * r, y: H - 42 - 2.2 * r, r: r * 0.85, icon: 'Q' },
      { a: 'lens', x: W - 22, y: 64, r: 11, icon: 'N' },
      { a: 'pause', x: W - 22, y: 22, r: 11, icon: 'II' },
      { a: 'hint', x: W - 22, y: 98, r: 10, icon: '?' },
    ];
  },
  enabledFor() { const sc = Game.top(); return Input.touchMode && sc && sc.touchControls; },
  hit(x, y, id) {
    if (!this.enabledFor()) return false;
    for (const b of this.layout()) {
      if (dist(x, y, b.x, b.y) <= b.r + 4) { this.owners.set(id, b.a); Input.virt.add(b.a); if (b.a === 'pause') Input.virt.add('cancel'); if (b.a === 'jump') Input.virt.add('confirm'); return true; }
    }
    return false;
  },
  move(x, y, id) {
    if (!this.owners.has(id)) return;
    const prev = this.owners.get(id);
    if (prev !== 'left' && prev !== 'right') return;
    // permite deslizar entre izquierda y derecha
    for (const b of this.layout()) if ((b.a === 'left' || b.a === 'right') && dist(x, y, b.x, b.y) <= b.r + 8 && b.a !== prev) {
      Input.virt.delete(prev); Input.virt.add(b.a); this.owners.set(id, b.a);
    }
  },
  release(id) {
    const a = this.owners.get(id);
    if (a) {
      this.owners.delete(id);
      let still = false; for (const v of this.owners.values()) if (v === a) still = true;
      if (!still) { Input.virt.delete(a); if (a === 'pause') Input.virt.delete('cancel'); if (a === 'jump') Input.virt.delete('confirm'); }
    }
  },
  render(g) {
    if (!this.enabledFor()) return;
    for (const b of this.layout()) {
      const on = Input.virt.has(b.a);
      fdisc(g, b.x, b.y + 2, b.r, 'rgba(20,13,38,0.45)');
      fdisc(g, b.x, b.y, b.r, on ? 'rgba(86,229,255,0.55)' : 'rgba(255,250,240,0.18)');
      fdisc(g, b.x, b.y, b.r - 2, on ? 'rgba(32,214,199,0.5)' : 'rgba(20,13,38,0.35)');
      drawText(g, b.icon, b.x, b.y - 4, { align: 'center', color: on ? '#140d26' : '#fffaf0' });
    }
  },
};

const DEFAULT_SETTINGS = {
  music: 0.6, sfx: 0.8, ambience: 0.8,
  textScale: 1, dialogSpeed: 1, autoAdvance: false,
  reduceFlash: false, reduceShake: false, highContrast: false, cbPalette: false,
  noTimeLimit: false, touch: 'auto', touchScale: 1, showFps: false, subtitles: true,
  bindings: null,
};

const Game = {
  canvas: null, g: null, scenes: [], time: 0, frame: 0, dt: 1 / 60, fps: 60,
  settings: deepClone(DEFAULT_SETTINGS),
  fade: { a: 0, target: 0, speed: 2, color: '#140d26', cb: null },
  flash: { a: 0, color: '#ffffff' },
  toasts: [],
  init() {
    this.canvas = document.getElementById('game');
    this.g = this.canvas.getContext('2d', { alpha: false });
    this.g.imageSmoothingEnabled = false;
    initFonts();
    this.loadSettings();
    Input.init(this.canvas);
    Input.loadBindings(this.settings.bindings);
    this.resize();
    window.addEventListener('resize', () => this.resize());
    let last = nowMs(), acc = 0, fpsAcc = 0, fpsN = 0;
    const loop = () => {
      const t = nowMs();
      let el = (t - last) / 1000; last = t;
      if (el > 0.25) el = 0.25;
      acc += el; fpsAcc += el; fpsN++;
      if (fpsAcc > 0.5) { this.fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
      let steps = 0;
      while (acc >= this.dt && steps < 5) {
        this.update(this.dt);
        acc -= this.dt; steps++;
      }
      if (steps >= 5) acc = 0;
      this.render();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  },
  resize() {
    const ww = window.innerWidth, wh = window.innerHeight;
    let s = Math.min(ww / W, wh / H);
    if (s >= 1) { const si = Math.floor(s); if (s - si < 0.35 || si >= 3) s = si; }
    this.canvas.style.width = Math.floor(W * s) + 'px';
    this.canvas.style.height = Math.floor(H * s) + 'px';
    this.viewScale = s;
  },
  loadSettings() {
    const s = SaveManager.readRaw('aridiaNexusSettings');
    if (s) Object.assign(this.settings, s);
  },
  saveSettings() { this.settings.bindings = Input.bindings; SaveManager.writeRaw('aridiaNexusSettings', this.settings); Audio2.applyVolumes(); },
  top() { return this.scenes[this.scenes.length - 1]; },
  setScene(scene, params) {
    while (this.scenes.length) { const s = this.scenes.pop(); s.exit && s.exit(); }
    this.scenes.push(scene);
    scene.enter && scene.enter(params || {});
  },
  push(scene, params) { this.scenes.push(scene); scene.enter && scene.enter(params || {}); },
  pop() { const s = this.scenes.pop(); s && s.exit && s.exit(); const t = this.top(); t && t.resume && t.resume(); return s; },
  /** Transición con fundido */
  transition(fn, color = '#140d26', speed = 2.5) {
    if (this.fade.busy) return;
    this.fade.busy = true; this.fade.color = color; this.fade.speed = speed; this.fade.target = 1;
    this.fade.cb = () => { fn(); this.fade.target = 0; this.fade.cb = null; setTimeout(() => { this.fade.busy = false; }, 50); };
  },
  doFlash(color = '#ffffff', a = 0.8) { if (this.settings.reduceFlash) a *= 0.25; this.flash.color = color; this.flash.a = a; },
  toast(text, icon = 'info', color = '#56e5ff', dur = 3.2) {
    this.toasts.push({ text, icon, color, t: 0, dur });
    if (this.toasts.length > 4) this.toasts.shift();
    announce(stripMarkup(text));
  },
  update(dt) {
    this.time += dt; this.frame++;
    Input.pollGamepad();
    if (Input.keyPressed('F9') || (Input.down('fast') && Input.keyPressed('KeyT') && Input.down('reset'))) { /* atajo docente gestionado por escenas */ }
    const top = this.top();
    if (top) {
      // escenas inferiores que piden actualizarse en segundo plano
      for (let i = 0; i < this.scenes.length - 1; i++) { const s = this.scenes[i]; if (s.updateBelow) s.updateBelow(dt); }
      if (!this.fade.busy || this.fade.target === 0) top.update(dt);
    }
    // fundido
    const f = this.fade;
    if (f.a !== f.target) {
      f.a = approach(f.a, f.target, f.speed * dt);
      if (f.a >= 1 && f.cb) f.cb();
    }
    this.flash.a = Math.max(0, this.flash.a - dt * 2.5);
    for (const t of this.toasts) t.t += dt;
    this.toasts = this.toasts.filter(t => t.t < t.dur);
    Audio2.updateAmbience(dt);
    Input.endStep();
  },
  render() {
    const g = this.g;
    g.imageSmoothingEnabled = false;
    g.setTransform(1, 0, 0, 1, 0, 0);
    // escenas: se dibujan desde la más baja opaca
    let start = 0;
    for (let i = this.scenes.length - 1; i >= 0; i--) { if (!this.scenes[i].overlay) { start = i; break; } }
    for (let i = start; i < this.scenes.length; i++) { g.save(); this.scenes[i].render(g); g.restore(); }
    Touch.render(g);
    this.renderToasts(g);
    if (this.flash.a > 0) { g.globalAlpha = this.flash.a; frect(g, 0, 0, W, H, this.flash.color); g.globalAlpha = 1; }
    if (this.fade.a > 0) {
      // fundido tramado (pixel art) en lugar de transparencia suave
      fdither(g, 0, 0, W, H, this.fade.color, this.fade.a);
    }
    if (this.settings.showFps) drawText(g, fmt0(this.fps) + ' FPS', 4, H - 10, { font: 'tiny', color: '#86e36f', shadow: '#140d26' });
  },
  renderToasts(g) {
    let y = 8;
    for (const t of this.toasts) {
      const a = t.t < 0.25 ? t.t / 0.25 : t.t > t.dur - 0.4 ? (t.dur - t.t) / 0.4 : 1;
      const w = Math.min(300, FONTS.main.measure(t.text) + 34);
      const x = Math.round(W / 2 - w / 2 + (1 - a) * 0);
      const yy = Math.round(y - (1 - a) * 12);
      UIK.panel(g, x, yy, w, 18, 'toast', t.color);
      Icons.draw(g, t.icon, x + 5, yy + 2);
      drawText(g, t.text, x + 25, yy + 5, { color: '#fffaf0', shadow: '#140d26' });
      y += 22;
    }
  },
};

let _srLast = '';

/* ---------- Cámara ---------- */
class Camera {
  constructor() { this.x = 0; this.y = 0; this.tx = 0; this.ty = 0; this.shakeT = 0; this.shakeA = 0; this.bounds = { x: 0, y: 0, w: W, h: H }; this.lookAhead = 0; this.zoom = 1; }
  follow(e, dt, opts = {}) {
    const dir = e.facing || 1;
    this.lookAhead = approach(this.lookAhead, dir * (opts.look ?? 40), dt * 60);
    this.tx = e.x - W / 2 + this.lookAhead;
    this.ty = e.y - H * (opts.vy ?? 0.62);
    const k = 1 - Math.pow(0.0008, dt);
    this.x += (this.tx - this.x) * k;
    this.y += (this.ty - this.y) * k * 0.8;
    this.clamp();
  }
  snap(e) { this.x = e.x - W / 2; this.y = e.y - H * 0.62; this.clamp(); }
  clamp() {
    const b = this.bounds;
    this.x = clamp(this.x, b.x, Math.max(b.x, b.x + b.w - W));
    this.y = clamp(this.y, b.y, Math.max(b.y, b.y + b.h - H));
  }
  shake(a, t = 0.3) { if (Game.settings.reduceShake) a *= 0.2; this.shakeA = Math.max(this.shakeA, a); this.shakeT = Math.max(this.shakeT, t); }
  update(dt) { if (this.shakeT > 0) { this.shakeT -= dt; if (this.shakeT <= 0) this.shakeA = 0; } }
  get ox() { return Math.round(this.x + (this.shakeT > 0 ? (Math.random() * 2 - 1) * this.shakeA : 0)); }
  get oy() { return Math.round(this.y + (this.shakeT > 0 ? (Math.random() * 2 - 1) * this.shakeA : 0)); }
}

class Particles {
  constructor(max = 1500) {
    this.max = max; this.n = 0;
    this.x = new Float32Array(max); this.y = new Float32Array(max); this.vx = new Float32Array(max); this.vy = new Float32Array(max);
    this.life = new Float32Array(max); this.maxLife = new Float32Array(max); this.type = new Array(max); this.col = new Array(max); this.seed = new Float32Array(max);
    this.wind = 0; this.windY = 0;
  }
  emit(type, x, y, vx = 0, vy = 0, n = 1, spread = 0) {
    const T = PTYPES[type]; if (!T) return;
    for (let k = 0; k < n; k++) {
      if (this.n >= this.max) return;
      const i = this.n++;
      this.x[i] = x + (spread ? (Math.random() * 2 - 1) * spread : 0); this.y[i] = y + (spread ? (Math.random() * 2 - 1) * spread * 0.5 : 0);
      this.vx[i] = vx + (Math.random() * 2 - 1) * Math.abs(vx * 0.3 + 10) * (spread ? 1 : 0.3);
      this.vy[i] = vy + (Math.random() * 2 - 1) * Math.abs(vy * 0.3 + 10) * (spread ? 1 : 0.3);
      const l = lerp(T.life[0], T.life[1], Math.random());
      this.life[i] = l; this.maxLife[i] = l; this.type[i] = type; this.col[i] = T.cols[(Math.random() * T.cols.length) | 0]; this.seed[i] = Math.random() * 100;
    }
  }
  update(dt) {
    let j = 0;
    for (let i = 0; i < this.n; i++) {
      const T = PTYPES[this.type[i]];
      this.life[i] -= dt;
      if (this.life[i] <= 0) continue;
      let vx = this.vx[i], vy = this.vy[i];
      vy += T.g * dt;
      vx += (this.wind * T.wind - vx * T.drag) * dt * (T.drag > 0 ? 1 : 0);
      if (T.drag === 0) vx += this.wind * T.wind * dt;
      if (T.flutter) vx += Math.sin(Game.time * 4 + this.seed[i]) * 20 * dt, vy += Math.cos(Game.time * 3 + this.seed[i]) * 10 * dt;
      if (T.wobble) vx += Math.sin(Game.time * 9 + this.seed[i]) * 30 * dt;
      if (T.wander) { vx += Math.sin(Game.time * 1.3 + this.seed[i]) * 12 * dt; vy += Math.cos(Game.time * 1.1 + this.seed[i] * 2) * 12 * dt; }
      this.x[j] = this.x[i] + vx * dt; this.y[j] = this.y[i] + vy * dt; this.vx[j] = vx; this.vy[j] = vy;
      this.life[j] = this.life[i]; this.maxLife[j] = this.maxLife[i]; this.type[j] = this.type[i]; this.col[j] = this.col[i]; this.seed[j] = this.seed[i];
      j++;
    }
    this.n = j;
  }
  render(g, ox = 0, oy = 0) {
    for (let i = 0; i < this.n; i++) {
      const T = PTYPES[this.type[i]];
      const x = Math.round(this.x[i] - ox), y = Math.round(this.y[i] - oy);
      if (x < -4 || y < -4 || x > W + 4 || y > H + 4) continue;
      const lf = this.life[i] / this.maxLife[i];
      if (T.fade && lf < 0.4 && ((x + y + (Game.frame >> 2)) & 1)) continue;
      if (T.sparkle && ((Game.frame + (this.seed[i] * 10 | 0)) % 20 < 3)) { g.fillStyle = '#ffffff'; g.fillRect(x - 1, y, 3, 1); g.fillRect(x, y - 1, 1, 3); continue; }
      g.fillStyle = this.col[i];
      if (T.streak) { const len = Math.min(8, Math.max(2, Math.abs(this.vx[i]) * 0.04 + Math.abs(this.vy[i]) * 0.02)); if (Math.abs(this.vy[i]) > Math.abs(this.vx[i])) g.fillRect(x, y, 1, len | 0); else g.fillRect(x, y, len | 0, 1); continue; }
      if (T.ring) { g.fillRect(x - 1, y, 1, 1); g.fillRect(x + 1, y, 1, 1); g.fillRect(x, y - 1, 1, 1); g.fillRect(x, y + 1, 1, 1); continue; }
      const s = T.size * (lf < 0.3 && T.size > 1 ? 0.5 : 1);
      const ss = Math.max(1, Math.round(s));
      g.fillRect(x, y, ss, ss);
      if (T.glow && lf > 0.5) { g.globalAlpha = 0.35; g.fillRect(x - 1, y, ss + 2, ss); g.fillRect(x, y - 1, ss, ss + 2); g.globalAlpha = 1; }
    }
  }
  clear() { this.n = 0; }
}

/* ---------- Guardado ---------- */
const SAVE_KEY = 'aridiaNexusSave';
const SAVE_VERSION = 3;
const SaveManager = {
  readRaw(key) { try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : null; } catch (e) { return null; } },
  writeRaw(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); return true; } catch (e) { return false; } },
  exists() { return !!this.readRaw(SAVE_KEY); },
  load() { const s = this.readRaw(SAVE_KEY); if (!s || s.version > SAVE_VERSION) return null; return s; },
  save(state) { state.version = SAVE_VERSION; state.timestamp = Date.now(); return this.writeRaw(SAVE_KEY, state); },
  wipe() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } },
};

/* ---------- Temporizadores simples ---------- */
class Timers {
  constructor() { this.list = []; }
  after(t, fn) { this.list.push({ t, fn }); }
  update(dt) { for (const it of this.list) { it.t -= dt; if (it.t <= 0 && !it.done) { it.done = true; it.fn(); } } this.list = this.list.filter(i => !i.done); }
  clear() { this.list.length = 0; }
}

/* ---------- descarga local de archivos (exportar) ---------- */
function downloadText(filename, text, mime = 'text/plain') {
  try {
    const blob = new Blob([text], { type: mime + ';charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  } catch (e) { Game.toast('No se pudo exportar el archivo', 'warn', '#ff4e5d'); }
}

/* ---------- Paneles ---------- */
const PANEL_STYLES = {
  tech: { bg: ['#0e1430', '#121a3c'], edge: '#22bdd0', edge2: '#106884', hi: '#56e5ff', ink: '#070a1c', corner: '#a6f4ff' },
  dialog: { bg: ['#16123a', '#1d1848'], edge: '#eab02a', edge2: '#8a5e14', hi: '#ffe14d', ink: '#0a0718', corner: '#fff08a' },
  paper: { bg: ['#f8e6b8', '#f2d898'], edge: '#a65f30', edge2: '#7e4429', hi: '#fff6d8', ink: '#3a1a10', corner: '#c97c38' },
  alert: { bg: ['#2a0c18', '#3a1020'], edge: '#ff4e5d', edge2: '#a82c40', hi: '#ff9a8a', ink: '#12040a', corner: '#ffc6b4' },
  mirage: { bg: ['#1d0b3a', '#2a1050'], edge: '#e050c8', edge2: '#6a1c94', hi: '#ffd0e8', ink: '#0a0418', corner: '#56e5ff' },
  mosaic: { bg: ['#0e1a2a', '#132438'], edge: '#86e36f', edge2: '#1f854c', hi: '#c2f58e', ink: '#06100a', corner: '#ffe14d' },
  glass: { bg: ['rgba(14,20,48,0.86)', 'rgba(18,26,60,0.86)'], edge: '#3cc0d6', edge2: '#165a7a', hi: '#a6f4ff', ink: '#070a1c', corner: '#c4fbff' },
  toast: { bg: ['#121a3c', '#16204a'], edge: '#56e5ff', edge2: '#106884', hi: '#a6f4ff', ink: '#070a1c', corner: '#ffffff' },
  green: { bg: ['#0b2a22', '#0f3a2c'], edge: '#4ccb70', edge2: '#156647', hi: '#c2f58e', ink: '#04140c', corner: '#ffe14d' },
  limen: { bg: ['#0a2236', '#0e2e48'], edge: '#7ee8f0', edge2: '#1f8aa8', hi: '#ffffff', ink: '#041018', corner: '#b49cff' },
};
const UIK = {
  panel(g, x, y, w, h, style = 'tech', accent = null) {
    const s = PANEL_STYLES[style] || PANEL_STYLES.tech;
    x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
    const edge = accent || s.edge;
    // sombra discretizada
    fdither(g, x + 2, y + 2, w, h, '#05030f', 0.6);
    // contorno exterior
    frect(g, x + 1, y, w - 2, h, s.ink); frect(g, x, y + 1, w, h - 2, s.ink);
    // fondo con gradiente tramado
    frect(g, x + 1, y + 1, w - 2, h - 2, s.bg[0]);
    fdither(g, x + 1, y + 1, w - 2, Math.floor((h - 2) / 2), s.bg[1], 0.5);
    frect(g, x + 1, y + 1, w - 2, Math.max(1, Math.floor((h - 2) / 4)), s.bg[1]);
    // bordes
    frect(g, x + 2, y + 1, w - 4, 1, edge); frect(g, x + 2, y + h - 2, w - 4, 1, s.edge2);
    frect(g, x + 1, y + 2, 1, h - 4, edge); frect(g, x + w - 2, y + 2, 1, h - 4, s.edge2);
    frect(g, x + 3, y + 2, Math.max(0, w - 6), 1, 'rgba(255,255,255,0.08)');
    // esquinas
    if (w > 20 && h > 14) {
      fpx(g, x + 2, y + 2, s.corner); fpx(g, x + w - 3, y + 2, s.corner);
      fpx(g, x + 2, y + h - 3, s.edge2); fpx(g, x + w - 3, y + h - 3, s.edge2);
      if (style === 'tech' || style === 'glass' || style === 'limen') {
        frect(g, x + 4, y + 3, 6, 1, s.hi); frect(g, x + 4, y + 3, 1, 3, s.hi);
        frect(g, x + w - 10, y + h - 4, 6, 1, s.edge); frect(g, x + w - 5, y + h - 6, 1, 3, s.edge);
      }
      if (style === 'dialog') {
        for (const [cx, cy] of [[x + 5, y + 4], [x + w - 6, y + 4], [x + 5, y + h - 5], [x + w - 6, y + h - 5]]) { fpx(g, cx, cy, s.hi); fpx(g, cx + 1, cy + 1, s.edge2); }
      }
      if (style === 'paper') { fdither(g, x + 3, y + 3, w - 6, h - 6, '#e8c47a', 0.12); }
      if (style === 'alert') for (let i = 0; i < w - 8; i += 6) { frect(g, x + 4 + i, y + h - 4, 3, 1, '#ffb83e'); }
      if (style === 'mirage') { const t = Game.time; for (let i = 0; i < 6; i++) fpx(g, x + 4 + ((t * 30 + i * 37) % (w - 8)), y + 1, '#56e5ff'); }
    }
  },
  /** Barra de título de panel */
  header(g, x, y, w, title, style = 'tech', icon = null) {
    const s = PANEL_STYLES[style] || PANEL_STYLES.tech;
    frect(g, x + 3, y + 3, w - 6, 13, s.edge2);
    fdither(g, x + 3, y + 3, w - 6, 6, s.edge, 0.5);
    frect(g, x + 3, y + 15, w - 6, 1, s.ink);
    let tx = x + 8;
    if (icon) { Icons.draw(g, icon, x + 5, y + 3); tx += 14; }
    drawText(g, title, tx, y + 5, { color: style === 'paper' ? '#fff6d8' : '#fffaf0', shadow: s.ink });
  },
  /** Marco decorativo grueso para retratos */
  frame(g, x, y, w, h, col = '#eab02a', col2 = '#8a5e14') {
    frect(g, x - 2, y - 2, w + 4, h + 4, '#0a0718');
    frect(g, x - 1, y - 1, w + 2, h + 2, col);
    frect(g, x, y + h, w + 1, 1, col2); frect(g, x + w, y, 1, h + 1, col2);
  },
  bar(g, x, y, w, h, frac, col, bg = '#0a0c22', segs = 0) {
    frect(g, x, y, w, h, '#05030f'); frect(g, x + 1, y + 1, w - 2, h - 2, bg);
    const fw = Math.round((w - 2) * clamp(frac, 0, 1));
    if (fw > 0) { frect(g, x + 1, y + 1, fw, h - 2, col); frect(g, x + 1, y + 1, fw, 1, shade(col, 0.25)); frect(g, x + 1, y + h - 2, fw, 1, shade(col, -0.3)); }
    if (segs) for (let i = 1; i < segs; i++) frect(g, x + 1 + Math.round(i * (w - 2) / segs), y + 1, 1, h - 2, 'rgba(5,3,15,0.5)');
  },
};

/* ---------- Iconos procedurales 12x12 (contorno automático) ---------- */
const Icons = {
  cache: new Map(),
  defs: {},
  def(name, fn) { this.defs[name] = fn; },
  get(name, scale = 1) {
    const k = name + '@' + scale;
    let c = this.cache.get(k);
    if (c) return c;
    const fn = this.defs[name] || this.defs.info;
    const pb = new PixelBuffer(14, 14);
    fn(pb);
    pb.outline('#140d26');
    c = pb.toCanvas();
    if (scale !== 1) { const s = makeCanvas(14 * scale, 14 * scale); s.g.drawImage(c, 0, 0, 14 * scale, 14 * scale); c = s; }
    this.cache.set(k, c);
    return c;
  },
  draw(g, name, x, y, scale = 1) { g.drawImage(this.get(name, scale), Math.round(x - scale), Math.round(y - scale)); },
};

/* ---------- GUI inmediata ---------- */
const Gui = {
  items: [], prev: [], focus: null, active: null, hot: null, keyNav: false, tooltip: null, sliderDrag: null,
  begin() { this.prev = this.items; this.items = []; this.hot = null; this.tooltip = null; },
  /** Registrar elemento enfocable */
  _reg(id, x, y, w, h, kind) {
    const it = { id, x, y, w, h, kind };
    this.items.push(it);
    const p = Input.pointer;
    const over = p.x >= x && p.x < x + w && p.y >= y && p.y < y + h;
    if (over) { this.hot = id; if (p.moved && !this.keyNav) this.focus = id; if (p.moved) this.keyNav = false; }
    return over;
  },
  end() {
    // navegación por teclado entre elementos registrados en este cuadro
    const list = this.items;
    if (!list.length) return;
    if (!list.find(i => i.id === this.focus)) { if (this.keyNav || Input.lastDevice !== 'mouse') this.focus = list[0].id; }
    const cur = list.find(i => i.id === this.focus);
    let dir = null;
    if (Input.pressed('next')) { const k = list.indexOf(cur); this.focus = list[(k + (Input.down('fast') ? -1 : 1) + list.length) % list.length].id; this.keyNav = true; Audio2.sfx('uiMove'); return; }
    if (Input.pressed('uiUp')) dir = [0, -1];
    else if (Input.pressed('uiDown')) dir = [0, 1];
    else if (cur && cur.kind !== 'slider' && Input.pressed('uiLeft')) dir = [-1, 0];
    else if (cur && cur.kind !== 'slider' && Input.pressed('uiRight')) dir = [1, 0];
    if (dir && cur) {
      const cx = cur.x + cur.w / 2, cy = cur.y + cur.h / 2;
      let best = null, bd = Infinity;
      for (const it of list) {
        if (it === cur) continue;
        const dx = it.x + it.w / 2 - cx, dy = it.y + it.h / 2 - cy;
        const along = dx * dir[0] + dy * dir[1];
        if (along <= 2) continue;
        const across = Math.abs(dx * dir[1]) + Math.abs(dy * dir[0]);
        const d = along + across * 2.2;
        if (d < bd) { bd = d; best = it; }
      }
      if (best) { this.focus = best.id; this.keyNav = true; Audio2.sfx('uiMove'); }
    } else if (dir && !cur) { this.focus = list[0].id; this.keyNav = true; }
  },
  isFocused(id) { return this.focus === id && (this.keyNav || Input.lastDevice !== 'mouse'); },
  /** Botón. opts: icon, style('primary'|'ghost'|'danger'|'choice'|'tab'), disabled, selected, tip, key */
  button(g, id, x, y, w, h, label, opts = {}) {
    const over = this._reg(id, x, y, w, h, 'button');
    const p = Input.pointer;
    let clicked = false;
    if (!opts.disabled) {
      if (over && p.pressed) this.active = id;
      if (this.active === id && p.released) { if (over) clicked = true; this.active = null; }
      if (this.focus === id && (Input.pressed('confirm')) && !opts.noKey) clicked = true;
    }
    if (over && opts.tip) this.tooltip = opts.tip;
    const focused = this.isFocused(id) || (over && !this.keyNav);
    const pressed = this.active === id && over;
    if (!opts.noDraw) this.drawButton(g, x, y, w, h, label, Object.assign({}, opts, { focused, pressed }));
    else if (focused) { frect(g, x, y, w, 1, '#ffe14d'); frect(g, x, y + h - 1, w, 1, '#ffe14d'); frect(g, x, y, 1, h, '#ffe14d'); frect(g, x + w - 1, y, 1, h, '#ffe14d'); }
    if (clicked) { Audio2.sfx(opts.sfx || 'ui'); Input.consumePointer(); }
    return clicked;
  },
  drawButton(g, x, y, w, h, label, o) {
    const st = o.style || 'primary';
    const pal = {
      primary: ['#1d346c', '#2c4f96', '#56e5ff', '#0a1030'],
      choice: ['#1a1640', '#262060', '#b49cff', '#0a0718'],
      danger: ['#4a1428', '#7a1f36', '#ff9a8a', '#12040a'],
      ghost: ['#121736', '#1c2350', '#8a8fb8', '#070a1c'],
      good: ['#0f4a3e', '#1f854c', '#c2f58e', '#04140c'],
      tab: ['#121736', '#1d346c', '#56e5ff', '#070a1c'],
      gold: ['#6a3e0e', '#9a5e12', '#ffe14d', '#1a0f04'],
      paper: ['#e8c47a', '#f8e6b8', '#7e4429', '#3a1a10'],
    }[st] || ['#1d346c', '#2c4f96', '#56e5ff', '#0a1030'];
    let [b0, b1, hi, ink] = pal;
    if (o.disabled) { b0 = '#141626'; b1 = '#1c1f34'; hi = '#4a4e70'; }
    if (o.selected) { b0 = shade(b1, 0.1); b1 = shade(b1, 0.25); }
    const dy = o.pressed ? 1 : 0;
    x = Math.round(x); y = Math.round(y);
    frect(g, x + 1, y + 1 + h - 1, w - 2, 1, '#05030f');
    frect(g, x + 1, y + dy, w - 2, h, ink); frect(g, x, y + 1 + dy, w, h - 2, ink);
    frect(g, x + 1, y + 1 + dy, w - 2, h - 2, b0);
    fdither(g, x + 1, y + 1 + dy, w - 2, Math.ceil((h - 2) / 2), b1, 0.5);
    frect(g, x + 1, y + 1 + dy, w - 2, 1, b1);
    if (o.focused || o.selected) {
      frect(g, x + 1, y + 1 + dy, w - 2, 1, hi); frect(g, x + 1, y + h - 2 + dy, w - 2, 1, hi);
      frect(g, x + 1, y + 1 + dy, 1, h - 2, hi); frect(g, x + w - 2, y + 1 + dy, 1, h - 2, hi);
      if (o.focused && ((Game.frame >> 4) & 1)) { fpx(g, x - 2, y + h / 2 + dy, hi); fpx(g, x - 3, y + h / 2 - 1 + dy, hi); fpx(g, x - 3, y + h / 2 + 1 + dy, hi); }
    }
    let tx = x + w / 2;
    const tcol = o.disabled ? '#5a5e80' : (o.textColor || (st === 'paper' ? '#3a1a10' : '#fffaf0'));
    const ty = y + Math.round(h / 2) - 4 + dy;
    if (o.icon) {
      const lw = label ? FONTS.main.measure(label) : 0;
      const total = 13 + (label ? lw + 3 : 0);
      const ix = o.align === 'left' ? x + 5 : Math.round(x + w / 2 - total / 2);
      Icons.draw(g, o.icon, ix, y + Math.round(h / 2) - 6 + dy);
      if (label) drawText(g, label, ix + 15, ty, { color: tcol, shadow: ink });
    } else if (label) {
      if (o.align === 'left') drawText(g, label, x + 6, ty, { color: tcol, shadow: ink });
      else drawText(g, label, tx, ty, { color: tcol, shadow: ink, align: 'center' });
    }
    if (o.key) drawText(g, o.key, x + w - 4, y + 3 + dy, { font: 'tiny', color: hi, align: 'right' });
  },
  /** Botón de opción multilínea (respuestas A–D) */
  choice(g, id, x, y, w, label, letter, opts = {}) {
    const lines = wrapText(label, w - 26);
    const h = Math.max(18, lines.length * 11 + 7);
    const over = this._reg(id, x, y, w, h, 'button');
    const p = Input.pointer;
    let clicked = false;
    if (!opts.disabled) {
      if (over && p.pressed) this.active = id;
      if (this.active === id && p.released) { if (over) clicked = true; this.active = null; }
      if (this.focus === id && Input.pressed('confirm')) clicked = true;
    }
    const focused = this.isFocused(id) || (over && !this.keyNav);
    const st = opts.state; // 'correct' | 'wrong' | 'selected' | 'dim'
    let bg = '#16123a', edge = focused ? '#b49cff' : '#3f2690', lc = '#ffe14d';
    if (st === 'selected') { bg = '#2a1a66'; edge = '#ffe14d'; }
    if (st === 'correct') { bg = '#0f3a2c'; edge = '#86e36f'; lc = '#c2f58e'; }
    if (st === 'wrong') { bg = '#3a1020'; edge = '#ff6b6b'; lc = '#ff9a8a'; }
    if (st === 'dim') { bg = '#100d26'; edge = '#2a2050'; lc = '#5a5e80'; }
    frect(g, x, y, w, h, '#0a0718'); frect(g, x + 1, y + 1, w - 2, h - 2, bg);
    frect(g, x + 1, y + 1, w - 2, 1, edge); frect(g, x + 1, y + h - 2, w - 2, 1, shade(edge, -0.3)); frect(g, x + 1, y + 1, 1, h - 2, edge);
    if (focused) fdither(g, x + 2, y + 2, w - 4, h - 4, '#8d6bff', 0.18);
    frect(g, x + 4, y + 4, 14, 11, '#0a0718'); frect(g, x + 5, y + 5, 12, 9, edge);
    drawText(g, letter, x + 11, y + 6, { align: 'center', color: '#0a0718' });
    lines.forEach((ln, i) => drawText(g, ln, x + 22, y + 5 + i * 11, { color: st === 'dim' ? '#6a6e90' : '#fffaf0', shadow: '#0a0718' }));
    if (st === 'correct') Icons.draw(g, 'check', x + w - 16, y + 3);
    if (st === 'wrong') Icons.draw(g, 'cross', x + w - 16, y + 3);
    if (clicked) Audio2.sfx('ui');
    return { clicked, h };
  },
  /** Deslizador. Retorna nuevo valor. opts: label, unit, fmt(v), color, disabled, marks:[{v,col,label}] */
  slider(g, id, x, y, w, value, min, max, step, opts = {}) {
    const h = 22;
    const over = this._reg(id, x, y, w, h, 'slider');
    const p = Input.pointer;
    const tx0 = x + 4, tw = w - 8, ty = y + 14;
    let v = value;
    if (!opts.disabled) {
      if (over && p.pressed) { this.active = id; this.sliderDrag = id; }
      if (this.sliderDrag === id) {
        if (p.down) { v = min + clamp((p.x - tx0) / tw, 0, 1) * (max - min); }
        else this.sliderDrag = null;
      }
      if (this.focus === id) {
        const big = Input.down('fast') ? 5 : 1;
        if (Input.pressed('uiLeft')) { v -= step * big; Audio2.sfx('uiMove'); }
        if (Input.pressed('uiRight')) { v += step * big; Audio2.sfx('uiMove'); }
      }
    }
    v = clamp(Math.round((v - min) / step) * step + min, min, max);
    v = parseFloat(v.toFixed(6));
    const focused = this.isFocused(id) || (over && !this.keyNav) || this.sliderDrag === id;
    const col = opts.disabled ? '#4a4e70' : (opts.color || '#56e5ff');
    // etiqueta
    if (opts.label) drawText(g, opts.label, x, y + 1, { color: focused ? '#fffaf0' : '#cfd6f0', shadow: '#0a0718' });
    const vs = (opts.fmt ? opts.fmt(v) : fmt(v, step < 1 ? (step < 0.1 ? 2 : 1) : 0)) + (opts.unit ? ' ' + opts.unit : '');
    drawText(g, vs, x + w, y + 1, { color: col, shadow: '#0a0718', align: 'right' });
    // pista
    frect(g, tx0 - 1, ty - 1, tw + 2, 5, '#05030f');
    frect(g, tx0, ty, tw, 3, '#1c2350');
    const f = (v - min) / (max - min);
    frect(g, tx0, ty, Math.round(tw * f), 3, col);
    frect(g, tx0, ty, Math.round(tw * f), 1, shade(col, 0.3));
    if (opts.marks) for (const m of opts.marks) {
      const mx = Math.round(tx0 + tw * (m.v - min) / (max - min));
      frect(g, mx, ty - 3, 1, 9, m.col || '#ff4e5d');
      if (m.zone) fdither(g, mx, ty - 2, Math.round(tw * (m.zone - m.v) / (max - min)), 7, m.col || '#ff4e5d', 0.25);
    }
    const kx = Math.round(tx0 + tw * f);
    frect(g, kx - 3, ty - 4, 7, 11, '#05030f');
    frect(g, kx - 2, ty - 3, 5, 9, focused ? '#fffaf0' : '#cfe8ee');
    frect(g, kx - 2, ty + 3, 5, 3, focused ? col : '#6aa0b4');
    fpx(g, kx, ty - 1, '#05030f');
    if (opts.tip && over) this.tooltip = opts.tip;
    return v;
  },
  toggle(g, id, x, y, label, on, opts = {}) {
    const w = opts.w || (FONTS.main.measure(label) + 30), h = 14;
    const over = this._reg(id, x, y, w, h, 'button');
    const p = Input.pointer;
    let changed = false;
    if (over && p.pressed) this.active = id;
    if (this.active === id && p.released) { if (over) changed = true; this.active = null; }
    if (this.focus === id && Input.pressed('confirm')) changed = true;
    const focused = this.isFocused(id) || (over && !this.keyNav);
    frect(g, x, y + 2, 20, 10, '#05030f');
    frect(g, x + 1, y + 3, 18, 8, on ? '#1f854c' : '#3a1020');
    frect(g, on ? x + 11 : x + 2, y + 4, 7, 6, on ? '#c2f58e' : '#ff9a8a');
    drawText(g, label, x + 25, y + 3, { color: focused ? '#ffe14d' : '#fffaf0', shadow: '#0a0718' });
    if (changed) Audio2.sfx('ui');
    return changed ? !on : on;
  },
  renderTooltip(g) {
    if (!this.tooltip) return;
    const p = Input.pointer;
    const lines = wrapText(this.tooltip, 180);
    const w = Math.min(190, Math.max(...lines.map(l => FONTS.main.measure(l))) + 10), h = lines.length * 11 + 8;
    const x = clamp(p.x + 10, 2, W - w - 2), y = clamp(p.y + 12, 2, H - h - 2);
    UIK.panel(g, x, y, w, h, 'glass');
    lines.forEach((l, i) => drawText(g, l, x + 5, y + 5 + i * 11, { color: '#fffaf0', shadow: '#0a0718' }));
  },
};

/* ---------- Gráficos científicos pixel ---------- */
const Charts = {
  frame(g, x, y, w, h, bg = '#0a0f26') {
    frect(g, x, y, w, h, '#05030f'); frect(g, x + 1, y + 1, w - 2, h - 2, bg);
  },
  /** Gráfico de líneas. series: [{data:[...y] | [[x,y]..], color, area, dashed, label, step}] */
  line(g, x, y, w, h, series, o = {}) {
    this.frame(g, x, y, w, h, o.bg);
    const pl = o.padL ?? 22, pb = o.padB ?? 10, pt = o.padT ?? 4, pr = o.padR ?? 4;
    const cx = x + pl, cy = y + pt, cw = w - pl - pr, chh = h - pt - pb;
    const pts = series.map(s => s.data.map((d, i) => Array.isArray(d) ? d : [i, d]));
    let xMin = o.xMin, xMax = o.xMax, yMin = o.yMin, yMax = o.yMax;
    const all = pts.flat();
    if (xMin == null) xMin = Math.min(...all.map(p => p[0]));
    if (xMax == null) xMax = Math.max(...all.map(p => p[0]));
    if (yMin == null) yMin = Math.min(0, ...all.map(p => p[1]));
    if (yMax == null) yMax = Math.max(...all.map(p => p[1])) * 1.1 || 1;
    const X = (v) => Math.round(cx + (v - xMin) / (xMax - xMin || 1) * (cw - 1));
    const Y = (v) => Math.round(cy + chh - 1 - (clamp(v, yMin, yMax) - yMin) / (yMax - yMin || 1) * (chh - 1));
    // rejilla punteada
    const ny = o.yTicks ?? 4;
    for (let i = 0; i <= ny; i++) {
      const v = yMin + (yMax - yMin) * i / ny, yy = Y(v);
      for (let xx = cx; xx < cx + cw; xx += 3) fpx(g, xx, yy, '#1f2a5a');
      drawText(g, o.yFmt ? o.yFmt(v) : fmt(v, Math.abs(yMax - yMin) < 5 ? 1 : 0), cx - 3, yy - 2, { font: 'tiny', color: '#8a8fb8', align: 'right' });
    }
    const nx = o.xTicks ?? 6;
    for (let i = 0; i <= nx; i++) {
      const v = xMin + (xMax - xMin) * i / nx, xx = X(v);
      for (let yy = cy; yy < cy + chh; yy += 3) fpx(g, xx, yy, '#18224c');
      drawText(g, o.xFmt ? o.xFmt(v) : fmt(v, 0), xx, cy + chh + 2, { font: 'tiny', color: '#8a8fb8', align: 'center' });
    }
    // banda (incertidumbre / límite)
    if (o.bands) for (const b of o.bands) {
      if (b.y0 != null) { const y0 = Y(b.y1), y1 = Y(b.y0); fdither(g, cx, y0, cw, y1 - y0 + 1, b.color, b.level ?? 0.25); }
      if (b.x0 != null) { const x0 = X(b.x0), x1 = X(b.x1); fdither(g, x0, cy, x1 - x0 + 1, chh, b.color, b.level ?? 0.25); }
      if (b.lo && b.hi) { // banda por serie
        for (let i = 0; i < b.lo.length - 1; i++) {
          const xa = X(i), xb = X(i + 1);
          for (let xx = xa; xx <= xb; xx++) {
            const t = (xx - xa) / Math.max(1, xb - xa);
            const lo = lerp(b.lo[i], b.lo[i + 1], t), hi = lerp(b.hi[i], b.hi[i + 1], t);
            const ya = Y(hi), yb = Y(lo);
            fdither(g, xx, ya, 1, yb - ya + 1, b.color, b.level ?? 0.35);
          }
        }
      }
    }
    if (o.hlines) for (const hl of o.hlines) { const yy = Y(hl.v); for (let xx = cx; xx < cx + cw; xx += 2) fpx(g, xx, yy, hl.color); if (hl.label) drawText(g, hl.label, cx + cw - 2, yy - 7, { font: 'tiny', color: hl.color, align: 'right' }); }
    if (o.vlines) for (const vl of o.vlines) { const xx = X(vl.v); for (let yy = cy; yy < cy + chh; yy += 2) fpx(g, xx, yy, vl.color); if (vl.label) drawText(g, vl.label, xx + 2, cy + 1, { font: 'tiny', color: vl.color }); }
    // series
    series.forEach((s, si) => {
      const P = pts[si];
      if (s.area) {
        for (let i = 0; i < P.length - 1; i++) {
          const xa = X(P[i][0]), xb = X(P[i + 1][0]);
          for (let xx = xa; xx <= xb; xx++) {
            const t = (xx - xa) / Math.max(1, xb - xa);
            const yy = Y(s.step ? P[i][1] : lerp(P[i][1], P[i + 1][1], t));
            fdither(g, xx, yy, 1, Y(Math.max(yMin, 0)) - yy, s.color, s.areaLevel ?? 0.35);
          }
        }
      }
      for (let i = 0; i < P.length - 1; i++) {
        const xa = X(P[i][0]), ya = Y(P[i][1]), xb = X(P[i + 1][0]), yb = Y(P[i + 1][1]);
        if (s.step) { fline(g, xa, ya, xb, ya, s.color); fline(g, xb, ya, xb, yb, s.color); }
        else if (s.dashed) { if (i % 2 === 0) fline(g, xa, ya, xb, yb, s.color); }
        else fline(g, xa, ya, xb, yb, s.color);
      }
      if (s.dots) for (const p of P) frect(g, X(p[0]) - 1, Y(p[1]) - 1, 3, 3, s.color);
      if (P.length === 1) frect(g, X(P[0][0]) - 1, Y(P[0][1]) - 1, 3, 3, s.color);
    });
    if (o.cursor != null) { const xx = X(o.cursor); frect(g, xx, cy, 1, chh, '#fffaf0'); }
    if (o.xLabel) drawText(g, o.xLabel, x + w - 3, y + h - 8, { font: 'tiny', color: '#cfd6f0', align: 'right' });
    if (o.yLabel) drawText(g, o.yLabel, x + 3, y + 2, { font: 'tiny', color: '#cfd6f0' });
    if (o.legend) {
      let lx = cx + 4;
      for (const s of series) if (s.label) { frect(g, lx, cy + 3, 5, 3, s.color); drawText(g, s.label, lx + 7, cy + 2, { font: 'tiny', color: s.color }); lx += FONTS.tiny.measure(s.label) + 14; }
    }
    return { X, Y, cx, cy, cw, ch: chh };
  },
  bars(g, x, y, w, h, items, o = {}) {
    this.frame(g, x, y, w, h, o.bg);
    const max = o.max ?? Math.max(...items.map(i => i.v)) * 1.15;
    const n = items.length, bw = Math.floor((w - 8) / n);
    items.forEach((it, i) => {
      const bh = Math.round((h - 16) * clamp(it.v / max, 0, 1));
      const bx = x + 4 + i * bw, by = y + h - 10 - bh;
      frect(g, bx + 1, by, bw - 3, bh, it.color);
      frect(g, bx + 1, by, bw - 3, 1, shade(it.color, 0.3));
      frect(g, bx + bw - 3, by, 1, bh, shade(it.color, -0.3));
      if (it.label) drawText(g, it.label, bx + bw / 2 - 1, y + h - 8, { font: 'tiny', color: '#cfd6f0', align: 'center' });
      if (o.values) drawText(g, o.fmt ? o.fmt(it.v) : fmt(it.v, 0), bx + bw / 2 - 1, by - 7, { font: 'tiny', color: it.color, align: 'center' });
    });
    if (o.limit != null) { const ly = y + h - 10 - Math.round((h - 16) * o.limit / max); for (let xx = x + 2; xx < x + w - 2; xx += 2) fpx(g, xx, ly, '#ff4e5d'); }
  },
  /** Tanque con líquido animado (fracción 0..1) */
  tank(g, x, y, w, h, frac, ramp = RAMP.sea, label = null, o = {}) {
    frect(g, x, y, w, h, '#05030f');
    frect(g, x + 1, y + 1, w - 2, h - 2, '#141d36');
    const lh = Math.round((h - 4) * clamp(frac, 0, 1));
    const top = y + h - 2 - lh;
    for (let yy = 0; yy < lh; yy++) {
      const t = yy / Math.max(1, h);
      frect(g, x + 2, top + yy, w - 4, 1, rampDither(ramp, 0.75 - t * 0.6, x, top + yy));
    }
    if (lh > 1) {
      for (let xx = x + 2; xx < x + w - 2; xx++) {
        const wv = Math.round(Math.sin(Game.time * 3 + xx * 0.5) * 0.8);
        fpx(g, xx, top + wv, ramp[ramp.length - 2]);
      }
    }
    if (o.reserve != null) { const ry = y + h - 2 - Math.round((h - 4) * o.reserve); for (let xx = x + 1; xx < x + w - 1; xx += 2) fpx(g, xx, ry, '#ff4e5d'); }
    frect(g, x + 2, y + 2, 1, h - 4, 'rgba(255,255,255,0.25)');
    for (let i = 1; i < 4; i++) frect(g, x + w - 4, y + Math.round(h * i / 4), 2, 1, '#6aa0b4');
    if (label) drawText(g, label, x + w / 2, y + h + 2, { font: 'tiny', color: '#cfd6f0', align: 'center' });
  },
  /** Batería con módulos iluminados según SOC */
  battery(g, x, y, w, h, soc, reserve = 0, label = null) {
    frect(g, x + Math.round(w / 2) - 4, y - 3, 8, 3, '#6aa0b4');
    frect(g, x, y, w, h, '#05030f'); frect(g, x + 1, y + 1, w - 2, h - 2, '#141d36');
    const n = 10, mh = Math.floor((h - 4) / n);
    for (let i = 0; i < n; i++) {
      const lv = (i + 0.5) / n;
      const my = y + h - 2 - (i + 1) * mh;
      const on = soc >= lv;
      const col = !on ? '#1c2350' : soc < 0.2 ? '#ff4e5d' : soc < 0.4 ? '#ffb83e' : '#86e36f';
      frect(g, x + 2, my + 1, w - 4, mh - 1, col);
      if (on) frect(g, x + 2, my + 1, w - 4, 1, shade(col, 0.35));
    }
    if (reserve > 0) { const ry = y + h - 2 - Math.round((h - 4) * reserve); frect(g, x - 2, ry, w + 4, 1, '#ff4e5d'); }
    if (label) drawText(g, label, x + w / 2, y + h + 2, { font: 'tiny', color: '#cfd6f0', align: 'center' });
  },
  gauge(g, cx, cy, r, frac, col = '#56e5ff', label = null, valueText = null) {
    for (let a = 0; a <= 40; a++) {
      const t = a / 40, an = Math.PI * (0.8 + t * 1.4);
      const on = t <= frac;
      const c = on ? (t > 0.85 ? '#ff4e5d' : t > 0.65 ? '#ffb83e' : col) : '#1c2350';
      fpx(g, cx + Math.cos(an) * r, cy + Math.sin(an) * r, c);
      fpx(g, cx + Math.cos(an) * (r - 1), cy + Math.sin(an) * (r - 1), c);
      fpx(g, cx + Math.cos(an) * (r - 2), cy + Math.sin(an) * (r - 2), shade(c, -0.3));
    }
    const an = Math.PI * (0.8 + clamp(frac, 0, 1) * 1.4);
    fline(g, cx, cy, cx + Math.cos(an) * (r - 4), cy + Math.sin(an) * (r - 4), '#fffaf0');
    frect(g, cx - 1, cy - 1, 3, 3, '#fffaf0');
    if (valueText) drawText(g, valueText, cx, cy + 4, { font: 'tiny', color: '#fffaf0', align: 'center' });
    if (label) drawText(g, label, cx, cy + r * 0.55 + 6, { font: 'tiny', color: '#8a8fb8', align: 'center' });
  },
  /** Flecha de flujo animada (líquido, energía, H2, datos) entre puntos (estilo Sankey pixel) */
  flow(g, pts, kind, rate = 1, width = 3) {
    const K = FLOW_KINDS[kind] || FLOW_KINDS.water;
    const wdt = Math.max(1, Math.round(width));
    for (let i = 0; i < pts.length - 1; i++) {
      const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
      const len = dist(x0, y0, x1, y1);
      const horiz = Math.abs(x1 - x0) >= Math.abs(y1 - y0);
      for (let s = 0; s <= len; s++) {
        const t = s / Math.max(1, len);
        const px = Math.round(lerp(x0, x1, t)), py = Math.round(lerp(y0, y1, t));
        for (let k = -Math.floor(wdt / 2); k <= Math.floor((wdt - 1) / 2); k++) {
          const qx = horiz ? px : px + k, qy = horiz ? py + k : py;
          fpx(g, qx, qy, k === -Math.floor(wdt / 2) ? K.hi : k === Math.floor((wdt - 1) / 2) ? K.lo : K.mid);
        }
      }
      // pulsos animados
      if (rate > 0) {
        const spacing = K.spacing, off = (Game.time * K.speed * rate) % spacing;
        for (let s = off; s < len; s += spacing) {
          const t = s / Math.max(1, len);
          const px = Math.round(lerp(x0, x1, t)), py = Math.round(lerp(y0, y1, t));
          if (K.dot === 'bubble') { fpx(g, px, py - 1, K.pulse); fpx(g, px - 1, py, K.pulse); fpx(g, px + 1, py, K.pulse); fpx(g, px, py + 1, K.pulse); }
          else if (K.dot === 'spark') { fpx(g, px, py, '#ffffff'); fpx(g, px + (horiz ? -1 : 0), py + (horiz ? 0 : -1), K.pulse); }
          else frect(g, px - (horiz ? 1 : 0), py - (horiz ? 0 : 1), horiz ? 3 : 1, horiz ? 1 : 3, K.pulse);
        }
      }
    }
    const [ex, ey] = pts[pts.length - 1], [px0, py0] = pts[pts.length - 2];
    const dx = sign(ex - px0), dy = sign(ey - py0);
    for (let k = 0; k < 4; k++) {
      for (let j = -k; j <= k; j++) fpx(g, ex - dx * (4 - k) + (dy ? j : 0) + dx, ey - dy * (4 - k) + (dx ? j : 0) + dy, K.mid);
    }
  },
};
const FLOW_KINDS = {
  water: { hi: '#a6f4ff', mid: '#22bdd0', lo: '#106884', pulse: '#ffffff', speed: 30, spacing: 10, dot: 'dash' },
  seawater: { hi: '#6cf0db', mid: '#1283bf', lo: '#0d3168', pulse: '#c6fff2', speed: 24, spacing: 12, dot: 'dash' },
  permeate: { hi: '#e6fdff', mid: '#56e5ff', lo: '#1491aa', pulse: '#ffffff', speed: 32, spacing: 9, dot: 'dash' },
  brine: { hi: '#f888b8', mid: '#bc3e92', lo: '#621a66', pulse: '#ffc4dc', speed: 18, spacing: 14, dot: 'dash' },
  power: { hi: '#fff08a', mid: '#ffd84a', lo: '#c8861a', pulse: '#ffffff', speed: 70, spacing: 16, dot: 'spark' },
  h2: { hi: '#d8fff8', mid: '#40d0d4', lo: '#16768c', pulse: '#ffffff', speed: 22, spacing: 12, dot: 'bubble' },
  data: { hi: '#dcd0ff', mid: '#8d6bff', lo: '#3f2690', pulse: '#ffffff', speed: 40, spacing: 11, dot: 'dash' },
  irrigation: { hi: '#c2f58e', mid: '#33a552', lo: '#156647', pulse: '#e6fdff', speed: 20, spacing: 10, dot: 'dash' },
  heat: { hi: '#ffe878', mid: '#ff7a2a', lo: '#a82418', pulse: '#ffffff', speed: 30, spacing: 12, dot: 'dash' },
};
