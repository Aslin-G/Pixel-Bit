/* ===== 10_rig.js ===== */
/* =====================================================================
   10_rig.js — Rig de personajes por SDF rasterizado a píxel.
   Cada parte es un campo de distancia con bisel → normal → luz en
   bandas discretas de una rampa (sin antialiasing). Luego:
   líneas internas entre partes solapadas, sellos de detalle (ojos,
   costuras), contorno selectivo y caché por fotograma.
   ===================================================================== */

const LIGHT = (() => { const l = [-0.55, -0.7, 0.62]; const n = Math.hypot(...l); return l.map(v => v / n); })();

/* ---------- SDF básicos ---------- */
const SDF = {
  circle: (cx, cy, r) => (x, y) => Math.hypot(x - cx, y - cy) - r,
  ellipse: (cx, cy, rx, ry, rot = 0) => {
    const c = Math.cos(-rot), s = Math.sin(-rot);
    return (x, y) => {
      const dx = x - cx, dy = y - cy;
      const lx = dx * c - dy * s, ly = dx * s + dy * c;
      const k = Math.hypot(lx / rx, ly / ry);
      return (k - 1) * Math.min(rx, ry);
    };
  },
  capsule: (ax, ay, bx, by, ra, rb = ra) => {
    const vx = bx - ax, vy = by - ay, L2 = vx * vx + vy * vy || 1e-6;
    return (x, y) => {
      const t = clamp(((x - ax) * vx + (y - ay) * vy) / L2, 0, 1);
      const cx = ax + vx * t, cy = ay + vy * t;
      return Math.hypot(x - cx, y - cy) - lerp(ra, rb, t);
    };
  },
  box: (cx, cy, hw, hh, r = 0, rot = 0) => {
    const c = Math.cos(-rot), s = Math.sin(-rot);
    return (x, y) => {
      const dx = x - cx, dy = y - cy;
      const lx = Math.abs(dx * c - dy * s) - (hw - r), ly = Math.abs(dx * s + dy * c) - (hh - r);
      return Math.hypot(Math.max(lx, 0), Math.max(ly, 0)) + Math.min(Math.max(lx, ly), 0) - r;
    };
  },
  poly: (pts) => (x, y) => {
    let d = Infinity, inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const [ax, ay] = pts[j], [bx, by] = pts[i];
      const vx = bx - ax, vy = by - ay, L2 = vx * vx + vy * vy || 1e-6;
      const t = clamp(((x - ax) * vx + (y - ay) * vy) / L2, 0, 1);
      d = Math.min(d, Math.hypot(x - ax - vx * t, y - ay - vy * t));
      if ((ay > y) !== (by > y) && x < ax + (y - ay) / (by - ay) * vx) inside = !inside;
    }
    return inside ? -d : d;
  },
  union: (...fs) => (x, y) => { let d = Infinity; for (const f of fs) d = Math.min(d, f(x, y)); return d; },
  smoothUnion: (k, ...fs) => (x, y) => {
    let d = fs[0](x, y);
    for (let i = 1; i < fs.length; i++) { const d2 = fs[i](x, y); const h = clamp(0.5 + 0.5 * (d2 - d) / k, 0, 1); d = lerp(d2, d, h) - k * h * (1 - h); }
    return d;
  },
  sub: (a, b) => (x, y) => Math.max(a(x, y), -b(x, y)),
  inter: (a, b) => (x, y) => Math.max(a(x, y), b(x, y)),
};
function polyBBox(pts, pad = 1) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y] of pts) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  return [x0 - pad, y0 - pad, x1 + pad, y1 + pad];
}

/* ---------- Constructor de figuras ---------- */
class Rig {
  constructor(w, h) { this.w = w; this.h = h; this.parts = []; this.stamps = []; this.anchors = {}; this.zc = 0; }
  /** opts: ramp, base(índice), bevel, z, group, shiny, flatten, lineIdx, noLine, light(+/-índice) */
  add(sdf, bbox, opts) { this.parts.push(Object.assign({ sdf, bbox, z: this.zc++, bevel: 3, base: 3, group: 'g' + this.parts.length, shiny: false, flatten: 1, dark: 0 }, opts)); return this; }
  ellipse(cx, cy, rx, ry, opts, rot = 0) { const m = Math.max(rx, ry) + 1; return this.add(SDF.ellipse(cx, cy, rx, ry, rot), [cx - m, cy - m, cx + m, cy + m], Object.assign({ bevel: Math.min(rx, ry) }, opts)); }
  circle(cx, cy, r, opts) { return this.add(SDF.circle(cx, cy, r), [cx - r - 1, cy - r - 1, cx + r + 1, cy + r + 1], Object.assign({ bevel: r }, opts)); }
  capsule(ax, ay, bx, by, ra, rb, opts) {
    const m = Math.max(ra, rb) + 1;
    return this.add(SDF.capsule(ax, ay, bx, by, ra, rb), [Math.min(ax, bx) - m, Math.min(ay, by) - m, Math.max(ax, bx) + m, Math.max(ay, by) + m], Object.assign({ bevel: Math.max(ra, rb) }, opts));
  }
  box(cx, cy, hw, hh, r, opts, rot = 0) { const m = Math.hypot(hw, hh) + 1; return this.add(SDF.box(cx, cy, hw, hh, r, rot), [cx - m, cy - m, cx + m, cy + m], opts); }
  poly(pts, opts) { return this.add(SDF.poly(pts), polyBBox(pts), opts); }
  custom(sdf, bbox, opts) { return this.add(sdf, bbox, opts); }
  /** Sello: función(pb, anchors) ejecutada tras sombrear (detalles a mano) */
  stamp(fn, z = 1e9) { this.stamps.push({ fn, z }); return this; }

  render(opt = {}) {
    const W2 = this.w, H2 = this.h;
    const pb = new PixelBuffer(W2, H2);
    const zb = new Int32Array(W2 * H2).fill(-1);
    const parts = this.parts.slice().sort((a, b) => a.z - b.z);
    const casters = parts.some(p => p.cast);
    const ib = casters ? new Int8Array(W2 * H2) : null;
    const L = opt.light || LIGHT;
    parts.forEach((p, pi) => {
      const ramp = p.ramp;
      const n = ramp.length;
      const x0 = Math.max(0, Math.floor(p.bbox[0])), y0 = Math.max(0, Math.floor(p.bbox[1]));
      const x1 = Math.min(W2 - 1, Math.ceil(p.bbox[2])), y1 = Math.min(H2 - 1, Math.ceil(p.bbox[3]));
      const f = p.sdf, bev = Math.max(0.6, p.bevel);
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        const sx = x + 0.5, sy = y + 0.5;
        const d = f(sx, sy);
        if (d > 0) continue;
        let col, idx = p.base;
        if (p.flat) col = ramp[clamp(p.base, 0, n - 1)];
        else {
          const gx = f(sx + 0.5, sy) - f(sx - 0.5, sy), gy = f(sx, sy + 0.5) - f(sx, sy - 0.5);
          const gl = Math.hypot(gx, gy) || 1;
          const k = clamp(-d / bev, 0, 1);
          // normal: borde → lateral, interior → frontal
          let nx = gx / gl * (1 - k), ny = gy / gl * (1 - k), nz = k * p.flatten + (1 - p.flatten) * 0.9;
          const nl = Math.hypot(nx, ny, nz) || 1; nx /= nl; ny /= nl; nz /= nl;
          let dd = nx * L[0] + ny * L[1] + nz * L[2];
          if (p.tilt) dd += p.tilt;
          if (dd < -0.2) idx -= 2; else if (dd < 0.36) idx -= 1; else if (dd > 0.94 && p.shiny) idx += 2; else if (dd > 0.74) idx += 1;
          if (p.ao) { const ao = p.ao(sx, sy); idx -= ao; }
          idx -= p.dark;
          col = ramp[clamp(idx, 1, n - 1)];
          if (p.texture) col = p.texture(x, y, idx, ramp, col) || col;
        }
        pb.data[y * W2 + x] = U(col);
        zb[y * W2 + x] = pi;
        if (ib) ib[y * W2 + x] = p.flat ? p.base : clamp(idx, 1, n - 1);
      }
    });
    // sombras proyectadas: parte con cast:{on:[grupos], dx, dy} oscurece en 1 tono a las partes destino
    if (casters) {
      const out0 = new Uint32Array(pb.data);
      parts.forEach((C, ci) => {
        if (!C.cast) return;
        const { on, dx = 0, dy = 2, k = 1 } = C.cast;
        for (let y = 0; y < H2; y++) for (let x = 0; x < W2; x++) {
          const i = y * W2 + x, ti = zb[i];
          if (ti < 0 || ti >= ci) continue;
          const T = parts[ti];
          if (!on.includes(T.group) || T.flat) continue;
          const sx = x - dx, sy = y - dy;
          if (sx < 0 || sy < 0 || sx >= W2 || sy >= H2) continue;
          if (zb[sy * W2 + sx] !== ci) continue;
          out0[i] = U(T.ramp[clamp(ib[i] - k, 1, T.ramp.length - 1)]);
        }
      });
      pb.data.set(out0);
    }
    // líneas internas: el píxel de una parte trasera junto a una delantera de otro grupo se oscurece
    const out = new Uint32Array(pb.data);
    for (let y = 0; y < H2; y++) for (let x = 0; x < W2; x++) {
      const i = y * W2 + x, pi = zb[i];
      if (pi < 0) continue;
      const P = parts[pi];
      if (P.noLine) continue;
      const nb = [x > 0 ? zb[i - 1] : -1, x < W2 - 1 ? zb[i + 1] : -1, y > 0 ? zb[i - W2] : -1, y < H2 - 1 ? zb[i + W2] : -1];
      for (const q of nb) {
        if (q > pi && parts[q].group !== P.group && !parts[q].noLineOver) {
          out[i] = U(P.lineCol || P.ramp[P.lineIdx ?? 0]);
          break;
        }
      }
    }
    pb.data.set(out);
    this.zbuf = zb; this.zparts = parts;
    // sellos de detalle
    this.stamps.sort((a, b) => a.z - b.z).forEach(s => s.fn(pb, this.anchors));
    // contorno selectivo
    if (opt.outline !== false) {
      const oc = opt.outlineColor;
      pb.outline(oc ? oc : (nb) => darkOf(nb, -0.62));
    }
    return pb;
  }
}

/* ---------- Cinemática: extremidad de dos segmentos ---------- */
function limb(x, y, a1, l1, a2, l2) {
  // ángulo 0 = hacia abajo; positivo = hacia delante (derecha)
  const kx = x + Math.sin(a1) * l1, ky = y + Math.cos(a1) * l1;
  const ex = kx + Math.sin(a1 + a2) * l2, ey = ky + Math.cos(a1 + a2) * l2;
  return { kx, ky, ex, ey };
}

/* ---------- Ojos y bocas (sellos pixel a pixel) ---------- */
const FACE = {
  /** ojo pequeño de sprite: (x,y) esquina superior izquierda, w 2-3, h 3-4 */
  eye(pb, x, y, expr, o) {
    const ink = o.ink || '#1a0f20', iris = o.iris || '#3a2233', hi = '#ffffff', lash = o.lash || ink;
    x = Math.round(x); y = Math.round(y);
    const w = o.w || 2, h = o.h || 4;
    switch (expr) {
      case 'blink': pb.hline(x, x + w - 1, y + h - 2, lash); break;
      case 'happy': pb.set(x, y + 2, lash); pb.hline(x + 1, x + w - 2 + 1, y + 1, lash); pb.set(x + w, y + 2, lash); break;
      case 'closed': pb.hline(x, x + w, y + h - 1, lash); pb.set(x - 1, y + h - 2, lash); break;
      case 'surprised':
        pb.rect(x, y - 1, w, h + 1, ink); pb.set(x, y, hi); pb.set(x + w - 1, y + h - 1, iris); break;
      case 'half':
        pb.hline(x - 1, x + w, y + 1, lash); pb.rect(x, y + 2, w, h - 2, ink); pb.set(x + w - 1, y + 2, iris); break;
      case 'angry':
        pb.rect(x, y + 1, w, h - 1, ink); pb.set(x, y + 1, hi); pb.set(x + w - 1, y + h - 1, iris); break;
      case 'sad':
        pb.rect(x, y + 1, w, h - 1, ink); pb.set(x, y + 1, hi); pb.set(x + w - 1, y + h - 1, iris); pb.set(x - 1, y + h, o.tear ? '#a6f4ff' : ink); break;
      default:
        pb.rect(x, y, w, h, ink); pb.set(x, y, hi); if (h > 3) pb.set(x + w - 1, y + h - 1, iris); if (w > 2) pb.set(x + 1, y + h - 1, iris);
    }
  },
  brow(pb, x, y, expr, col, w = 3, flip = false) {
    x = Math.round(x); y = Math.round(y);
    // flip=false: ceja del ojo cercano (interior a la derecha)
    const inner = flip ? x : x + w - 1, outer = flip ? x + w - 1 : x;
    switch (expr) {
      case 'angry': case 'determined': pb.line(outer, y - 1, inner, y + 1, col); break;
      case 'worried': case 'sad': case 'guilty': pb.line(outer, y + 1, inner, y - 1, col); break;
      case 'surprised': pb.hline(x, x + w - 1, y - 2, col); break;
      case 'skeptical': pb.hline(x, x + w - 1, flip ? y - 1 : y, col); break;
      default: pb.hline(x, x + w - 1, y - 1, col); if (w > 2) pb.set(outer, y, col);
    }
  },
  mouth(pb, x, y, kind, o) {
    const ink = o.ink || '#3a1418', tongue = '#e2606a', teeth = '#fffaf0';
    x = Math.round(x); y = Math.round(y);
    switch (kind) {
      case 'smile': pb.set(x - 1, y - 1, ink); pb.hline(x, x + 2, y, ink); pb.set(x + 3, y - 1, ink); break;
      case 'grin': pb.hline(x - 1, x + 3, y, ink); pb.hline(x, x + 2, y + 1, ink); pb.set(x + 1, y + 1, tongue); pb.hline(x, x + 2, y, teeth); break;
      case 'open': pb.rect(x, y - 1, 3, 3, ink); pb.set(x + 1, y + 1, tongue); break;
      case 'talk': pb.rect(x, y, 3, 2, ink); pb.set(x + 1, y + 1, tongue); break;
      case 'o': pb.rect(x + 1, y - 1, 2, 3, ink); break;
      case 'frown': pb.set(x - 1, y + 1, ink); pb.hline(x, x + 2, y, ink); pb.set(x + 3, y + 1, ink); break;
      case 'flat': pb.hline(x, x + 2, y, ink); break;
      case 'wavy': pb.set(x - 1, y, ink); pb.set(x, y - 1, ink); pb.set(x + 1, y, ink); pb.set(x + 2, y - 1, ink); pb.set(x + 3, y, ink); break;
      case 'smirk': pb.hline(x, x + 2, y, ink); pb.set(x + 3, y - 1, ink); break;
      default: pb.hline(x, x + 1, y, ink);
    }
  },
};

/* expresiones: {eyes, brows, mouth} */
const EXPR = {
  neutral: { eyes: 'open', brows: 'neutral', mouth: 'line' },
  happy: { eyes: 'happy', brows: 'neutral', mouth: 'smile' },
  joy: { eyes: 'happy', brows: 'surprised', mouth: 'grin' },
  smile: { eyes: 'open', brows: 'neutral', mouth: 'smile' },
  surprised: { eyes: 'surprised', brows: 'surprised', mouth: 'o' },
  worried: { eyes: 'open', brows: 'worried', mouth: 'wavy' },
  sad: { eyes: 'sad', brows: 'sad', mouth: 'frown' },
  angry: { eyes: 'angry', brows: 'angry', mouth: 'frown' },
  determined: { eyes: 'angry', brows: 'determined', mouth: 'flat' },
  thinking: { eyes: 'half', brows: 'skeptical', mouth: 'flat' },
  skeptical: { eyes: 'half', brows: 'skeptical', mouth: 'smirk' },
  guilty: { eyes: 'sad', brows: 'guilty', mouth: 'flat' },
  calm: { eyes: 'half', brows: 'neutral', mouth: 'smile' },
  scared: { eyes: 'surprised', brows: 'worried', mouth: 'wavy' },
  tired: { eyes: 'half', brows: 'sad', mouth: 'flat' },
};

/* =====================================================================
   Animación procedimental: genera pose a partir de (anim, fase t∈[0,1))
   ===================================================================== */
const ANIMS = {
  idle: { frames: 8, fps: 6, loop: true },
  walk: { frames: 8, fps: 11, loop: true },
  run: { frames: 8, fps: 15, loop: true },
  jump: { frames: 2, fps: 8, loop: true },
  fall: { frames: 2, fps: 8, loop: true },
  land: { frames: 3, fps: 14, loop: false },
  scan: { frames: 6, fps: 8, loop: true },
  sample: { frames: 6, fps: 8, loop: false },
  repair: { frames: 6, fps: 10, loop: true },
  program: { frames: 6, fps: 10, loop: true },
  talk: { frames: 6, fps: 7, loop: true },
  celebrate: { frames: 8, fps: 10, loop: true },
  frustrate: { frames: 6, fps: 8, loop: true },
  tool: { frames: 4, fps: 10, loop: true },
  hit: { frames: 3, fps: 10, loop: false },
  help: { frames: 4, fps: 6, loop: false },
  climb: { frames: 4, fps: 8, loop: true },
  sit: { frames: 4, fps: 3, loop: true },
  point: { frames: 4, fps: 6, loop: true },
  think: { frames: 6, fps: 4, loop: true },
  sad: { frames: 6, fps: 4, loop: true },
  wade: { frames: 8, fps: 8, loop: true },
};

function poseFor(anim, t, ch) {
  const S = Math.sin, C = Math.cos, P = TAU * t;
  const p = {
    bob: 0, lean: 0, headTilt: 0, headDX: 0, headDY: 0,
    hipF: 0, kneeF: 0, hipB: 0, kneeB: 0, footF: 0, footB: 0,
    shF: 0.1, elF: 0.25, shB: -0.1, elB: 0.25, handF: 'open', handB: 'open',
    expr: null, mouth: null, blink: false, hairSwing: 0, squash: 0, item: null, beam: 0,
    crouch: 0, eyeDY: 0,
  };
  const energetic = ch.energetic ?? 1;
  switch (anim) {
    case 'idle': {
      p.bob = Math.round((S(P) * 0.5 + 0.5) * 1);
      p.shF = 0.12 + S(P) * 0.03; p.shB = -0.12 - S(P) * 0.03;
      p.elF = 0.3; p.elB = 0.3;
      p.headTilt = S(P) * 0.02; p.hairSwing = S(P) * 0.6;
      p.hipF = 0.08; p.hipB = -0.06; p.kneeF = -0.02; p.kneeB = 0.02;
      p.blink = (t > 0.8 && t < 0.92);
      break;
    }
    case 'walk': case 'wade': {
      const sw = anim === 'wade' ? 0.35 : 0.5;
      p.hipF = S(P) * sw; p.hipB = -S(P) * sw;
      p.kneeF = -Math.max(0, -C(P)) * 0.8 - 0.05; p.kneeB = -Math.max(0, C(P)) * 0.8 - 0.05;
      p.footF = S(P) * 0.2; p.footB = -S(P) * 0.2;
      p.shF = -S(P) * 0.45; p.shB = S(P) * 0.45; p.elF = 0.35; p.elB = 0.35;
      p.bob = Math.round(Math.abs(C(P)) * 1.5); p.lean = 0.04 * energetic; p.hairSwing = -1 + S(P * 2) * 0.6;
      break;
    }
    case 'run': {
      p.hipF = S(P) * 0.85; p.hipB = -S(P) * 0.85;
      p.kneeF = -Math.max(0, -C(P)) * 1.6 - 0.15; p.kneeB = -Math.max(0, C(P)) * 1.6 - 0.15;
      p.footF = S(P) * 0.35; p.footB = -S(P) * 0.35;
      p.shF = -S(P) * 0.9; p.shB = S(P) * 0.9; p.elF = 1.4; p.elB = 1.4;
      p.bob = Math.round(Math.abs(C(P)) * 2.5) - 1; p.lean = 0.14 * energetic; p.hairSwing = -2.5 + S(P * 2);
      p.handF = 'fist'; p.handB = 'fist';
      break;
    }
    case 'jump': {
      p.hipF = 0.7; p.kneeF = -1.2; p.hipB = -0.25; p.kneeB = -0.5;
      p.shF = 2.5 + S(P) * 0.1; p.elF = 0.3; p.shB = -0.7; p.elB = 0.6; p.hairSwing = 2.5; p.lean = 0.05; p.expr = ch.jumpExpr || null;
      break;
    }
    case 'fall': {
      p.hipF = 0.3; p.kneeF = -0.5; p.hipB = -0.4; p.kneeB = -0.3;
      p.shF = 1.9 + S(P) * 0.2; p.elF = 0.4; p.shB = 2.4 - S(P) * 0.2; p.elB = 0.4; p.hairSwing = -3; p.lean = -0.03;
      break;
    }
    case 'land': {
      const k = 1 - t;
      p.crouch = Math.round(4 * k); p.hipF = 0.5 * k; p.kneeF = -1.0 * k; p.hipB = 0.3 * k; p.kneeB = -0.9 * k;
      p.shF = 0.5 * k; p.shB = 0.3 * k; p.elF = 0.5; p.elB = 0.5; p.hairSwing = 2 * k; p.lean = 0.12 * k;
      break;
    }
    case 'scan': {
      p.shF = 1.45 + S(P) * 0.05; p.elF = 0.15; p.item = 'scanner'; p.beam = 1;
      p.shB = 0.3; p.elB = 1.2; p.headTilt = 0.04 + S(P) * 0.02; p.bob = Math.round(S(P) * 0.5 + 0.5);
      p.hipF = 0.15; p.hipB = -0.1; p.expr = 'thinking';
      break;
    }
    case 'sample': {
      const k = S(Math.min(1, t * 1.6) * Math.PI / 2);
      p.crouch = Math.round(9 * k); p.lean = 0.35 * k; p.hipF = 1.1 * k; p.kneeF = -1.9 * k; p.hipB = 0.2 * k; p.kneeB = -1.5 * k;
      p.shF = 0.6 * k + 0.1; p.elF = 0.2; p.shB = 0.2; p.elB = 0.8; p.item = 'vial'; p.headTilt = 0.15 * k;
      break;
    }
    case 'repair': {
      p.shF = 1.0 + S(P) * 0.5; p.elF = 0.9 + S(P) * 0.4; p.item = 'wrench'; p.shB = 0.6; p.elB = 1.1;
      p.lean = 0.1; p.bob = Math.round(Math.abs(S(P))); p.expr = 'determined'; p.hipF = 0.25; p.kneeF = -0.2;
      break;
    }
    case 'program': {
      p.shF = 0.7 + S(P * 2) * 0.06; p.elF = 1.4; p.shB = 0.6; p.elB = 1.6 + S(P * 2 + 1) * 0.06; p.item = 'tablet';
      p.headTilt = 0.12; p.expr = 'thinking';
      break;
    }
    case 'talk': {
      p.shF = 0.15 + Math.max(0, S(P)) * 0.9; p.elF = 0.6 + Math.max(0, S(P)) * 0.6; p.shB = -0.12; p.elB = 0.3;
      p.mouth = (Math.floor(t * 6) % 2) ? 'talk' : null; p.headTilt = S(P) * 0.03; p.bob = Math.round(S(P) * 0.5 + 0.5);
      break;
    }
    case 'celebrate': {
      const up = Math.max(0, S(P));
      p.bob = -Math.round(up * 6); p.shF = 2.9; p.elF = 0.2 + S(P * 2) * 0.2; p.shB = 2.5 + S(P) * 0.3; p.elB = 0.3;
      p.hipF = 0.4 * up; p.kneeF = -0.8 * up; p.hipB = -0.2 * up; p.kneeB = -0.6 * up; p.expr = 'joy'; p.hairSwing = 2 * up; p.handF = 'fist';
      break;
    }
    case 'frustrate': {
      p.shF = 2.7; p.elF = 2.3 + S(P * 2) * 0.1; p.shB = 2.5; p.elB = 2.3; p.expr = 'angry'; p.headTilt = -0.06 + S(P * 2) * 0.05;
      p.bob = Math.round(Math.abs(S(P * 2))); p.hipF = Math.abs(S(P)) * 0.4; p.kneeF = -Math.abs(S(P)) * 0.6;
      break;
    }
    case 'tool': {
      p.shF = 1.5; p.elF = 0; p.item = ch.tool || 'scanner'; p.beam = 0.5 + 0.5 * S(P); p.shB = 0.3; p.elB = 0.9; p.lean = 0.05;
      p.hipF = 0.25; p.hipB = -0.15; p.expr = 'determined';
      break;
    }
    case 'hit': {
      p.lean = -0.25 * (1 - t); p.shF = 1.2; p.shB = 1.6; p.elF = 0.8; p.elB = 0.8; p.expr = 'surprised'; p.hairSwing = 3; p.hipF = 0.2; p.kneeF = -0.3; p.squash = 1;
      break;
    }
    case 'help': {
      p.shF = 1.35 * Math.min(1, t * 2); p.elF = 0.05; p.lean = 0.12; p.shB = 0.1; p.elB = 0.4; p.expr = 'smile'; p.hipF = 0.3; p.kneeF = -0.15;
      break;
    }
    case 'climb': {
      p.shF = 2.6 + S(P) * 0.4; p.shB = 2.6 - S(P) * 0.4; p.elF = 0.6; p.elB = 0.6;
      p.hipF = 0.6 + S(P) * 0.4; p.kneeF = -1.2; p.hipB = 0.6 - S(P) * 0.4; p.kneeB = -1.2; p.handF = 'fist'; p.handB = 'fist'; p.back = true;
      break;
    }
    case 'sit': {
      p.crouch = 13; p.hipF = 1.5; p.kneeF = -1.55; p.hipB = 1.4; p.kneeB = -1.5; p.shF = 0.3; p.elF = 1.0; p.shB = 0.2; p.elB = 1.0; p.bob = Math.round(S(P) * 0.5 + 0.5); p.blink = t > 0.75;
      break;
    }
    case 'point': {
      p.shF = 1.6; p.elF = 0.05; p.handF = 'point'; p.shB = -0.05; p.elB = 0.3; p.headTilt = 0.02; p.hipF = 0.15; p.hipB = -0.1;
      break;
    }
    case 'think': {
      p.shF = 0.5; p.elF = 2.6; p.handF = 'fist'; p.shB = 0.3; p.elB = 1.5; p.expr = 'thinking'; p.headTilt = -0.08 + S(P) * 0.02;
      break;
    }
    case 'sad': {
      p.shF = 0.05; p.elF = 0.1; p.shB = -0.05; p.elB = 0.1; p.expr = 'sad'; p.headTilt = 0.18; p.headDY = 1; p.lean = 0.05; p.bob = Math.round(S(P) * 0.5 + 0.5);
      break;
    }
  }
  return p;
}

/* =====================================================================
   Constructor humanoide genérico 3/4 mirando a la derecha.
   Lienzo 64x80, pies en y≈78, centro x=30.
   ===================================================================== */
function buildHumanoid(R, D, pose, opts = {}) {
  const cx = 30 + (D.dx || 0);
  const crouch = pose.crouch || 0;
  const lean = pose.lean || 0;
  const scale = D.scale || 1;
  const legL1 = D.thigh * scale, legL2 = D.shin * scale;
  const hipY = 78 - D.footH - legL1 - legL2 + crouch + pose.bob;
  const footY = 78 - D.footH;
  // pelvis
  const pelvis = { x: cx, y: hipY };
  const waistY = hipY - D.pelvisH;
  const chestY = waistY - D.chestH * 0.5;
  const shoulderY = waistY - D.chestH + 2;
  const neckX = cx + Math.sin(lean) * (D.chestH + 4);
  const neckY = shoulderY - 1;
  const headCX = neckX + 1 + (pose.headDX || 0) + Math.sin(lean) * 2, headCY = neckY - D.headRY + 1 + (pose.headDY || 0);
  R.anchors = { cx, hipY, waistY, chestY, shoulderY, neckX, neckY, head: { x: headCX, y: headCY, rx: D.headRX, ry: D.headRY, tilt: pose.headTilt }, lean, pose };
  const M = D.mat;
  // ---- piernas: IK simplificada con ángulos de pose
  const hipFX = cx + 2, hipBX = cx - 2;
  const lf = limb(hipFX, hipY + 1, pose.hipF, legL1, pose.kneeF, legL2);
  const lb = limb(hipBX, hipY + 1, pose.hipB, legL1, pose.kneeB, legL2);
  // si el pie quedaría bajo el suelo, levanta ligeramente
  const clampFoot = (L) => { if (L.ey > footY) L.ey = footY; return L; };
  clampFoot(lf); clampFoot(lb);
  R.anchors.legF = lf; R.anchors.legB = lb;
  const legMat = M.legs, legW = D.legW;
  // pierna trasera
  R.capsule(hipBX, hipY + 1, lb.kx, lb.ky, legW, legW * 0.9, { ramp: legMat, base: 3, z: 10, group: 'legB', dark: 1 });
  R.capsule(lb.kx, lb.ky, lb.ex, lb.ey, legW * 0.9, legW * 0.75, { ramp: D.shinMat || legMat, base: 3, z: 11, group: 'legB', dark: 1 });
  footPart(R, lb.ex, lb.ey, pose.footB, D, 12, 'legB', 1);
  // pierna delantera
  R.capsule(hipFX, hipY + 1, lf.kx, lf.ky, legW, legW * 0.9, { ramp: legMat, base: 3, z: 40, group: 'legF' });
  R.capsule(lf.kx, lf.ky, lf.ex, lf.ey, legW * 0.9, legW * 0.75, { ramp: D.shinMat || legMat, base: 3, z: 41, group: 'legF' });
  footPart(R, lf.ex, lf.ey, pose.footF, D, 42, 'legF', 0);
  // ---- torso
  const tw = D.torsoW, th = D.chestH;
  const lx = Math.sin(lean) * th;
  const torsoPts = [
    [cx - tw * 0.55 + lx * 0.95, shoulderY - 1], [cx + tw * 0.62 + lx, shoulderY],
    [cx + tw * 0.58 + lx * 0.4, waistY], [cx + tw * 0.62, hipY + 2],
    [cx - tw * 0.6, hipY + 2], [cx - tw * 0.5 + lx * 0.4, waistY],
  ];
  if (D.torso) D.torso(R, { cx, hipY, waistY, shoulderY, tw, lx, pose, M, torsoPts });
  else R.poly(torsoPts, { ramp: M.top, base: 3, z: 30, group: 'torso', bevel: 4 });
  // cuello
  R.capsule(neckX - 1, neckY + 3, headCX - 1, headCY + D.headRY - 3, 2.6, 2.6, { ramp: M.skin, base: 2, z: 29, group: 'neck', bevel: 2 });
  // ---- brazos
  const shFX = cx + tw * 0.38 + lx, shBX = cx - tw * 0.38 + lx * 0.9;
  const armL1 = D.upperArm, armL2 = D.foreArm;
  const af = limb(shFX, shoulderY + 2, pose.shF, armL1, pose.elF, armL2);
  const ab = limb(shBX, shoulderY + 2, pose.shB, armL1, pose.elB, armL2);
  R.anchors.armF = af; R.anchors.armB = ab;
  const sleeve = M.sleeve || M.top;
  R.capsule(shBX, shoulderY + 2, ab.kx, ab.ky, D.armW, D.armW * 0.9, { ramp: sleeve, base: 3, z: 5, group: 'armB', dark: 1 });
  R.capsule(ab.kx, ab.ky, ab.ex, ab.ey, D.armW * 0.9, D.armW * 0.75, { ramp: D.foreMat || sleeve, base: 3, z: 6, group: 'armB', dark: 1 });
  handPart(R, ab, pose.handB, D, 7, 'armB', 1);
  R.capsule(shFX, shoulderY + 2, af.kx, af.ky, D.armW, D.armW * 0.9, { ramp: sleeve, base: 3, z: 80, group: 'armF' });
  R.capsule(af.kx, af.ky, af.ex, af.ey, D.armW * 0.9, D.armW * 0.75, { ramp: D.foreMat || sleeve, base: 3, z: 81, group: 'armF' });
  handPart(R, af, pose.handF, D, 82, 'armF', 0);
  // ---- cabeza
  const hx = headCX, hy = headCY;
  const tilt = pose.headTilt || 0;
  R.ellipse(hx, hy, D.headRX, D.headRY, { ramp: M.skin, base: 4, z: 50, group: 'head', bevel: D.headRX * 0.8 }, tilt);
  // mandíbula / mejilla hacia delante
  R.ellipse(hx + D.headRX * 0.35, hy + D.headRY * 0.45, D.headRX * 0.62, D.headRY * 0.5, { ramp: M.skin, base: 4, z: 51, group: 'head', bevel: 4 }, tilt);
  // oreja
  R.ellipse(hx - D.headRX * 0.42, hy + 1.5, 1.8, 2.4, { ramp: M.skin, base: 3, z: 52, group: 'ear', bevel: 1.5 });
  // pelo y accesorios específicos
  if (D.hair) D.hair(R, { hx, hy, rx: D.headRX, ry: D.headRY, pose, M, tilt });
  if (D.extra) D.extra(R, { cx, hipY, waistY, shoulderY, tw, lx, pose, M, af, ab, hx, hy, lf, lb });
  // ---- cara (sellos)
  R.stamp((pb) => {
    const exprName = pose.blink ? null : (pose.expr || opts.expr || 'neutral');
    const E = EXPR[exprName] || EXPR.neutral;
    const eyeY = Math.round(hy + D.eyeY);
    const e1x = Math.round(hx + D.eye1X), e2x = Math.round(hx + D.eye2X);
    const eo = { ink: D.eyeInk || '#1a0f20', iris: D.iris || '#5a3354', lash: D.lash || '#140a18', w: 2, h: D.eyeH || 4 };
    const eyeExpr = pose.blink ? 'blink' : E.eyes;
    FACE.eye(pb, e1x, eyeY, eyeExpr, eo);
    FACE.eye(pb, e2x, eyeY, eyeExpr, Object.assign({}, eo, { w: D.eye2W || 2 }));
    const bc = D.browCol || M.hair[1];
    if (!D.noBrows) { FACE.brow(pb, e1x - 1, eyeY - 2, E.brows, bc, 3, false); FACE.brow(pb, e2x, eyeY - 2, E.brows, bc, 2, true); }
    const mk = pose.mouth || E.mouth;
    FACE.mouth(pb, Math.round(hx + D.mouthX), Math.round(hy + D.mouthY), mk, { ink: D.mouthInk || '#4a1a20' });
    if (D.blush && (exprName === 'happy' || exprName === 'joy' || exprName === 'smile')) { pb.set(e1x - 1, eyeY + D.eyeH + 1, D.blush); pb.set(e1x, eyeY + D.eyeH + 1, D.blush); }
    if (D.freckles) { pb.set(e1x - 2, eyeY + 4, M.skin[3]); pb.set(e1x + 2, eyeY + 5, M.skin[3]); pb.set(e2x + 1, eyeY + 4, M.skin[3]); }
    if (D.nose !== false) pb.set(Math.round(hx + D.headRX * 0.86), Math.round(hy + D.eyeY + 3), M.skin[2]);
    if (D.faceStamp) D.faceStamp(pb, { hx, hy, eyeY, e1x, e2x, pose, exprName });
  }, 100);
  // ---- objeto en mano
  if (pose.item) itemPart(R, af, pose, D);
}

function footPart(R, x, y, ang, D, z, group, dark) {
  const fl = D.footL, fh = D.footH + 1;
  const a = ang || 0;
  const pts = [[x - 2.5, y - 2], [x + 1, y - 2.5], [x + fl * Math.cos(a), y - 1 + fl * Math.sin(a) * 0.5], [x + fl * Math.cos(a) + 0.5, y + fh - 1], [x - 3, y + fh]];
  R.poly(pts, { ramp: D.mat.shoes, base: 3, z, group, bevel: 1.5, dark });
  if (D.sole) R.stamp((pb) => { for (let k = 0; k < 2; k++) { const yy = Math.round(y + fh - 1) - k; let n = 0; for (let xx = Math.round(x - 4); xx <= Math.round(x + fl + 1); xx++) if (pb.alpha(xx, yy) && !pb.alpha(xx, yy + 1)) { pb.set(xx, yy, D.sole); n++; } if (n) break; } }, 90 + z * 0.01);
}
function handPart(R, A, kind, D, z, group, dark) {
  const r = D.handR || 2.2;
  const dx = A.ex - A.kx, dy = A.ey - A.ky, l = Math.hypot(dx, dy) || 1;
  const hx = A.ex + dx / l * 1.2, hy = A.ey + dy / l * 1.2;
  const mat = D.mat.gloves || D.mat.skin;
  if (kind === 'point') {
    R.circle(hx, hy, r * 0.9, { ramp: mat, base: 4, z, group, bevel: r, dark });
    R.capsule(hx, hy, hx + dx / l * 4, hy + dy / l * 4, 0.9, 0.7, { ramp: mat, base: 4, z: z + 0.1, group, dark });
  } else R.circle(hx, hy, kind === 'fist' ? r : r * 1.05, { ramp: mat, base: 4, z, group, bevel: r, dark });
  A.hx = hx; A.hy = hy;
}
function itemPart(R, A, pose, D) {
  const hx = A.hx, hy = A.hy;
  const dx = A.ex - A.kx, dy = A.ey - A.ky, l = Math.hypot(dx, dy) || 1, ux = dx / l, uy = dy / l;
  switch (pose.item) {
    case 'scanner': {
      const tx = hx + ux * 4, ty = hy + uy * 4;
      R.capsule(hx - ux, hy - uy, tx, ty, 1.8, 2.2, { ramp: RAMP.metal, base: 4, z: 85, group: 'item', bevel: 1.5 });
      R.circle(tx + ux * 1.2, ty + uy * 1.2, 1.6, { ramp: RAMP.cyan, base: 5, z: 86, group: 'item', flat: true });
      R.anchors.beam = { x: tx + ux * 2, y: ty + uy * 2, ux, uy, on: pose.beam };
      break;
    }
    case 'vial': R.capsule(hx, hy - 1, hx + 1, hy + 4, 1.2, 1.2, { ramp: RAMP.cyan, base: 5, z: 85, group: 'item', bevel: 1 }); break;
    case 'wrench': {
      const tx = hx + ux * 7 - uy * 2, ty = hy + uy * 7 + ux * 2;
      R.capsule(hx, hy, tx, ty, 1, 1, { ramp: RAMP.metal, base: 5, z: 85, group: 'item', bevel: 1, shiny: true });
      R.circle(tx, ty, 2.2, { ramp: RAMP.metal, base: 5, z: 85, group: 'item', bevel: 1 });
      break;
    }
    case 'tablet': R.box(hx + 2, hy - 1, 4, 3, 1, { ramp: RAMP.navy, base: 3, z: 85, group: 'item', bevel: 1 }); R.stamp(pb => { pb.rect(Math.round(hx), Math.round(hy - 3), 5, 3, '#56e5ff'); pb.set(Math.round(hx + 1), Math.round(hy - 3), '#e6fdff'); }, 120); break;
    case 'seeds': R.circle(hx + 1, hy + 1, 2.5, { ramp: RAMP.soil, base: 5, z: 85, group: 'item', bevel: 2 }); break;
    case 'anemometer': {
      R.capsule(hx, hy, hx + ux * 2, hy - 9, 0.7, 0.7, { ramp: RAMP.metal, base: 5, z: 85, group: 'item' });
      R.stamp(pb => { const t = (pose.phase || 0) * TAU * 2; const cx = Math.round(hx + ux * 2), cy = Math.round(hy - 9); for (let k = 0; k < 3; k++) { const a = t + k * 2.094; pb.line(cx, cy, cx + Math.cos(a) * 4, cy + Math.sin(a) * 1.5, '#cfe8ee'); pb.set(Math.round(cx + Math.cos(a) * 4), Math.round(cy + Math.sin(a) * 1.5), '#ff6b6b'); } }, 121);
      break;
    }
    case 'clipboard': R.box(hx + 2, hy, 3.5, 4.5, 0.5, { ramp: RAMP.sand, base: 6, z: 85, group: 'item', bevel: 1 }); R.stamp(pb => { for (let i = 0; i < 3; i++) pb.hline(Math.round(hx), Math.round(hx + 4), Math.round(hy - 2 + i * 2), '#7e4429'); }, 121); break;
    case 'kite': break;
  }
}

/* ---------- caché de sprites ---------- */
const SpriteCache = {
  map: new Map(),
  get(charId, anim, frame, opts = {}) {
    const k = charId + '|' + anim + '|' + frame + '|' + (opts.expr || '') + '|' + (opts.mouth || '') + '|' + (opts.variant || '');
    let c = this.map.get(k);
    if (!c) {
      const def = CHARS[charId];
      const A = ANIMS[anim] || ANIMS.idle;
      const t = (frame % A.frames) / A.frames;
      const pb = def.render(anim, t, opts);
      c = pb.toCanvas();
      c.anchors = pb.anchors;
      this.map.set(k, c);
      if (this.map.size > 2600) { const first = this.map.keys().next().value; this.map.delete(first); }
    }
    return c;
  },
};

/* Personajes registrados (se definen en 11_chars.js) */
const CHARS = {};

/** Dibuja personaje: (x,y) = pies en el mundo (coordenadas de pantalla) */
function drawChar(g, charId, anim, time, x, y, facing = 1, opts = {}) {
  const def = CHARS[charId];
  if (!def) return;
  const A = ANIMS[anim] || ANIMS.idle;
  let frame = Math.floor(time * A.fps * (opts.speed || 1));
  frame = A.loop ? frame % A.frames : Math.min(frame, A.frames - 1);
  const c = SpriteCache.get(charId, anim, frame, opts);
  const ox = def.ox ?? 30, oy = def.oy ?? 78;
  g.save();
  const dx = Math.round(x), dy = Math.round(y);
  if (opts.shadow !== false && def.shadow !== false) fshadow(g, dx, dy, def.shadowR || 9, 2, '#140d26', 0.5);
  if (facing < 0) { g.translate(dx, 0); g.scale(-1, 1); g.drawImage(c, -(c.width - ox), dy - oy); }
  else g.drawImage(c, dx - ox, dy - oy);
  g.restore();
  // rayo de escáner (dinámico)
  if (c.anchors && c.anchors.beam && opts.beam !== false) {
    const b = c.anchors.beam;
    const bx = facing < 0 ? dx + (ox - b.x) : dx - ox + b.x, by = dy - oy + b.y;
    drawScanBeam(g, bx, by, facing, opts.beamLen || 46);
  }
}
function drawScanBeam(g, x, y, facing, len) {
  const t = Game.time;
  for (let i = 0; i < len; i++) {
    const spread = i * 0.28;
    const xx = Math.round(x + facing * i);
    const lvl = 0.55 * (1 - i / len);
    fdither(g, xx, Math.round(y - spread), 1, Math.max(1, Math.round(spread * 2)), '#56e5ff', lvl);
    if ((i + Math.floor(t * 40)) % 7 === 0) fpx(g, xx, Math.round(y + Math.sin(i * 0.7 + t * 6) * spread), '#e6fdff');
  }
}

};

/** Textura de rizos: bucles con lado iluminado arriba-izquierda y sombra abajo-derecha */
function coilTexture(x, y, idx, ramp, cell = 4) {
  const row = Math.floor(y / cell);
  const ox = (row & 1) ? cell / 2 : 0;
  const ccx = Math.floor((x + ox) / cell) * cell + cell / 2 - ox, ccy = row * cell + cell / 2;
  const jx = (hash2(Math.floor((x + ox) / cell), row, 3) - 0.5) * 1.2;
  const dx = x + 0.5 - ccx - jx, dy = y + 0.5 - ccy;
  const d = Math.hypot(dx, dy);
  if (d > cell * 0.36 && d < cell * 0.62 && dx + dy > 0.4) return ramp[clamp(idx - 1, 1, ramp.length - 1)];
  if (d < cell * 0.3 && dx + dy < -0.3 && idx >= 3) return ramp[clamp(idx + 1, 1, ramp.length - 1)];
  return null;
}

function renderHumanoid(id, D, anim, t, opts) {
  const R = new Rig(64, 80);
  const pose = poseFor(anim, t, D);
  if (opts.expr && !pose.expr) pose.expr = opts.expr;
  if (opts.expr && anim === 'idle') pose.expr = opts.expr;
  if (opts.mouth) pose.mouth = opts.mouth;
  if (opts.item) pose.item = opts.item;
  buildHumanoid(R, D, pose, opts);
  const pb = R.render();
  pb.anchors = R.anchors;
  return pb;
}

const KIRU_EYES = {
  curioso: 'open', alegre: 'happy', alarmado: 'big', confundido: 'mixed', culpable: 'down', valiente: 'brave', agotado: 'tired', esperanzado: 'star',
  neutral: 'open', happy: 'happy', surprised: 'big', sad: 'down', worried: 'down', determined: 'brave', thinking: 'mixed', scared: 'big', joy: 'happy', tired: 'tired',
};
function renderKiru(anim, t, opts) {
  const R = new Rig(44, 36);
  const S = Math.sin, P = TAU * t;
  let bob = 0, legPh = 0, legAmp = 0, earTw = 0, tailA = 0, hop = 0, lean = 0;
  switch (anim) {
    case 'idle': bob = Math.round(S(P) * 0.6 + 0.4); earTw = (t > 0.6 && t < 0.75) ? 1 : 0; break;
    case 'walk': legPh = P; legAmp = 1.6; bob = Math.round(Math.abs(S(P * 2)) * 1); break;
    case 'run': legPh = P; legAmp = 2.6; bob = Math.round(Math.abs(S(P * 2)) * 2); lean = 0.15; break;
    case 'jump': hop = 0; legAmp = 0; earTw = -1; break;
    case 'fall': earTw = 2; break;
    case 'talk': bob = Math.round(S(P) * 0.6 + 0.4); earTw = Math.floor(t * 6) % 2; break;
    case 'celebrate': bob = -Math.round(Math.max(0, S(P)) * 5); earTw = 1; break;
    case 'scan': bob = 0; earTw = -1; break;
    default: bob = Math.round(S(P) * 0.6 + 0.4);
  }
  const by = 24 + bob + hop;
  const bx = 22;
  // cola con microturbina (detrás)
  const tx0 = bx - 7, ty0 = by + 1;
  const tx1 = bx - 13 + S(P) * 0.8, ty1 = by - 6 + Math.cos(P) * 0.6 - tailA;
  R.capsule(tx0, ty0, tx1, ty1, 2.2, 1.2, { ramp: MAT.kiruBody, base: 3, z: 1, group: 'tail', bevel: 2 });
  R.capsule(tx1, ty1, tx1 - 1, ty1 - 4, 1.2, 0.8, { ramp: MAT.kiruOrange, base: 4, z: 2, group: 'tail2', bevel: 1 });
  // patas traseras (oscuras)
  const leg = (x, ph, z, dark) => {
    const lift = Math.max(0, S(legPh + ph)) * legAmp;
    const fx = x + Math.cos(legPh + ph) * legAmp * 0.6;
    R.capsule(x, by + 3, fx, by + 8 - lift, 1.5, 1.3, { ramp: MAT.kiruBody, base: 3, z, group: 'leg' + z, dark, bevel: 1.2 });
    R.ellipse(fx + 0.5, by + 9 - lift, 2, 1.2, { ramp: MAT.ink, base: 3, z: z + 0.1, group: 'leg' + z, dark, bevel: 1 });
  };
  leg(bx - 5, Math.PI, 3, 1); leg(bx + 3, 0, 4, 1);
  // cuerpo
  R.ellipse(bx - 1, by + 1, 8, 5.4, { ramp: MAT.kiruBody, base: 4, z: 10, group: 'body', bevel: 4 }, lean * 0.5);
  // panel naranja del vientre (compartimento de muestras)
  R.ellipse(bx + 0.5, by + 3, 5, 2.6, { ramp: MAT.kiruOrange, base: 4, z: 11, group: 'belly', bevel: 2 });
  leg(bx - 4, 0, 12, 0); leg(bx + 4, Math.PI, 13, 0);
  // cabeza
  const hx = bx + 5 + lean * 4, hy = by - 7;
  // oreja trasera
  const earB = [[hx - 6, hy - 2], [hx - 9 - earTw, hy - 13 + Math.abs(earTw)], [hx - 1, hy - 5]];
  R.poly(earB, { ramp: MAT.kiruPanel, base: 3, z: 14, group: 'earB', bevel: 1.5, dark: 1 });
  R.ellipse(hx, hy, 8.4, 7, { ramp: MAT.kiruBody, base: 4, z: 20, group: 'head', bevel: 5 });
  // oreja delantera con celdas solares
  const earF = [[hx + 1, hy - 4], [hx + 3 + earTw * 0.5, hy - 15 + Math.abs(earTw)], [hx + 8, hy - 3]];
  R.poly(earF, { ramp: MAT.kiruPanel, base: 4, z: 25, group: 'earF', bevel: 1.5 });
  // pantalla facial
  R.ellipse(hx + 2.2, hy + 1, 5.6, 4.4, { ramp: MAT.ink, base: 2, z: 26, group: 'screen', bevel: 2, flat: true });
  // hocico naranja
  R.ellipse(hx + 7.4, hy + 3, 2.4, 1.8, { ramp: MAT.kiruOrange, base: 4, z: 27, group: 'nose', bevel: 1.5 });
  const mood = opts.expr || (anim === 'celebrate' ? 'alegre' : anim === 'scan' ? 'curioso' : 'curioso');
  const eyeMode = KIRU_EYES[mood] || 'open';
  const blink = anim === 'idle' && t > 0.85;
  R.stamp((pb) => {
    // celdas solares en orejas
    const ex = Math.round(hx + 3), ey = Math.round(hy - 9);
    pb.set(ex + 1, ey, '#9cc8ff'); pb.set(ex, ey + 2, '#4a86e8'); pb.set(ex + 2, ey + 2, '#4a86e8'); pb.set(ex + 1, ey + 4, '#9cc8ff');
    pb.hline(ex - 1, ex + 3, ey + 3, '#0a1846');
    pb.set(Math.round(hx + 3 + earTw * 0.5), Math.round(hy - 14 + Math.abs(earTw)), '#ff8e34');
    // ojos LED
    const c1 = '#56e5ff', c2 = '#e6fdff';
    const lx = Math.round(hx - 0.5), rx = Math.round(hx + 3.5), yy = Math.round(hy - 1);
    const twoEyes = (fn) => { fn(lx); fn(rx); };
    if (blink) twoEyes(x => pb.hline(x, x + 1, yy + 2, c1));
    else switch (eyeMode) {
      case 'happy': twoEyes(x => { pb.set(x, yy + 2, c1); pb.set(x + 1, yy + 1, c2); pb.set(x + 2, yy + 2, c1); }); break;
      case 'big': twoEyes(x => { pb.rect(x, yy, 2, 4, c1); pb.set(x, yy, c2); pb.set(x - 1, yy + 1, c1); pb.set(x + 2, yy + 2, c1); }); break;
      case 'mixed': pb.rect(lx, yy, 2, 4, c1); pb.set(lx, yy, c2); pb.hline(rx, rx + 1, yy + 2, c1); pb.set(rx + 2, yy, '#ffe14d'); break;
      case 'down': twoEyes(x => { pb.rect(x, yy + 2, 2, 2, c1); }); pb.set(lx - 1, yy + 1, c1); pb.set(rx + 2, yy + 1, c1); break;
      case 'brave': twoEyes(x => { pb.rect(x, yy + 1, 2, 3, c1); pb.set(x, yy + 1, c2); }); pb.set(lx - 1, yy, c1); pb.set(rx + 2, yy, c1); break;
      case 'tired': twoEyes(x => { pb.hline(x, x + 1, yy + 2, c1); pb.set(x, yy + 3, '#106884'); }); break;
      case 'star': twoEyes(x => { pb.set(x, yy + 1, '#ffe14d'); pb.set(x + 1, yy + 1, c2); pb.set(x + 1, yy, '#ffe14d'); pb.set(x + 1, yy + 2, '#ffe14d'); pb.set(x + 2, yy + 1, '#ffe14d'); }); break;
      default: twoEyes(x => { pb.rect(x, yy, 2, 4, c1); pb.set(x, yy, c2); });
    }
    if (anim === 'talk' && Math.floor(t * 6) % 2) pb.hline(Math.round(hx + 1), Math.round(hx + 3), Math.round(hy + 3), c1);
    // ventanilla del compartimento de muestras
    pb.rect(Math.round(bx), Math.round(by + 2), 3, 2, '#2a1a10'); pb.set(Math.round(bx + 1), Math.round(by + 2), '#56e5ff');
    // microturbina (aspas)
    const rx2 = Math.round(tx1 - 1), ry2 = Math.round(ty1 - 5);
    const ang = t * TAU * 2 + (anim === "run" ? t * TAU * 2 : 0);
    for (let k = 0; k < 3; k++) { const a = ang + k * TAU / 3; pb.line(rx2, ry2, rx2 + Math.round(Math.cos(a) * 3), ry2 + Math.round(Math.sin(a) * 1.5), '#ffe2b0'); }
    pb.set(rx2, ry2, '#ffffff');
  }, 100);
  const pb = R.render();
  pb.anchors = { head: { x: hx, y: hy } };
  return pb;
}
CHARS.kiru = { name: 'KIRU', render: renderKiru, ox: 22, oy: 34, shadowR: 7 };

/* Peinados y accesorios reutilizables                                 */
/* ------------------------------------------------------------------ */
const HAIR = {
  cap(R, o, ramp, opts = {}) {
    const { hx, hy, rx, ry } = o;
    const cap = SDF.sub(SDF.ellipse(hx - 1.2 + (opts.dx || 0), hy - 2.4 + (opts.dy || 0), rx + (opts.grow ?? 0.6), ry * (opts.sy || 0.86)), SDF.ellipse(hx + 5.8 + (opts.faceDX || 0), hy + 3.8 + (opts.faceDY || 0), 7.6, 7.4));
    R.custom(cap, [hx - rx - 4, hy - ry - 4, hx + rx + 4, hy + ry + 2], { ramp, base: 3, z: 55, group: 'hair', bevel: 4, shiny: true, texture: opts.texture });
  },
  strands(R, o, ramp, list, z = 56) {
    list.forEach(([ax, ay, bx, by, r1, r2], i) => R.capsule(o.hx + ax, o.hy + ay, o.hx + bx, o.hy + by, r1, r2 ?? r1 * 0.6, { ramp, base: 3, z: z + i * 0.01, group: 'strand' + i, bevel: r1, shiny: true, lineIdx: 1 }));
  },
  bun(R, o, ramp, dx = -5, dy = -9, r = 4.2) {
    R.circle(o.hx + dx, o.hy + dy, r, { ramp, base: 3, z: 54, group: 'bun', bevel: r, shiny: true });
    R.stamp(pb => { const x = Math.round(o.hx + dx), y = Math.round(o.hy + dy); pb.line(x - 3, y - 1, x + 2, y + 2, ramp[1]); pb.line(x - 2, y - 3, x + 3, y - 1, ramp[1]); }, 97);
  },
  braid(R, o, ramp, pts, tieCol) {
    pts.forEach(([x, y, r], i) => R.circle(x, y, r, { ramp, base: 3, z: 84 + i * 0.01, group: 'braid' + (i % 2), bevel: r, shiny: true, lineIdx: 1 }));
    if (tieCol) { const [x, y] = pts[pts.length - 1]; R.circle(x, y + 2, 1.2, { ramp: tieCol, base: 4, z: 85, group: 'tie', bevel: 1 }); }
  },
  spikes(R, o, ramp, list) {
    list.forEach(([ax, ay, bx, by, w], i) => R.poly([[o.hx + ax - w, o.hy + ay], [o.hx + ax + w, o.hy + ay + 0.5], [o.hx + bx, o.hy + by]], { ramp, base: 3, z: 53 + i * 0.01, group: 'spike' + i, bevel: 1.5, shiny: true, lineIdx: 1 }));
  },
};

/* ------------------------------------------------------------------ */
/* LIMEN — protocolo cristalino de agua, sal y píxeles                 */
/* ------------------------------------------------------------------ */
function renderLimen(anim, t, opts) {
  const R = new Rig(72, 100);
  const P = TAU * t;
  const cx = 36, cy = 46 + Math.round(Math.sin(P) * 1.5);
  const mood = opts.expr || 'calm'; // calm | alert | warn | speak | soft
  const L = RAMP.limen;
  const facet = (pts, base, z, group) => R.poly(pts, { ramp: L, base, z, group, flat: true, lineCol: '#0e2b4a' });
  const off = (i) => Math.sin(P + i * 1.3) * 1.2;
  // brazos flotantes (fragmentos)
  for (const side of [-1, 1]) {
    const ax = cx + side * 17, ay = cy - 2 + off(side + 2);
    facet([[ax, ay - 9], [ax + side * 3, ay - 1], [ax, ay + 10], [ax - side * 2, ay]], side < 0 ? 4 : 2, 2, 'arm' + side);
    facet([[ax, ay - 9], [ax - side * 2, ay], [ax, ay + 10]], side < 0 ? 5 : 3, 2.1, 'armb' + side);
    facet([[ax + side * 1, ay + 13], [ax + side * 3, ay + 17], [ax + side * 1, ay + 21], [ax - side, ay + 17]], 3, 2.2, 'armc' + side);
  }
  // corona de fragmentos alrededor del núcleo
  for (let i = 0; i < 7; i++) {
    const a = -Math.PI / 2 + i * TAU / 7 + Math.sin(P) * 0.05;
    const r0 = 6, r1 = 15 + (i % 2) * 2;
    const x0 = cx + Math.cos(a) * r0, y0 = cy + Math.sin(a) * r0 * 1.1;
    const x1 = cx + Math.cos(a) * r1, y1 = cy + Math.sin(a) * r1 * 1.25;
    const nx = -Math.sin(a) * 3, ny = Math.cos(a) * 3;
    const light = Math.cos(a + 2.3) > 0 ? 4 : 2;
    facet([[x0 + nx * 0.4, y0 + ny * 0.4], [lerp(x0, x1, 0.55) + nx, lerp(y0, y1, 0.55) + ny], [x1, y1], [lerp(x0, x1, 0.55), lerp(y0, y1, 0.55)]], light + 1, 5 + i * 0.01, 's' + i);
    facet([[x0 - nx * 0.4, y0 - ny * 0.4], [lerp(x0, x1, 0.55) - nx, lerp(y0, y1, 0.55) - ny], [x1, y1], [lerp(x0, x1, 0.55), lerp(y0, y1, 0.55)]], light, 5.005 + i * 0.01, 'sb' + i);
  }
  // cabeza: diamante facetado
  const hy = cy - 27 + Math.round(off(5));
  facet([[cx, hy - 10], [cx + 7, hy], [cx, hy + 3]], 3, 20, 'h1');
  facet([[cx, hy - 10], [cx - 7, hy], [cx, hy + 3]], 5, 20.1, 'h2');
  facet([[cx - 7, hy], [cx, hy + 3], [cx, hy + 9]], 4, 20.2, 'h3');
  facet([[cx + 7, hy], [cx, hy + 3], [cx, hy + 9]], 1, 20.3, 'h4');
  // cuerpo inferior en cola de cristal
  const by = cy + 16;
  facet([[cx - 6, by], [cx, by - 3], [cx, by + 26 + off(7)]], 5, 8, 'b1');
  facet([[cx + 6, by], [cx, by - 3], [cx, by + 26 + off(7)]], 2, 8.1, 'b2');
  facet([[cx - 9, by + 14 + off(8)], [cx - 6, by + 12], [cx - 5, by + 20 + off(8)]], 4, 8.2, 'b3');
  facet([[cx + 9, by + 16 + off(9)], [cx + 6, by + 13], [cx + 6, by + 22 + off(9)]], 3, 8.3, 'b4');
  // núcleo-ojo
  const coreCol = mood === 'alert' ? RAMP.coral : mood === 'warn' ? RAMP.yellow : RAMP.cyan;
  R.circle(cx, cy, 5.2, { ramp: MAT.ink, base: 2, z: 30, group: 'coreRing', flat: true });
  R.circle(cx, cy, 4, { ramp: coreCol, base: 5, z: 31, group: 'core', bevel: 4, shiny: true });
  R.stamp(pb => {
    // pupila vertical
    const blink = anim === 'idle' && t > 0.88;
    if (blink) pb.hline(cx - 2, cx + 2, cy, '#0e2b4a');
    else { pb.vline(cx, cy - 2, cy + 2, '#0e2b4a'); if (mood === 'speak') pb.vline(cx + 1, cy - 1, cy + 1, '#0e2b4a'); }
    pb.set(cx - 2, cy - 2, '#ffffff');
    // brillos de arista
    pb.line(cx - 6, hy - 1, cx - 1, hy - 8, '#ffffff');
    pb.set(cx - 5, cy - 13, '#ffffff'); pb.set(cx + 10, cy - 6, '#c4fbff');
    // gotas orbitando
    for (let i = 0; i < 4; i++) {
      const a = P + i * TAU / 4;
      const x = Math.round(cx + Math.cos(a) * 24), y = Math.round(cy + 6 + Math.sin(a) * 6);
      pb.set(x, y, '#56e5ff'); pb.set(x, y - 1, '#e6fdff'); pb.set(x, y + 1, '#1491aa');
    }
    // cristales de sal (blancos)
    for (let i = 0; i < 3; i++) { const a = -P * 0.7 + i * 2.1; pb.set(Math.round(cx + Math.cos(a) * 30), Math.round(cy - 12 + Math.sin(a) * 9), '#fff2f8'); }
    // glitch de píxel
    const gy = Math.round(cy - 20 + ((t * 7) % 1) * 50);
    for (let x = 0; x < 72; x++) if (pb.alpha(x, gy) && hash2(x, gy, Math.floor(t * 8)) < 0.4) pb.set(x + 1, gy, '#b49cff');
  }, 100);
  const pb = R.render({ outlineColor: '#0b2238' });
  pb.anchors = { head: { x: cx, y: hy }, core: { x: cx, y: cy } };
  return pb;
}
CHARS.limen = { name: 'LIMEN', render: renderLimen, ox: 36, oy: 96, shadowR: 10 };

/* ------------------------------------------------------------------ */
/* MIRAGE / MOSAICO — gemelo digital                                    */
/* ------------------------------------------------------------------ */
const MOSAIC_LAYERS = ['#56e5ff', '#ffe14d', '#86e36f', '#20d6c7', '#ff7656', '#eab02a', '#8d6bff'];
function renderTwin(anim, t, opts, mosaic) {
  const R = new Rig(104, 136);
  const P = TAU * t;
  const cx = 52, hov = Math.round(Math.sin(P) * 2);
  const hy = 24 + hov;
  const iri = (x, y, idx, ramp) => {
    if (mosaic) {
      const cxl = Math.floor(x / 4), cyl = Math.floor((y - hov) / 4);
      if (x % 4 === 0 || (y - hov) % 4 === 0) return '#0e1a2a';
      const c = MOSAIC_LAYERS[Math.floor(hash2(cxl, cyl, 11) * MOSAIC_LAYERS.length)];
      return idx <= 2 ? shade(c, -0.25) : idx >= 5 ? shade(c, 0.15) : c;
    }
    const band = Math.floor((y * 0.5 + Math.sin(x * 0.15 + P) * 4 + t * 16) / 3) % 6;
    const cols = ['#a830b8', '#e050c8', '#ff8ad0', '#56e5ff', '#ffd0e8', '#6a1c94'];
    let c = cols[(band + 6) % 6];
    // curvas de nivel (mapa)
    const iso = Math.sin(x * 0.21 + y * 0.09) + Math.sin(y * 0.17 - x * 0.05 + P);
    if (Math.abs(iso) < 0.08) c = '#fff6ff';
    if ((x + y) % 9 === 0 && idx > 3) c = '#ffd84a';
    if (idx <= 1) c = shade(c, -0.35);
    return c;
  };
  // vestido amplio
  const gown = [[cx - 9, hy + 18], [cx + 9, hy + 18], [cx + 14, hy + 40], [cx + 30 + Math.sin(P) * 2, 128 + hov * 0.3], [cx - 30 - Math.sin(P) * 2, 128 + hov * 0.3], [cx - 14, hy + 40]];
  R.poly(gown, { ramp: RAMP.mirage, base: 4, z: 10, group: 'gown', bevel: 10, texture: iri });
  // brazos-cinta
  const armUp = anim === 'talk' || anim === 'point' ? Math.max(0, Math.sin(P)) : 0.2;
  for (const side of [-1, 1]) {
    const sx = cx + side * 10, sy = hy + 20;
    const ex = cx + side * (22 + armUp * 6), ey = sy + 22 - armUp * 18;
    R.capsule(sx, sy, ex, ey, 3, 2, { ramp: RAMP.mirage, base: side < 0 ? 4 : 3, z: side < 0 ? 5 : 20, group: 'arm' + side, bevel: 3, texture: iri });
    R.capsule(ex, ey, ex + side * 4, ey + 14 - armUp * 10, 2, 1, { ramp: RAMP.mirage, base: side < 0 ? 4 : 3, z: side < 0 ? 5.1 : 20.1, group: 'hand' + side, bevel: 2, texture: iri });
  }
  // cuello y cabeza-espejo
  R.capsule(cx, hy + 8, cx, hy + 19, 3.5, 5, { ramp: RAMP.mirage, base: 4, z: 12, group: 'neck', bevel: 3, texture: iri });
  R.ellipse(cx, hy, 10, 13, { ramp: mosaic ? RAMP.cyan : RAMP.mirage, base: 5, z: 15, group: 'head', bevel: 5,
    texture: mosaic ? iri : (x, y, idx) => {
      const k = (y - hy + 13) / 26;
      const sky = ['#ffd0e8', '#fff6ff', '#c4fbff', '#56e5ff', '#e050c8', '#6a1c94'];
      let c = sky[clamp(Math.floor(k * 6 + Math.sin(x * 0.4 + P) * 0.4), 0, 5)];
      if (Math.abs((x - cx) + (y - hy) * 0.6 + 3) < 1.2) c = '#ffffff';
      return idx <= 2 ? shade(c, -0.3) : c;
    } });
  // halo de datos (corona)
  R.stamp(pb => {
    for (let i = 0; i < 11; i++) {
      const a = -Math.PI + i * Math.PI / 10;
      const x = Math.round(cx + Math.cos(a) * 17), y = Math.round(hy - 2 + Math.sin(a) * 18);
      pb.set(x, y, mosaic ? MOSAIC_LAYERS[i % 7] : (i % 2 ? '#56e5ff' : '#ffd84a'));
    }
    if (mosaic) {
      // rostro amable visible
      pb.rect(cx - 5, hy - 1, 2, 3, '#0e1a2a'); pb.rect(cx + 3, hy - 1, 2, 3, '#0e1a2a');
      pb.set(cx - 5, hy - 1, '#ffffff'); pb.set(cx + 3, hy - 1, '#ffffff');
      pb.set(cx - 2, hy + 5, '#0e1a2a'); pb.hline(cx - 1, cx + 1, hy + 6, '#0e1a2a'); pb.set(cx + 2, hy + 5, '#0e1a2a');
    } else {
      // líneas de escaneo desplazadas (glitch)
      for (let k = 0; k < 3; k++) {
        const gy = Math.round(30 + ((t * 3 + k * 0.37) % 1) * 96);
        const row = []; for (let x = 0; x < 104; x++) row.push(pb.get(x, gy));
        for (let x = 0; x < 104; x++) if (row[x] >>> 24) pb.set(x + 2, gy, row[x]);
      }
    }
  }, 100);
  const pb = R.render({ outlineColor: mosaic ? '#06100a' : '#1d0b3a' });
  pb.anchors = { head: { x: cx, y: hy } };
  return pb;
}
CHARS.mirage = { name: 'MIRAGE', render: (a, t, o) => renderTwin(a, t, o, false), ox: 52, oy: 132, shadowR: 22 };
CHARS.mosaico = { name: 'MOSAICO', render: (a, t, o) => renderTwin(a, t, o, true), ox: 52, oy: 132, shadowR: 22 };

/* ------------------------------------------------------------------ */
/* BETA-9 — robot batería que expresa su SOC                            */
/* ------------------------------------------------------------------ */
function renderBeta(anim, t, opts) {
  const R = new Rig(40, 48);
  const P = TAU * t;
  const soc = (opts.variant ?? 6) / 10;
  const bob = Math.round(Math.sin(P) * 0.6 + 0.4);
  const cx = 20, by = 30 + bob;
  R.box(cx, 41, 9, 3, 2, { ramp: MAT.ink, base: 3, z: 1, group: 'tread', bevel: 1.5 });
  R.box(cx, by, 9, 11, 2.5, { ramp: RAMP.metal, base: 4, z: 5, group: 'body', bevel: 4 });
  R.box(cx, by - 12, 4, 1.6, 0.6, { ramp: RAMP.metal, base: 5, z: 6, group: 'cap', bevel: 1, shiny: true });
  for (const s of [-1, 1]) R.capsule(cx + s * 9, by - 2, cx + s * 12, by + 4 + (anim === 'talk' && s > 0 ? -Math.max(0, Math.sin(P)) * 6 : 0), 1.3, 1.1, { ramp: RAMP.metal, base: 3, z: s > 0 ? 8 : 0, group: 'arm' + s, bevel: 1 });
  R.stamp(pb => {
    // pantalla de SOC
    pb.rect(cx - 6, by - 8, 12, 8, '#0a1030');
    const col = soc < 0.2 ? '#ff4e5d' : soc < 0.4 ? '#ffb83e' : '#86e36f';
    const n = Math.round(soc * 10);
    for (let i = 0; i < 10; i++) pb.set(cx - 5 + i, by - 2, i < n ? col : '#1c2350');
    // carita
    if (soc < 0.25) { pb.set(cx - 3, by - 6, col); pb.set(cx + 2, by - 6, col); pb.hline(cx - 2, cx + 1, by - 4, col); pb.set(cx - 3, by - 3, col); pb.set(cx + 2, by - 3, col); }
    else { pb.set(cx - 3, by - 6, col); pb.set(cx + 2, by - 6, col); pb.set(cx - 3, by - 4, col); pb.hline(cx - 2, cx + 1, by - 3, col); pb.set(cx + 2, by - 4, col); }
    // franjas de módulo
    for (let y = by + 2; y < by + 9; y += 2) pb.hline(cx - 7, cx + 7, y, RAMP.metal[2]);
    pb.set(cx, by - 14, anim === 'talk' && (Math.floor(t * 6) % 2) ? '#ff4e5d' : '#ffe14d');
    pb.vline(cx, by - 13, by - 13, '#98c6d2');
  }, 100);
  const pb = R.render();
  pb.anchors = { head: { x: cx, y: by - 8 } };
  return pb;
}
CHARS.beta9 = { name: 'BETA-9', render: renderBeta, ox: 20, oy: 46, shadowR: 9 };

/* ------------------------------------------------------------------ */
/* NPC generativos                                                      */
/* ------------------------------------------------------------------ */
const NPC_CLOTH = [
  ['#2a0c22', '#4a1a3a', '#7a2a58', '#a83e78', '#d0609a', '#ec8cbc'],
  ['#0c2232', '#123a52', '#1a5a78', '#287ca0', '#3ea2c4', '#72c8e2'],
  ['#2a2006', '#4a3a0a', '#7a6010', '#a88818', '#d6b42a', '#f4dc5a'],
  ['#0e2a18', '#16442a', '#226640', '#328a56', '#4cae6c', '#7ed090'],
  ['#2a1006', '#4e200c', '#7c3814', '#ac5420', '#d87430', '#f4a050'],
  ['#1a1240', '#2a2066', '#3e3290', '#5648b6', '#7466d6', '#9a90ee'],
  ['#3a3a4a', '#5a5a70', '#7e7e96', '#a4a4ba', '#cacade', '#ececf8'],
  ['#3a0a0a', '#6a1414', '#9a2020', '#c83030', '#f04a40', '#ff8070'],
];
const SKINS = ['skinA', 'skinN', 'skinD', 'skinE', 'skinM'];
const NPC_HAIRS = [RAMP.hairA, RAMP.hairN, RAMP.hairD, RAMP.hairE, ['#1a1010', '#2e1c18', '#4a2e24', '#6a4432', '#8c5c42', '#ae7a56']];
function makeNPC(id, cfg) {
  const r = RNG(cfg.seed || 1);
  const skin = RAMP[cfg.skin || r.pick(SKINS)];
  const hairR = cfg.hair || r.pick(NPC_HAIRS);
  const top = cfg.top || r.pick(NPC_CLOTH), legs = cfg.legs || r.pick(NPC_CLOTH.concat([MAT.amayaPants, MAT.olive, MAT.tealPants]));
  const child = !!cfg.child;
  const style = cfg.style || r.pick(['short', 'bun', 'long', 'curly', 'cap', 'braid', 'bald']);
  const D = {
    thigh: child ? 6.5 : 10.5 + r.range(-0.5, 1), shin: child ? 6.5 : 10.5 + r.range(-0.5, 1), footH: 2, footL: child ? 4 : 5, pelvisH: child ? 3 : 4,
    chestH: child ? 9 : 13 + r.range(-0.5, 1), torsoW: (child ? 11 : 14 + r.range(-1, 2)) * (cfg.wide || 1),
    headRX: child ? 8.5 : 9, headRY: child ? 8.5 : 9, upperArm: child ? 5.5 : 8, foreArm: child ? 5 : 7.5, armW: child ? 1.9 : 2.3 * (cfg.wide || 1), legW: child ? 2.2 : 2.8, handR: 1.8,
    eyeY: 0.5, eye1X: 1, eye2X: 5.5, eyeH: child ? 4 : 3, mouthX: 4.5, mouthY: 6, iris: '#3a2a30', blush: child ? '#e07a6a' : null,
    mat: { skin, hair: hairR, top, sleeve: top, legs, shoes: cfg.shoes || MAT.boots },
    foreMat: cfg.shortSleeve ? skin : null,
    energetic: child ? 1.4 : 1,
    hair(R, o) {
      const { hx, hy } = o;
      if (style === 'bald') { HAIR.strands(R, o, hairR, [[-7, -1, -8, 4, 1.6]]); }
      else if (style === 'cap' || cfg.hat === 'cap') {
        HAIR.cap(R, o, hairR, { grow: 0.1, sy: 0.75 });
        const hc = cfg.hatCol || r.pick(NPC_CLOTH);
        R.custom(SDF.sub(SDF.ellipse(hx - 0.5, hy - 4.5, 9.5, 6.4), SDF.box(hx, hy + 4, 14, 6, 0)), [hx - 11, hy - 12, hx + 11, hy - 1], { ramp: hc, base: 3, z: 70, group: 'hat', bevel: 4 });
        R.box(hx + 7, hy - 2.4, 5, 1, 0.5, { ramp: hc, base: 2, z: 71, group: 'brim', bevel: 1 });
      } else {
        HAIR.cap(R, o, hairR, { grow: style === 'long' || style === 'curly' ? 1.2 : 0.4, sy: style === 'short' ? 0.8 : 0.9 });
        if (style === 'bun') HAIR.bun(R, o, hairR, -5, -8, 3.6);
        if (style === 'long') R.capsule(hx - 5, hy, hx - 6, hy + 14, 4, 3, { ramp: hairR, base: 3, z: 3, group: 'longhair', bevel: 3, shiny: true });
        if (style === 'curly') [[-6, -6, 3], [-8, 0, 3], [-2, -9, 3], [3, -8, 2.6], [-7, 5, 2.6]].forEach(([dx, dy, rr], i) => R.circle(hx + dx, hy + dy, rr, { ramp: hairR, base: 3, z: 56 + i * 0.01, group: 'c' + i, bevel: rr, shiny: true, lineIdx: 1 }));
        if (style === 'braid') { const pts = []; for (let i = 0; i < (child ? 4 : 6); i++) pts.push([hx - 6 - i * 0.3, hy + 4 + i * 2.4, 1.9]); HAIR.braid(R, o, hairR, pts, RAMP.coral); }
        if (child && cfg.pigtails) { R.circle(hx - 9, hy - 1, 2.6, { ramp: hairR, base: 3, z: 3, group: 'pt1', bevel: 2 }); R.circle(hx - 7, hy + 5, 2.4, { ramp: hairR, base: 3, z: 3, group: 'pt2', bevel: 2 }); }
      }
      if (cfg.hat === 'bucket') {
        const hc = cfg.hatCol || NPC_CLOTH[1];
        R.ellipse(hx - 0.5, hy - 7.5, 8, 4.5, { ramp: hc, base: 3, z: 70, group: 'hatC', bevel: 3 });
        R.ellipse(hx + 0.5, hy - 4.6, 11.5, 2.2, { ramp: hc, base: 2, z: 71, group: 'hatB', bevel: 1.5 });
      }
      if (cfg.hat === 'aviator') {
        R.custom(SDF.sub(SDF.ellipse(hx - 0.5, hy - 3, 10, 8), SDF.ellipse(hx + 6, hy + 4, 7.6, 7.2)), [hx - 12, hy - 12, hx + 12, hy + 8], { ramp: MAT.leather, base: 3, z: 70, group: 'av', bevel: 3 });
        R.ellipse(hx + 3, hy - 7.5, 2.4, 1.8, { ramp: RAMP.metal, base: 5, z: 72, group: 'g1', bevel: 1, shiny: true });
        R.ellipse(hx - 2, hy - 8.5, 2.4, 1.8, { ramp: RAMP.metal, base: 4, z: 72, group: 'g2', bevel: 1, shiny: true });
      }
      if (cfg.flowers) R.stamp(pb => { [[-4, -9, '#f78acb'], [0, -10, '#ffe14d'], [4, -9, '#56e5ff'], [-7, -6, '#86e36f']].forEach(([dx, dy, c]) => { pb.set(Math.round(hx + dx), Math.round(hy + dy), c); pb.set(Math.round(hx + dx + 1), Math.round(hy + dy), '#fff'); }); }, 98);
    },
    torso: cfg.apron || cfg.vest || cfg.raincoat ? (R, o) => {
      const { cx, hipY, waistY, shoulderY, tw, lx, torsoPts } = o;
      R.poly(torsoPts, { ramp: top, base: 3, z: 30, group: 'torso', bevel: 6 });
      if (cfg.apron) R.poly([[cx - 3 + lx * 0.6, shoulderY + 3], [cx + 7 + lx * 0.6, shoulderY + 3], [cx + 8, hipY + 9], [cx - 5, hipY + 9]], { ramp: cfg.apron, base: 3, z: 44, group: 'apron', bevel: 3 });
      if (cfg.vest) R.poly([[cx - tw * 0.55 + lx * 0.95, shoulderY], [cx + 1 + lx, shoulderY], [cx + 1, hipY + 2], [cx - tw * 0.6, hipY + 2]], { ramp: cfg.vest, base: 3, z: 31, group: 'vest', bevel: 3 });
      if (cfg.raincoat) R.stamp(pb => { pb.hline(Math.round(cx - 6), Math.round(cx + 7), Math.round(waistY - 2), '#fff08a'); pb.hline(Math.round(cx - 6), Math.round(cx + 7), Math.round(waistY - 1), '#c8d8e8'); }, 95);
    } : null,
    faceStamp(pb, o) {

/* =====================================================================
   12_props.js — Primitivas de escenografía pixel art.
   Prerender sobre PixelBuffer (estático) y dibujo dinámico sobre ctx.
   ===================================================================== */

const ART = {};

/* ---------- utilidades de color atmosférico ---------- */
ART.haze = (hex, haze, k) => mixHex(hex, haze, clamp(k, 0, 1));
ART.hazeRamp = (ramp, haze, k) => ramp.map(c => mixHex(c, haze, k));

/* ---------- Cielo ---------- */
/** Cielo en bandas tramadas. ramp de arriba (oscuro) a horizonte (claro). */
ART.sky = function (pb, ramp, horizonY, opts = {}) {
  const h = pb.h, w = pb.w;
  for (let y = 0; y < h; y++) {
    const t = clamp(y / horizonY, 0, 1);
    const tt = Math.pow(t, opts.curve || 1.25);
    for (let x = 0; x < w; x++) pb.data[y * w + x] = U(rampDither(ramp, tt, x, y));
  }
  if (opts.sun) ART.sunDisc(pb, opts.sun.x, opts.sun.y, opts.sun.r, opts.sun.cols, opts.sun.halo);
  if (opts.stars) {
    const r = RNG(opts.seed || 5);
    for (let i = 0; i < opts.stars; i++) {
      const x = r.int(0, w - 1), y = r.int(0, Math.floor(horizonY * 0.85));
      const b = r();
      pb.set(x, y, b > 0.9 ? '#ffffff' : b > 0.6 ? '#c8d0ff' : '#8a8ccb');
      if (b > 0.97) { pb.set(x - 1, y, '#5a6fb0'); pb.set(x + 1, y, '#5a6fb0'); pb.set(x, y - 1, '#5a6fb0'); pb.set(x, y + 1, '#5a6fb0'); }
    }
  }
};
/** Sol con halo de anillos tramados */
ART.sunDisc = function (pb, cx, cy, r, cols = ['#fff6d8', '#ffe878', '#ffd04a'], halo = '#fff0b8') {
  for (let y = Math.floor(cy - r * 3.2); y <= cy + r * 3.2; y++) for (let x = Math.floor(cx - r * 3.2); x <= cx + r * 3.2; x++) {
    const d = Math.hypot(x + 0.5 - cx, y + 0.5 - cy);
    if (d < r) { pb.set(x, y, d < r * 0.55 ? cols[0] : d < r * 0.85 ? cols[1] : cols[2]); }
    else if (d < r * 3.2) {
      const k = 1 - (d - r) / (r * 2.2);
      if (bayer4(x, y) < k * 0.55) pb.set(x, y, halo);
    }
  }
};
/** Nube pixel: racimo de círculos con base plana, sombreada en 4 tonos */
ART.cloudSprite = function (w, h, seed, pal) {
  const pb = new PixelBuffer(w, h);
  const r = RNG(seed);
  const blobs = [];
  const n = 4 + Math.floor(w / 18);
  for (let i = 0; i < n; i++) {
    const bx = lerp(w * 0.18, w * 0.82, i / (n - 1)) + r.range(-4, 4);
    const rad = (h * 0.32) * (1 - Math.abs(i / (n - 1) - 0.5) * 0.9) + r.range(0, h * 0.18);
    blobs.push([bx, h - rad * 0.9 - 2, rad]);
  }
  for (let i = 0; i < 3; i++) blobs.push([r.range(w * 0.3, w * 0.7), h * 0.45 + r.range(-3, 3), h * r.range(0.28, 0.4)]);
  const base = h - 3;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let inside = false, best = 0;
    for (const [bx, by, br] of blobs) {
      const d = Math.hypot(x + 0.5 - bx, y + 0.5 - by);
      if (d < br) { inside = true; const nyv = (y + 0.5 - by) / br, nxv = (x + 0.5 - bx) / br; best = Math.max(best, -nyv * 0.8 - nxv * 0.35); }
    }
    if (!inside || y > base) continue;
    const bottom = (y - (base - h * 0.28)) / (h * 0.28);
    let idx = best > 0.55 ? 3 : best > 0.05 ? 2 : best > -0.45 ? 1 : 0;
    if (bottom > 0.4) idx = Math.min(idx, 1);
    if (bottom > 0.8) idx = 0;
    // transición tramada entre tonos
    if (idx < 3 && bayer4(x, y) < 0.25 && best > (idx === 2 ? 0.45 : idx === 1 ? -0.05 : -0.55)) idx++;
    pb.set(x, y, pal[idx]);
  }
  return pb;
};

/* ---------- Perfiles de terreno ---------- */
/** Dibuja cordillera/mesetas: heightFn(x)→y superior. pal: rampa (oscura→clara). */
ART.ridge = function (pb, heightFn, pal, opts = {}) {
  const w = pb.w, h = pb.h;
  const tops = new Float32Array(w);
  for (let x = 0; x < w; x++) tops[x] = heightFn(x);
  for (let x = 0; x < w; x++) {
    const top = Math.round(tops[x]);
    const slope = (tops[Math.min(w - 1, x + 1)] - tops[Math.max(0, x - 1)]) * 0.5;
    for (let y = Math.max(0, top); y < h; y++) {
      const depth = y - top;
      let idx;
      if (opts.mesa) {
        // caras: lado izquierdo iluminado (pendiente negativa = subida hacia la derecha... luz desde izquierda)
        const face = slope < -0.6 ? 2 : slope > 0.6 ? -1 : 0;
        idx = opts.baseIdx + face;
        if (depth < 2) idx = opts.baseIdx + 2;
        // estratos
        if (opts.strata && ((y + Math.floor(fbm1(x * 0.02, 2, 9) * 6)) % opts.strata === 0)) idx -= 1;
        if (opts.strata && ((y + Math.floor(fbm1(x * 0.02, 2, 9) * 6)) % opts.strata === 1) && face >= 0) idx += 1;
      } else {
        idx = opts.baseIdx + (slope < -0.35 ? 1 : slope > 0.35 ? -1 : 0);
        if (depth < 1) idx += 1;
      }
      // degradado vertical hacia la base (bruma)
      if (opts.fadeTo) {
        const k = clamp((y - top) / (opts.fadeLen || 60), 0, 1);
        if (bayer4(x, y) < k * 0.9) idx = Math.min(idx, opts.fadeIdx ?? 0);
      }
      pb.set(x, y, pal[clamp(idx, 0, pal.length - 1)]);
    }
  }
  return tops;
};
/** Dunas: se pintan de atrás hacia delante; cara de barlovento iluminada, cara de
 *  sotavento sombreada con borde curvo, cresta resaltada y rizaduras del viento. */
ART.dunes = function (pb, yBase, amp, pal, seed, opts = {}) {
  const w = pb.w;
  const r = RNG(seed);
  const crests = [];
  let x = -r.range(20, 80);
  while (x < w + 100) { const width = r.range(opts.minW || 80, opts.maxW || 180); crests.push({ x, w: width, hgt: amp * r.range(0.55, 1), back: r.range(0, 8) }); x += width * r.range(0.5, 0.8); }
  crests.sort((a, b) => a.back - b.back || a.hgt - b.hgt);
  const top = new Float32Array(w).fill(1e9);
  const lit = opts.lit ?? 4, sh = opts.shadow ?? 2, body = lit - 1;
  for (const c of crests) {
    const peak = c.x + c.w * 0.6, base = Math.round(yBase + c.back), peakY = base - c.hgt;
    for (let xx = Math.max(0, Math.floor(c.x)); xx < Math.min(w, Math.ceil(c.x + c.w)); xx++) {
      let y, windward = xx < peak;
      if (windward) { const t = (xx - c.x) / (peak - c.x); y = base - c.hgt * Math.pow(Math.sin(t * Math.PI / 2), 1.5); }
      else { const t = (xx - peak) / (c.x + c.w - peak); y = base - c.hgt * Math.pow(1 - t, 1.25); }
      const y0 = Math.round(y);
      if (y0 < top[xx]) top[xx] = y0;
      for (let yy = y0; yy < pb.h; yy++) {
        const d = yy - y0;
        let idx;
        if (yy > base + 2) {
          // cuerpo compartido bajo la base: sin cortes verticales entre dunas
          idx = body;
          if (yy < base + 6 && bayer4(xx, yy) < (base + 6 - yy) / 5 * 0.5) idx = windward ? lit : sh + 1;
        } else if (windward) {
          idx = lit;
          if (d > c.hgt * 0.5 && bayer4(xx, yy) < 0.3) idx = body;
          if (opts.ripples && d > 2 && ((yy * 3 + Math.floor(Math.sin(xx * 0.09 + yy * 0.25) * 3)) % 8 === 0)) idx = body;
        } else {
          // cara de sotavento: la frontera luz/sombra se curva bajo la cresta
          const dd = yy - peakY;
          const edge = peak + Math.pow(Math.max(0, dd), 1.2) * 0.42;
          const k = xx - edge;
          idx = k > 1 ? sh : k > -1 ? (bayer4(xx, yy) < 0.5 ? sh : body) : body;
          if (k > 1 && k < 4 && bayer4(xx, yy) < 0.35) idx = sh + 1;
        }
        if (d === 0) idx = windward ? lit + 1 : (idx === sh ? sh + 1 : lit);
        pb.set(xx, yy, pal[clamp(idx, 0, pal.length - 1)]);
      }
    }
  }
  for (let xx = 0; xx < w; xx++) if (top[xx] > 1e8) top[xx] = yBase;
  return top;
};
/** Mar con degradado hacia el horizonte */
ART.sea = function (pb, y0, y1, pal, opts = {}) {
  for (let y = y0; y < y1; y++) {
    const t = (y - y0) / Math.max(1, y1 - y0);
    for (let x = 0; x < pb.w; x++) {
      const tt = opts.invert ? 1 - t : t;
      pb.set(x, y, rampDither(pal, tt * 0.9 + 0.05, x, y));
    }
  }
};

/* ---------- Vegetación ---------- */
ART.palm = function (pb, x, y, hgt, lean, seed, pal = RAMP.leaf) {
  const r = RNG(seed);
  // tronco segmentado
  let px = x, py = y;
  const segs = Math.floor(hgt / 3);
  for (let i = 0; i < segs; i++) {
    const t = i / segs;
    const nx = x + Math.sin(t * 1.4) * lean, ny = y - i * 3;
    pb.rect(Math.round(nx) - 2, Math.round(ny) - 3, 4, 3, '#8a5a3c');
    pb.set(Math.round(nx) - 2, Math.round(ny) - 3, '#5a3826'); pb.set(Math.round(nx) + 1, Math.round(ny) - 1, '#5a3826');
    pb.hline(Math.round(nx) - 2, Math.round(nx) + 1, Math.round(ny) - 1, '#6e452e');
    pb.set(Math.round(nx) - 1, Math.round(ny) - 3, '#b07a50');
    px = nx; py = ny - 3;
  }
  // hojas (frondas)
  const fronds = 7;
  for (let f = 0; f < fronds; f++) {
    const a = -Math.PI + (f / (fronds - 1)) * Math.PI + r.range(-0.15, 0.15);
    const len = hgt * r.range(0.45, 0.62);
    let fx = px, fy = py;
    for (let s = 0; s < len; s++) {
      const t = s / len;
      fx = px + Math.cos(a) * s; fy = py + Math.sin(a) * s * 0.55 + t * t * len * 0.45;
      const wdt = Math.round((1 - t) * 3) + 1;
      for (let k = -wdt; k <= wdt; k++) {
        const c = k < 0 ? pal[5] : k === 0 ? pal[6] : pal[3];
        pb.set(Math.round(fx), Math.round(fy) + k, c);
      }
      if (s % 2 === 0) pb.set(Math.round(fx), Math.round(fy) + wdt + 1, pal[2]);
    }
  }
  pb.disc(px, py + 1, 2, '#5a3826'); pb.set(Math.round(px) - 1, Math.round(py), '#c8861a'); pb.set(Math.round(px) + 1, Math.round(py) + 1, '#9a5e12');
};
/** Cactus columnar (cardón) */
ART.cactus = function (pb, x, y, hgt, seed, pal = RAMP.leaf) {
  const r = RNG(seed);
  const col = (cx, cy0, cy1, w) => {
    for (let yy = Math.round(cy1); yy <= cy0; yy++) {
      for (let k = -w; k <= w; k++) {
        const t = k / w;
        let idx = t < -0.4 ? 5 : t < 0.2 ? 4 : t < 0.7 ? 3 : 2;
        if (Math.abs(k) === w) idx = 1;
        if ((k + 64) % 2 === 0 && Math.abs(k) < w && idx > 2) idx -= 0;
        pb.set(Math.round(cx + k), yy, pal[idx]);
      }
      if ((yy % 4) === 0) for (let k = -w + 1; k < w; k += 2) pb.set(Math.round(cx + k), yy, '#fff6d8');
    }
    for (let k = -w + 1; k < w; k++) pb.set(Math.round(cx + k), Math.round(cy1) - 1, pal[k < 0 ? 5 : 4]);
  };
  const w = Math.max(2, Math.round(hgt / 14));
  col(x, y, y - hgt, w);
  const arms = r.int(1, 3);
  for (let i = 0; i < arms; i++) {
    const side = i % 2 ? 1 : -1;
    const ay = y - hgt * r.range(0.3, 0.6);
    const ax = x + side * (w + 3);
    const ah = hgt * r.range(0.25, 0.45);
    for (let k = 0; k <= 3; k++) pb.rect(Math.round(x + side * (w + k)), Math.round(ay - 1), 1, w * 2 - 1, pal[3]);
    col(ax, ay + w, ay - ah, Math.max(1, w - 1));
  }
  if (r.chance(0.6)) { pb.set(Math.round(x), Math.round(y - hgt - 2), '#f78acb'); pb.set(Math.round(x) + 1, Math.round(y - hgt - 2), '#ffd8ec'); }
};
/** Nopal / tuna */
ART.nopal = function (pb, x, y, size, seed, pal = RAMP.leaf) {
  const r = RNG(seed);
  const pads = [[0, 0, size, size * 1.3]];
  for (let i = 0; i < 3 + r.int(0, 2); i++) { const p = r.pick(pads); pads.push([p[0] + r.range(-size, size), p[1] - p[3] * r.range(0.7, 1.1), size * r.range(0.6, 0.9), size * r.range(0.8, 1.2)]); }
  for (const [px, py, rw, rh] of pads) {
    const cx = x + px, cy = y + py - rh;
    for (let yy = -rh; yy <= rh; yy++) for (let xx = -rw; xx <= rw; xx++) {
      const d = (xx * xx) / (rw * rw) + (yy * yy) / (rh * rh);
      if (d > 1) continue;
      let idx = xx < -rw * 0.3 && yy < 0 ? 5 : d > 0.75 ? 2 : 4;
      if (d > 0.92) idx = 1;
      pb.set(Math.round(cx + xx), Math.round(cy + yy), pal[idx]);
    }
    pb.set(Math.round(cx), Math.round(cy - rh * 0.3), '#fff6d8'); pb.set(Math.round(cx - rw * 0.4), Math.round(cy + rh * 0.2), '#fff6d8');
    if (r.chance(0.5)) { pb.disc(cx + rw * 0.2, cy - rh, 1.4, '#e05aa0'); pb.set(Math.round(cx + rw * 0.2) - 1, Math.round(cy - rh) - 1, '#ffc4dc'); }
  }
};
/** Agave */
ART.agave = function (pb, x, y, size, pal = ['#0f3b3a', '#1c5a50', '#2c7a66', '#4a9e7e', '#7cc4a0', '#b8e6c4']) {
  const leaves = 9;
  for (let i = 0; i < leaves; i++) {
    const a = -Math.PI * (0.08 + 0.84 * i / (leaves - 1));
    const len = size * (0.7 + 0.3 * Math.sin(i * 1.7));
    for (let s = 0; s < len; s++) {
      const t = s / len;
      const lx = x + Math.cos(a) * s, ly = y + Math.sin(a) * s;
      const wdt = Math.round((1 - t) * 2.2);
      for (let k = -wdt; k <= wdt; k++) pb.set(Math.round(lx + k * Math.sin(a) * 0.6), Math.round(ly), pal[k < 0 ? 4 : k === 0 ? 5 : 2]);
    }
    pb.set(Math.round(x + Math.cos(a) * len), Math.round(y + Math.sin(a) * len), '#c97c38');
  }
};
/** Arbusto xerófito */
ART.shrub = function (pb, x, y, r0, seed, pal = RAMP.moss) {
  const r = RNG(seed);
  const n = 5 + r.int(0, 4);
  for (let i = 0; i < n; i++) {
    const bx = x + r.range(-r0, r0), by = y - r.range(1, r0 * 0.9), br = r0 * r.range(0.4, 0.7);
    for (let yy = -br; yy <= br; yy++) for (let xx = -br; xx <= br; xx++) {
      const d = Math.hypot(xx, yy) / br;
      if (d > 1 || by + yy > y) continue;
      const lit = (-xx - yy) / br;
      let idx = lit > 0.5 ? 4 : lit > -0.2 ? 3 : 2;
      if (hash2(Math.round(bx + xx), Math.round(by + yy), seed) < 0.18) idx -= 1;
      if (d > 0.9) idx = 1;
      pb.set(Math.round(bx + xx), Math.round(by + yy), pal[clamp(idx, 0, pal.length - 1)]);
    }
  }
  if (r.chance(0.5)) for (let i = 0; i < 3; i++) pb.set(Math.round(x + r.range(-r0, r0)), Math.round(y - r.range(2, r0)), r.pick(['#ffe14d', '#f78acb', '#fffaf0']));
};
/** Mata de hierba / pasto */
ART.grass = function (pb, x, y, n, seed, pal = RAMP.leaf) {
  const r = RNG(seed);
  for (let i = 0; i < n; i++) {
    const gx = x + r.range(-n, n), h = r.int(2, 6), lean = r.range(-1.2, 1.2);
    for (let k = 0; k < h; k++) pb.set(Math.round(gx + lean * k / h), y - k, pal[k === h - 1 ? 6 : k > h / 2 ? 5 : 3]);
  }
};
/** Árbol frondoso (moringa / trupillo) */
ART.tree = function (pb, x, y, hgt, seed, pal = RAMP.leaf, trunk = ['#3a2218', '#5a3826', '#7a5236', '#9a6e4a']) {
  const r = RNG(seed);
  for (let i = 0; i < hgt * 0.45; i++) { const xx = x + Math.sin(i * 0.12) * 1.5; pb.rect(Math.round(xx) - 2, y - i, 4, 1, trunk[1]); pb.set(Math.round(xx) - 1, y - i, trunk[2]); pb.set(Math.round(xx) + 1, y - i, trunk[0]); }
  const cy = y - hgt * 0.6;
  const blobs = 7 + r.int(0, 4);
  for (let i = 0; i < blobs; i++) {
    const bx = x + r.range(-hgt * 0.38, hgt * 0.38), by = cy + r.range(-hgt * 0.22, hgt * 0.15), br = hgt * r.range(0.15, 0.25);
    for (let yy = -br; yy <= br; yy++) for (let xx = -br; xx <= br; xx++) {
      const d = Math.hypot(xx, yy) / br; if (d > 1) continue;
      const lit = (-xx * 0.6 - yy) / br;
      let idx = lit > 0.55 ? 6 : lit > 0.15 ? 5 : lit > -0.3 ? 4 : 3;
      if (hash2(Math.round(bx + xx) >> 1, Math.round(by + yy) >> 1, seed) < 0.2) idx--;
      if (d > 0.93) idx = 2;
      pb.set(Math.round(bx + xx), Math.round(by + yy), pal[clamp(idx, 0, pal.length - 1)]);
    }
  }
};

/* ---------- Arquitectura bioclimática de Aridia ---------- */
const HOUSE_COLS = [
  ['#7a2a3a', '#b04450', '#e06a70', '#f6a0a0', '#ffd0c8'],
  ['#0e5a5e', '#178a86', '#28b8aa', '#6ae0cc', '#c0f8ea'],
  ['#8a5e14', '#c08a20', '#eab02a', '#ffd86a', '#fff0b0'],
  ['#3a2a7a', '#5a44a8', '#8070d0', '#b0a4ec', '#e0dafc'],
  ['#8a3e1e', '#c06030', '#e8884a', '#f8b880', '#ffe2c4'],
  ['#2a5a2a', '#3e8040', '#5aa85a', '#90d080', '#c8f0b0'],
  ['#e8dcc0', '#f2e8d0', '#faf4e4', '#fffcf4', '#ffffff'],
];
ART.house = function (pb, x, y, w, h, seed, opts = {}) {
  const r = RNG(seed);
