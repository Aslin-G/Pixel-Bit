/**
 * DialogueScene: overlay. lines: [{who, text, expr, side, choices:[...]}]
 * onDone(result) → índice de elección (si hubo) o null.
 */
const DialogueScene = {
  overlay: true,
  enter(p) {
    this.lines = p.lines; this.i = 0; this.onDone = p.onDone; this.t = 0; this.choice = 0; this.result = null;
    this.bgDim = p.dim ?? 0.0; this.silence = 0;
    this.startLine();
  },
  startLine() {
    const L = this.lines[this.i];
    this.t = 0; this.shown = 0; this.done = false; this.choice = 0; this.lastBlip = 0;
    this.silence = L.pause || 0;
    this.full = String(L.text || '');
    this.plain = stripMarkup(this.full);
    announce((SPEAKERS[L.who] ? SPEAKERS[L.who].name + ': ' : '') + this.plain);
    if (L.sfx) Audio2.sfx(L.sfx);
    if (L.onShow) L.onShow();
  },
  update(dt) {
    const L = this.lines[this.i];
    if (this.silence > 0) { this.silence -= dt; return; }
    this.t += dt;
    const speed = 42 * Game.settings.dialogSpeed * (Input.down('fast') ? 3 : 1);
    if (!this.done) {
      const prev = Math.floor(this.shown);
      this.shown = Math.min(this.plain.length, this.shown + speed * dt);
      const cur = Math.floor(this.shown);
      if (cur > prev) {
        const ch = this.plain[cur - 1];
        const sp = SPEAKERS[L.who];
        if (sp && sp.voice && ch && ch !== ' ' && (cur % 2 === 0)) Audio2.sfx('voice', { voice: sp.voice, vol: 0.7 });
        if (ch === '.' || ch === '?' || ch === '!') this.silence = 0.12 / Game.settings.dialogSpeed;
      }
      if (this.shown >= this.plain.length) this.done = true;
    }
    const adv = Input.pressed('confirm') || Input.pressed('jump') || Input.pressed('interact') || (Input.pointer.pressed && !L.choices);
    if (Input.pressed('skip') && !L.choices && !L.noSkip) { this.done = true; this.shown = this.plain.length; this.next(); return; }
    if (L.choices) {
      if (!this.done) { if (adv) { this.done = true; this.shown = this.plain.length; } return; }
      return; // la elección la gestiona Gui en render
    }
    if (adv) {
      if (!this.done) { this.done = true; this.shown = this.plain.length; }
      else this.next();
    } else if (this.done && Game.settings.autoAdvance) { this.autoT = (this.autoT || 0) + dt; if (this.autoT > 1.6 + this.plain.length * 0.03) { this.autoT = 0; this.next(); } }
  },
  next(choiceIdx) {
    const L = this.lines[this.i];
    if (choiceIdx !== undefined) { this.result = choiceIdx; if (L.onChoose) L.onChoose(choiceIdx); }
    Audio2.sfx('soft', { vol: 0.4 });
    this.i++;
    if (this.i >= this.lines.length) { Game.pop(); this.onDone && this.onDone(this.result); }
    else this.startLine();
  },
  render(g) {
    const L = this.lines[this.i];
    if (!L) return;
    if (this.bgDim) fdither(g, 0, 0, W, H, '#05030f', this.bgDim);
    const sp = SPEAKERS[L.who] || SPEAKERS.narr;
    const big = Game.settings.textScale > 1;
    const boxH = big ? 104 : 86, boxY = H - boxH - 6;
    const side = L.side || (['amaya', 'kiru'].includes(L.who) ? 'left' : 'right');
    const hasP = sp.portrait && L.portrait !== false;
    // retrato grande sobre la caja
    if (hasP) {
      const talking = !this.done && (Math.floor(this.t * 9) % 2 === 0);
      const pc = Portraits.get(sp.portrait, L.expr || 'neutral', talking ? 1 : 0, (Math.floor(Game.time * 0.4) % 7 === 0) && (Game.time % 2.5) < 0.12);
      const px = side === 'left' ? 10 : W - 10 - 128;
      const py = boxY - 128 + 34;
      g.drawImage(pc, px, py);
    }
    UIK.panel(g, 6, boxY, W - 12, boxH, L.who === 'mirage' ? 'mirage' : L.who === 'limen' ? 'limen' : L.who === 'mosaico' ? 'mosaic' : 'dialog');
    const tx = hasP && side === 'left' ? 146 : 16;
    const tw = hasP ? W - 12 - 150 : W - 36;
    // placa de nombre
    if (sp.name) {
      const nw = FONTS.main.measure(sp.name) + 16;
      const nx = hasP && side === 'left' ? 140 : (hasP ? W - 146 - nw : 14);
      frect(g, nx, boxY - 9, nw, 13, '#0a0718'); frect(g, nx + 1, boxY - 8, nw - 2, 11, sp.color);
      fdither(g, nx + 1, boxY - 8, nw - 2, 5, '#ffffff', 0.25);
      drawText(g, sp.name, nx + nw / 2, boxY - 6, { align: 'center', color: '#0a0718' });
    }
    const opts = { color: '#fffaf0', shadow: '#0a0718', scale: big ? 1 : 1 };
    drawTextBlock(g, this.full, tx, boxY + 12, tw, Object.assign({ max: Math.floor(this.shown), lineH: big ? 13 : 11 }, opts));
    if (L.choices && this.done) {
      Gui.begin();
      const n = L.choices.length;
      const cw = Math.min(280, (W - 40) / Math.min(n, 2) - 8);
      let cy = boxY - 8 - n * 22;
      L.choices.forEach((c, k) => {
        const by = cy + k * 22;
        UIK.panel(g, W / 2 - cw / 2 - 4, by - 2, cw + 8, 22, 'glass');
        if (Gui.button(g, 'ch' + k, W / 2 - cw / 2, by, cw, 18, c, { style: 'choice' })) this.next(k);
      });
      Gui.end();
    } else if (this.done) {
      const bx = W - 22, by = boxY + boxH - 12 + Math.round(Math.sin(Game.time * 6));

    }
    drawText(g, 'X: saltar', W - 16, boxY + 4, { font: 'tiny', color: '#5a5e80', align: 'right' });
  },
};

/** Muestra diálogo y devuelve promesa con el resultado */
function talk(lines, opts = {}) {
  return new Promise((res) => { Game.push(DialogueScene, Object.assign({ lines: lines.map(normLine), onDone: res }, opts)); });
}
function normLine(l) {
  if (Array.isArray(l)) { const [who, expr, text, extra] = l; return Object.assign({ who, expr, text }, extra || {}); }
  return l;
}

    if (!ids.length) { drawTextBlock(g, 'Aún no hay pistas. Observa anomalías, conversa y escanea: cada evidencia aparecerá aquí con su interpretación aparente. Las revelaciones de la historia las reinterpretarán.', 50, 120, W - 100, { color: '#3a1a10', align: 'center' }); return; }
    const cols = 3, cw = (W - 80) / cols, ch = 92;
    const pos = ids.map((id, i) => [36 + (i % cols) * cw, 40 + Math.floor(i / cols) * (ch + 4)]);
    // hilos rojos entre pistas del mismo giro
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) if (CLUES[ids[i]].payoff === CLUES[ids[j]].payoff) {
      const [ax, ay] = pos[i], [bx, by] = pos[j];
      const sag = 10;
      for (let k = 0; k <= 30; k++) { const t = k / 30; fpx(g, lerp(ax + cw / 2, bx + cw / 2, t), lerp(ay + 6, by + 6, t) + Math.sin(t * Math.PI) * sag, '#d8343c'); }
    }
    Gui.begin();
    ids.forEach((id, i) => {
      const C = CLUES[id], [x, y] = pos[i];
      const rev = clueRevealed(id);
      const tilt = ((i * 37) % 5) - 2;
      frect(g, x + 2, y + 2, cw - 8, ch, '#5a2e12');
      frect(g, x, y + tilt * 0, cw - 8, ch, rev ? '#e6ffe0' : '#fff6d8');
      frect(g, x, y, cw - 8, 2, rev ? '#86e36f' : '#ffe14d');
      fdisc(g, x + cw / 2 - 4, y + 4, 3, '#d8343c'); fpx(g, x + cw / 2 - 5, y + 3, '#ff9a8a');
      drawTextBlock(g, C.title, x + 4, y + 9, cw - 16, { color: '#3a1a10', font: 'main' });
      const yy = y + 9 + textHeight(C.title, cw - 16) + 2;
      drawTextBlock(g, (rev ? '{g}REAL:{/} ' + C.real : '{o}PARECE:{/} ' + C.apparent), x + 4, yy, cw - 16, { color: '#5a3020', font: 'main' });
      if (rev) { drawText(g, 'REINTERPRETADA', x + cw - 12, y + ch - 9, { font: 'tiny', color: '#1f854c', align: 'right' }); }
      if (Gui.button(g, 'clue' + id, x, y, cw - 8, ch, '', { style: 'ghost', noDraw: true, tip: C.seen })) { }
    });
    Gui.end();
    Gui.renderTooltip(g);
    drawText(g, 'Pasa el cursor sobre una pista para ver la observación original · ESC para cerrar', W / 2, H - 22, { font: 'tiny', align: 'center', color: '#3a1a10' });
  },
};

/* ===== 32_gameplay.js ===== */
/* =====================================================================
   32_gameplay.js — Escena de juego: carga de nivel, bucle de mundo,
   interacción, herramientas, Lente Nexo, HUD, guiones asíncronos.
   ===================================================================== */

const LEVELS = {};

const GameplayScene = {
  touchControls: true,
  enter(p) {
    this.levelId = p.level;
    const def = LEVELS[p.level];
    this.def = def;
    this.cam = new Camera(); Game.cam = this.cam;
    this.world = new World(def, this);
    this.terrainC = renderTerrain(this.world);
    this.backdrop = (BIOMES[def.biome] || BIOMES.coast)(def);
    this.propsC = null;
    if (def.props) { const pb = new PixelBuffer(this.world.w, this.world.h); def.props(pb, this.world); this.propsC = pb.toCanvas(); }
    if (def.propsFront) { const pb = new PixelBuffer(this.world.w, this.world.h); def.propsFront(pb, this.world); this.propsFrontC = pb.toCanvas(); } else this.propsFrontC = null;
    const sp = (p.checkpoint && def.checkpoints && def.checkpoints[p.checkpoint]) || def.spawn;
    this.player = this.world.add(new Player({ x: sp.x, y: sp.y, facing: sp.facing || 1 }));
    this.kiru = def.noKiru ? null : this.world.add(new Kiru({ x: sp.x - 30, y: sp.y }));
    this.cam.bounds = { x: 0, y: 0, w: this.world.w, h: this.world.h };
    this.cam.snap(this.player);
    this.lens = false; this.lensT = 0;
    this.cutscene = 0; this.waiters = []; this.timers = new Timers();
    this.objective = null; this.hintLevel = 0;
    this.chapterCard = { t: 0, title: def.title, sub: def.chapter };
    this.state = {}; // estado de guion del nivel
    this.time = 0;
    this.grade = def.grade || null;
    GS.s.level = p.level; GS.s.scene = 'level';
    if (!GS.s.unlocked.includes(p.level)) GS.s.unlocked.push(p.level);
    LearningModel.startLevel(p.level);
    if (def.portraits) Portraits.warm(def.portraits);
    Audio2.playMusic(def.music || 'coast');
    Audio2.setAmbience(def.ambience || { sea: 0.5, wind: 0.3, birds: 0.5 });
    if (def.setup) def.setup(this, p);
    this.cam.snap(this.player);
  },
  resume() { Audio2.playMusic(this.musicOverride || this.def.music || 'coast'); },
  exit() { },
  inputEnabled() { return this.cutscene === 0 && Game.top() === this && !Game.fade.busy; },
  /* ---------- API de guion ---------- */
  run(fn) {
    this.cutscene++;
    const done = () => { this.cutscene = Math.max(0, this.cutscene - 1); };
    return Promise.resolve().then(() => fn(this)).then((r) => { done(); return r; }, (e) => { done(); console.error(e); });
  },
  until(pred) { return new Promise(res => this.waiters.push({ pred, res })); },
  wait(t) { const end = this.time + t; return this.until(() => this.time >= end); },
  say(lines, opts) { return talk(Array.isArray(lines[0]) || typeof lines[0] === 'object' ? lines : [lines], opts); },
  walk(actor, x, speed = 70) { const tg = { x, speed, done: false }; actor.target = tg; return this.until(() => tg.done); },
  camTo(x, y, t = 1) {
    const sx = this.cam.x, sy = this.cam.y, start = this.time;
    this.camLock = true;
    return this.until(() => { const k = smooth(clamp((this.time - start) / t, 0, 1)); this.cam.x = lerp(sx, x - W / 2, k); this.cam.y = lerp(sy, (y ?? sy + H * 0.62) - H * 0.62, k); this.cam.clamp(); return k >= 1; });
  },
  camRelease() { this.camLock = false; },
  open(scene, params = {}) { return new Promise(res => Game.push(scene, Object.assign({}, params, { onDone: res, gameplay: this }))); },
  setObjective(text, hints = [], opts = {}) {
    this.objective = { text, hints, t: 0, icon: opts.icon || 'target' };
    this.hintLevel = 0;
    announce('Objetivo: ' + stripMarkup(text));
  },
  actor(id, charId, x, opts = {}) { return this.world.add(new Actor(Object.assign({ id, charId, x, y: this.world.groundAt(x) }, opts))); },
  station(o) { return this.world.add(new Station(Object.assign({ y: o.y ?? this.world.groundAt(o.x) }, o))); },
  /* ---------- bucle ---------- */
  update(dt) {
    this.time += dt;
    this.chapterCard.t += dt;
    // esperas de guion
    if (this.waiters.length) { const ws = this.waiters; this.waiters = []; for (const w of ws) { if (w.pred()) w.res(); else this.waiters.push(w); } }
    this.timers.update(dt);
    const W_ = this.world;
    W_.time += dt;
    // entrada
    if (this.inputEnabled()) this.handleInput();
    for (const e of W_.entities) if (!e.dead) e.update(dt);
    W_.entities = W_.entities.filter(e => !e.dead);
    W_.ps.wind = (this.backdrop.weather.wind || 0) * 60;
    W_.ps.update(dt);
    if (!this.camLock) this.cam.follow(this.player, dt, this.def.cam || {});
    this.cam.update(dt);
    if (this.def.update) this.def.update(this, dt);
    // disparadores por posición
    if (this.def.triggers) for (const tr of this.def.triggers) {
      if (tr.done || (tr.flag && !GS.flag(tr.flag)) || (tr.notFlag && GS.flag(tr.notFlag))) continue;
      if (this.player.x >= tr.x && this.player.x <= tr.x + (tr.w || 20) && this.cutscene === 0) { tr.done = !tr.repeat; tr.run(this); }
    }
    if (this.lens) this.lensT = Math.min(1, this.lensT + dt * 4); else this.lensT = Math.max(0, this.lensT - dt * 4);
    if (this.objective) this.objective.t += dt;
    GS.s.stats.playTime += dt;
  },
  nearestInteract() {
    const P = this.player;
    let best = null, bd = 1e9;
    for (const e of this.world.entities) {
      if (e instanceof Station && e.near(P)) { const d = Math.abs(e.x - P.x); if (d < bd) { bd = d; best = e; } }
      if (e instanceof Actor && !e.hidden && e.talkable && e.onTalk && Math.abs(e.x - P.x) < 30 && Math.abs(e.y - P.y) < 40) { const d = Math.abs(e.x - P.x) + 4; if (d < bd) { bd = d; best = e; } }
    }
    return best;
  },
  handleInput() {
    const P = this.player;
    if (Input.pressed('pause')) { Game.push(PauseScene, { gameplay: this }); Audio2.sfx('uiBack'); return; }
    if (Input.pressed('interact')) {
      const it = this.nearestInteract();
      if (it) {
        Audio2.sfx('confirm');
        if (it instanceof Station) { it.onUse && this.run(async () => { P.vx = 0; P.facing = sign(it.x - P.x) || P.facing; await it.onUse(this, it); }); }
        else if (it instanceof Actor) { this.run(async () => { P.vx = 0; P.facing = sign(it.x - P.x) || P.facing; it.facing = -P.facing; await it.onTalk(this, it); }); }
        return;
      }
    }
    if (Input.pressed('lens')) {
      if (GS.hasTool('lente')) { this.lens = !this.lens; Audio2.sfx(this.lens ? 'scan' : 'uiBack', { vol: 0.6 }); if (this.lens) LearningModel.note('lensUse'); }
      else Game.toast('La {c}Lente Nexo{/} aún no está calibrada', 'lock', '#8a8fb8', 2);
    }
    if (Input.pressed('tool')) this.useTool();
    if (Input.pressed('codex')) { Game.push(CodexScene, {}); return; }
    if (Input.pressed('data')) { Game.push(EvidenceScene, {}); return; }
    if (Input.pressed('map')) { Game.push(PauseScene, { gameplay: this, tab: 'map' }); return; }
    if (Input.pressed('hint')) this.showHint();
  },
  showHint() {
    const o = this.objective;
    if (!o || !o.hints || !o.hints.length) { this.kiru && this.kiru.say('Mi radar de pistas no detecta nada aquí. Explora y conversa.', 'confundido'); return; }
    const h = o.hints[Math.min(this.hintLevel, o.hints.length - 1)];
    const lbl = ['Pregunta', 'Evidencia', 'Demostración parcial'][Math.min(this.hintLevel, 2)];
    this.kiru && this.kiru.say(lbl + ': ' + h, 'curioso', 6);
    this.hintLevel = Math.min(this.hintLevel + 1, o.hints.length - 1);
    GS.s.stats.hints++; GS.lp(this.levelId).hints++;
    LearningModel.note('hint');
  },
  useTool() {
    const P = this.player;
    if (this.def.onTool && this.def.onTool(this) === true) return;
    // corrige adversarios conceptuales cercanos
    const adv = this.world.entities.find(e => e instanceof Adversary && !e.calm && Math.abs(e.x - P.x) < 90 && Math.abs(e.y - (P.y - 28)) < 60);
    if (adv && GS.s.tools.length) {
      this.run(async () => {
        P.forcedAnim = 'tool'; Audio2.sfx('scan');
        await this.wait(0.4); P.forcedAnim = null;
        const ok = await this.open(MicroCheckScene, { advType: adv.type, quiz: adv.quiz });
        if (ok) { adv.calm = true; Audio2.sfx('success'); this.world.ps.emit('crystal', adv.x, adv.y, 0, 0, 30, 12); Codex.unlock('adv_' + adv.type); if (adv.onCalm) adv.onCalm(this); }
        else { P.hurt(sign(P.x - adv.x) || 1, 120); }
      });
      return;
    }
    if (GS.hasTool('barrido')) {
      P.forcedAnim = 'scan'; Audio2.sfx('scan');
      this.kiru && (this.kiru.scanT = 1.2);
      this.timers.after(0.9, () => { P.forcedAnim = null; });
      const st = this.world.entities.find(e => e instanceof Station && e.scan && Math.abs(e.x - P.x) < 120);
      if (st) this.timers.after(0.5, () => st.scan(this, st));
      else if (this.def.onScan) this.timers.after(0.5, () => this.def.onScan(this));
      return;
    }
    if (GS.s.tools.length === 0) Game.toast('Aún no tienes herramientas activas', 'lock', '#8a8fb8', 2);
  },
  /* ---------- render ---------- */
  render(g) {
    const cam = this.cam, B = this.backdrop, def = this.def;
    const ox = cam.ox, oy = cam.oy;
    const camI = { x: ox, y: oy };
    // cielo
    if (def.renderSky) def.renderSky(g, this, camI); else if (B.sky) g.drawImage(B.sky, 0, Math.round(-oy * 0.05));
    if (def.skyFx) def.skyFx(g, this, camI);
    B.drawClouds(g, camI, 1 + (B.weather.wind || 0));
    B.render(g, camI, 'back');
    if (def.renderBack) def.renderBack(g, this, camI);
    // accesorios estáticos de fondo (mundo)
    if (this.propsC) g.drawImage(this.propsC, ox, oy, W, H, 0, 0, W, H);
    if (def.renderMid) def.renderMid(g, this, camI);
    // terreno
    g.drawImage(this.terrainC, ox, oy, W, H, 0, 0, W, H);
    for (const p of this.world.platforms) drawPlatform(g, p, ox, oy);
    for (const l of this.world.ladders) drawLadder(g, l, ox, oy);
    // entidades: estaciones, actores, kiru, jugadora
    const ents = this.world.entities.slice().sort((a, b) => (a.z || 0) - (b.z || 0) || ((a instanceof Station) ? -1 : 0) - ((b instanceof Station) ? -1 : 0));
    for (const e of ents) if (!(e instanceof Player) && !(e instanceof Kiru)) e.render(g, cam);
    if (this.kiru) this.kiru.render(g, cam);
    this.player.render(g, cam);
    // agua delante (superficie translúcida tramada)
    for (const w of this.world.water) drawWaterFront(g, w, ox, oy, this);
    if (def.renderFront) def.renderFront(g, this, camI);
    if (this.propsFrontC) g.drawImage(this.propsFrontC, ox, oy, W, H, 0, 0, W, H);
    this.world.ps.render(g, ox, oy);
    B.render(g, camI, 'front');
    // gradación de luz / clima
    if (def.renderGrade) def.renderGrade(g, this);
    else if (this.grade) { g.globalCompositeOperation = this.grade.op || 'multiply'; g.globalAlpha = this.grade.a ?? 1; frect(g, 0, 0, W, H, this.grade.col); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; }
    // Lente Nexo
    if (this.lensT > 0) this.renderLens(g, camI);
    // globos
    for (const e of this.world.entities) if (e.renderBubble) e.renderBubble(g, cam);
    // indicador de interacción
    if (this.inputEnabled()) { const it = this.nearestInteract(); if (it && it.renderPrompt) it.renderPrompt(g, cam, this.player); else if (it instanceof Actor) drawTalkPrompt(g, it, cam); }
    this.renderHUD(g);
  },
  renderLens(g, cam) {
    const k = this.lensT;
    fdither(g, 0, 0, W, H, '#05031a', 0.55 * k);
    // rejilla técnica
    if (k > 0.5) { g.fillStyle = 'rgba(86,229,255,0.10)'; for (let x = -(cam.x % 32); x < W; x += 32) g.fillRect(Math.round(x), 0, 1, H); for (let y = -(cam.y % 32); y < H; y += 32) g.fillRect(0, Math.round(y), W, 1); }
    if (this.def.lens) this.def.lens(g, this, cam, k);
    UIK.panel(g, W - 192, H - 26, 184, 18, 'glass');
    Icons.draw(g, 'lens', W - 186, H - 24);
    drawText(g, 'LENTE NEXO · flujos y unidades', W - 92, H - 21, { align: 'center', color: '#a6f4ff', shadow: '#070a1c' });
  },
  renderHUD(g) {
    if (this.hideHUD) return;
    const def = this.def;
    // tarjeta de capítulo (cinta con borde, sin oscurecer el cielo)
    const ct = this.chapterCard.t;
    if (ct < 4.2) {
      const a = ct < 0.5 ? ct / 0.5 : ct > 3.4 ? (4.2 - ct) / 0.8 : 1;
      const tw = Math.max(220, FONTS.main.measure(this.chapterCard.title || '') * 2 + 60);
      const bx = Math.round(W / 2 - tw / 2), by = Math.round(30 - (1 - a) * 46);
      UIK.panel(g, bx, by, tw, 44, 'dialog');
      drawText(g, this.chapterCard.sub || '', W / 2, by + 6, { align: 'center', font: 'tiny', color: '#ffe14d' });
      drawTitleText(g, this.chapterCard.title || '', W / 2, by + 13, 2, ['#fffaf0', '#ffe14d', '#ff9f43'], { align: 'center', shadow: '#140d26', depth: 1 });
      frect(g, bx + 10, by + 40, tw - 20, 1, '#8a5e14');
    }
    // objetivo
    if (this.objective && ct > 3.5) {
      const o = this.objective;
      const lines = wrapText(o.text, 210);
      const h = 18 + lines.length * 11;
      const slide = Math.min(1, o.t * 3);
      const x = Math.round(6 - (1 - slide) * 240);
      UIK.panel(g, x, 6, 236, h, 'glass');
      Icons.draw(g, o.icon, x + 6, 9);
      drawText(g, 'OBJETIVO', x + 22, 10, { font: 'tiny', color: '#ffe14d' });
      lines.forEach((l, i) => drawText(g, l, x + 22, 18 + i * 11, { color: '#fffaf0', shadow: '#070a1c' }));
    }
    // herramienta activa y teclas
    const tools = GS.s.tools;
    let tx = W - 8;
    const slot = (icon, key, on) => { tx -= 26; UIK.panel(g, tx, 6, 24, 24, on ? 'glass' : 'tech', on ? '#ffe14d' : null); Icons.draw(g, icon, tx + 5, 9); drawText(g, key, tx + 20, 22, { font: 'tiny', color: '#ffe14d', align: 'right', shadow: '#070a1c' }); };
    if (!Input.touchMode) {
      slot('book', keyName(Input.codesFor('codex')[0]), false);
      slot('eye', 'TAB', false);
      if (GS.hasTool('lente')) slot('lens', keyName(Input.codesFor('lens')[0]), this.lens);
      const tl = tools.filter(t => t !== 'lente'); if (tl.length) { const t = TOOLS[GS.s.activeTool || tl[tl.length - 1]]; if (t) slot(t.icon, keyName(Input.codesFor('tool')[0]), false); }
      slot('hint', keyName(Input.codesFor('hint')[0]), false);
    }
    if (def.hud) def.hud(g, this);
  },
};

function drawTalkPrompt(g, a, cam) {
  const x = Math.round(a.x - cam.ox), y = Math.round(a.y - cam.oy - (a.bubbleH || 74) - 6 + Math.sin(Game.time * 5) * 1.5);
  UIK.panel(g, x - 18, y, 36, 15, 'glass');
  const key = keyName(Input.codesFor('interact')[0]);
  frect(g, x - 14, y + 2, 11, 11, '#fffaf0'); drawText(g, key, x - 8, y + 4, { color: '#140d26', align: 'center' });
  for (let i = 0; i < 3; i++) frect(g, x + 1 + i * 4, y + 7, 2, 2, (Math.floor(Game.time * 4) % 3) === i ? '#ffe14d' : '#fffaf0');
}
function drawLadder(g, l, ox, oy) {
  const x = Math.round(l.x - ox), y0 = Math.round(l.y0 - oy), y1 = Math.round(l.y1 - oy);
  if (x < -20 || x > W + 20) return;
  frect(g, x - 7, y0, 2, y1 - y0, '#6aa0b4'); frect(g, x + 5, y0, 2, y1 - y0, '#477a94');
  for (let y = y0 + 3; y < y1; y += 6) { frect(g, x - 6, y, 12, 2, '#98c6d2'); frect(g, x - 6, y + 2, 12, 1, '#1d2a48'); }
}
function drawWaterFront(g, w, ox, oy, sc) {
  const x0 = Math.round(w.x0 - ox), x1 = Math.round(w.x1 - ox), y = Math.round(w.y - oy);
  if (x1 < 0 || x0 > W) return;
  const xa = Math.max(0, x0), xb = Math.min(W, x1);
  const depthPx = Math.max(4, H - y);
  // cuerpo de agua translúcido en bandas (sin malla de tramado)
  g.globalAlpha = w.alpha ?? 0.55; frect(g, xa, y + 1, xb - xa, depthPx, w.tint || '#20d6c7');
  g.globalAlpha = 0.45; frect(g, xa, y + 9, xb - xa, depthPx, w.deep || '#1063a6');
  g.globalAlpha = 0.35; frect(g, xa, y + 22, xb - xa, depthPx, '#0d3168');
  if (w.turbid) { g.globalAlpha = clamp(w.turbid, 0, 0.75); frect(g, xa, y + 1, xb - xa, depthPx, '#a0783a'); }
  g.globalAlpha = 1;
  // cáusticas animadas
  const t = Game.time;
  for (let k = 0; k < (xb - xa) / 9; k++) {
    const xx = xa + ((k * 37 + Math.floor((t * 6 + k * 3) % 9)) % (xb - xa));
    const yy = y + 4 + ((k * 13) % Math.max(4, depthPx - 8));
    if (((k + Math.floor(t * 2)) % 3) === 0) frect(g, xx, yy, 3 + (k % 3), 1, '#6cf0db');
  }
  // superficie con oleaje y espuma
  for (let x = xa; x < xb; x++) {
    const wy = Math.round(Math.sin((x + ox) * 0.08 + t * 2.2) * 1.2);
    fpx(g, x, y + wy, '#c6fff2');
    if (((x + ox + Math.floor(t * 12)) % 17) < 3) fpx(g, x, y + wy - 1, '#ffffff');
    if (((x + ox) % 5) === 0) fpx(g, x, y + wy + 1, '#6cf0db');
  }
}

/* =====================================================================
   Pausa / menú en juego
   ===================================================================== */
const PauseScene = {
  overlay: true,
  enter(p) { this.gp = p.gameplay; this.tab = p.tab || 'main'; Audio2.sfx('uiBack'); },
  update() { if (Input.pressed('cancel') || Input.pressed('pause')) { if (this.tab !== 'main') this.tab = 'main'; else Game.pop(); } },
  render(g) {
    fdither(g, 0, 0, W, H, '#05030f', 0.7);
    const x = W / 2 - 120, y = 40, w = 240;
    UIK.panel(g, x, y, w, 270, 'dialog');
    UIK.header(g, x, y, w, 'PAUSA · ' + (LEVELS[this.gp.levelId].title || ''), 'dialog', 'pause');
    Gui.begin();
    const B = (id, label, icon, fn, st) => { if (Gui.button(g, id, x + 20, this._y, w - 40, 22, label, { icon, align: 'left', style: st })) fn(); this._y += 26; };
    this._y = y + 26;
    if (this.tab === 'map') {

/* =====================================================================
   Marco de simulador (laboratorio / gemelo digital)
   Uso: const S = makeSim({...}) → escena overlay con fases, panel de
   controles, error seguro y registro de evidencia.
   ===================================================================== */
const SIM_PHASES = { demo: 'Demostración', guided: 'Práctica guiada', auto: 'Práctica autónoma', transfer: 'Transferencia', free: 'Laboratorio libre' };
function makeSim(def) {
  return Object.assign({
    overlay: true,
    enter(p) {
      this.p = p; this.onDone = p.onDone; this.gp = p.gameplay; this.t = 0; this.phase = p.phase || def.phases[0];
      this.hints = 0; this.attempts = 0; this.safeErr = null; this.msg = null; this.result = {}; this.startT = nowMs(); this.paused = false; this.speed = 1;
      this.ps = new Particles(600);
      Audio2.sfx('power', { vol: 0.5 });
      this.init && this.init(p);
      this.enterPhase(this.phase);
    },
    enterPhase(ph) {
      this.phase = ph; this.phaseT = 0; this.hints = 0; this.phaseStart = nowMs(); this.attemptsPhase = 0;
      this.onPhase && this.onPhase(ph);
    },
    nextPhase() {
      const i = def.phases.indexOf(this.phase);
      if (i < def.phases.length - 1) { Audio2.sfx('confirm'); this.enterPhase(def.phases[i + 1]); }
      else this.finish(true);
    },
    finish(ok) { Game.pop(); this.onDone && this.onDone(Object.assign({ ok }, this.result)); },
    /** Estado de error seguro: pausa, explica consecuencia reversible, permite inspeccionar */
    safeError(title, text, guide) { if (this.safeErr) return; this.safeErr = { title, text, guide, t: 0 }; this.paused = true; Audio2.sfx('alarm', { vol: 0.5 }); LearningModel.note('safeError'); },
    /** Registra evidencia de un reto manipulativo */
    evidence(id, correct, extra = {}) {
      const time = (nowMs() - this.phaseStart) / 1000;
      LearningModel.record(Object.assign({ kind: 'challenge', id, ra: def.ra, concepts: def.concepts, solo: extra.solo || 3, correct, hints: this.hints, time, transfer: this.phase === 'transfer' }, extra));
      const lp = GS.lp(LearningModel.currentLevel ?? 0);
      lp.feedback = true; lp.attempts++;
      if (correct && (this.phase === 'auto' || this.phase === 'guided')) lp.tech = true;
      if (correct && this.phase === 'transfer') lp.variant = true;
    },
    say(text, who = 'kiru') { this.msg = { text, who, t: 0 }; Audio2.sfx('voice', { voice: SPEAKERS[who] ? SPEAKERS[who].voice : 'kiru' }); },
    hint() {
      const hs = def.hintLadder || [];
      if (!hs.length) return;
      const h = hs[Math.min(this.hints, hs.length - 1)];
      this.say(['{y}Pregunta:{/} ', '{y}Evidencia:{/} ', '{y}Demostración parcial:{/} '][Math.min(this.hints, 2)] + h);
      if (this.hints === 2 && this.partial) this.partial();
      this.hints = Math.min(this.hints + 1, 3); GS.s.stats.hints++; LearningModel.note('hint');
    },
    update(dt) {
      this.t += dt; this.phaseT += dt;
      if (this.msg) this.msg.t += dt;
      if (this.safeErr) { this.safeErr.t += dt; return; }
      if (Input.pressed('hint')) this.hint();
      if (Input.pressed('cancel') && def.canExit !== false) { this.finish(false); return; }
      if (Input.pressed('reset') && this.reset) { this.reset(); Audio2.sfx('uiBack'); }
      if (!this.paused) for (let i = 0; i < this.speed; i++) this.step && this.step(dt);
      this.ps.update(dt);
    },
    render(g) {
      frect(g, 0, 0, W, H, '#070a1c');
      fdither(g, 0, 0, W, H, '#0e1430', 0.5);
      this.draw && this.draw(g);
      this.ps.render(g);
      // cabecera
      UIK.panel(g, 4, 4, W - 8, 20, def.style || 'tech');
      Icons.draw(g, def.icon || 'flask', 9, 7);
      drawText(g, def.title, 26, 10, { color: '#fffaf0', shadow: '#070a1c' });
      const ph = SIM_PHASES[this.phase] || this.phase;
      const phw = FONTS.main.measure(ph) + 14;
      frect(g, W - phw - 120, 7, phw, 13, '#ffe14d'); drawText(g, ph, W - phw / 2 - 120, 10, { align: 'center', color: '#140d26' });
      // indicadores de fase
      def.phases.forEach((p2, i) => { const on = def.phases.indexOf(this.phase) >= i; frect(g, W - 110 + i * 14, 10, 10, 7, on ? '#86e36f' : '#1c2350'); });
      drawText(g, def.ra || '', W - 52, 11, { font: 'tiny', color: '#a6f4ff' });
      if (this.msg && !this.verdict) {
        const m = this.msg, sp = SPEAKERS[m.who] || SPEAKERS.kiru;
        const lines = wrapText(m.text, 300);
        const hh = lines.length * 11 + 10;
        const by = H - hh - 6;
        UIK.panel(g, 6, by, 340, hh, 'glass');
        Icons.draw(g, m.who === 'kiru' ? 'kiru' : 'person', 10, by + 4);
        let rem = Math.floor(m.t * 60);
        lines.forEach((l, i) => { if (rem > 0) drawText(g, l, 28, by + 5 + i * 11, { color: '#fffaf0', max: rem, shadow: '#070a1c' }); rem -= stripMarkup(l).length + 1; });
      }
      if (this.safeErr) this.renderSafeErr(g);
      Gui.renderTooltip(g);
    },
    renderSafeErr(g) {
      const e = this.safeErr;
      fdither(g, 0, 0, W, H, '#2a0c18', 0.5);
      const w = 380, x = W / 2 - w / 2;
      const th = textHeight(e.text, w - 20) + textHeight(e.guide || '', w - 20) + 70;
      const y = H / 2 - th / 2;
      UIK.panel(g, x, y, w, th, 'alert');
      UIK.header(g, x, y, w, 'ESTADO DE ERROR SEGURO · ' + e.title, 'alert', 'warn');
      let yy = y + 22;
      yy += drawTextBlock(g, '{o}Consecuencia (reversible):{/} ' + e.text, x + 10, yy, w - 20, { color: '#fffaf0' }) + 4;
      if (e.guide) yy += drawTextBlock(g, '{y}Pregunta orientadora:{/} ' + e.guide, x + 10, yy, w - 20, { color: '#fffaf0' }) + 4;
      Gui.begin();
      if (Gui.button(g, 'serr_inspect', x + 10, y + th - 26, 150, 18, 'Inspeccionar datos', { icon: 'eye', style: 'ghost' })) { this.safeErr = null; this.inspect = true; }
      if (Gui.button(g, 'serr_retry', x + w - 160, y + th - 26, 150, 18, 'Corregir y continuar', { icon: 'reset', style: 'gold' })) { this.safeErr = null; this.paused = false; this.onSafeRetry && this.onSafeRetry(); }
      Gui.end();
    },
  }, def);
}

/** Regla física de conexión. Devuelve {ok, kind} o {ok:false, msg, mis} */
function nexusCheck(a, b) {
  const A = NX[a], B = NX[b];
  const L = (n) => NX[n].label;
  if (a === b) return { ok: false, msg: 'Elige un destino distinto del origen.', silent: true };
  if (B.decoy) return { ok: false, msg: 'El mar está a 40 km: llevar la salmuera hasta allí exigiría una tubería larga, costosa y con su propio impacto. Dentro del límite de Los Médanos conviene una laguna de evaporación revestida y monitoreada.', mis: 'ignorar los límites del sistema y el territorio' };
  if (!A.out.length) return { ok: false, msg: L(a) + ' es un destino: recibe o consume, no envía flujo en este mapa. Empieza por una fuente (mar, sol, viento) o por un equipo que transforma.', mis: 'confundir entradas y salidas del sistema' };
  if (a === 'ely' && (b === 'bus' || b === 'bat')) return { ok: false, msg: 'El electrolizador consume electricidad; no la devuelve. Un ciclo barra → electrolizador → barra produciría energía de la nada: es físicamente imposible (siempre hay pérdidas).', mis: 'creer en ciclos de energía sin pérdidas' };
  if ((a === 'pv' || a === 'eol') && b !== 'bus') {
    if (b === 'bat') return { ok: false, msg: 'En SYNARA toda la generación entra a la barra de la microred y desde allí se reparte a cargas y batería. Conecta la generación a la BARRA.', mis: null };
    return { ok: false, msg: 'La electricidad no es agua ni materia: no llena tanques ni se mezcla con caudales. Viaja por cables desde la generación hasta la BARRA, que la reparte a los equipos que la consumen.', mis: 'confundir flujo de agua y flujo de energía' };
  }
  if (A.out.includes('power') && !B.inn.includes('power')) return { ok: false, msg: L(b) + ' no consume electricidad en este mapa simplificado. Las cargas eléctricas son: bombas de la toma (o del pozo), bomba de alta presión de la OI y electrolizador.', mis: 'confundir flujo de agua y flujo de energía' };
  if ((b === 'pv' || b === 'eol')) return { ok: false, msg: 'Paneles y aerogeneradores generan electricidad; no se "cargan" ni reciben agua.', mis: 'confundir fuentes y almacenamientos' };
  if ((a === 'mar' || a === 'pozo') && ['hogares', 'riego', 'tanque', 'ely'].includes(b)) return { ok: false, msg: 'El agua de mar (≈ 35 g/L) o salobre no es apta para beber, regar ni electrolizar: primero pasa por captación, pretratamiento y ósmosis inversa.', mis: 'creer que el agua salada sirve directamente' };
  if (a === 'oi' && ['hogares', 'riego', 'ely'].includes(b)) return { ok: false, msg: 'El permeado sale casi sin minerales y es corrosivo: se almacena y remineraliza en el TANQUE antes de distribuirse. El agua desalinizada no es idéntica para cualquier uso.', mis: 'tratar el agua desalinizada como idéntica para cualquier uso' };
  if (['tanque', 'oi', 'pre'].includes(a) && ['toma', 'mar', 'pre', 'pozo'].includes(b)) return { ok: false, msg: 'Devolver agua al inicio de la cadena crea un ciclo sin propósito: gastarías energía dos veces para la misma agua.', mis: 'crear ciclos de flujo imposibles o inútiles' };
  if (a === 'toma' && b === 'oi') return { ok: false, msg: 'Sin pretratamiento, arena, limo y algas ensuciarían las membranas en horas. La toma alimenta al PRETRATAMIENTO.', mis: 'omitir el pretratamiento' };
  if (a === 'pre' && b !== 'oi') return { ok: false, msg: 'El agua pretratada sigue siendo agua de mar: todavía tiene ≈ 35 g/L de sales. Le falta la ósmosis inversa.', mis: 'confundir agua clara con agua desalinizada' };
  if (a === 'oi' && b === 'tanque') return { ok: true, kind: 'permeate' };
  if (a === 'oi' && (b === 'difusor' || b === 'evap')) return { ok: true, kind: 'brine' };
  if (a === 'oi') return { ok: false, msg: 'La OI produce dos corrientes: permeado (hacia el tanque) y salmuera (hacia el difusor o la laguna).', mis: null };
  if (a === 'ely' && b !== 'h2') return { ok: false, msg: 'El hidrógeno es un gas combustible: se comprime y almacena. No es un servicio de agua ni de riego.', mis: 'confundir agua, energía y materia' };
  const kind = A.out.find(k => B.inn.includes(k));
  if (!kind) return { ok: false, msg: 'No hay un flujo compatible: ' + L(a) + ' entrega ' + A.out.map(k => NX_KIND_LABEL[k]).join(' / ') + ' y ' + L(b) + ' recibe ' + (B.inn.map(k => NX_KIND_LABEL[k]).join(' / ') || 'nada') + '.', mis: 'confundir agua, energía y materia' };
  return { ok: true, kind };
}
/** Ruta ortogonal entre nodos (coordenadas de pantalla del simulador) */
function nexusRoute(a, b) {
  const A = NX[a], B = NX[b];
  const k = a + '>' + b;
  const R = {
    'oi>difusor': () => [[A.x - 8, A.y + 12], [A.x - 8, B.y], [B.x + 24, B.y]],
    'oi>evap': () => [[A.x - 8, A.y + 12], [A.x - 8, B.y], [B.x + 24, B.y]],
    'tanque>hogares': () => [[A.x + 24, A.y], [A.x + 33, A.y], [A.x + 33, B.y], [B.x - 24, B.y]],
    'tanque>riego': () => [[A.x + 24, A.y], [A.x + 33, A.y], [A.x + 33, B.y], [B.x - 24, B.y]],
    'tanque>ely': () => [[A.x, A.y + 12], [B.x, B.y - 12]],
    'pv>bus': () => [[A.x + 24, A.y], [84, A.y], [84, B.y], [B.x - 24, B.y]],
    'eol>bus': () => [[A.x + 24, A.y], [84, A.y], [84, B.y], [B.x - 24, B.y]],
    'bus>bat': () => [[A.x, A.y + 12], [B.x, B.y - 12]],
    'bus>oi': () => [[A.x + 24, A.y - 6], [B.x + 12, A.y - 6], [B.x + 12, B.y + 12]],
    'bus>ely': () => [[A.x + 24, A.y + 4], [B.x - 8, A.y + 4], [B.x - 8, B.y + 12]],
    'bus>toma': () => [[A.x - 14, A.y - 12], [A.x - 14, 100], [B.x, 100], [B.x, B.y + 12]],
    'bus>pozo': () => [[A.x - 14, A.y - 12], [A.x - 14, 100], [B.x, 100], [B.x, B.y + 12]],
  };
  if (R[k]) return R[k]();
  if (Math.abs(A.x - B.x) < 30) return [[A.x, A.y + (B.y > A.y ? 12 : -12)], [B.x, B.y + (B.y > A.y ? -12 : 12)]];
  const sx = B.x > A.x ? 1 : -1;
  const x0 = A.x + 24 * sx, x1 = B.x - 24 * sx, mx = Math.round((x0 + x1) / 2);
  return A.y === B.y ? [[x0, A.y], [x1, B.y]] : [[x0, A.y], [mx, A.y], [mx, B.y], [x1, B.y]];
}
/** Balance estacionario del diagrama (supuestos de simulación) */
function nexusSolve(edges, opts = {}) {
  const has = (k) => edges.some(e => e.key === k && !e.wrong);
  const med = opts.medanos;
  const gen = (med ? 0 : 0) + (has('pv>bus') ? (opts.pv ?? 320) : 0) + (has('eol>bus') ? (opts.wind ?? 160) : 0);
  const batOk = has('bus>bat');
  const power = (n) => has('bus>' + n) && (gen > 0 || batOk);
  const src = med ? 'pozo' : 'mar';
  const chain = med ? (power('pozo') && has('pozo>pre')) : (has('mar>toma') && has('toma>pre') && power('toma'));
  const brineOut = has('oi>difusor') || has('oi>evap');
  const roOn = chain && has('pre>oi') && power('oi') && brineOut && has('oi>tanque');
  const R = med ? 0.75 : 0.42;
  const Qf = roOn ? (med ? 40 : 100) : 0;
  const Qp = Qf * R, Qb = Qf - Qp;
  const Cb = med ? 5 / (1 - R) : 35 / (1 - R);
  const dem = { hogares: has('tanque>hogares') ? (med ? 18 : 25) : 0, riego: has('tanque>riego') ? (med ? 9 : 12) * (opts.irrig ?? 1) : 0 };
  const elyOn = !med && has('tanque>ely') && has('ely>h2') && power('ely');
  const h2 = elyOn ? 2 * (opts.elyRate ?? 1) : 0;
  const elyWater = h2 * 0.009 * 1.0;
  const tankIn = roOn ? Qp : 0;
  const tankNet = tankIn - dem.hogares - dem.riego - elyWater;
  const loads = { toma: power(med ? 'pozo' : 'toma') ? (med ? 12 : 25) : 0, oi: roOn ? Qp * (med ? 1.2 : 3.0) : 0, ely: h2 * 55 };
  const loadSum = loads.toma + loads.oi + loads.ely;
  const batFlow = batOk ? clamp(gen - loadSum, -150, 150) : 0;
  const vals = {};
  vals[src + '>' + (med ? 'pre' : 'toma')] = Qf; vals['toma>pre'] = Qf; vals['pre>oi'] = Qf; vals['oi>tanque'] = Qp; vals['oi>difusor'] = Qb; vals['oi>evap'] = Qb;
  vals['tanque>hogares'] = dem.hogares; vals['tanque>riego'] = dem.riego; vals['tanque>ely'] = elyWater; vals['ely>h2'] = h2;
  vals['pv>bus'] = has('pv>bus') ? (opts.pv ?? 320) : 0; vals['eol>bus'] = has('eol>bus') ? (opts.wind ?? 160) : 0; vals['bus>bat'] = batFlow;
  vals['bus>oi'] = loads.oi; vals['bus>toma'] = loads.toma; vals['bus>pozo'] = loads.toma; vals['bus>ely'] = loads.ely;
  return { roOn, Qf, Qp, Qb, Cb, tankNet, h2, gen, loadSum, batFlow, vals, brineOut, chain, elyWater };
}

}

    if (!r || !r.ok) { sc.kiru && sc.kiru.say('El mapa aún no está completo. Podemos volver cuando quieras.', 'valiente'); return; }
    Codex.unlock('flujos_reservas'); Codex.unlock('unidades');

async function intakeFlow(sc, st) {

    S.simStage = 'explain'; S.gateClosed = false; S.storm = 0.3; S.turb = 6; GS.lp(1).guardian = true;

        'Reducir el caudal aumenta la presión del filtro y eso limpia el medio filtrante.',
        'El tanque produce agua nueva mientras la toma está cerrada.'],
      key: 0, mis: 'creer que captar más siempre produce más',
      why: 'La carga de sólidos que llega al filtro es turbidez × caudal. Menos caudal durante el pulso mantiene el ΔP bajo el límite, evita el colapso y conserva la disponibilidad; la reserva del tanque cubre la demanda temporalmente.',

function drawDrone(g, x, y, t, flying) {
  x = Math.round(x); y = Math.round(y);
  const bob = flying ? Math.round(Math.sin(t * 6) * 1) : 0;
  frect(g, x - 6, y - 5 + bob, 12, 4, '#ff9f43'); frect(g, x - 6, y - 5 + bob, 12, 1, '#ffc06a'); frect(g, x - 4, y - 1 + bob, 8, 2, '#263442');
  fpx(g, x, y + 1 + bob, '#56e5ff');
  const sp = flying ? ((Math.floor(t * 30) % 2) ? 5 : 3) : 4;
  for (const s of [-1, 1]) { frect(g, x + s * 7 - (s < 0 ? 1 : 0), y - 7 + bob, 1, 3, '#6aa0b4'); frect(g, x + s * 7 - sp, y - 8 + bob, sp * 2, 1, flying ? '#cfe8ee' : '#98c6d2'); }
}

    this.stopAfter = p.stopAfter || 'free';
    this.marea = !!p.marea;
    this.reset();
  },
  reset() {
    this.h = 0; this.dp = 0.35; this.tank = 0.7; this.series = []; this.produced = 0; this.treatableH = 0; this.ecoAcc = 0; this.errors = 0; this.backwashT = 0; this.running = false; this.done = false; this.verdict = null;
    this.scn = this.scenario(this.phase);
  },
  scenario(ph) {
    if (ph === 'auto' || ph === 'free') return { hours: 12, base: 3, pulseAt: 3.5, pulseW: 4, pulseAmp: 45, demand: 70, T: 27, sdiAdd: 0, live: true };
    if (ph === 'transfer') return { hours: 24, base: 4, pulseAt: 6, pulseW: 12, pulseAmp: 14, demand: 70, T: 31, sdiAdd: 2.5, live: false, algae: true };
    return { hours: 6, base: 3, pulseAt: 99, pulseW: 1, pulseAmp: 0, demand: 70, T: 27, sdiAdd: 0, live: true };
  },
  turbAt(h) { const s = this.scn; const k = Math.exp(-Math.pow((h - s.pulseAt) / (s.pulseW / 2), 2)); return s.base + s.pulseAmp * k; },
  onPhase(ph) {
    this.reset();
    if (ph === 'demo') { this.say('Demostración: observa qué ocurre si capto {y}140 m³/h{/} desde 8 m sin rejillas. Mira el ΔP del filtro y el riesgo ecológico.'); this.cfg.q = 140; this.cfg.screens = false; this.running = true; }
    if (ph === 'guided') { this.cfg.q = 100; this.say('Tu turno (día normal, 6 h): consigue turbidez de salida < 1 NTU, riesgo ecológico bajo (< 0,4) y al menos 85 m³/h hacia la planta. Pulsa {y}Probar 6 h{/}.'); }
    if (ph === 'auto') this.say(this.marea ? 'El Filtro Ciego: llega el pulso de turbidez. Tía Marea estima que llegará en 3–4 h. Opera en vivo; no habrá pistas automáticas.' : 'El Filtro Ciego: llega el pulso de turbidez (llegada incierta: 2–5 h). Opera en vivo; no habrá pistas automáticas.');
    if (ph === 'transfer') this.say('Transferencia: temporada de floración algal (31 °C, materia orgánica, pulso largo). Diseña el protocolo ANTES de correr 24 h: no podrás ajustar durante la simulación.');
    if (ph === 'free') this.say('Laboratorio libre: experimenta con cualquier combinación.');
  },
  step(dt) {
    if (!this.running || this.done) return;
    const dh = dt * (this.phase === 'demo' ? 0.6 : this.phase === 'guided' ? 1.2 : this.phase === 'transfer' ? 2.4 : 0.55) * (Input.down('fast') ? 3 : 1);
    const s = this.scn;
    const turbIn = this.turbAt(this.h);
    const backwash = this.backwashT > 0;
    if (backwash) this.backwashT -= dh;
    const r = IntakeModel.step({ Qtoma: backwash ? this.cfg.q * 0.6 : this.cfg.q, depth: this.cfg.depth, screens: this.cfg.screens, coag: this.cfg.coag, turbIn, filterDP: this.dp, cap: 130, dt: dh, backwash });
    if (s.algae) r.turbOut += (this.cfg.depth < 6 ? 1.2 : 0.3) * (1 - this.cfg.coag * 0.6);
    this.dp = r.filterDP;
    // auto-lavado programado en transferencia (protocolo)
    if (this.phase === 'transfer' && this.cfg.autoBW && this.dp > 0.9 && this.backwashT <= 0) this.backwashT = 0.6;
    const toRO = r.treatable || this.cfg.storage === false ? Math.min(r.Qtoma, 120) : 0;
    const tankIn = r.treatable ? toRO : 0;
    this.tank = clamp(this.tank + (tankIn - s.demand) * dh / 900, 0, 1);
    this.produced += tankIn * dh;
    if (r.treatable) this.treatableH += dh;
    this.ecoAcc += r.ecoRisk * dh;
    this.last = r;
    this.h += dh;
    if (this.series.length === 0 || this.h - this.series[this.series.length - 1].h > 0.1) this.series.push({ h: this.h, tin: turbIn, tout: r.turbOut, dp: this.dp, tank: this.tank, eco: r.ecoRisk });
    // errores seguros
    if (r.overload > 0.05 && this.phase !== 'demo') { this.errors++; this.safeError('Sobrecarga', 'El caudal supera la capacidad de diseño del pretratamiento: el agua sale turbia hacia las membranas y el filtro se satura.', '¿Qué variable puedes reducir sin cerrar por completo la planta?'); this.onSafeRetry = () => { this.cfg.q = Math.min(this.cfg.q, 125); }; }
    else if (this.dp > 1.45 && this.phase !== 'demo') { this.errors++; this.safeError('Filtro colapsado', 'La presión diferencial superó 1,45 bar: el medio filtrante se compacta y deja pasar sólidos.', '¿Cuál fue el primer indicador que subió? ¿Qué acción lo reduce?'); this.onSafeRetry = () => { this.dp = 1.1; this.backwashT = 0.6; }; }
    else if (this.tank <= 0.02 && this.phase !== 'demo') { this.errors++; this.safeError('Reserva agotada', 'El tanque se vació: los hogares se quedarían sin agua mientras la toma se recupera.', '¿Cuándo convenía usar la reserva y cuándo recuperarla?'); this.onSafeRetry = () => { this.tank = 0.15; }; }
    // partículas visuales
    if (Math.random() < turbIn / 40) this.ps.emit('dust', 30 + Math.random() * 80, 120 + Math.random() * 60, 20, 0, 1);
    if (this.h >= s.hours) this.evaluate();
  },
  evaluate() {
    this.running = false; this.done = true;
    const s = this.scn;
    const frac = this.treatableH / s.hours, eco = this.ecoAcc / s.hours;
    let ok, txt;
    if (this.phase === 'demo') { ok = true; txt = 'Con 140 m³/h sin rejillas, el ΔP sube rápido y el riesgo ecológico es alto: captar más no significa producir mejor.'; }
    else if (this.phase === 'guided') {
      const q = this.last ? this.last.Qtoma : 0;
      ok = this.last && this.last.turbOut < 1 && eco < 0.4 && q >= 85;
      txt = ok ? 'Configuración estable: calidad dentro de diseño, bajo riesgo ecológico y producción suficiente.' : (eco >= 0.4 ? 'El riesgo ecológico sigue alto: revisa rejillas, profundidad y velocidad de aproximación.' : q < 85 ? 'La planta recibe muy poca agua: el caudal es insuficiente para la demanda.' : 'La turbidez de salida supera 1 NTU: revisa coagulación y profundidad de captación.');
      this.evidence('lv1_guided_intake', ok, { solo: 3 });
    } else if (this.phase === 'auto') {
      ok = frac >= 0.8 && this.tank > 0.15 && eco < 0.5 && this.errors === 0;
      txt = ok ? '¡El Filtro Ciego vencido! Mantuviste agua tratable el ' + fmt0(frac * 100) + ' % del tiempo sin colapsar el filtro.' : 'Agua tratable el ' + fmt0(frac * 100) + ' % del tiempo, errores seguros: ' + this.errors + '. Objetivo: ≥ 80 %, reserva > 15 % y sin errores.';
      this.evidence('lv1_guardian_filtro_ciego', ok, { solo: 4 });
    } else if (this.phase === 'transfer') {
      ok = frac >= 0.75 && eco < 0.45 && this.errors === 0;
      txt = ok ? 'Tu protocolo funciona en otra estación: captación profunda, coagulación alta y lavado programado ante algas.' : 'El protocolo no resistió la floración algal. ¿Captas cerca de la superficie, donde están las algas? ¿Programaste lavados?';
      this.evidence('lv1_transfer_protocol', ok, { solo: 5, transfer: true });
    } else { ok = true; txt = 'Laboratorio libre: los datos quedan en tu cuaderno.'; }
    this.verdict = { ok, txt };
    Audio2.sfx(ok ? 'success' : 'error');
  },
  draw(g) {
    const c = this.cfg, r = this.last || IntakeModel.step({ Qtoma: c.q, depth: c.depth, screens: c.screens, coag: c.coag, turbIn: this.turbAt(this.h), filterDP: this.dp, cap: 130, dt: 0 });
    const turbIn = this.turbAt(this.h);
    // --- esquema pixel (izquierda)
    const X0 = 8, Y0 = 30, WW = 372, HH = 262;
    Charts.frame(g, X0, Y0, WW, HH, '#0a1838');
    // mar en corte
    for (let y = Y0 + 30; y < Y0 + HH - 30; y++) { const k = (y - Y0 - 30) / (HH - 60); frect(g, X0 + 1, y, 150, 1, rampDither(['#20d6c7', '#16a6cf', '#1283bf', '#1063a6', '#0d3168'], k, X0, y)); }
    fdither(g, X0 + 1, Y0 + 30, 150, HH - 60, '#a07a3a', clamp(turbIn / 60, 0, 0.7));
    if (this.scn.algae) for (let i = 0; i < 40; i++) fpx(g, X0 + 4 + (i * 37) % 146, Y0 + 32 + (i * 7) % 18, '#86e36f');
    for (let x = X0 + 1; x < X0 + 151; x++) fpx(g, x, Y0 + 30 + Math.round(Math.sin(x * 0.2 + Game.time * 3)), '#c6fff2');
    frect(g, X0 + 1, Y0 + HH - 30, 150, 29, '#c97c38'); fdither(g, X0 + 1, Y0 + HH - 30, 150, 29, '#e49c44', 0.5);
    drawText(g, 'MAR', X0 + 6, Y0 + 34, { font: 'tiny', color: '#e6fdff' });
    // cabezal de toma a la profundidad elegida
    const hy = Y0 + 30 + (c.depth / 15) * (HH - 70);
    frect(g, X0 + 120, Y0 + 26, 6, hy - Y0 - 26, '#6aa0b4');
    frect(g, X0 + 112, hy - 6, 22, 12, '#345a78'); for (let k = 0; k < 6; k++) frect(g, X0 + 114 + k * 3, hy - 5, 1, 10, c.screens ? '#cfe8ee' : '#477a94');
    drawText(g, fmt0(c.depth) + ' m', X0 + 96, hy - 3, { font: 'tiny', color: '#fffaf0' });
    // peces cerca (riesgo ecológico)
    for (let i = 0; i < 6; i++) {
      const pull = r.ecoRisk;
      const fx = X0 + 30 + ((Game.time * 12 + i * 23) % 80) + pull * 30 * Math.sin(Game.time + i), fy = hy - 20 + i * 7;
      frect(g, Math.round(fx), Math.round(fy), 4, 2, pull > 0.5 && i < 3 ? '#ff4e5d' : '#ffb93b'); fpx(g, Math.round(fx) - 1, Math.round(fy), '#ffe0a0');
    }
    // tubería → cribado → coagulación → filtro → tanque → OI
    const pY = Y0 + 34;
    Charts.flow(g, [[X0 + 123, Y0 + 26], [X0 + 123, pY - 10], [X0 + 170, pY - 10]], 'seawater', c.q / 100, 3);
    // coagulación
    frect(g, X0 + 172, pY - 22, 50, 40, '#1d2a48'); frect(g, X0 + 174, pY - 14, 46, 30, '#1283bf'); fdither(g, X0 + 174, pY - 14, 46, 30, '#a07a3a', clamp(turbIn / 50, 0, 0.6));
    for (let i = 0; i < 12; i++) { const fx = X0 + 176 + (i * 13 + Game.time * 8) % 42, fy = pY - 10 + (i * 7) % 24; fdisc(g, fx, fy, 1 + c.coag * 1.5, '#c8a860'); }
    drawText(g, 'COAGULACIÓN', X0 + 197, pY - 30, { font: 'tiny', color: '#cfd6f0', align: 'center' });
    Charts.flow(g, [[X0 + 222, pY], [X0 + 240, pY]], 'seawater', c.q / 100, 3);
    // filtro con capas que se ensucian
    const fx0 = X0 + 242, fy0 = pY - 26, fw = 44, fh = 120;
    frect(g, fx0, fy0, fw, fh, '#477a94'); frect(g, fx0 + 3, fy0 + 3, fw - 6, fh - 6, '#0a1838');
    frect(g, fx0 + 3, fy0 + 40, fw - 6, 26, '#2a2a3a'); frect(g, fx0 + 3, fy0 + 66, fw - 6, 40, '#e4c088');
    for (let i = 0; i < 40; i++) fpx(g, fx0 + 4 + (i * 7) % (fw - 8), fy0 + 67 + (i * 11) % 38, '#c49860');
    const dirt = clamp((this.dp - 0.3) / 1.2, 0, 1);
    fdither(g, fx0 + 3, fy0 + 40, fw - 6, Math.round(26 + 40 * dirt), '#5a3a1a', 0.3 + dirt * 0.5);
    if (this.backwashT > 0) for (let i = 0; i < 8; i++) fpx(g, fx0 + 6 + Math.random() * (fw - 12), fy0 + 10 + Math.random() * 30, '#c6fff2');
    drawText(g, 'FILTRO', fx0 + fw / 2, fy0 - 8, { font: 'tiny', color: '#cfd6f0', align: 'center' });
    Charts.gauge(g, fx0 + fw / 2, fy0 + fh + 22, 13, clamp(this.dp / 1.6, 0, 1), '#56e5ff', 'ΔP', fmt(this.dp, 2));
    Charts.flow(g, [[fx0 + fw, fy0 + fh - 10], [X0 + 310, fy0 + fh - 10]], r.treatable ? 'permeate' : 'brine', r.treatable ? 1 : 0.3, 3);
    // tanque de reserva
    Charts.tank(g, X0 + 312, Y0 + 70, 34, 120, this.tank, RAMP.sea, 'RESERVA', { reserve: 0.15 });
    drawText(g, fmt0(this.tank * 100) + '%', X0 + 329, Y0 + 60, { font: 'tiny', color: '#fffaf0', align: 'center' });
    drawText(g, '→ OI', X0 + 330, Y0 + HH - 18, { font: 'tiny', color: '#a6f4ff', align: 'center' });
    drawText(g, 'SALIDA ' + fmt(r.turbOut, 2) + ' NTU', X0 + 300, Y0 + 40, { font: 'tiny', color: r.turbOut < 1 ? '#86e36f' : r.turbOut < 2 ? '#ffe14d' : '#ff4e5d', align: 'right' });
    if (r.overload > 0.05) drawText(g, '¡SOBRECARGA!', X0 + 200, Y0 + HH - 14, { color: '#ff4e5d', align: 'center' });
    // --- controles (derecha)
    const CX = 388, CW = W - CX - 8;
    UIK.panel(g, CX, 30, CW, 168, 'tech');
    Gui.begin();
    const locked = this.phase === 'demo' || (this.phase === 'transfer' && this.running);
    const yy = 36;
    c.q = Gui.slider(g, 'q', CX + 8, yy, CW - 16, c.q, 40, 160, 5, { label: 'Caudal de toma', unit: 'm³/h', disabled: locked, marks: [{ v: 130, col: '#ff4e5d' }], tip: 'Capacidad de diseño del pretratamiento: 130 m³/h' });
    c.depth = Gui.slider(g, 'd', CX + 8, yy + 24, CW - 16, c.depth, 2, 14, 1, { label: 'Profundidad de la toma', unit: 'm', disabled: locked || this.phase === 'auto' });
    c.coag = Gui.slider(g, 'c', CX + 8, yy + 48, CW - 16, c.coag, 0, 1, 0.1, { label: 'Coagulación (abstracta)', fmt: v => v < 0.34 ? 'baja' : v < 0.67 ? 'media' : 'alta', disabled: locked, color: '#c8a860' });
    const sc = Gui.toggle(g, 'scr', CX + 8, yy + 74, 'Rejillas finas', c.screens); if (!locked) c.screens = sc;
    if (this.phase === 'transfer') { const ab = Gui.toggle(g, 'abw', CX + 120, yy + 74, 'Lavado automático', !!c.autoBW); if (!locked) c.autoBW = ab; }
    else if (Gui.button(g, 'bw', CX + 120, yy + 72, CW - 128, 16, this.backwashT > 0 ? 'Lavando…' : 'Lavar filtro', { icon: 'reset', style: 'ghost', disabled: locked || this.backwashT > 0 || !this.running })) { this.backwashT = 0.6; Audio2.sfx('valve'); }
    // indicadores
    const ix = CX + 8, iy = yy + 96;
    drawText(g, 'Velocidad de aproximación: ' + fmt(r.approachV, 3) + ' m/s', ix, iy, { font: 'tiny', color: r.approachV > 0.15 ? '#ff9f43' : '#86e36f' });
    drawText(g, 'Riesgo ecológico: ' + fmt(r.ecoRisk, 2) + '   SDI: ' + fmt(r.sdi, 1), ix, iy + 9, { font: 'tiny', color: r.ecoRisk > 0.4 ? '#ff9f43' : '#86e36f' });
    drawText(g, 'Hora ' + fmt(this.h, 1) + ' / ' + this.scn.hours + ' h   Agua a planta: ' + fmt0(this.produced) + ' m³', ix, iy + 18, { font: 'tiny', color: '#cfd6f0' });
    drawText(g, 'Tratable: ' + (r.treatable ? 'SÍ' : 'NO') + '   Turbidez entrada: ' + fmt(turbIn, 1) + ' NTU', ix, iy + 27, { font: 'tiny', color: r.treatable ? '#86e36f' : '#ff4e5d' });
    // botones de control de corrida
    const by = 176;
    if (this.phase === 'guided' && !this.running && !this.done) { if (Gui.button(g, 'run', CX + 8, by, 110, 18, 'Probar 6 h', { style: 'good', icon: 'play' })) { this.reset(); this.running = true; } }
    if ((this.phase === 'auto' || this.phase === 'free') && !this.running && !this.done) { if (Gui.button(g, 'run', CX + 8, by, 110, 18, 'Iniciar', { style: 'good', icon: 'play' })) { this.running = true; } }
    if (this.phase === 'transfer' && !this.running && !this.done) { if (Gui.button(g, 'run', CX + 8, by, 130, 18, 'Correr 24 h', { style: 'good', icon: 'play' })) { this.running = true; } }
    if (this.running && this.phase !== 'transfer' && Gui.button(g, 'pause', CX + 8, by, 80, 18, this.paused ? 'Seguir' : 'Pausa', { style: 'ghost', icon: this.paused ? 'play' : 'pause' })) this.paused = !this.paused;
    if (Gui.button(g, 'hintb', CX + CW - 64, by, 56, 18, 'Pista', { style: 'ghost', icon: 'hint', disabled: this.phase === 'auto' })) this.hint();
    // gráfico temporal
    const S = this.series;
    const band = this.phase === 'auto' ? { x0: this.marea ? 3 : 2, x1: this.marea ? 4 : 5, color: '#ffb93b', level: 0.18 } : null;
    Charts.line(g, CX, 202, CW, 92, [
      { data: S.map(s => [s.h, s.tin]), color: '#c8a860', label: 'entrada' },
      { data: S.map(s => [s.h, s.tout * 10]), color: '#56e5ff', label: 'salida×10' },
      { data: S.map(s => [s.h, s.dp * 20]), color: '#ff6b6b', label: 'ΔP×20' },
    ].map(sr => sr.data.length ? sr : Object.assign(sr, { data: [[0, 0]] })), { xMin: 0, xMax: this.scn.hours, yMin: 0, yMax: 60, legend: true, xLabel: 'h', yLabel: 'NTU', bands: band ? [band] : [], hlines: [{ v: 24, color: '#ff4e5d', label: 'ΔP límite' }], cursor: this.h });
    // veredicto
    if (this.verdict) {
      const v = this.verdict;
      const vh = textHeight(v.txt, 340) + 34;
      UIK.panel(g, 20, H - vh - 10, 360, vh, v.ok ? 'green' : 'alert');
      drawTextBlock(g, v.txt, 28, H - vh - 4, 344, { color: '#fffaf0' });
      if (v.ok) { if (Gui.button(g, 'nxt', 270, H - 30, 100, 16, this.phase === this.stopAfter ? 'Terminar' : 'Continuar', { style: 'good', icon: 'play' })) { if (this.phase === this.stopAfter) this.finish(true); else this.nextPhase(); } }
      else if (Gui.button(g, 'rt', 270, H - 30, 100, 16, 'Reintentar', { style: 'gold', icon: 'reset' })) { this.attempts++; GS.s.stats.retries++; this.onPhase(this.phase); }
    }
    if (this.phase === 'demo' && !this.done && this.h > 4) this.evaluate();
    Gui.end();
    if (!this.verdict && !this.msg) { }
  },
});

   PANTALLA DE TÍTULO — panorama de Aridia al atardecer

const TitleScene = {
  touchControls: false,
  enter() {
    this.t = 0; this.menu = 'main'; this.ps = new Particles(400);
    this.build();
    Audio2.playMusic('title');
    Audio2.setAmbience({ sea: 0.6, wind: 0.4, birds: 0.3 });
    this.hasSave = SaveManager.exists();
  },
  build() {
    const k = 'title_bg';
    if (BG_CACHE.has(k)) { Object.assign(this, BG_CACHE.get(k)); return; }
    const horizon = 196;
    const sky = makeSkyCanvas(RAMP.skyDusk, horizon, { sun: { x: 412, y: 168, r: 22, cols: ['#fff6d8', '#ffe08a', '#ffb862'], halo: '#ffd28d' }, curve: 1.05, stars: 40, seed: 3 });
    // capa lejana: promontorio y mesetas en contraluz violeta
    const far = new PixelBuffer(W, H);
    const farPal = ['#3a2a6a', '#4e3480', '#6a3e8e', '#8a4a96', '#b05a96', '#d06e94', '#e88a92'];
    ART.ridge(far, (x) => 176 - Math.max(0, 1 - Math.abs(x - 90) / 120) * 40 - fbm1(x * 0.04, 3, 3) * 10 + (x > 240 ? 26 : 0) - (x > 520 ? Math.max(0, (x - 520) * 0.3) : 0), farPal, { mesa: true, baseIdx: 3, strata: 6 });
    // mar con reflejo del sol
    const sea = new PixelBuffer(W, H - horizon);
    ART.sea(sea, 0, sea.h, ['#2a2a6e', '#3a3a88', '#5a4a9a', '#8a5aa0', '#c06a9a', '#e88a92'], { invert: true });
    // ciudad y SYNARA (capa media)
    const mid = new PixelBuffer(W, H);
    const landY = 236;
    ART.ridge(mid, (x) => landY - 10 - Math.sin(x * 0.012) * 8 - fbm1(x * 0.02, 3, 8) * 8 - Math.max(0, 1 - Math.abs(x - 470) / 140) * 26, ['#2a1838', '#3e2048', '#5a2c52', '#7a3a58', '#a24a5a', '#c8645e'], { baseIdx: 3 });
    const r = RNG(5);
    for (let i = 0; i < 26; i++) {
      const x = 330 + i * 11 + r.int(-3, 3), w = r.int(8, 16), h = r.int(10, 30) + Math.max(0, 30 - Math.abs(x - 470) * 0.3);
      const base = landY - 6 - Math.max(0, 1 - Math.abs(x - 470) / 140) * 24;
      ART.house(mid, x, Math.round(base), w, Math.round(h), i * 13, { pal: HOUSE_COLS[i % 7].map(c => mixHex(c, '#7a3a78', 0.45)), night: true });
    }
    // torre SYNARA
    const tx = 470, tb = landY - 34;
    for (let y = tb - 92; y < tb; y++) { const w = 3 + Math.round((y - (tb - 92)) / 30); mid.rect(tx - w, y, w * 2, 1, '#d8d0ec'); mid.rect(tx + w - 2, y, 2, 1, '#9a8ab8'); }
    mid.ellipse(tx, tb - 70, 14, 4, '#56e5ff'); mid.ellipse(tx, tb - 70, 11, 2.5, '#0e2b4a'); mid.ellipse(tx, tb - 92, 5, 5, '#e6fdff');
    // planta desalinizadora junto a la costa
    for (let i = 0; i < 4; i++) ART.tank(mid, 560 + i * 16, landY - 4, 12, 18 - i % 2 * 4, ART.hazeRamp(RAMP.steelW, '#c06a9a', 0.35));
    // campo FV en las dunas (izquierda)
    for (let k = 0; k < 5; k++) ART.pvRow(mid, 180 + k * 8, landY - 2 - k * 3, 60, k, { tilt: 5, depth: 4 });
    // salinas rosadas en primer plano medio
    const fg = new PixelBuffer(W, H);
    for (let y = 262; y < H; y++) for (let x = 0; x < W; x++) {
      const t = (y - 262) / 98;
      const n = fbm(x * 0.03, y * 0.06, 3, 7);

    GS.reset();

    Game.transition(() => Game.setScene(IntroScene, {}), '#140d26', 1.5);
  },
  continueGame() {
    if (!GS.load()) { this.newGame(); return; }
    if (GS.s.settings) { Object.assign(Game.settings, GS.s.settings); Audio2.applyVolumes(); }
    Game.transition(() => {
      if (GS.s.scene === 'level' && GS.s.checkpoint && LEVELS[GS.s.level] && !GS.s.completed.includes(GS.s.level)) Game.setScene(GameplayScene, { level: GS.s.level, checkpoint: GS.s.checkpoint });

  },
};

const MAP_BIOMES = [
  [214, 168, RAMP.sand, 0.62, 0.5], [120, 200, RAMP.sand, 0.58, 0.5],
  [232, 296, RAMP.salt, 0.55, 0.6], [170, 300, RAMP.salt, 0.6, 0.6],
  [378, 282, RAMP.leaf, 0.45, 0.7], [420, 300, RAMP.leaf, 0.5, 0.6],
  [430, 108, RAMP.mesa, 0.5, 0.9], [520, 120, RAMP.mesa, 0.45, 0.9],
  [352, 214, RAMP.dune, 0.55, 0.8], [300, 140, RAMP.dune, 0.6, 0.8], [500, 210, RAMP.dune, 0.5, 0.8], [270, 240, RAMP.dune, 0.6, 0.7],
];
const MAP_LINKS = [[0, 1], [1, 2], [2, 3], [0, 6], [6, 4], [4, 7], [6, 5], [4, 8], [3, 8], [0, 9], [9, 5], [6, 10], [10, 4], [10, 8], [10, 7]];
const WorldMapScene = {
  touchControls: false,
  enter(p) {
    this.t = 0; this.sel = p.focus ?? GS.s.unlocked[GS.s.unlocked.length - 1] ?? 0;
    if (!GS.s.unlocked.includes(this.sel)) this.sel = 0;
    this.build(); this.ps = new Particles(200);
    Audio2.playMusic('title'); Audio2.setAmbience({ sea: 0.4, wind: 0.3, birds: 0.2 });
    GS.s.scene = 'map';
  },
  build() {
    if (BG_CACHE.has('worldmap')) { this.mapC = BG_CACHE.get('worldmap'); return; }
    const pb = new PixelBuffer(W, H);
    const cx = 310, cy = 196;
    const landF = (x, y) => {
      const dx = (x - cx) / 230, dy = (y - cy) / 150;
      let d = Math.sqrt(dx * dx * 0.9 + dy * dy) - 0.82 + (fbm(x * 0.012, y * 0.012, 4, 2) - 0.5) * 0.55;
      if (y < 60) d += (60 - y) * 0.01;
      d -= Math.exp(-(((x - 520) / 60) ** 2 + ((y - 120) / 40) ** 2)) * 0.3;
      return d;
    };
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const d = landF(x, y);
      let c;
      if (d > 0) {
        const t = clamp(d * 3, 0, 1);
        c = rampDither(['#20d6c7', '#16a6cf', '#1283bf', '#1063a6', '#0f4888', '#0d3168'], t, x, y);
        if (d < 0.025) c = '#c6fff2';
        else if (d < 0.05 && ((x + y + Math.floor(fbm(x * 0.1, y * 0.1, 2, 9) * 6)) % 5 === 0)) c = '#6cf0db';
      } else {
        // biomas con fronteras orgánicas (Voronoi deformado por ruido)
        const n = fbm(x * 0.03, y * 0.03, 3, 5);
        const wx = x + (fbm(x * 0.018, y * 0.018, 3, 21) - 0.5) * 70, wy = y + (fbm(x * 0.018 + 9, y * 0.018, 3, 22) - 0.5) * 70;
        let b1 = null, d1 = 1e9, d2 = 1e9;
        for (const A of MAP_BIOMES) { const dd = Math.hypot(wx - A[0], (wy - A[1]) * 1.1); if (dd < d1) { d2 = d1; d1 = dd; b1 = A; } else if (dd < d2) d2 = dd; }
        let ramp = b1[2], t = b1[3] + (n - 0.5) * b1[4];
        if (d2 - d1 < 5 && bayer4(x, y) < 0.5 - (d2 - d1) / 10) t -= 0.12;
        c = rampDither(ramp, t, x, y);
        if (d > -0.02) c = '#fff6d8';
        // relieve sombreado
        const dd = landF(x + 1, y + 1) - d;
        if (dd > 0.004) c = shade(c, -0.18);
      }
      pb.data[y * W + x] = U(c);
    }
    // ciudad: casitas de colores
    const r = RNG(77);
    for (let i = 0; i < 60; i++) { const x = 190 + r.int(-34, 34), y = 150 + r.int(-24, 30); if (landF(x, y) < -0.04) { const col = r.pick(['#ff7656', '#20d6c7', '#ffe14d', '#8d6bff', '#fffaf0', '#86e36f']); pb.rect(x, y, 4, 3, col); pb.hline(x, x + 3, y, shade(col, 0.3)); pb.set(x + 3, y + 2, shade(col, -0.4)); } }
    // campos FV (rejillas azules)
    for (let k = 0; k < 8; k++) for (let j = 0; j < 3; j++) { const x = 330 + k * 9, y = 200 + j * 8 + (k % 2); pb.rect(x, y, 7, 4, '#1f469e'); pb.hline(x, x + 6, y, '#8cc4ff'); }
    // oasis: parcelas
    for (let k = 0; k < 10; k++) { const x = 350 + (k % 5) * 12, y = 268 + Math.floor(k / 5) * 12; pb.rect(x, y, 10, 9, k % 3 ? '#33a552' : '#86e36f'); for (let q = 0; q < 9; q += 3) pb.hline(x, x + 9, y + q, '#1f854c'); }
    // planta y tanques
    for (let k = 0; k < 5; k++) { pb.disc(140 + k * 7, 246, 3, '#e6f0f7'); pb.set(139 + k * 7, 245, '#ffffff'); }
    // ciudadela H2: esferas
    for (let k = 0; k < 3; k++) { pb.disc(492 + k * 9, 190 + (k % 2) * 6, 4, '#8cf4ec'); pb.set(490 + k * 9, 188 + (k % 2) * 6, '#ffffff'); }
    // salinas: espejos
    for (let k = 0; k < 6; k++) pb.rect(200 + k * 12, 286 + (k % 2) * 5, 9, 4, '#ffd8ec');
    // caminos
    MAP_LINKS.forEach(([a, b]) => { const A = MAP_NODES[a], B = MAP_NODES[b]; pb.line(A.x, A.y + 1, B.x, B.y + 1, '#c97c38'); });
    // rosa de los vientos
    const rx = 590, ry = 300;
    pb.ellipseOutline(rx, ry, 14, 14, '#fff6d8'); pb.poly([[rx, ry - 20], [rx + 4, ry], [rx, ry + 20], [rx - 4, ry]], '#fff6d8'); pb.poly([[rx - 20, ry], [rx, ry - 4], [rx + 20, ry], [rx, ry + 4]], '#ffd84a');
    pb.poly([[rx, ry - 20], [rx + 4, ry], [rx - 4, ry]], '#ff6b6b');
    this.mapC = pb.toCanvas();
    BG_CACHE.set('worldmap', this.mapC);
  },
  update(dt) {
    this.t += dt; this.ps.update(dt);
    const avail = MAP_NODES.filter(n => GS.s.unlocked.includes(n.id) && LEVELS[n.id]);
    const cur = MAP_NODES[this.sel];
    let dir = null;
    if (Input.pressed('uiLeft')) dir = [-1, 0]; if (Input.pressed('uiRight')) dir = [1, 0]; if (Input.pressed('uiUp')) dir = [0, -1]; if (Input.pressed('uiDown')) dir = [0, 1];
    if (dir) {
      let best = null, bd = 1e9;
      for (const n of avail) { if (n === cur) continue; const dx = n.x - cur.x, dy = n.y - cur.y; const along = dx * dir[0] + dy * dir[1]; if (along <= 0) continue; const d = along + Math.abs(dx * dir[1] + dy * dir[0]) * 1.5; if (d < bd) { bd = d; best = n; } }
      if (best) { this.sel = best.id; Audio2.sfx('uiMove'); }
    }
    if (Input.pressed('next')) { const i = avail.findIndex(n => n.id === this.sel); this.sel = avail[(i + 1) % avail.length].id; Audio2.sfx('uiMove'); }
    if (Input.pointer.pressed) for (const n of avail) if (dist(Input.pointer.x, Input.pointer.y, n.x, n.y) < 12) { if (this.sel === n.id) this.enterLevel(); else { this.sel = n.id; Audio2.sfx('uiMove'); } Input.consumePointer(); }
    if (Input.pressed('confirm') && !Gui.focus) this.enterLevel();
    if (Input.pressed('codex')) Game.push(CodexScene, {});
    if (Input.pressed('data')) Game.push(EvidenceScene, {});
    if (Input.pressed('pause')) Game.push(MapMenuScene, {});
    if (Input.keyPressed('F9')) Game.push(TeacherScene, {});
    if (Math.random() < 0.1) this.ps.emit('spark', MAP_NODES[this.sel].x + (Math.random() - 0.5) * 16, MAP_NODES[this.sel].y + (Math.random() - 0.5) * 16, 0, -10, 1);
  },
  enterLevel() {
    const id = this.sel;
    if (!LEVELS[id]) { Game.toast('Capítulo en construcción', 'lock', '#8a8fb8'); return; }
    if (!GS.s.unlocked.includes(id)) { Game.toast('Capítulo bloqueado', 'lock', '#8a8fb8'); Audio2.sfx('error'); return; }
    Audio2.sfx('confirm');
    Game.transition(() => Game.setScene(GameplayScene, { level: id }));
  },
  render(g) {
    const t = this.t;
    g.drawImage(this.mapC, 0, 0);
    drawSeaSparkles(g, 0, 0, W, H, t, 0.5, ['#c6fff2', '#ffffff']);
    // sombras de nubes cruzando el mapa
    for (let i = 0; i < 4; i++) { const x = ((t * (6 + i * 2) + i * 190) % (W + 160)) - 80, y = 60 + i * 70; fshadow(g, x, y, 40 + i * 6, 12 + i * 2, '#0a1a3a', 0.28); }
    // enlaces SYNARA animados
    MAP_LINKS.forEach(([a, b], i) => {
      const A = MAP_NODES[a], B = MAP_NODES[b];
      const on = GS.s.unlocked.includes(a) && GS.s.unlocked.includes(b);
      const n = Math.ceil(dist(A.x, A.y, B.x, B.y) / 3);
      for (let k = 0; k < n; k++) { const ph = (k / n + t * 0.4 + i * 0.13) % 1; const x = lerp(A.x, B.x, k / n), y = lerp(A.y, B.y, k / n); if (on && ph < 0.08) fpx(g, x, y - 1, i % 2 ? '#56e5ff' : '#ffe14d'); }
    });
    // aerogeneradores diminutos en el corredor
    for (let i = 0; i < 5; i++) ART.turbine(g, 400 + i * 14, 92 + (i % 2) * 8, 10, t * 2 + i, { col: '#fffaf0', shade: '#cfe8ee' });
    // nodos
    for (const n of MAP_NODES) {
      const un = GS.s.unlocked.includes(n.id), done = GS.s.completed.includes(n.id), sel = this.sel === n.id;
      const pulse = sel ? Math.sin(t * 6) * 1.5 : 0;
      fdisc(g, n.x, n.y + 2, 10, 'rgba(5,3,15,0.5)');
      fdisc(g, n.x, n.y, 9 + pulse, done ? '#eab02a' : un ? '#fffaf0' : '#3a3a5a');
      fdisc(g, n.x, n.y, 7 + pulse, done ? '#ffd84a' : un ? '#20d6c7' : '#1c1f34');
      if (un) Icons.draw(g, n.icon, n.x - 7, n.y - 7); else Icons.draw(g, 'lock', n.x - 7, n.y - 7);

    frect(g, 0, 0, W, H, '#0a0718');
    for (let i = 0; i < 100; i++) fpx(g, hash1(i, 3) * W, (hash1(i, 4) * H + this.t * 4 * (0.3 + hash1(i, 5))) % H, '#5a6fb0');
    const lines = [
      ['t', 'ARIDIA NEXUS'], ['s', 'LA CIUDAD QUE BEBÍA EL MAR'], ['', ''],
      ['h', 'Diseño, programación, pixel art procedural, música y sonido'], ['', 'Generados con código para este proyecto: Canvas 2D y Web Audio, sin recursos externos.'], ['', ''],
      ['h', 'Personajes'], ['', 'Amaya Serrano · KIRU · Naira Valdés · Dante Vela · Dra. Eliana Rojas'], ['', 'L.I.M.E.N. · MIRAGE · MOSAICO · Tía Marea · Don Cobre · Alma Semilla · BETA-9 · Capitán Nimbo'], ['', ''],
      ['h', 'Fuentes científicas base'],
      ...Object.values(SRC).map(v => ['f', v]),
      ['', ''], ['h', 'Nota'], ['', 'Aridia es un territorio ficticio inspirado en costas áridas del Caribe.'], ['', 'Los datos de escenario son supuestos de simulación para fines educativos.'], ['', 'Ningún resultado constituye asesoría técnica, operativa ni financiera.'], ['', ''],
      ['h', 'Ningún dato es ruido hasta entender su historia.'], ['', ''], ['', 'Gracias por jugar.'],
    ];
    let y = H - this.t * 18;
    for (const [k, txt] of lines) {
      if (k === 't') { if (y > -40 && y < H) drawTitleText(g, txt, W / 2, y, 3, ['#fff6d8', '#ffe14d', '#ff7656'], { align: 'center', shadow: '#2a1040' }); y += 38; continue; }
      if (k === 's') { if (y > -20 && y < H) drawText(g, txt, W / 2, y, { align: 'center', color: '#56e5ff' }); y += 20; continue; }
      if (k === 'h') { if (y > -20 && y < H) drawText(g, txt, W / 2, y, { align: 'center', color: '#ffe14d' }); y += 14; continue; }
      if (k === 'f') { const hh = textHeight(txt, 520, { font: 'tiny', lineH: 8 }); if (y > -40 && y < H) drawTextBlock(g, txt, 60, y, 520, { font: 'tiny', color: '#cfd6f0', align: 'center', lineH: 8 }); y += hh + 4; continue; }
      if (y > -20 && y < H) drawText(g, txt, W / 2, y, { align: 'center', color: '#fffaf0' }); y += 12;
    }
    drawText(g, 'ESC: cerrar · mantén ENTER: acelerar', W - 8, H - 10, { font: 'tiny', color: '#5a5e80', align: 'right' });
  },
};

const TESTS = {};
function boot() {
  Game.init();
  GS.reset();
  const q = new URLSearchParams(location.search);
  const test = q.get('test');
  if (test && TESTS[test]) { Game.setScene(TESTS[test]); return; }
  if (typeof TitleScene !== 'undefined') Game.setScene(TitleScene);
}
TESTS.sprites = {
  enter() { this.t = 0; },
  update(dt) { this.t += dt; },
  render(g) {
    frect(g, 0, 0, W, H, '#7ccaf4');

    const anims = ['idle', 'walk', 'run', 'jump', 'fall', 'scan', 'talk', 'celebrate', 'frustrate', 'repair', 'program', 'sample', 'point', 'think', 'sad', 'help'];
    const q = new URLSearchParams(location.search);

    anims.forEach((a, i) => {
      const x = 40 + (i % 8) * 76, y = 90 + Math.floor(i / 8) * 100;
      drawChar(g, ch, a, fr / (ANIMS[a].fps), x, y, 1);
      drawText(g, a, x, y + 4, { font: 'tiny', color: '#140d26', align: 'center' });
    });
    drawText(g, 'ÁÉÍÓÚ ñ ¿Qué es la salmuera? ¡Recuperación 42 %! m³/h · kWh → H₂', 8, 300, { color: '#fffaf0', shadow: '#140d26' });
    drawText(g, 'TINY 0123456789 KWH/M³ 35 G/L ÁREA Ñ', 8, 316, { font: 'tiny', color: '#140d26' });
    drawText(g, 'Agua · energía · hidrógeno · agroecología {y}amarillo{/} {c}cian{/} {p}rosa{/}', 8, 328, { color: '#140d26' });
    for (let i = 0; i < 12; i++) Icons.draw(g, Object.keys(Icons.defs)[i + (parseInt(q.get('ic') || '0'))], 8 + i * 18, 340);
  },
};
window.addEventListener('load', boot);
TESTS.zoom = {
  enter() { this.t = 0; },
  update(dt) { this.t += dt; },
  render(g) {
    frect(g, 0, 0, W, H, '#5aaee8');
    const q = new URLSearchParams(location.search);
    const ch = q.get('char') || 'amaya';
    const list = (q.get('list') || 'idle:0,walk:2,scan:1,talk:1,celebrate:2').split(',');
    const z = parseInt(q.get('z') || '3');
    list.forEach((it, i) => {
      const [chn, a, f, e] = it.includes('@') ? it.split(/[@:]/) : [ch].concat(it.split(':'));
      const c = SpriteCache.get(chn, a, parseInt(f), { expr: e });
      this.x = (i === 0 ? 4 : this.x);
      g.drawImage(c, this.x, H - 8 - c.height * z, c.width * z, c.height * z);
      this.x += c.width * z + 2;
    });
  },
};
TESTS.portraits = {
  enter() {},
  update() {},
  render(g) {
    frect(g, 0, 0, W, H, '#2a2a5a');

TESTS.level = { enter() { const q = new URLSearchParams(location.search); const lv = parseInt(q.get('lv') || '1'); if (q.get('tools')) for (const t of q.get('tools').split(',')) GS.giveTool(t, true); Game.setScene(GameplayScene, { level: lv, checkpoint: q.get('cp') || null }); if (q.get('px')) { const P = GameplayScene.player; P.x = parseFloat(q.get('px')); P.y = GameplayScene.world.groundAt(P.x); GameplayScene.kiru && (GameplayScene.kiru.x = P.x - 30); GameplayScene.cam.snap(P); } if (q.get('lens')) { GameplayScene.lens = true; GameplayScene.lensT = 1; } if (q.get('nocard')) GameplayScene.chapterCard.t = 9; }, update() { }, render() { } };
TESTS.title = { enter() { Game.setScene(TitleScene); }, update() { }, render() { } };
TESTS.map = { enter() { for (let i = 0; i <= 10; i++) GS.s.unlocked.push(i); GS.s.completed.push(0, 1); Game.setScene(WorldMapScene, { focus: 2 }); }, update() { }, render() { } };
TESTS.scene = { enter() { const q = new URLSearchParams(location.search); const sc = window[q.get('s')] || eval(q.get('s')); Game.setScene(sc, JSON.parse(q.get('p') || '{}')); }, update() { }, render() { } };
TESTS.sim = { enter() { const q = new URLSearchParams(location.search); const lv = q.get('lv'); if (lv) { Game.setScene(GameplayScene, { level: parseInt(lv) }); GameplayScene.chapterCard.t = 9; } const sc = eval(q.get('s')); Game.push(sc, { phase: q.get('phase') || undefined, stopAfter: 'free', onDone: () => { } }); }, update() { }, render() { } };
/* ---------- Piloto automático para pruebas de guion (solo ?test=) ---------- */
function AUTOPILOT_ON(choices = []) {
  if (window.__autopilot) return;
  window.__autopilot = { choices: choices.slice(), log: [] };
  const push = Game.push.bind(Game);
  Game.push = function (scene, params = {}) {
    const AP = window.__autopilot;
    const resolve = (v) => setTimeout(() => params.onDone && params.onDone(v), 30);
    if (scene === DialogueScene) {
      const lines = params.lines || [];
      const hasChoice = lines.some(l => l && (l.choices || (Array.isArray(l) && l[3] && l[3].choices)));
      AP.log.push('dlg:' + lines.length);
      return resolve(hasChoice ? (AP.choices.length ? AP.choices.shift() : 0) : null);
    }
    if (scene === SOLOScene) return resolve({ correct: 5, total: 5 });
    if (scene === ExplainScene || scene === MicroCheckScene) return resolve(true);
    if (typeof DroneScene !== 'undefined' && scene === DroneScene) return resolve({ choice: 'E', ok: true });
    if (scene === LevelCompleteScene) return resolve();
    if (scene.nextPhase) { AP.log.push('sim:' + (scene.title || '')); return resolve({ ok: true }); }
    if (scene === PauseScene || scene === CodexScene || scene === EvidenceScene) return push(scene, params);
    AP.log.push('scene?'); return resolve({ ok: true });
  };
}
